amily=Italiana&amp;family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap\" rel=\"stylesheet\"/>\n\u003clink rel=\"stylesheet\" href=\"assets/template-code/9abf51cdeeb2eb622ed58dbe.css\">\n\u003clink rel=\"stylesheet\" href=\"assets/template-code/3dd46a0f031f0bf338ce8cd7.css\">\n\u003cmeta content=\"The Social Edit \u2014 an editorial birthday invitation experience by VraxisRSVP.\" name=\"description\"/>\n\u003clink rel=\"stylesheet\" href=\"assets/template-code/483c7a341125c9fedbb98565.css\">\n\u003clink rel=\"stylesheet\" href=\"assets/template-code/f3847db13317f1aaba44ab3b.css\">\u003cscript src=\"assets/static-media.js?v=1\">\u003c/script>\u003c/head>\n\u003cbody>\n\u003cdiv aria-label=\"Your private birthday invitation\" aria-modal=\"true\" class=\"se-stage\" id=\"seStage\" role=\"dialog\">\n\u003cimg alt=\"Sofia \u2014 birthday editorial portrait\" class=\"se-photo\" src=\"assets/media/3bcb8a566f25e635908df169-960.webp\"/ srcset=\"assets/media/7a5a29b0dfc00ac4e6d841a8-320.webp 320w, assets/media/eb2370fc8d61a868027cfdd4-640.webp 640w, assets/media/3bcb8a566f25e635908df169-960.webp 960w, assets/media/f0e30179ab211b1ab8413bfd-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\" loading=\"lazy\">\n\u003cdiv class=\"se-grain\">\u003c/div>\n\u003cdiv class=\"se-head\">\n\u003cspan>A private dinner invitation\u003c/span>\n\u003cspan>VraxisRSVP \u00b7 005\u003c/span>\n\u003c/div>\n\u003cdiv class=\"se-scene\">\n\u003cdiv class=\"se-overline\">A seat has been saved for you\u003c/div>\n\u003ch1 class=\"se-name\" id=\"seName\">Sofia\u003c/h1>\n\u003cp class=\"se-sub\" id=\"seSubtitle\">is celebrating twenty five.\u003c/p>\n\u003cdiv class=\"se-place\">\n\u003cdiv class=\"se-plate\">\u003c/div>\n\u003cbutton aria-label=\"Open Sofia's invitation\" class=\"se-card\" id=\"seCard\" type=\"button\">\n\u003cspan class=\"se-mini\">The guest of honour\u003c/span>\n\u003cspan class=\"se-person\" id=\"seCardName\">Sofia\u003c/span>\n\u003cspan class=\"se-script\">requests the pleasure of your company\u003c/span>\n\u003c/button>\n\u003c/div>\n\u003cbutton class=\"se-action\" id=\"seEnter\" type=\"button\">Take your seat \u00a0 \u2197\u003c/button>\n\u003c/div>\n\u003cdiv class=\"se-foot\">\n\u003cspan>Good company. An unforgettable evening.\u003c/span>\n\u003cbutton class=\"se-skip\" id=\"seSkip\" type=\"button\">Skip opening\u003c/button>\n\u003c/div>\n\u003cdiv aria-hidden=\"true\" class=\"se-reservation\" id=\"seReservation\">\n\u003cdiv aria-label=\"Candlelit dinner atmosphere\" class=\"se-res-photo\" role=\"img\">\u003c/div>\n\u003cdiv class=\"se-res-content\">\n\u003cspan class=\"se-kicker\">THE PRIVATE TABLE \u00b7 NO. 005\u003c/span>\n\u003cspan class=\"se-ornament\">\u2733\u003c/span>\n\u003cp class=\"se-res-small\">A place has been reserved at\u003c/p>\n\u003ch2>\n\u003cspan id=\"seResHost\">Sofia\u003c/span>\u2019s\u003cbr/>\n\u003cem>table.\u003c/em>\n\u003c/h2>\n\u003cdiv class=\"se-res-line\">\u003c/div>\n\u003clabel for=\"seGuest\">The reservation is for\u003c/label>\n\u003cinput autocomplete=\"name\" id=\"seGuest\" maxlength=\"42\" placeholder=\"Your name (optional)\" type=\"text\"/>\n\u003cbutton id=\"seConfirm\" type=\"button\">Reveal my invitation \u003cspan>\u2197\u003c/span>\u003c/button>\n\u003cp class=\"se-res-note\">No sign-in. No details are sent or saved.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cdiv aria-hidden=\"true\" class=\"se-shutters\">\n\u003cdiv>\u003c/div>\n\u003cdiv>\u003c/div>\n\u003c/div>\n\u003cdiv aria-hidden=\"true\" class=\"se-welcome\">\n\u003cspan class=\"se-mini\" id=\"seGreeting\">You're invited\u003c/span>\n\u003cdiv class=\"se-rule\">\u003c/div>\n\u003ch2 id=\"seWelcomeName\">Sofia's\u003cbr/>evening.\u003c/h2>\n\u003cp>Something lovely is about to begin.\u003c/p>\n\u003cdiv class=\"se-rule\">\u003c/div>\n\u003cspan class=\"se-mini\">The Social Edit \u00b7 Private celebration\u003c/span>\n\u003c/div>\n\u003c/div>\n\u003cdiv aria-hidden=\"true\" class=\"read-progress\" id=\"readProgress\">\u003c/div>\n\u003cheader class=\"top\">\n\u003cdiv class=\"logo\">THE SOCIAL EDIT.\u003c/div>\n\u003cnav>\n\u003ca href=\"#details\">The Invitation\u003c/a>\n\u003ca href=\"#dress\">Dress Code\u003c/a>\n\u003ca href=\"#rsvp\">RSVP\u003c/a>\n\u003c/nav>\n\u003c/header>\n\u003cmain>\n\u003csection class=\"hero\" id=\"home\">\n\u003cimg alt=\"Sofia \u2014 birthday editorial portrait\" id=\"heroPhoto\" src=\"assets/media/fbc356c5ffc761afa9381ef4-960.webp\"/ srcset=\"assets/media/41d21755c17a2902142ce881-320.webp 320w, assets/media/a807ad1a79e24bbb2adc9f07-640.webp 640w, assets/media/fbc356c5ffc761afa9381ef4-960.webp 960w, assets/media/02a9a87e5965f825b9c6203c-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n\u003cdiv class=\"hero-content\">\n\u003cdiv class=\"hero-topline tiny\">\n\u003cspan>Private birthday celebration\u003c/span>\n\u003cspan>Issue No. 025\u003c/span>\n\u003c/div>\n\u003ch1 id=\"heroName\">Sofia\u003cspan>turns twenty five.\u003c/span>\u003c/h1>\n\u003cdiv class=\"hero-bottom\">\n\u003cp>\n              Good company. Beautiful clothes. An evening we'll be talking about long after the last\n              glass.\n            \u003c/p>\n\u003ca class=\"btn light\" href=\"#details\">You're invited \u2197\u003c/a>\n\u003c/div>\n\u003cdiv aria-label=\"Countdown to the celebration\" class=\"countdown-panel\">\n\u003cdiv>\n\u003cstrong id=\"cdDays\">\u2014\u003c/strong>\n\u003cspan>Days\u003c/span>\n\u003c/div>\n\u003cdiv>\n\u003cstrong id=\"cdHours\">\u2014\u003c/strong>\n\u003cspan>Hours\u003c/span>\n\u003c/div>\n\u003cdiv>\n\u003cstrong id=\"cdMins\">\u2014\u003c/strong>\n\u003cspan>Minutes\u003c/span>\n\u003c/div>\n\u003cdiv>\n\u003cstrong id=\"cdSecs\">\u2014\u003c/strong>\n\u003cspan>Seconds\u003c/span>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003cdiv class=\"ticker\">\n\u003cspan>AN OCCASION WORTH DRESSING UP FOR \u00a0 \u2726 \u00a0 AN OCCASION WORTH DRESSING UP FOR \u00a0 \u2726 \u00a0 AN\n          OCCASION WORTH DRESSING UP FOR \u00a0 \u2726 \u00a0 AN OCCASION WORTH DRESSING UP FOR \u00a0 \u2726 \u00a0 AN OCCASION\n          WORTH DRESSING UP FOR \u00a0 \u2726 \u00a0\n        \u003c/span>\n\u003c/div>\n\u003csection class=\"intro\" id=\"about\">\n\u003cdiv class=\"wrap intro-grid\">\n\u003cdiv class=\"reveal\">\n\u003cdiv class=\"tiny\" style=\"color: var(--red)\">01 / The birthday edit\u003c/div>\n\u003ch2>\n              Another year.\u003cbr/>\n\u003ci class=\"serif\">Better stories.\u003c/i>\n\u003c/h2>\n\u003cp id=\"introText\">\n              A birthday is always a good excuse to get our favourite people in one room. This year,\n              we're making an evening of it \u2014 dinner, drinks, a little dancing and absolutely no\n              rushing home.\n            \u003c/p>\n\u003cdiv class=\"big-number\" id=\"ageBig\">25\u003c/div>\n\u003cdiv class=\"intro-quote\">\u201cConsider this your official excuse to dress up.\u201d\u003c/div>\n\u003c/div>\n\u003cdiv class=\"photo reveal\">\n\u003cimg alt=\"Elegant celebratory table setting\" loading=\"lazy\" src=\"assets/media/7725bbbdbbd9e16ab1602a29-960.webp\"/ srcset=\"assets/media/e61cd25dd8c106652c2f352f-320.webp 319w, assets/media/3dffa06a7704e506fd4fcce6-640.webp 640w, assets/media/7725bbbdbbd9e16ab1602a29-960.webp 959w, assets/media/0fa1b43a5029ad7042a9ec39-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n\u003cdiv class=\"round-stamp\">With love,\u003cbr/>Sofia x\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection aria-label=\"A note from the host\" class=\"editorial-interlude\">\n\u003cdiv class=\"tiny\">A note from the birthday girl\u003c/div>\n\u003cblockquote>\u201cThe dress code is fabulous. The company is everything.\u201d\u003c/blockquote>\n\u003cdiv class=\"tiny\">Dinner \u00b7 Drinks \u00b7 The best people\u003c/div>\n\u003c/section>\n\u003csection class=\"details\" id=\"details\">\n\u003cdiv class=\"table-scene\">\n\u003cimg alt=\"Elegant event dinner table\" loading=\"lazy\" src=\"assets/media/430e348ea8250833025b5199-960.webp\"/ srcset=\"assets/media/4437d0160ba0980bd17e7f31-320.webp 320w, assets/media/0db50f7fbb60b50f42ec7829-640.webp 640w, assets/media/430e348ea8250833025b5199-960.webp 960w, assets/media/4fab370d77155a0f4d332ab2-1440.webp 1439w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n\u003cdiv class=\"table-title reveal\">\n\u003cdiv class=\"tiny\">02 / The invitation\u003c/div>\n\u003ch2>\n              Save\u003cbr/>\n\u003ci class=\"serif\">the date.\u003c/i>\n\u003c/h2>\n\u003cp style=\"max-width: 290px; line-height: 1.9\">\n              A seat has been saved for you. Now all that's missing is your presence.\n            \u003c/p>\n\u003c/div>\n\u003cdiv class=\"invite-card reveal\">\n\u003cdiv class=\"tiny\" style=\"color: var(--red)\">You are cordially invited\u003c/div>\n\u003ch3 id=\"cardAge\">25\u003c/h3>\n\u003cdiv class=\"serif ital\" id=\"cardName\">Sofia's birthday dinner\u003c/div>\n\u003cdiv class=\"divider\" style=\"margin: 25px 0\">\u003c/div>\n\u003cdiv class=\"tiny\" style=\"color: var(--red)\">The date\u003c/div>\n\u003cp id=\"eventDateLabel\">Saturday, 14 November 2026\u003c/p>\n\u003cdiv class=\"tiny\" style=\"color: var(--red)\">The time\u003c/div>\n\u003cp id=\"eventTimeLabel\">18:30 until late\u003c/p>\n\u003cdiv class=\"tiny\" style=\"color: var(--red)\">The place\u003c/div>\n\u003cp id=\"eventVenueLabel\">The Glasshouse \u00b7 Johannesburg\u003c/p>\n\u003cdiv class=\"detail-actions\">\n\u003ca class=\"btn\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Johannesburg\" id=\"directions\" rel=\"noopener\" target=\"_blank\">Directions \u2197\u003c/a>\n\u003cbutton class=\"btn outline\" id=\"calendar\">Add to calendar +\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"dress section\" id=\"dress\">\n\u003cdiv class=\"wrap\">\n\u003cdiv class=\"section-head rev 100vw, 70vw\" decoding=\"async\">\n\u003c/div>\n\u003cform class=\"form-card reveal\" id=\"rsvpForm\">\n\u003cdiv class=\"tiny\" style=\"color: var(--red)\">Private reservation\u003c/div>\n\u003ch3>Will we see you there?\u003c/h3>\n\u003clabel class=\"field\">Your name\u003cinput id=\"guestName\" maxlength=\"100\" placeholder=\"First and last name\" required=\"\"/>\n\u003c/label>\n\u003cdiv class=\"tiny\" style=\"color: var(--red); margin-top: 22px\">Your response\u003c/div>\n\u003cdiv class=\"choices\">\n\u003clabel class=\"choice\">\n\u003cinput name=\"attendance\" required=\"\" type=\"radio\" value=\"yes\"/> Absolutely,\n                yes\u003c/label>\n\u003clabel class=\"choice\">\n\u003cinput name=\"attendance\" type=\"radio\" value=\"no\"/> Sadly, no\u003c/label>\n\u003c/div>\n\u003cdiv class=\"hidden\" id=\"attendingFields\">\n\u003clabel class=\"field\">Number of guests\u003cselect id=\"guestCount\">\n\u003coption value=\"1\">Just me\u003c/option>\n\u003coption value=\"2\">Two guests\u003c/option>\n\u003coption value=\"3\">Three guests\u003c/option>\n\u003coption value=\"4\">Four guests\u003c/option>\n\u003c/select>\n\u003c/label>\n\u003clabel class=\"field\">Dietary notes (optional)\u003ctextarea id=\"dietary\" placeholder=\"Anything we should know?\" rows=\"2\">\u003c/textarea>\n\u003c/label>\n\u003c/div>\n\u003clabel class=\"field\">A note for the birthday girl (optional)\u003ctextarea id=\"guestNote\" placeholder=\"Leave a little message...\" rows=\"3\">\u003c/textarea>\n\u003c/label>\n\u003cbutton class=\"btn\" style=\"width: 100%; margin-top: 15px\" type=\"submit\">\n              Send my reply \u2197\n            \u003c/button>\n\u003cdiv aria-live=\"polite\" class=\"success-note hidden\" id=\"rsvpStatus\" role=\"status\">\u003c/div>\n\u003cp style=\"font-size: 11px; color: var(--muted); line-height: 1.6; margin-top: 20px\">\n              Preview mode: responses are not sent to the host or saved online yet.\n            \u003c/p>\n\u003c/form>\n\u0 cinput id=\"edDress\" value=\"Cocktail chic. A touch of cherry red.\"/> \u003c/label>\n\u003clabel>Intro paragraph\u003ctextarea id=\"edIntro\" rows=\"4\">\nA birthday is always a good excuse to get our favourite people in one room. This year, we're making an evening of it \u2014 dinner, drinks, a little dancing and absolutely no rushing home.\u003c/textarea>\n\u003c/label>\n\u003clabel>Hero image URL\u003cinput id=\"edHero\" placeholder=\"https://...\"/> \u003c/label>\n\u003cbutton class=\"btn\" id=\"resetEditor\" style=\"width: 100%\">Reset example\u003c/button>\n\u003c/aside>\n\u003cdiv aria-label=\"Photo viewer\" aria-modal=\"true\" class=\"lightbox hidden\" id=\"lightbox\" role=\"dialog\">\n\u003cbutton aria-label=\"Close photo\" class=\"close\" id=\"lbClose\">\u00d7\u003c/button>\n\u003cbutton aria-label=\"Previous photo\" class=\"prev\" id=\"lbPrev\">\u2039\u003c/button>\n\u003cimg alt=\"Expanded celebration photograph\" id=\"lbImg\"/>\n\u003cbutton aria-label=\"Next photo\" class=\"next\" id=\"lbNext\">\u203a\u003c/button>\n\u003cp id=\"lbCount\">01 / 03\u003c/p>\n\u003c/div>\n\u003cscript src=\"assets/template-code/a3e356d831140f721efc5477.js\">\u003c/script>\n\u003cscript src=\"assets/template-code/12a6a7870192607b8ddcaea5.js\">\u003c/script>\n\u003cscript src=\"assets/template-code/06f260e60d264edd3f0164ae.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n";const frame=document.getElementById("invitation");frame.srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/template-image-overrides.js?v=zero-waste1" defer></script><script src="assets/templates.js?v=zero-waste1"></script><script src="assets/design-finishing.js?v=20261115b"></script><script src="assets/template-polish.js?v=zero-waste1"></script></body></html>
