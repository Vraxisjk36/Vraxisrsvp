 class=\"se-mini\">The Social Edit \u00b7 Private celebration<\/span><\/div><\/div><div aria-hidden=\"true\" class=\"read-progress\" id=\"readProgress\"><\/div>\n<header class=\"top\"><div class=\"logo\">THE SOCIAL EDIT.<\/div><nav><a href=\"#details\">The Invitation<\/a><a href=\"#dress\">Dress Code<\/a><a href=\"#rsvp\">RSVP<\/a><\/nav><\/header>\n<main><section class=\"hero\" id=\"home\"><img alt=\"Candlelit celebration with elegant dinner styling\" id=\"heroPhoto\" src=\"https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=1800&amp;q=85\"/><div class=\"hero-content\"><div class=\"hero-topline tiny\"><span>Private birthday celebration<\/span><span>Issue No. 025<\/span><\/div><h1 id=\"heroName\">Sofia<span>turns twenty five.<\/span><\/h1><div class=\"hero-bottom\"><p>Good company. Beautiful clothes. An evening we'll be talking about long after the last glass.<\/p><a class=\"btn light\" href=\"#details\">You're invited \u2197<\/a><\/div><div aria-label=\"Countdown to the celebration\" class=\"countdown-panel\"><div><strong id=\"cdDays\">\u2014<\/strong><span>Days<\/span><\/div><div><strong id=\"cdHours\">\u2014<\/strong><span>Hours<\/span><\/div><div><strong id=\"cdMins\">\u2014<\/strong><span>Minutes<\/span><\/div><div><strong id=\"cdSecs\">\u2014<\/strong><span>Seconds<\/span><\/div><\/div><\/div><\/section>\n<div class=\"ticker\"><span>AN OCCASION WORTH DRESSING UP FOR \u00a0 \u2726 \u00a0 AN OCCASION WORTH DRESSING UP FOR \u00a0 \u2726 \u00a0 AN OCCASION WORTH DRESSING UP FOR \u00a0 \u2726 \u00a0 AN OCCASION WORTH DRESSING UP FOR \u00a0 \u2726 \u00a0 AN OCCASION WORTH DRESSING UP FOR \u00a0 \u2726 \u00a0 <\/span><\/div>\n<section class=\"intro\" id=\"about\"><div class=\"wrap intro-grid\"><div class=\"reveal\"><div class=\"tiny\" style=\"color:var(--red)\">01 / The birthday edit<\/div><h2>Another year.<br/><i class=\"serif\">Better stories.<\/i><\/h2><p id=\"introText\">A birthday is always a good excuse to get our favourite people in one room. This year, we're making an evening of it \u2014 dinner, drinks, a little dancing and absolutely no rushing home.<\/p><div class=\"big-number\" id=\"ageBig\">25<\/div><div class=\"intro-quote\">\u201cConsider this your official excuse to dress up.\u201d<\/div><\/div><div class=\"photo reveal\"><img alt=\"Elegant celebratory table setting\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=1100&amp;q=85\"/><div class=\"round-stamp\">With love,<br/>Sofia x<\/div><\/div><\/div><\/section><section aria-label=\"A note from the host\" class=\"editorial-interlude\"><div class=\"tiny\">A note from the birthday girl<\/div><blockquote>\u201cThe dress code is fabulous. The company is everything.\u201d<\/blockquote><div class=\"tiny\">Dinner \u00b7 Drinks \u00b7 The best people<\/div><\/section>\n<section class=\"details\" id=\"details\"><div class=\"table-scene\"><img alt=\"Elegant event dinner table\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=1800&amp;q=85\"/><div class=\"table-title reveal\"><div class=\"tiny\">02 / The invitation<\/div><h2>Save<br/><i class=\"serif\">the date.<\/i><\/h2><p style=\"max-width:290px;line-height:1.9\">A seat has been saved for you. Now all that's missing is your presence.<\/p><\/div><div class=\"invite-card reveal\"><div class=\"tiny\" style=\"color:var(--red)\">You are cordially invited<\/div><h3 id=\"cardAge\">25<\/h3><div class=\"serif ital\" id=\"cardName\">Sofia's birthday dinner<\/div><div class=\"divider\" style=\"margin:25px 0\"><\/div><div class=\"tiny\" style=\"color:var(--red)\">The date<\/div><p id=\"eventDateLabel\">Saturday, 14 November 2026<\/p><div class=\"tiny\" style=\"color:var(--red)\">The time<\/div><p id=\"eventTimeLabel\">18:30 until late<\/p><div class=\"tiny\" style=\"color:var(--red)\">The place<\/div><p id=\"eventVenueLabel\">The Glasshouse \u00b7 Johannesburg<\/p><div class=\"detail-actions\"><a class=\"btn\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Johannesburg\" id=\"directions\" rel=\"noopener\" target=\"_blank\">Directions \u2197<\/a><button class=\"btn outline\" id=\"calendar\">Add to calendar +<\/button><\/div><\/div><\/div><\/section>\n<section class=\"dress section\" id=\"dress\"><div class=\"wrap\"><div class=\"section-head reveal\"><div><div class=\"tiny\" style=\"color:var(--red)\">03 / The dress code edit<\/div><h2>Come dressed<br/><i class=\"serif\">to impress.<\/i><\/h2><\/div><p>A little glamour never hurt anybody. Think cocktail silhouettes, beautiful textures and your favourite statement piece.<\/p><\/div><div class=\"moodboard\"><figure class=\"reveal\"><img alt=\"Fashion editorial outfit inspiration\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=900&amp;q=85\"/><figcaption>01 / Statement dressing<\/figcaption><\/figure><figure class=\"reveal\"><img alt=\"Fashion styling inspiration\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1483985988355-763728e1935b?w=800&amp;q=85\"/><figcaption>02 / Something special<\/figcaption><\/figure><figure class=\"reveal\"><img alt=\"Chic wardrobe inspiration\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=850&amp;q=85\"/><figcaption>03 / Make it yours<\/figcaption><\/figure><\/div><div class=\"dress-footer\"><div><div class=\"tiny\" style=\"color:var(--red)\">The brief<\/div><p id=\"dressText\" style=\"font-family:'Playfair Display',serif;font-size:25px;margin:8px 0\">Cocktail chic. A touch of cherry red.<\/p><\/div><div aria-label=\"Suggested palette\" class=\"swatches\"><span style=\"background:#7c2034\"><\/span><span style=\"background:#d89ba5\"><\/span><span style=\"background:#eac5b6\"><\/span><span style=\"background:#a9a4a9\"><\/span><\/div><\/div><\/div><\/section>\n<section class=\"agenda section\" id=\"agenda\"><div class=\"wrap\"><div class=\"section-head reveal\"><div><div class=\"tiny\" style=\"color:var(--wine)\">04 / The evening's a /textarea><\/label><\/div><label class=\"field\">A note for the birthday girl (optional)<textarea id=\"guestNote\" placeholder=\"Leave a little message...\" rows=\"3\"><\/textarea><\/label><button class=\"btn\" style=\"width:100%;margin-top:15px\" type=\"submit\">Send my reply \u2197<\/button><div aria-live=\"polite\" class=\"success-note hidden\" id=\"rsvpStatus\" role=\"status\"><\/div><p style=\"font-size:11px;color:var(--muted);line-height:1.6;margin-top:20px\">Preview mode: responses are not sent to the host or saved online yet.<\/p><\/form><\/div><\/section><\/main>\n<footer class=\"footer\"><div class=\"wrap footer-inner\"><div><div class=\"tiny\">The final word<\/div><h2>See you<br/><i class=\"serif\">at dinner.<\/i><\/h2><p>With love, <span id=\"footerName\">Sofia<\/span> x<\/p><\/div><div style=\"text-align:right\"><div class=\"logo\">THE SOCIAL EDIT.<\/div><p>Made for the moments worth celebrating.<br/>VraxisRSVP \u00b7 Template 005<\/p><a class=\"tiny\" href=\"#home\" style=\"color:#f8e9e4\">Back to top \u2191<\/a><\/div><\/div><\/footer>\n<button aria-controls=\"editor\" aria-expanded=\"false\" class=\"floating\" id=\"editToggle\">\u270e Personalise<\/button><aside aria-label=\"Personalisation panel\" class=\"editor hidden\" id=\"editor\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><h3 style=\"margin:0\">Make it yours.<\/h3><button aria-label=\"Close editor\" id=\"editClose\" style=\"border:0;background:none;font-size:24px\">\u00d7<\/button><\/div><p style=\"font-size:12px;line-height:1.7;color:var(--muted)\">Changes update this preview. They are not saved to a server.<\/p><label>First name<input id=\"edName\" value=\"Sofia\"/><\/label><label>Age<input id=\"edAge\" max=\"120\" min=\"1\" type=\"number\" value=\"25\"/><\/label><label>Event date<input id=\"edDate\" type=\"date\" value=\"2026-11-14\"/><\/label><label>Start time<input id=\"edTime\" type=\"time\" value=\"18:30\"/><\/label><label>Venue name<input id=\"edVenue\" value=\"The Glasshouse\"/><\/label><label>City / location<input id=\"edCity\" value=\"Johannesburg\"/><\/label><label>Dress code<input id=\"edDress\" value=\"Cocktail chic. A touch of cherry red.\"/><\/label><label>Intro paragraph<textarea id=\"edIntro\" rows=\"4\">A birthday is always a good excuse to get our favourite people in one room. This year, we're making an evening of it \u2014 dinner, drinks, a little dancing and absolutely no rushing home.<\/textarea><\/label><label>Hero image URL<input id=\"edHero\" placeholder=\"https://...\"/><\/label><button class=\"btn\" id=\"resetEditor\" style=\"width:100%\">Reset example<\/button><\/aside>\n<div aria-label=\"Photo viewer\" aria-modal=\"true\" class=\"lightbox hidden\" id=\"lightbox\" role=\"dialog\"><button aria-label=\"Close photo\" class=\"close\" id=\"lbClose\">\u00d7<\/button><button aria-label=\"Previous photo\" class=\"prev\" id=\"lbPrev\">\u2039<\/button><img alt=\"Expanded celebration photograph\" id=\"lbImg\"/><button aria-label=\"Next photo\" class=\"next\" id=\"lbNext\">\u203a<\/button><p id=\"lbCount\">01 / 03<\/p><\/div>\n<script>\n(()=>{'use strict';const $=id=>document.getElementById(id);const all=(s)=>Array.from(document.querySelectorAll(s));const defaultHero=$('heroPhoto').src;const defaults={edName:'Sofia',edAge:'25',edDate:'2026-11-14',edTime:'18:30',edVenue:'The Glasshouse',edCity:'Johannesburg',edDress:'Cocktail chic. A touch of cherry red.',edIntro:$('edIntro').value,edHero:''};let dateObj=new Date('2026-11-14T18:30:00');function formatDate(s){const d=new Date(s+'T12:00:00');return isNaN(d)?'Date to be announced':new Intl.DateTimeFormat('en-ZA',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d)}function update(){const name=$('edName').value.trim()||'Your Name',age=$('edAge').value||'25',date=$('edDate').value,time=$('edTime').value,venue=$('edVenue').value.trim()||'Venue to be announced',city=$('edCity').value.trim()||'Location to be announced';$('heroName').innerHTML='';$('heroName').append(document.createTextNode(name));const span=document.createElement('span');span.textContent='turns '+(Number(age)===25?'twenty five.':age+'.');$('heroName').append(span);$('ageBig').textContent=age;$('cardAge').textContent=age;$('cardName').textContent=name+\"'s birthday dinner\";$('eventDateLabel').textContent=formatDate(date);$('eventTimeLabel').textContent=(time||'18:30')+' until late';$('eventVenueLabel').textContent=venue+' \u00b7 '+city;$('footerName').textContent=name;$('dressText').textContent=$('edDress').value;$('introText').textContent=$('edIntro').value;$('directions').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(venue+' '+city);const hero=$('edHero').value.trim();$('heroPhoto').src=/^https:\\/\\//i.test(hero)?hero:defaultHero;if(date){const deadline=new Date(date+'T12:00:00');deadline.setDate(deadline.getDate()-7);$('deadline').textContent=new Intl.DateTimeFormat('en-ZA',{day:'numeric',month:'long',year:'numeric'}).format(deadline)}dateObj=new Date((date||'2026-11-14')+'T'+(time||'18:30')+':00')}Object.keys(defaults).forEach(id=>$(id).addEventListener('input',update));$('resetEditor').onclick=()=>{Object.entries(defaults).forEach(([id,value])=>$(id).value=value);update()};function toggleEditor(show){$('editor').classList.toggle('hidden',!show);$('editToggle').setAttribute('aria-expanded',String(show))}$('editToggle').onclick=()=>toggleEditor($('editor').classList.contains('hidden'));$('editClose').onclick=()=>toggleEditor(false);$('calendar').onclick=()=>{const start=dateObj;const end=new Date(start.getTime()+4*3600000);const fmt=d=>d.toISOString().replace(/[-:]/g,'').replace(/\\.\\d{3}/,'');const data=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//VraxisRSVP//SocialEdit//EN','BEGIN:VEVENT','UID:'+Date.now()+'@vraxisrsvp.local','DTSTAMP:'+fmt(new Date()),'DTSTART:'+fmt(start),'DTEND:'+fmt(end),'SUMMARY:'+($('edName').value||'Birthday')+' Birthday Celebration','LOCATION:'+[$('edVenue').value,$('edCity').value].join(', ').replace(/[,;\\\\]/g,' '),'DESCRIPTION:You are invited!','END:VEVENT','END:VCALENDAR'].join('\\r\\n');const url=URL.createObjectURL(new Blob([data],{type:'text/calendar'}));const a=document.createElement('a');a.href=url;a.download='birthday-invitation.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};all('input[name=\"attendance\"]').forEach(r=>r.addEventListener('change',()=>{$('attendingFields').classList.toggle('hidden',document.querySelector('input[name=\"attendance\"]:checked')?.value!=='yes')}));$('rsvpForm').addEventListener('submit',e=>{e.preventDefault();const selected=document.querySelector('input[name=\"attendance\"]:checked');if(!selected)return;const who=$('guestName').value.trim();$('rsvpStatus').textContent=selected.value==='yes'?`Preview: ${who}, you're on the guest list (${ $('guestCount').value } guest${$('guestCount').value==='1'?'':'s'}). This has not been submitted to the host.`:`Preview: Thank you, ${who}. Your decline has not been submitted to the host.`;$('rsvpStatus').classList.remove('hidden')});const photos=all('.gallery button img').map(img=>({src:img.src,alt:img.alt}));let current=0;function showPhoto(n){current=(n+photos.length)%photos.length;$('lbImg').src=photos[current].src;$('lbImg').alt=photos[current].alt;$('lbCount').textContent=String(current+1).padStart(2,'0')+' / '+String(photos.length).padStart(2,'0');$('lightbox').classList.remove('hidden');document.body.style.overflow='hidden'}function closePhoto(){$('lightbox').classList.add('hidden');document.body.style.overflow=''}all('.gallery button').forEach((b,i)=>b.onclick=()=>showPhoto(i));$('lbClose').onclick=closePhoto;$('lbPrev').onclick=()=>showPhoto(current-1);$('lbNext').onclick=()=>showPhoto(current+1);$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))closePhoto()});let x=0;$('lightbox').addEventListener('touchstart',e=>{x=e.touches[0].clientX},{passive:true});$('lightbox').addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-x;if(Math.abs(delta)>50)showPhoto(current+(delta<0?1:-1))},{passive:true});document.addEventListener('keydown',e=>{if(!$('lightbox').classList.contains('hidden')){if(e.key==='Escape')closePhoto();if(e.key==='ArrowRight')showPhoto(current+1);if(e.key==='ArrowLeft')showPhoto(current-1)}else if(e.key==='Escape')toggleEditor(false)});if('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('in');observer.unobserve(entry.target)}}),{threshold:.1});all('.reveal').forEach(el=>observer.observe(el))}else all('.reveal').forEach(el=>el.classList.add('in'));update()})();\n<\/script><script>(()=>{const progress=document.getElementById('readProgress');const els=['cdDays','cdHours','cdMins','cdSecs'].map(id=>document.getElementById(id));function tick(){const date=document.getElementById('edDate')?.value||'2026-11-14',time=document.getElementById('edTime')?.value||'18:30';const target=new Date(date+'T'+time+':00');const diff=Math.max(0,Math.floor((target.getTime()-Date.now())/1000));const vals=[Math.floor(diff/86400),Math.floor(diff/3600)%24,Math.floor(diff/60)%60,diff%60];els.forEach((el,i)=>{if(el)el.textContent=String(vals[i]).padStart(2,'0')})}function scroll(){const max=document.documentElement.scrollHeight-innerHeight;progress.style.width=(max>0?Math.max(0,Math.min(100,scrollY/max*100)):0)+'%'}tick();scroll();setInterval(tick,1000);addEventListener('scroll',scroll,{passive:true});addEventListener('resize',scroll,{passive:true});document.querySelectorAll('#edDate,#edTime').forEach(el=>el.addEventListener('input',tick));const status=document.getElementById('rsvpStatus');new MutationObserver(()=>{if(!status.classList.contains('hidden')){const msg=status.textContent;status.innerHTML='';const h=document.createElement('h4');h.textContent='Your reply, beautifully noted.';const p=document.createElement('p');p.textContent=msg;status.append(h,p)}}).observe(status,{attributes:true,attributeFilter:['class']})})();<\/script><script>(()=>{'use strict';const stage=document.getElementById('seStage');if(!stage)return;document.body.classList.add('se-opening');let finished=false,opening=false,transitioning=false;let timers=[];const timer=(f,t)=>timers.push(setTimeout(f,t));const by=id=>document.getElementById(id);function sync(){const n=(by('edName')?.value||'Sofia').trim()||'Sofia';by('seName').textContent=n;by('seCardName').textContent=n;by('seResHost').textContent=n;by('seWelcomeName').textContent=n+\"'s evening.\";by('seCard').setAttribute('aria-label','Open '+n+\"'s invitation\");const a=by('edAge')?.value||'25';by('seSubtitle').textContent='is celebrating '+(a==='25'?'twenty five':a)+'.'}function finish(){if(finished)return;finished=true;timers.forEach(clearTimeout);stage.classList.add('se-gone');document.body.classList.remove('se-opening');timer(()=>{stage.hidden=true;stage.setAttribute('aria-hidden','true')},800)}function open(){if(finished||opening)return;opening=true;stage.classList.add('se-reveal');timer(()=>{stage.classList.add('se-reserving');by('seReservation').setAttribute('aria-hidden','false')},750)}function confirm(){if(finished||transitioning)return;transitioning=true;const guest=by('seGuest').value.trim();by('seGreeting').textContent=guest?'Especially for '+guest:'You are invited';stage.classList.add('se-transition');timer(()=>{stage.classList.add('se-welcoming');stage.classList.remove('se-transition')},750);timer(finish,2450)}by('seEnter').addEventListener('click',open);by('seCard').addEventListener('click',open);by('seConfirm').addEventListener('click',confirm);by('seGuest').addEventListener('keydown',e=>{if(e.key==='Enter')confirm()});by('seSkip').addEventListener('click',finish);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!finished)finish()});['edName','edAge'].forEach(id=>by(id)?.addEventListener('input',sync));sync();})();<\/script><\/body><\/html>";const frame=document.getElementById("invitation");frame.srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/template-image-overrides.js" defer></script></body></html>
