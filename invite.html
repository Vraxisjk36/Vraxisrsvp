<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172f28"><title>You're invited | VraxisRSVP</title><style>
:root{--dark:#18352d;--cream:#f7f2e9;--accent:#b18c70}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--dark);font-family:Arial,sans-serif}main{max-width:760px;margin:auto;min-height:100vh;text-align:center;padding:60px 22px 80px}header{font:22px Georgia,serif;letter-spacing:-1px}header span{color:#a46d53}.eyebrow{margin-top:95px;letter-spacing:.25em;text-transform:uppercase;font-size:11px;color:#947b68}h1{font:normal clamp(48px,9vw,90px)/1.04 Georgia,serif;overflow-wrap:anywhere;margin:30px 0}h2{font:normal 35px Georgia,serif}p{line-height:1.8;color:#58675e}.line{height:1px;background:#cfc9bd;margin:45px auto;max-width:300px}.detail{margin:22px 0}.detail b{display:block;font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:#967960;margin-bottom:9px}.detail span{font:23px Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere}.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:40px 0}.photos img{width:100%;aspect-ratio:4/5;object-fit:cover}a{color:inherit}.footer{margin-top:75px;font-size:12px;color:#7b847e}#status{margin:70px 0}#content{display:none}#template-stage{display:none}#template-frame{display:block;width:100%;height:100svh;border:0}body.template-live #template-stage{display:block}body.template-live #template-frame{height:100svh}body.template-live main>header{display:none}body.template-live main>.footer{margin-top:24px}body.template-live main{max-width:760px;padding-top:35px}body.template-live #content>.eyebrow,body.template-live #heading,body.template-live #message,body.template-live #details,body.template-live #photos,body.template-live #content>.line{display:none!important}@media(max-width:480px){.eyebrow{margin-top:65px}.photos{gap:7px}}
.formfield{display:block;margin:18px 0;font-size:12px;font-weight:700}.formfield input,.formfield select,.formfield textarea{display:block;width:100%;padding:14px;margin-top:8px;border:1px solid #c9c7be;background:#fff;font:16px Arial,sans-serif;color:#203329;border-radius:0}.send{display:block;width:100%;border:0;background:#18352d;color:white;padding:17px;font:700 14px Arial,sans-serif;cursor:pointer}.send:disabled{opacity:.6}#rsvp-status{font-size:13px}</style></head><body><div id="template-stage"><iframe id="template-frame" title="Interactive invitation"></iframe></div><main><header>vraxis<span>RSVP</span></header><p id="status" role="status">Opening your invitation…</p><section id="content"><div class="eyebrow">You are warmly invited</div><h1 id="heading"></h1><p id="message"></p><div class="line"></div><div id="details"></div><div class="photos" id="photos"></div><div class="line"></div><section id="rsvp-area"><h2 id="rsvp-title">Will you join us?</h2><p id="deadline"></p><form id="rsvp-form" style="max-width:480px;margin:32px auto;text-align:left"><label class="formfield">Full name<input name="guest_name" required maxlength="100" autocomplete="name"></label><label class="formfield">Email address<input name="guest_email" type="email" required maxlength="254" autocomplete="email"></label><label class="formfield">Your response<select name="response"><option value="yes">Joyfully accepts</option><option value="no">Regretfully declines</option><option value="maybe">Not sure yet</option></select></label><label class="formfield">Number of guests including yourself<input name="party_size" type="number" min="1" max="20" value="1" required></label><label class="formfield">Message for the host (optional)<textarea name="note" maxlength="1000" rows="3" placeholder="Your message"></textarea></label><label class="formfield" style="position:absolute;left:-9999px" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><button id="send-rsvp" class="send" type="submit">Send RSVP →</button><p id="rsvp-status" role="status" aria-live="polite"></p></form></section><p>We can't wait to celebrate with you.</p></section><div class="footer">Made with VraxisRSVP</div></main><script src="assets/editor-utils.js"></script><script src="assets/photographs.js"></script><script src="assets/template-personalisation.js"></script><script>

function mountTemplate(data,eventData){
 const value=String(data.template_id||data.templateId||'');
 const match=value.match(/^0*(20|1[0-9]|[1-9])$/);
 if(!match)return;
 const num=Number(match[1]);if(num<1||num>20)return;
 const frame=document.getElementById('template-frame');
 const edits=data.design_data?.tap_edits||data.design?.tap_edits||data.tap_edits||{};
 const profile={first:(eventData.names||'').split(/\s+(?:and|&)\s+|,/i)[0],second:(eventData.names||'').split(/\s+(?:and|&)\s+|,/i)[1]||'',names:eventData.names||eventData.openingTitle,date:eventData.date,time:eventData.time,venue:eventData.venue,address:eventData.address,dress:eventData.dress||eventData.dressCode,message:eventData.introParagraph||eventData.message,age:eventData.age,child:eventData.child,deadline:eventData.deadline,title:eventData.openingTitle||eventData.title,tribute:eventData.story||eventData.introParagraph||eventData.message};
 const fields={first:'first',second:'second',date:'date',ceremonyTime:'time',ceremonyVenue:'venue',ceremonyLocation:'address',receptionTime:'time',receptionVenue:'venue',dress:'dress',letter:'message',parents:'names',bride:'names',groom:'names',tagline:'title',tribute:'tribute',quote:'message',organiser:'names',city:'address',time:'time',venue:'venue',address:'address'};
 const inputs={firstName:'first',secondName:'second',weddingDate:'date',ceremonyVenue:'venue',ceremonyPlace:'address',receptionVenue:'venue',receptionPlace:'address',editName1:'first',editName2:'second',editDate:'date',editCeremony:'venue',editReception:'venue',edName:'names',edAge:'age',edDate:'date',edTime:'time',edVenue:'venue',edAddress:'address',edCity:'address',edDress:'dress',edIntro:'message',editName:'names',editAge:'age',editVenue:'venue',editAddress:'address',editParents:'names',editBaby:'child',editMessage:'message','edit-parents':'names','edit-date':'date','edit-time':'time','edit-venue':'venue','edit-address':'address','edit-dress':'dress'};
 function apply(doc){
  if(!doc?.body||doc.__vraxisPublished)return;doc.__vraxisPublished=true;VraxisPhotographs.prepare(doc);window.vraxisApplyTemplateProfile?.(doc,String(num).padStart(3,'0'),profile);
  const style=doc.createElement('style');style.textContent='#editPanel,#editDrawer,#editor,#editOpen,#editFab,#editTop,#editorToggle,#editToggle,#openEdit,#editBtn,#studioToggle,#studioPanel,#drawer,.editor-toggle{display:none!important}';doc.head.append(style);
  for(const [field,key] of Object.entries(inputs)){const el=doc.getElementById(field),v=profile[key];if(el&&typeof v==='string'&&v.trim()){el.value=v;el.dispatchEvent(new doc.defaultView.Event('input',{bubbles:true}));el.dispatchEvent(new doc.defaultView.Event('change',{bubbles:true}))}}
  if(num===3)doc.getElementById('applyEdits')?.click();
  if(num===4)doc.getElementById('saveEd')?.click();
  for(const [field,key] of Object.entries(fields)){const v=profile[key];if(typeof v==='string'&&v.trim())doc.querySelectorAll('[data-text="'+field+'"]').forEach(el=>el.textContent=v)}
  if(num===14){for(const [field,key] of Object.entries({bride:'names',date:'date',city:'address',venue:'venue',tribute:'tribute',message:'message'})){const v=profile[key];if(typeof v==='string'&&v.trim())doc.querySelectorAll('[data-bind="'+field+'"]').forEach(el=>el.textContent=v)}}
  const photos=Array.isArray(data.photos)?data.photos.filter(x=>typeof x==='string'&&x.startsWith('https://')):[];
  doc.querySelectorAll('[data-photo],img[data-img]').forEach((el,i)=>{if(el.tagName==='IMG'&&photos[i])el.src=photos[i]});
  VraxisPhotographs.apply(doc,String(num).padStart(3,'0'),photos);
  for(const [path,v] of Object.entries(edits.text||{})){try{const el=doc.querySelector(path);if(el&&typeof v==='string')VraxisEditor.setText(el,v)}catch{}}
  for(const [path,v] of Object.entries(edits.images||{})){try{const el=doc.querySelector(path);if(el?.tagName==='IMG'&&typeof v==='string'&&v.startsWith('https://'))VraxisEditor.setImage(el,v)}catch{}}
  for(const [path,src] of Object.entries(edits.backgrounds||{}))VraxisEditor.setBackground(doc,path,src);
  function makeLiveReply(form){
   const fields=[...form.elements].map(el=>el.name+' '+el.id).join(' ');
   if(!/rsvp|attend|guest|reply|response/i.test(form.id+' '+form.className+' '+fields)||form.querySelector('[data-live-rsvp]'))return;
   const oldButton=form.querySelector('button[type="submit"],button'),oldStyle=oldButton?doc.defaultView.getComputedStyle(oldButton):null;
   const reply=doc.createElement('button');reply.type='button';reply.className=oldButton?.className||'';reply.textContent='Reply to this invitation →';reply.setAttribute('data-live-rsvp','true');reply.style.cssText='width:100%;min-height:48px;padding:16px 22px;cursor:pointer;font:inherit;border:1px solid currentColor;';
   if(oldStyle){reply.style.background=oldStyle.backgroundColor;reply.style.color=oldStyle.color;}
   reply.onclick=()=>{document.getElementById('rsvp-area').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});setTimeout(()=>document.querySelector('#rsvp-form input[name="guest_name"]')?.focus({preventScroll:true}),250);};
   const caption=doc.createElement('p');caption.textContent='Your reply goes straight to the host.';caption.style.cssText='font-size:12px;line-height:1.6;opacity:.75;margin:16px 0 0';
   form.replaceChildren(reply,caption);
   for(const note of form.parentElement.querySelectorAll('p,small'))if(note!==caption&&/(?:demo|preview)[\s\S]*(?:sent|saved|record|integration)|(?:sent|saved)[\s\S]*preview/i.test(note.textContent))note.hidden=true;
  }
  doc.querySelectorAll('form').forEach(makeLiveReply);
  new doc.defaultView.MutationObserver(records=>{for(const record of records){if(record.target.tagName==='FORM')makeLiveReply(record.target);for(const node of record.addedNodes){if(node.nodeType!==1)continue;if(node.tagName==='FORM')makeLiveReply(node);node.querySelectorAll?.('form').forEach(makeLiveReply);}}}).observe(doc.body,{childList:true,subtree:true});
 }
 frame.addEventListener('load',()=>{try{const outer=frame.contentDocument;const inner=outer.getElementById('invitation')||outer.querySelector('iframe');if(inner){const clean=outer.createElement('style');clean.textContent='html,body{margin:0!important;padding:0!important;height:100%!important;overflow:hidden!important}body>header,body>footer,body>main,body>nav,body>section,body>div:not(#invitation){display:none!important}#invitation{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;max-width:none!important;border:0!important;display:block!important}';outer.head.append(clean);const resize=()=>{try{const d=inner.contentDocument;if(d){apply(d);const h=Math.max(d.body.scrollHeight,d.documentElement.scrollHeight,inner.scrollHeight,window.innerHeight);frame.style.height=Math.max(650,window.innerHeight)+'px'}}catch{}};inner.addEventListener('load',resize);resize();setTimeout(resize,600);setTimeout(resize,1800)}else{apply(outer);frame.style.height=Math.max(window.innerHeight,outer.documentElement.scrollHeight)+'px'}}catch{}});
 frame.src='preview-'+String(num).padStart(3,'0')+'.html';document.body.classList.add('template-live');
}

(async()=>{
 const slug=new URLSearchParams(location.search).get('slug');
 const status=document.getElementById('status');
 if(!/^inv-[a-f0-9]{20}$/.test(slug||'')){status.textContent='This invitation link is invalid.';return}
 try{
  const res=await fetch('https://ogmlfnmdhmrbbmxnxwqw.supabase.co/functions/v1/public-invitation?slug='+encodeURIComponent(slug));
  const data=await res.json();if(!res.ok)throw new Error(data.error||'Invitation unavailable');
  const e=data.event||{};document.title=(data.title||'You are invited')+' | VraxisRSVP';
  document.getElementById('heading').textContent=e.openingTitle||e.names||e.title||data.title||'A special celebration';
  document.getElementById('message').textContent=e.introParagraph||e.message||e.description||'';
  const details=document.getElementById('details');
  for(const [label,key] of [['Date','date'],['Time','time'],['Venue','venue'],['Address','address'],['Dress code','dressCode']]){
   if(!e[key])continue;const block=document.createElement('div');block.className='detail';const b=document.createElement('b');b.textContent=label;const value=document.createElement('span');value.textContent=e[key];block.append(b,value);details.append(block);
  }
  const gallery=document.getElementById('photos');for(const src of data.photos||[]){const img=document.createElement('img');img.src=src;img.alt='Event photograph';img.loading='lazy';gallery.append(img)}
  mountTemplate(data,e);
  const form=document.getElementById('rsvp-form');const responseSelect=form.querySelector('select[name="response"]'),partyField=form.querySelector('input[name="party_size"]'),partyLabel=partyField.closest('label');function syncPartySize(){const attending=responseSelect.value==='yes';partyLabel.hidden=!attending;partyField.disabled=!attending;partyField.required=attending;if(!attending)partyField.value='1'}responseSelect.addEventListener('change',syncPartySize);syncPartySize();
  if(e.rsvpQuestion){const label=form.querySelector('select[name="response"]')?.closest('label');if(label)label.firstChild.textContent=e.rsvpQuestion}
  if(e.rsvpOptions){const options=e.rsvpOptions.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);const select=form.querySelector('select[name="response"]');if(options[0])select.options[0].textContent=options[0].slice(0,80);if(options[1])select.options[1].textContent=options[1].slice(0,80);if(options[2])select.options[2].textContent=options[2].slice(0,80)}
  if(e.guestQuestions){const questions=e.guestQuestions.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,4);const anchor=form.querySelector('textarea[name="note"]').closest('label');for(let i=0;i<questions.length;i++){const label=document.createElement('label');label.className='formfield';label.textContent=questions[i].slice(0,120);const input=document.createElement('input');input.name='extra_'+i;input.maxLength=180;label.append(input);anchor.parentElement.insertBefore(label,anchor)}}

  const rsvpDeadline=e.deadline||e.rsvpDeadline||e.rsvpDate;if(rsvpDeadline){document.getElementById('deadline').textContent='RSVP closes '+rsvpDeadline}
  if(e.rsvpHeading)document.getElementById('rsvp-title').textContent=e.rsvpHeading;
  form.addEventListener('submit',async event=>{
   event.preventDefault();const btn=document.getElementById('send-rsvp'),note=document.getElementById('rsvp-status');btn.disabled=true;note.textContent='Sending your RSVP…';
   try{
    const payload=Object.fromEntries(new FormData(form).entries());payload.slug=slug;payload.party_size=payload.response==='yes'?Number(payload.party_size||1):1;const extras=Object.entries(payload).filter(([key])=>key.startsWith('extra_'));for(const [key,value] of extras)delete payload[key];if(extras.length){const lines=extras.filter(([,value])=>String(value).trim()).map(([key,value])=>{const input=form.elements.namedItem(key);const label=input?.closest('label')?.firstChild?.textContent?.trim()||'Guest answer';return label+': '+value});payload.note=[payload.note||'',...lines].filter(Boolean).join('\n');if(payload.note.length>1000)throw new Error('Please shorten your message or answers to fit within 1,000 characters in total.')}
    const response=await fetch('https://ogmlfnmdhmrbbmxnxwqw.supabase.co/functions/v1/submit-rsvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const result=await response.json();if(!response.ok)throw new Error(result.error||'Please try again');
    form.replaceChildren();const message=document.createElement('p');message.textContent='Thank you! Your RSVP has been sent to the host.';form.append(message);
   }catch(err){note.textContent=err.message;btn.disabled=false}
  });
  if(rsvpDeadline&&/^\d{4}-\d{2}-\d{2}$/.test(rsvpDeadline)&&Date.now()>new Date(rsvpDeadline+'T23:59:59+02:00').getTime()){form.replaceChildren();const note=document.createElement('p');note.textContent='RSVP submissions have closed.';form.append(note)}
  status.hidden=true;document.getElementById('content').style.display='block';
 }catch(err){status.textContent='We could not open this invitation. '+err.message}
})();
</script></body></html>
