<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172f28"><title>You're invited | VraxisRSVP</title><style>
:root{--dark:#18352d;--cream:#f7f2e9;--accent:#b18c70}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--dark);font-family:Arial,sans-serif}main{max-width:760px;margin:auto;min-height:100vh;text-align:center;padding:60px 22px 80px}header{font:22px Georgia,serif;letter-spacing:-1px}header span{color:#a46d53}.eyebrow{margin-top:95px;letter-spacing:.25em;text-transform:uppercase;font-size:11px;color:#947b68}h1{font:normal clamp(48px,9vw,90px)/1.04 Georgia,serif;overflow-wrap:anywhere;margin:30px 0}h2{font:normal 35px Georgia,serif}p{line-height:1.8;color:#58675e}.line{height:1px;background:#cfc9bd;margin:45px auto;max-width:300px}.detail{margin:22px 0}.detail b{display:block;font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:#967960;margin-bottom:9px}.detail span{font:23px Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere}.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:40px 0}.photos img{width:100%;aspect-ratio:4/5;object-fit:cover}a{color:inherit}.footer{margin-top:75px;font-size:12px;color:#7b847e}#status{margin:70px 0}#content{display:none}@media(max-width:480px){.eyebrow{margin-top:65px}.photos{gap:7px}}
.formfield{display:block;margin:18px 0;font-size:12px;font-weight:700}.formfield input,.formfield select,.formfield textarea{display:block;width:100%;padding:14px;margin-top:8px;border:1px solid #c9c7be;background:#fff;font:16px Arial,sans-serif;color:#203329;border-radius:0}.send{display:block;width:100%;border:0;background:#18352d;color:white;padding:17px;font:700 14px Arial,sans-serif;cursor:pointer}.send:disabled{opacity:.6}#rsvp-status{font-size:13px}</style></head><body><main><header>vraxis<span>RSVP</span></header><p id="status" role="status">Opening your invitation…</p><section id="content"><div class="eyebrow">You are warmly invited</div><h1 id="heading"></h1><p id="message"></p><div class="line"></div><div id="details"></div><div class="photos" id="photos"></div><div class="line"></div><section id="rsvp-area"><h2 id="rsvp-title">Will you join us?</h2><p id="deadline"></p><form id="rsvp-form" style="max-width:480px;margin:32px auto;text-align:left"><label class="formfield">Full name<input name="guest_name" required maxlength="100" autocomplete="name"></label><label class="formfield">Email address<input name="guest_email" type="email" required maxlength="254" autocomplete="email"></label><label class="formfield">Your response<select name="response"><option value="yes">Joyfully accepts</option><option value="no">Regretfully declines</option><option value="maybe">Not sure yet</option></select></label><label class="formfield">Number of guests including yourself<input name="party_size" type="number" min="1" max="20" value="1" required></label><label class="formfield">Message for the host (optional)<textarea name="note" maxlength="1000" rows="3" placeholder="Your message"></textarea></label><label class="formfield" style="position:absolute;left:-9999px" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><button id="send-rsvp" class="send" type="submit">Send RSVP →</button><p id="rsvp-status" role="status" aria-live="polite"></p></form></section><p>We can't wait to celebrate with you.</p></section><div class="footer">Made with VraxisRSVP</div></main><script>
(async()=>{
 const slug=new URLSearchParams(location.search).get('slug');
 const status=document.getElementById('status');
 if(!/^inv-[a-f0-9]{20}$/.test(slug||'')){status.textContent='This invitation link is invalid.';return}
 try{
  const res=await fetch('https://ogmlfnmdhmrbbmxnxwqw.supabase.co/functions/v1/public-invitation?slug='+encodeURIComponent(slug));
  const data=await res.json();if(!res.ok)throw new Error(data.error||'Invitation unavailable');
  const e=data.event||{};document.title=(data.title||'You are invited')+' | VraxisRSVP';
  document.getElementById('heading').textContent=e.names||e.title||data.title||'A special celebration';
  document.getElementById('message').textContent=e.message||e.description||'';
  const details=document.getElementById('details');
  for(const [label,key] of [['Date','date'],['Time','time'],['Venue','venue'],['Address','address'],['Dress code','dressCode']]){
   if(!e[key])continue;const block=document.createElement('div');block.className='detail';const b=document.createElement('b');b.textContent=label;const value=document.createElement('span');value.textContent=e[key];block.append(b,value);details.append(block);
  }
  const gallery=document.getElementById('photos');for(const src of data.photos||[]){const img=document.createElement('img');img.src=src;img.alt='Event photograph';img.loading='lazy';gallery.append(img)}
  const form=document.getElementById('rsvp-form');
  if(e.deadline){document.getElementById('deadline').textContent='RSVP closes '+e.deadline}
  if(e.rsvpHeading)document.getElementById('rsvp-title').textContent=e.rsvpHeading;
  form.addEventListener('submit',async event=>{
   event.preventDefault();const btn=document.getElementById('send-rsvp'),note=document.getElementById('rsvp-status');btn.disabled=true;note.textContent='Sending your RSVP…';
   try{
    const payload=Object.fromEntries(new FormData(form).entries());payload.slug=slug;payload.party_size=Number(payload.party_size);
    const response=await fetch('https://ogmlfnmdhmrbbmxnxwqw.supabase.co/functions/v1/submit-rsvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const result=await response.json();if(!response.ok)throw new Error(result.error||'Please try again');
    form.replaceChildren();const message=document.createElement('p');message.textContent='Thank you! Your RSVP has been sent to the host.';form.append(message);
   }catch(err){note.textContent=err.message;btn.disabled=false}
  });
  if(e.deadline&&/^\\d{4}-\\d{2}-\\d{2}$/.test(e.deadline)&&Date.now()>new Date(e.deadline+'T23:59:59+02:00').getTime()){form.replaceChildren();const note=document.createElement('p');note.textContent='RSVP submissions have closed.';form.append(note)}
  status.hidden=true;document.getElementById('content').style.display='block';
 }catch(err){status.textContent='We could not open this invitation. '+err.message}
})();
</script></body></html>
