frame\"><img alt=\"Family portrait\" id=\"siFamilyPhoto\" src=\"https://images.unsplash.com/photo-1511895426328-dc8714191300?w=1000&amp;q=85\"/><span class=\"si-frame-label\">our favourite little secret \u2661<\/span><span class=\"si-seal\">?<\/span><\/div><button class=\"si-button\" id=\"siBegin\" type=\"button\">Open our little secret \u2733<\/button><small class=\"si-hint\">A surprise awaits inside<\/small><\/div><\/div><div class=\"si-pull-scene\" id=\"siPull\"><div class=\"si-secret-room\"><div class=\"si-room-eyebrow\">A LITTLE SURPRISE IS WAITING<\/div><h2 class=\"si-room-title\">Three little wishes.<br/><i>One big secret.<\/i><\/h2><p class=\"si-room-desc\">Tap the three floating balloons to send your wishes to the little one.<\/p><div class=\"si-balloon-field\" id=\"siBalloons\"><button aria-label=\"Send first wish\" class=\"si-balloon si-b1\" data-wish=\"0\" type=\"button\"><span>\u2661<\/span><\/button><button aria-label=\"Send second wish\" class=\"si-balloon si-b2\" data-wish=\"1\" type=\"button\"><span>\u2726<\/span><\/button><button aria-label=\"Send third wish\" class=\"si-balloon si-b3\" data-wish=\"2\" type=\"button\"><span>\u2733<\/span><\/button><div class=\"si-gift\" id=\"siGift\"><div class=\"si-gift-lid\"><\/div><div class=\"si-gift-body\"><span>?<\/span><\/div><\/div><div class=\"si-invite-note\" id=\"siInviteNote\"><span>YOU'RE INVITED<\/span><strong>Our little secret<br/>is worth celebrating.<\/strong><small>The answer stays a surprise\u2026 for now.<\/small><\/div><\/div><div class=\"si-wish-progress\" id=\"siProgress\">0 of 3 wishes sent<\/div><button class=\"si-room-skip\" id=\"siWishSkip\" type=\"button\">Reveal the invitation instead \u2192<\/button><\/div><\/div><div class=\"si-final\" id=\"siFinal\"><span class=\"si-kicker\" style=\"color:#6e514b\">SHHH\u2026 THE SECRET STAYS SAFE<\/span><h2>Boy or girl?<br/>Come find out.<\/h2><p><span id=\"siFinalParents\">Mia &amp; Jordan<\/span> can't wait to celebrate their little one with you.<\/p><button class=\"si-button\" id=\"siEnter\" type=\"button\">See your invitation \u2192<\/button><\/div><\/div><header class=\"top\"><div class=\"mark\">VRAXISRSVP <span style=\"opacity:.5\">/ 009<\/span><\/div><button class=\"edit\" id=\"openEdit\">\u270e Personalise<\/button><\/header><main><div class=\"shell hero\"><div class=\"hero-copy\"><div class=\"baby-kicker\">\u2726 A LITTLE ONE IS COMING \u2726<\/div><span class=\"eyebrow\">A celebration for two, soon to be three<\/span><h1>Our big<br/><em>little<\/em><br/>secret.<\/h1><p class=\"sub\"><strong id=\"parentNamesHero\">Mia &amp; Jordan<\/strong> have something wonderful to celebrate. And you're part of the story.<\/p><a class=\"pill\" href=\"#prediction\">Make your prediction \u2197<\/a><p class=\"hint\" style=\"margin-top:22px\">A BABY IS ON THE WAY \u00b7 <span id=\"heroDate\">21 MARCH 2027<\/span><\/p><\/div><div class=\"hero-photo\"><span aria-hidden=\"true\" class=\"star\">\u2733<\/span><div class=\"photo-wrap\"><img alt=\"Parents-to-be portrait\" id=\"heroImg\" src=\"https://images.unsplash.com/photo-1529636798458-92182e662485?w=1000&amp;q=85\"/><\/div><span aria-hidden=\"true\" class=\"star2\">\u273a<\/span><div aria-hidden=\"true\" class=\"nursery-mobile\"><div class=\"mobile-top\"><\/div><div class=\"mobile-string s1\"><span>\u263e<\/span><\/div><div class=\"mobile-string s2\"><span>\u2726<\/span><\/div><div class=\"mobile-string s3\"><span>\u2661<\/span><\/div><div class=\"mobile-string s4\"><span>\u2727<\/span><\/div><\/div><\/div><\/div><div aria-hidden=\"true\" class=\"ticker\"><span>\u2733 SOMETHING WONDERFUL IS COMING \u2733 A LITTLE SURPRISE \u2733 A WHOLE LOT OF LOVE \u2733 SOMETHING WONDERFUL IS COMING \u2733 A LITTLE SURPRISE \u2733 A WHOLE LOT OF LOVE \u2733\u00a0<\/span><\/div><section class=\"story\"><div class=\"section-inner story-grid\"><div class=\"story-photo reveal-on-scroll\"><img alt=\"A family moment\" id=\"storyImg\" src=\"https://images.unsplash.com/photo-1511895426328-dc8714191300?w=900&amp;q=85\"/><\/div><div class=\"reveal-on-scroll\"><span class=\"eyebrow\">A note from us<\/span><h2 class=\"section-title\">First came love. Then came this.<\/h2><p class=\"story-note\" id=\"storyText\">We have been keeping the sweetest little secret, and our hearts are bursting to share it with the people we love. Before we meet our little one, we want one afternoon full of laughter, guesses, happy tears and you.<\/p><p class=\"story-sign\">Love, <span id=\"parentNamesStory\">Mia &amp; Jordan<\/span> \u2661<\/p><\/div><div aria-hidden=\"true\" class=\"baby-onesie\"><svg role=\"img\" viewbox=\"0 0 130 145\"><path d=\"M40 13 Q65 27 90 13 L117 30 104 61 91 54 91 105 77 127 65 116 53 127 39 105 39 54 26 61 13 30Z\" fill=\"#fff9ef\" stroke=\"#bd8f8b\" stroke-width=\"2.5\"><\/path><path d=\"M49 15 Q65 39 81 15\" fill=\"none\" stroke=\"#bd8f8b\" stroke-width=\"2.5\"><\/path><path d=\"M39 105 Q65 93 91 105\" fill=\"none\" stroke=\"#bd8f8b\" stroke-dasharray=\"3 4\"><\/path><path d=\"M60 66 Q52 54 45 64 Q38 78 65 93 Q92 78 85 64 Q78 54 70 66 L65 71Z\" fill=\"#e6a8b1\"><\/path><\/svg><span>little love<\/span><\/div><\/div><\/section><section class=\"facts\"><div class=\"section-inner\"><div aria-hidden=\"true\" class=\"baby-footprints\"><span class=\"foot f1\">\u25cf<i>\u2022\u2022\u2022<\/i><\/span><span class=\"foot f2\">\u25cf<i>\u2022\u2022\u2022<\/i><\/span><span class=\"foot f3\">\u25cf<i>\u2022\u2022\u2022<\/i><\/span><span class=\"foot f4\">\u25cf<i>\u2022\u2022\u2022<\/i><\/span><\/div><span class=\"eyebrow\">You're invited<\/span><h2 class=\"section-title\">The little details.<\/h2><div class=\"facts-grid\"><article class=\"fact reveal-on-scroll\"><small>01 / WHEN<\/small><h3 id=\"eventDate\">Sunday, 21 March 2027<\/h3><p id=\"eventTime\">2:00 PM \u2014 5:00 PM<\/p><button class=\"smallbtn\" id=\"calendarBtn\">Add to calendar \u2197<\/button><\/article><article class=\"fact reveal-on-scroll\"><small>02 / WHERE<\/small><h3 id=\"eventVenue\">The Glasshouse<\/h3><p id=\"eventLocation\">Potchefstroom, South Africa<\/p><a href=\"https://www.google.com/maps/search/?api=1&amp;query=Potchefstroom\" id=\"mapLink\" rel=\"noopener\" target=\"_blank\">Get directions \u2197<\/a><\/article><article class=\"fact reveal-on-scroll\"><small>03 / THE PLAN<\/small><h3>Come curious.<\/h3><p id=\"dressCode\">Wear whatever makes you feel wonderful. Bring your best guess and your biggest smile.<\/p><\/article><\/div><\/div><\/section><section class=\"prediction\" id=\"prediction\"><div class=\"section-inner\"><div aria-hidden=\"true\" class=\"baby-cloud\">\u2601 <span>\u2726<\/span> \u2601<\/div><span class=\"eyebrow\">The guessing game<\/span><h2 class=\"section-title\">What's your<br/>little hunch?<\/h2><p class=\"intro\">No spoilers here. Pick your prediction and we'll make you a little keepsake. The actual surprise stays a secret until the celebration.<\/p><div class=\"choices\"><button class=\"choice\" data-guess=\"Girl\"><span class=\"glyph\">\u273f<\/span><strong>Team Girl<\/strong><span>I'm calling it!<\/span><\/button><button class=\"choice\" data-guess=\"Boy\"><span class=\"glyph\">\u2726<\/span><strong>Team Boy<\/strong><span>I've got a feeling!<\/span><\/button><\/div><div aria-live=\"polite\" class=\"result\" id=\"predictionResult\"><span class=\"eyebrow\">Your prediction card<\/span><h3 id=\"predictionTitle\">Team Girl \u273f<\/h3><p id=\"predictionDesc\">Your guess is in! The secret stays safe until the big day.<\/p><button class=\"smallbtn\" id=\"savePrediction\">Save my prediction card \u2193<\/button><p class=\"hint\">Your prediction is saved in this browser only. It isn't sent to the hosts.<\/p><\/div><\/div><\/section><section class=\"reveal\"><div class=\"section-inner reveal-box reveal-on-scroll\"><div aria-hidden=\"true\" class=\"baby-rattle\"><span class=\"rattle-head\">\u2661<\/span><span class=\"rattle-stick\"><\/span><\/div><div class=\"lock\">\u2733<\/div><span class=\"eyebrow\">The secret is safe<\/span><h3>The big reveal happens together.<\/h3><p>We're saving the surprise for the celebration. No spoilers, no accidental reveals, just one beautiful moment with our favourite people.<\/p><p><strong id=\"revealParents\">Mia &amp; Jordan<\/strong> can't wait to see you.<\/p><\/div><\/section><section class=\"photos\"><div class=\"section-inner\"><span class=\"eyebrow\">Our little photo album<\/span><h2 class=\"section-title\">Us, before<br/>the adventure.<\/h2><p>Every family story starts somewhere. Here are a few moments from ours.<\/p><div class=\"photo-grid\"><figure class=\"reveal-on-scroll\"><img alt=\"Couple portrait\" id=\"gallery1\" src=\"https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=700&amp;q=85\"/><figcaption id=\"caption1\">The beginning \u2661<\/figcaption><\/figure><figure class=\"reveal-on-scroll\"><img alt=\"Happy couple\" id=\"gallery2\" src=\"https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=700&amp;q=85\"/><figcaption id=\"caption2\">Our favourite days<\/figcaption><\/figure><figure class=\"reveal-on-scroll\"><img alt=\"A treasured memory\" id=\"gallery3\" src=\"https://images.unsplash.com/photo-1523438885200-e635ba2c371e?w=700&amp;q=85\"/><figcaption id=\"caption3\">And now, this chapter<\/figcaption><\/figure><\/div><\/div><\/section><section class=\"keepsake\" id=\"keepsake\"><div class=\"section-inner\"><div class=\"keepsake-card reveal-on-scroll\"><div aria-hidden=\"true\" class=\"baby-moon\">\u263e <span>\u2726<\/span><\/div><span class=\"eyebrow\">A note from us to you<\/span><h2>Before we meet you, little one\u2026<\/h2><p id=\"babyLetter\">You are already loved beyond words. One day we'll tell you about the people who gathered to celebrate you before we even knew your name.<\/p><div class=\"keepsake-preview\">A little letter from <strong id=\"letterParents\">Mia &amp; Jordan<\/strong><\/div><button class=\"smallbtn\" id=\"copyLetter\" type=\"button\">Copy this little note \u2661<\/button><\/div><\/div><\/section><section class=\"rsvp\" id=\"rsvp\"><div class=\"rsvp-card reveal-on-scroll\"><div aria-hidden=\"true\" class=\"baby-stars\">\u2727 \u00a0 \u2726 \u00a0 \u2727<\/div><span class=\"eyebrow\">A little gathering, a lot of love<\/span><h2>Will you be there?<\/h2><p>We'd love to celebrate with you. Let us know if you can make it.<\/p><form id=\"rsvpForm\"><div class=\"field\"><label for=\"guestName\">Your name<\/label><input id=\"guestName\" maxlength=\"90\" placeholder=\"Your full name\" required=\"\"/><\/div><div class=\"field\"><label for=\"attendance\">Can you come?<\/label><select id=\"attendance\" required=\"\"><option value=\"\">Choose one<\/option><option value=\"yes\">Yes, wouldn't miss it!<\/option><option value=\"no\">Sending love from afar<\/option><\/select><\/div><div class=\"field\" hidden=\"\" id=\"guestCountField\"><label for=\"guestCount\">Number of guests (including you)<\/label><input id=\"guestCount\" max=\"10\" min=\"1\" type=\"number\" value=\"1\"/><\/div><div class=\"field\"><label for=\"guestMessage\">A note for the parents (optional)<\/label><textarea id=\"guestMessage\" maxlength=\"500\" placeholder=\"Leave a little love...\"><\/textarea><\/div><button class=\"submit\" type=\"submit\">Send my reply \u2661<\/button><\/form><div class=\"rsvp-confirm\" id=\"rsvpConfirm\" role=\"status\"><h3 id=\"rsvpConfirmTitle\">Thank you \u2661<\/h3><p id=\"rsvpConfirmText\"><\/p><\/div><p class=\"hint\">Preview only: replies are not sent or stored online until the VraxisRSVP backend is connected.<\/p><\/div><\/section><\/main><footer class=\"footer\"><span class=\"eyebrow\">Made with love<\/span><h2 id=\"footerParents\">Mia &amp; Jordan \u2661<\/h2><p>One little secret. A whole new world.<\/p><small>VRAXISRSVP \u00b7 THE BIG LITTLE SECRET \u00b7 TEMPLATE 009<\/small><\/footer><div class=\"drawer-back\" id=\"drawerBack\"><\/div><aside aria-hidden=\"true\" aria-label=\"Personalise invitation\" class=\"drawer\" id=\"drawer\"><div class=\"drawer-head\"><h2>Make it y
