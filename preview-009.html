iBegin\" type=\"button\">Open our little secret \u2733\u003c/button>\n          \u003csmall class=\"si-hint\">A surprise awaits inside\u003c/small>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"si-pull-scene\" id=\"siPull\">\n        \u003cdiv class=\"si-secret-room\">\n          \u003cdiv class=\"si-room-eyebrow\">A LITTLE SURPRISE IS WAITING\u003c/div>\n          \u003ch2 class=\"si-room-title\">\n            Three little wishes.\u003cbr />\n            \u003ci>One big secret.\u003c/i>\n          \u003c/h2>\n          \u003cp class=\"si-room-desc\">\n            Tap the three floating balloons to send your wishes to the little one.\n          \u003c/p>\n          \u003cdiv class=\"si-balloon-field\" id=\"siBalloons\">\n            \u003cbutton\n              aria-label=\"Send first wish\"\n              class=\"si-balloon si-b1\"\n              data-wish=\"0\"\n              type=\"button\"\n            >\n              \u003cspan>\u2661\u003c/span>\n            \u003c/button>\n            \u003cbutton\n              aria-label=\"Send second wish\"\n              class=\"si-balloon si-b2\"\n              data-wish=\"1\"\n              type=\"button\"\n            >\n              \u003cspan>\u2726\u003c/span>\n            \u003c/button>\n            \u003cbutton\n              aria-label=\"Send third wish\"\n              class=\"si-balloon si-b3\"\n              data-wish=\"2\"\n              type=\"button\"\n            >\n              \u003cspan>\u2733\u003c/span>\n            \u003c/button>\n            \u003cdiv class=\"si-gift\" id=\"siGift\">\n              \u003cdiv class=\"si-gift-lid\">\u003c/div>\n              \u003cdiv class=\"si-gift-body\">\n                \u003cspan>?\u003c/span>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"si-invite-note\" id=\"siInviteNote\">\n              \u003cspan>YOU'RE INVITED\u003c/span>\n              \u003cstrong>Our little secret\u003cbr />is worth celebrating.\
