one}}@media(max-width:760px){header{padding:10px 14px}.brand{font-size:19px}header .btn{padding:10px;font-size:12px}.hero{grid-template-columns:1fr;min-height:auto;padding:42px 20px 75px;gap:35px}.hero h1{font-size:clamp(66px,16vw,110px)}.hero-photo{height:430px;margin:0 10px 0 20px;max-width:540px}.stamp{width:95px;height:95px;font-size:11px;left:-22px}.intro-grid,.pass-layout,.rsvp-grid,.memory-grid{grid-template-columns:1fr;gap:30px}.intro-photo{height:390px}.section-head{display:block}.section-head p{max-width:none}.stop{grid-template-columns:65px 1fr;gap:12px}.stop .tag{grid-column:2;justify-self:start}.look-grid{grid-template-columns:1fr 1fr}.look:last-child{grid-column:1/-1;max-width:320px;margin:auto}.kit-grid,.info-grid{grid-template-columns:1fr 1fr}.memory-grid img{height:330px}.pass h2{font-size:62px}}@media(max-width:430px){.hero h1{font-size:clamp(61px,15vw,80px)}.hero-photo{height:350px}.look-grid,.kit-grid,.info-grid{grid-template-columns:1fr}.look:last-child{grid-column:auto;max-width:none}.ticket .guest{font-size:30px}.stop{grid-template-columns:55px 1fr}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.marquee span{animation:none}*{transition:none!important}}\n/* Cherry-red edition: stronger contrast, clean mobile presentation */\n.hero{background:linear-gradient(135deg,#FFF0E9 0%,#F4CBC7 100%)}\n.hero h1 em{color:#AE2032}.marquee{background:#B52134}\n.itinerary{background:#861E2C}.day-tabs button.active{background:#FFE2D9;color:#681421;border-color:#FFE2D9}\n.looks{background:#EEC5BF}.logistics{background:#F5B9AF}\n.stamp{background:#C52B40;color:#fff;border-color:#F7D1C8}\n.ticket{box-shadow:12px 12px 0 #D12C3D}\n@media(max-width:700px){.hero h1{font-size:clamp(56px,14vw,90px);overflow-wrap:anywhere}.hero-photo{max-width:100%}.stamp{left:-8px;width:94px;height:94px;font-size:11px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003cdiv>\u003cdiv class=\"brand\">The Last Fling\u003c/div>\u003cdiv class=\"micro\">VraxisRSVP · Prestige\u003c/div>\u003c/div>\u003cbutton class=\"btn\" id=\"editOpen\">✎ Personalise\u003c/button>\u003c/header>\n\u003cmain>\u003csection class=\"hero\" id=\"top\">\u003cdiv>\u003cdiv class=\"eyebrow\">The official girls' getaway · 2027\u003c/div>\u003ch1>One last \u003cem>fling.\u003c/em>\u003cbr>All for \u003cspan data-bind=\"bride\">Nadia\u003c/span>.\u003c/h1>\u003cp>Before the vows, there's one unforgettable weekend with her favourite people. Pack your bags. We're celebrating our girl properly.\u003c/p>\u003cdiv style=\"display:flex;gap:10px;flex-wrap:wrap\">\u003ca href=\"#weekend\" class=\"btn dark\">Explore the weekend ↓\u003c/a>\u003ca href=\"#rsvp\" class=\"btn\">I'm coming ↗\u003c/a>\u003c/div>\u003cp class=\"micro\" style=\"margin-top:28px\">\u003cspan data-bind=\"date\">20–22 March 2027\u003c/span> &nbsp; · &nbsp; \u003cspan data-bind=\"city\">Cape Town\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"hero-photo\">\u003cimg data-photo=\"hero\" alt=\"Bachelorette getaway editorial portrait\" src=\"https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=1200&q=85\">\u003cdiv class=\"stamp\">THE GIRLS\u003cbr>ARE GOING\u003cbr>OUT ✳\u003c/div>\u003c/div>\u003c/section>\n\u003cdiv class=\"marquee\" aria-hidden=\"true\">\u003cspan>THE WEEKEND IS OURS ✳ CELEBRATING \u003cspan data-bind=\"bride\">NADIA\u003c/span> ✳ THE WEEKEND IS OURS ✳ THE LAST FLING ✳ THE WEEKEND IS OURS ✳ CELEBRATING \u003cspan data-bind=\"bride\">NADIA\u003c/span> ✳ THE WEEKEND IS OURS ✳ THE LAST FLING ✳ \u003c/span>\u003c/div>\n\u003csection class=\"intro\">\u003cdiv class=\"wrap intro-grid\">\u003cimg class=\"intro-photo\" data-photo=\"bride\" src=\"https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=1000&q=85\" alt=\"Bride-to-be portrait\">\u003cdiv>\u003cdiv class=\"eyebrow\">A weekend for our favourite girl\u003c/div>\u003ch2 class=\"serif\">She's found her person. \u003cem>We've got the weekend.\u003c/em>\u003c/h2>\u003cp class=\"lead\" data-bind=\"tribute\">Nadia is the friend who turns ordinary moments into stories we'll tell forever. So before her next big chapter, we're giving her a weekend filled with the people, places and little surprises she loves most.\u003c/p>\u003cp class=\"micro\">Hosted with love by her favourite people ♡\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"itinerary\" id=\"weekend\">\u003cdiv class=\"wrap\">\u003cdiv class=\"section-head\">\u003cdiv>\u003cdiv class=\"eyebrow\">01 / The plan\u003c/div>\u003ch2 class=\"serif\">Three days.\u003cbr>\u003cem>One for the books.\u003c/em>\u003c/h2>\u003c/div>\u003cp>Not just a schedule. Your actual weekend guide—what's happening, when to arrive, and where to be.\u003c/p>\u003c/div>\u003cdiv class=\"day-tabs\" role=\"tablist\" aria-label=\"Weekend itinerary\">\u003cbutton type=\"button\" role=\"tab\" class=\"active\" data-day=\"0\" aria-selected=\"true\">Friday · Arrival\u003c/button>\u003cbutton type=\"button\" role=\"tab\" data-day=\"1\" aria-selected=\"false\">Saturday · The Main Event\u003c/button>\u003cbutton type=\"button\" role=\"tab\" data-day=\"2\" aria-selected=\"false\">Sunday · Slow Morning\u003c/button>\u003c/div>\u003cdiv class=\"timeline fade\" id=\"timeline\" aria-live=\"polite\">\u003c/div>\u003cp class=\"itinerary-note\">*Times and locations are sample details. The host can customise the full itinerary in the published version.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"looks\">\u003cdiv class=\"wrap\">\u003cdiv class=\"section-head\">\u003cdiv>\u003cdiv class=\"eyebrow\">02 / Outfit notes\u003c/div>\u003ch2 class=\"serif\">The looks\u003cbr>are \u003cem>planned.\u003c/em>\u003c/h2>\u003c/div>\u003cp>Three moments. Three moods. Bring your personality; we've handled the inspiration.\u003c/p>\u003c/div>\u003cdiv class=\"look-grid\">\u003carticle class=\"look\">\u003cimg data-photo=\"look1\" src=\"https://images.unsplash.com/photo-1483985988355-763728e1935b?w=800&q=85\" alt=\"Daytime outfit inspiration\">\u003ch3>01. Arrival chic\u003c/h3>\u003cp>Easy, effortless and camera-ready. Think linen, denim and your favourite sunglasses.\u003c/p>\u003c/article>\u003carticle class=\"look\">\u003cimg data-photo=\"look2\" src=\"https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=800&q=85\" alt=\"Evening outfit inspiration\">\u003ch3>02. Main character\u003c/h3>\u003cp>Dress to be remembered. Everyone in colour; the bride gets her own spotlight.\u003c/p>\u003c/article>\u003carticle class=\"look\">\u003cimg data-photo=\"look3\" src=\"https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=800&q=85\" alt=\"Brunch outfit inspiration\">\u003ch3>03. Sunday soft\u003c/h3>\u003cp>Comfy, pretty and ready for one last brunch together.\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"kit\">\u003cdiv class=\"wrap\">\u003cdiv class=\"section-head\">\u003cdiv>\u003cdiv class=\"eyebrow\">03 / Before you leave\u003c/div>\u003ch2 class=\"serif\">The packing \u003cem>edit.\u003c/em>\u003c/h2>\u003c/div>\u003cp>Tick off your essentials. Your checklist stays in this browser while the page remains open.\u003c/p>\u003c/div>\u003cdiv class=\"kit-grid\" id=\"checklist\">\u003clabel class=\"kit-item\">\u003cinput type=\"checkbox\"> Your Friday outfit\u003c/label>\u003clabel class=\"kit-item\">\u003cinput type=\"checkbox\"> Saturday night look\u003c/label>\u003clabel class=\"kit-item\">\u003cinput type=\"checkbox\"> Sunday brunch fit\u003c/label>\u003clabel class=\"kit-item\">\u003cinput type=\"checkbox\"> Swimwear & sunscreen\u003c/label>\u003clabel class=\"kit-item\">\u003cinput type=\"checkbox\"> Phone charger\u003c/label>\u003clabel class=\"kit-item\">\u003cinput type=\"checkbox\"> Your best energy ♡\u003c/label>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"logistics\" id=\"details\">\u003cdiv class=\"wrap\">\u003cdiv class=\"section-head\">\u003cdiv>\u003cdiv class=\"eyebrow\">04 / Everything you need\u003c/div>\u003ch2 class=\"serif\">The \u003cem>essentials.\u003c/em>\u003c/h2>\u003c/div>\u003cp>Less frantic group-chat scrolling. More time to get excited.\u003c/p>\u003c/div>\u003cdiv class=\"info-grid\">\u003carticle class=\"info\">\u003cdiv class=\"eyebrow\">When\u003c/div>\u003ch3 data-bind=\"date\">20–22 March 2027\u003c/h3>\u003cp>Arrive Friday afternoon. Final timings are in the itinerary above.\u003c/p>\u003cbutton class=\"btn\" id=\"calendar\">Add to calendar ↗\u003c/button>\u003c/article>\u003carticle class=\"info\">\u003cdiv class=\"eyebrow\">Where\u003c/div>\u003ch3 data-bind=\"city\">Cape Town\u003c/h3>\u003cp data-bind=\"venue\">Sea Point, Cape Town · Exact accommodation address shared with confirmed guests.\u003c/p>\u003ca class=\"btn\" id=\"map\" href=\"https://www.google.com/maps/search/?api=1&query=Sea+Point+Cape+Town\" target=\"_blank\" rel=\"noopener\">View location ↗\u003c/a>\u003c/article>\u003carticle class=\"info\">\u003cdiv class=\"eyebrow\">The group\u003c/div>\u003ch3>Girls only. Good vibes.\u003c/h3>\u003cp data-bind=\"notes\">Accommodation is being coordinated by the host. Please confirm attendance before booking travel.\u003c/p>\u003ca class=\"btn\" href=\"#rsvp\">Confirm your spot ↗\u003c/a>\u003c/article>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"memory\">\u003cdiv class=\"wrap memory-grid\">\u003cimg data-photo=\"friends\" src=\"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=1200&q=85\" alt=\"Friends sharing a special moment\">\u003cdiv class=\"memory-copy\">\u003cdiv class=\"eyebrow\">05 / A little note\u003c/div>\u003ch2 class=\"serif\">The best part? \u003cem>Being together.\u003c/em>\u003c/h2>\u003cp style=\"font-size:18px;line-height:1.7\" data-bind=\"message\">It's not about having the perfect itinerary. It's about the laughs, the photos, the inside jokes and being there for Nadia before she says “I do.” We can't wait to make these memories with you.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"pass\">\u003cdiv class=\"wrap pass-layout\">\u003cdiv>\u003cdiv class=\"eyebrow\">06 / Your weekend pass\u003c/div>\u003ch2 class=\"serif\">You're on\u003cbr>\u003cem>the list.\u003c/em>\u003c/h2>\u003cp style=\"line-height:1.7;max-width:450px\">Create a personalised keepsake pass for the weekend. It's a fun memento—not a ticket or proof of booking.\u003c/p>\u003clabel for=\"passName\" class=\"micro\">Your name\u003c/label>\u003cdiv style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:10px\">\u003cinput id=\"passName\" maxlength=\"35\" placeholder=\"Enter your name\" style=\"padding:14px;min-width:0;flex:1;font-size:16px\">\u003cbutton class=\"btn coral\" id=\"savePass\">Save PNG ↗\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"ticket\" id=\"ticket\">\u003cdiv class=\"micro\">The Last Fling · Guest edition\u003c/div>\u003cdiv style=\"font-family:'Playfair Display',serif;font-size:32px;margin-top:15px\">Weekend with \u003cspan data-bind=\"bride\">Nadia\u003c/span> ♡\u003c/div>\u003cdiv class=\"guest\" id=\"passDisplay\">Your name here\u003c/div>\u003cdiv class=\"micro\">\u003cspan data-bind=\"city\">Cape Town\u003c/span> · \u003cspan data-bind=\"date\">20–22 March 2027\u003c/span>\u003c/div>\u003cdiv class=\"barcode\">|||| ||| ||||| || |||| ||||| |||\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"rsvp\" id=\"rsvp\">\u003cdiv class=\"wrap rsvp-grid\">\u003cdiv>\u003cdiv class=\"eyebrow\">07 / Save your spot\u003c/div>\u003ch2 class=\"serif\">Are you \u003cem>in?\u003c/em>\u003c/h2>\u003cp style=\"line-height:1.7\">We need to know who's coming so we can make the weekend perfect for our girl. Let us know below.\u003c/p>\u003cp class=\"small\">Demo mode: submissions are not sent or stored online.\u003c/p>\u003c/div>\u003cdiv>\u003cform class=\"form\" id=\"rsvpForm\">\u003clabel>Your full name\u003cinput name=\"name\" required maxlength=\"80\" placeholder=\"Your name\">\u003c/label>\u003clabel>Email address\u003cinput type=\"email\" name=\"email\" required placeholder=\"you@example.com\">\u003c/label>\u003clabel>Can you join us?\u003cselect name=\"attending\" id=\"attending\">\u003coption value=\"yes\">Absolutely, I'm in!\u003c/option>\u003coption value=\"no\">Sorry, I can't make it\u003c/option>\u003c/select>\u003c/label>\u003cdiv id=\"attendExtra\">\u003clabel>Anything we should know?\u003ctextarea name=\"requests\" placeholder=\"Dietary needs, travel questions, anything helpful...\">\u003c/textarea>\u003c/label>\u003c/div>\u003clabel>A message for the bride\u003ctextarea name=\"wish\" placeholder=\"Leave her a little love...\">\u003c/textarea>\u003c/label>\u003cbutton class=\"btn coral\" type=\"submit\">Send my response ↗\u003c/button>\u003c/form>\u003cdiv class=\"confirm\" id=\"confirm\" role=\"status\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter>\u003cdiv>\u003cdiv class=\"brand\">The Last Fling\u003c/div>\u003cdiv class=\"micro\">A weekend for \u003cspan data-bind=\"bride\">Nadia\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"micro\">VraxisRSVP · Template 014 · Prestige\u003c/div>\u003c/footer>\n\u003cdialog id=\"editor\">\u003cdiv class=\"dialog-head\">\u003ch2 class=\"serif\">Make it hers.\u003c/h2>\u003cbutton class=\"btn\" id=\"editClose\" aria-label=\"Close personalisation\">✕\u003c/button>\u003c/div>\u003cp class=\"small\">Preview personalisation only. Changes are not permanently saved. Photos are loaded locally in this browser.\u003c/p>\u003cdiv class=\"edit-grid\">\u003clabel>Bride's first name\u003cinput data-edit=\"bride\" value=\"Nadia\">\u003c/label>\u003clabel>Weekend date / display text\u003cinput data-edit=\"date\" value=\"20–22 March 2027\">\u003c/label>\u003clabel>Destination\u003cinput data-edit=\"city\" value=\"Cape Town\">\u003c/label>\u003clabel>Accommodation / location details\u003ctextarea data-edit=\"venue\">Sea Point, Cape Town · Exact accommodation address shared with confirmed guests.\u003c/textarea>\u003c/label>\u003clabel>Tribute to the bride\u003ctextarea data-edit=\"tribute\">Nadia is the friend who turns ordinary moments into stories we'll tell forever. So before her next big chapter, we're giving her a weekend filled with the people, places and little surprises she loves most.\u003c/textarea>\u003c/label>\u003clabel>Group information\u003ctextarea data-edit=\"notes\">Accommodation is being coordinated by the host. Please confirm attendance before booking travel.\u003c/textarea>\u003c/label>\u003clabel>Personal message\u003ctextarea data-edit=\"message\">It's not about having the perfect itinerary. It's about the laughs, the photos, the inside jokes and being there for Nadia before she says “I do.” We can't wait to make these memories with you.\u003c/textarea>\u003c/label>\u003clabel>Hero photo\u003cinput type=\"file\" accept=\"image/*\" data-upload=\"hero\">\u003c/label>\u003clabel>Bride portrait\u003cinput type=\"file\" accept=\"image/*\" data-upload=\"bride\">\u003c/label>\u003clabel>Friends photo\u003cinput type=\"file\" accept=\"image/*\" data-upload=\"friends\">\u003c/label>\u003clabel>Look 1 photo\u003cinput type=\"file\" accept=\"image/*\" data-upload=\"look1\">\u003c/label>\u003clabel>Look 2 photo\u003cinput type=\"file\" accept=\"image/*\" data-upload=\"look2\">\u003c/label>\u003clabel>Look 3 photo\u003cinput type=\"file\" accept=\"image/*\" data-upload=\"look3\">\u003c/label>\u003c/div>\u003cdiv class=\"edit-actions\">\u003cbutton class=\"btn dark\" id=\"editDone\">Done ✓\u003c/button>\u003c/div>\u003c/dialog>\n\u003cscript>\nconst schedule=[[[\"16:00\",\"Check-in & welcome\",\"Drop your bags, settle in and meet the girls.\",\"Arrival\"],[\"18:30\",\"Sunset drinks\",\"A relaxed first toast to our bride-to-be.\",\"Drinks\"],[\"20:00\",\"Dinner together\",\"Good food, stories and the start of the weekend.\",\"Dinner\"]],[[\"10:00\",\"Slow breakfast\",\"Coffee, catch-ups and a little recovery time.\",\"Morning\"],[\"13:00\",\"The surprise activity\",\"A little adventure planned just for Nadia.\",\"Surprise\"],[\"18:00\",\"Getting ready\",\"Music on. Outfits out. Photos first.\",\"Glam\"],[\"20:30\",\"The main event\",\"Our biggest celebration of the weekend.\",\"Party\"]],[[\"09:30\",\"Coffee & stories\",\"One last morning together.\",\"Morning\"],[\"11:00\",\"Farewell brunch\",\"The perfect ending to an unforgettable weekend.\",\"Brunch\"],[\"13:00\",\"Check-out\",\"Hugs, photos and see you at the wedding.\",\"Departure\"]]];\nfunction renderDay(n){document.querySelectorAll('[data-day]').forEach(b=>{let a=+b.dataset.day===n;b.classList.toggle('active',a);b.setAttribute('aria-selected',String(a))});const t=document.getElementById('timeline');t.classList.remove('fade');t.replaceChildren();schedule[n].forEach(([time,title,desc,tag])=>{const row=document.createElement('article');row.className='stop';const a=document.createElement('time');a.textContent=time;const b=document.createElement('div');const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=desc;b.append(h,p);const c=document.createElement('div');c.className='tag';c.textContent=tag;row.append(a,b,c);t.append(row)});void t.offsetWidth;t.classList.add('fade')};document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>renderDay(+b.dataset.day)));renderDay(0);\nconst editor=document.getElementById('editor');document.getElementById('editOpen').onclick=()=>editor.showModal();document.getElementById('editClose').onclick=()=>editor.close();document.getElementById('editDone').onclick=()=>editor.close();document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('input',()=>{const k=el.dataset.edit;document.querySelectorAll('[data-bind=\"'+k+'\"]').forEach(node=>node.textContent=el.value);if(k==='city'||k==='venue'){document.getElementById('map').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(document.querySelector('[data-edit=\"venue\"]').value)}}));const photoUrls={};document.querySelectorAll('[data-upload]').forEach(el=>el.addEventListener('change',()=>{const file=el.files&&el.files[0];if(!file||!file.type.startsWith('image/'))return;const k=el.dataset.upload;if(photoUrls[k])URL.revokeObjectURL(photoUrls[k]);photoUrls[k]=URL.createObjectURL(file);document.querySelectorAll('[data-photo=\"'+k+'\"]').forEach(img=>img.src=photoUrls[k])}));\ndocument.getElementById('passName').addEventListener('input',e=>document.getElementById('passDisplay').textContent=e.target.value.trim()||'Your name here');document.getElementById('savePass').addEventListener('click',()=>{const c=document.createElement('canvas');c.width=1100;c.height=650;const x=c.getContext('2d');x.fillStyle='#FFF0EB';x.fillRect(0,0,1100,650);x.fillStyle='#252c2c';x.font='bold 28px Arial';x.fillText('THE LAST FLING · GUEST EDITION',70,90);x.font='54px Georgia';x.fillText('Weekend with '+document.querySelector('[data-edit=\"bride\"]').value,70,210);x.fillStyle='#D12C3D';x.fillRect(70,250,960,4);x.fillStyle='#252c2c';x.font='66px Georgia';const name=document.getElementById('passName').value.trim()||'Your name here';x.fillText(name.slice(0,25),70,375);x.font='bold 27px Arial';x.fillText((document.querySelector('[data-edit=\"city\"]').value+' · '+document.querySelector('[data-edit=\"date\"]').value).slice(0,65),70,465);x.font='22px Arial';x.fillText('A keepsake — not a booking confirmation',70,565);const a=document.createElement('a');a.download='the-last-fling-guest-pass.png';a.href=c.toDataURL('image/png');a.click()});\ndocument.getElementById('attending').onchange=e=>document.getElementById('attendExtra').hidden=e.target.value==='no';document.getElementById('rsvpForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.currentTarget);const yes=d.get('attending')==='yes';const c=document.getElementById('confirm');c.textContent=(yes?'You’re on the list, ':'We’ll miss you, ')+d.get('name')+'! ♡ This is a preview confirmation only; your response has not been sent.';c.classList.add('show');c.scrollIntoView({behavior:'smooth',block:'nearest'})};document.getElementById('calendar').onclick=()=>{const text=document.querySelector('[data-edit=\"date\"]').value;const match=text.match(/(\\d{1,2})\\s*[–-]\\s*(\\d{1,2})\\s+(\\w+)\\s+(\\d{4})/);let start='20270320',end='20270323';if(match){const m=['january','february','march','april','may','june','july','august','september','october','november','december'].indexOf(match[3].toLowerCase());if(m>=0){const y=+match[4];const f=d=>d.getUTCFullYear()+String(d.getUTCMonth()+1).padStart(2,'0')+String(d.getUTCDate()).padStart(2,'0');start=f(new Date(Date.UTC(y,m,+match[1])));end=f(new Date(Date.UTC(y,m,+match[2]+1)))}}const esc=s=>String(s).replace(/\\\\/g,'\\\\\\\\').replace(/,/g,'\\\\,').replace(/;/g,'\\\\;').replace(/\\n/g,'\\\\n');const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//VraxisRSVP//EN','BEGIN:VEVENT','UID:last-fling-preview@vraxisrsvp','DTSTAMP:20261112T000000Z','DTSTART;VALUE=DATE:'+start,'DTEND;VALUE=DATE:'+end,'SUMMARY:'+esc('The Last Fling — '+document.querySelector('[data-edit=\"bride\"]').value),'LOCATION:'+esc(document.querySelector('[data-edit=\"venue\"]').value),'END:VEVENT','END:VCALENDAR'].join('\\r\\n');const u=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));const a=document.createElement('a');a.href=u;a.download='the-last-fling.ics';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};\n\u003c/script>\u003cstyle id=\"vraxis-opening-style\">#vraxisOpening{position:fixed;inset:0;z-index:2147483640;background:#9b1830;color:#fff3e9;display:grid;place-items:center;text-align:center;padding:32px 20px;transition:opacity .85s ease,visibility .85s ease}#vraxisOpening.dismissed{opacity:0;visibility:hidden;pointer-events:none}#vraxisOpening .opening-inner{max-width:680px;animation:openingRise 1s ease both}#vraxisOpening .opening-mark{font:600 11px/1.5 Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase}#vraxisOpening h2{font:normal clamp(46px,9vw,94px)/1.04 Georgia,serif;letter-spacing:-.055em;margin:36px 0 22px;color:inherit}#vraxisOpening .opening-rule{width:54px;height:1px;background:currentColor;margin:24px auto;opacity:.6}#vraxisOpening .opening-sub{font:12px/1.7 Arial,sans-serif;letter-spacing:.22em;margin:0 0 42px}#vraxisOpening button{border:1px solid currentColor;background:transparent;color:inherit;min-height:54px;padding:14px 28px;font:700 11px Arial,sans-serif;letter-spacing:.16em;cursor:pointer}#vraxisOpening button:focus-visible{outline:3px solid currentColor;outline-offset:5px}@keyframes openingRise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){#vraxisOpening,#vraxisOpening .opening-inner{animation:none;transition:none}}\u003c/style>\u003cdiv id=\"vraxisOpening\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Invitation opening\">\u003cdiv class=\"opening-inner\">\u003cdiv class=\"opening-mark\">THE LAST FLING · 014\u003c/div>\u003ch2>One last night\u003cbr>before forever.\u003c/h2>\u003cdiv class=\"opening-rule\">\u003c/div>\u003cp class=\"opening-sub\">THE WEEKEND BEGINS HERE\u003c/p>\u003cbutton type=\"button\" id=\"vraxisOpeningEnter\">OPEN THE INVITATION &rarr;\u003c/button>\u003c/div>\u003c/div>\u003cscript>(function(){var intro=document.getElementById('vraxisOpening');var button=document.getElementById('vraxisOpeningEnter');if(!intro||!button)return;var old=document.body.style.overflow;document.body.style.overflow='hidden';button.addEventListener('click',function(){intro.classList.add('dismissed');document.body.style.overflow=old;setTimeout(function(){intro.remove()},900)},{once:true})})();\u003c/script>\u003c/body>\u003c/html>";document.getElementById('invitation').srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/template-image-overrides.js?v=2" defer></script></body></html>
