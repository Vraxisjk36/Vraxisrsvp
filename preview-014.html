lebrating our girl properly.\n          \u003c/p>\n          \u003cdiv style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n            \u003ca href=\"#weekend\" class=\"btn dark\">Explore the weekend \u2193\u003c/a>\n            \u003ca href=\"#rsvp\" class=\"btn\">I'm coming \u2197\u003c/a>\n          \u003c/div>\n          \u003cp class=\"micro\" style=\"margin-top: 28px\">\n            \u003cspan data-bind=\"date\">20\u201322 March 2027\u003c/span> &nbsp; \u00b7 &nbsp;\n            \u003cspan data-bind=\"city\">Cape Town\u003c/span>\n          \u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"hero-photo\">\n          \u003cimg\n            data-photo=\"hero\"\n            alt=\"Bachelorette getaway editorial portrait\"\n            src=\"assets/media/b96d34852c0e4620f5c46fa8-960.webp\"\n          / srcset=\"assets/media/0803ddddcdc84dda2ed383ac-320.webp 320w, assets/media/ec1ddd6b42406d7c41ea6814-640.webp 640w, assets/media/b96d34852c0e4620f5c46fa8-960.webp 960w, assets/media/f0286ebd960f64ff2f4212e8-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n          \u003cdiv class=\"stamp\">THE GIRLS\u003cbr />ARE GOING\u003cbr />OUT \u2733\u003c/div>\n        \u003c/div>\n      \u003c/section>\n      \u003cdiv class=\"marquee\" aria-hidden=\"true\">\n        \u003cspan\n          >THE WEEKEND IS OURS \u2733 CELEBRATING \u003cspan data-bind=\"bride\">NADIA\u003c/span> \u2733 THE WEEKEND IS\n          OURS \u2733 THE LAST FLING \u2733 THE WEEKEND IS OURS \u2733 CELEBRATING\n          \u003cspan data-bind=\"bride\">NADIA\u003c/span> \u2733 THE WEEKEND IS OURS \u2733 THE LAST FLING \u2733\n        \u003c/span>\n      \u003c/div>\n      \u003csection class=\"intro\">\n        \u003cdiv class=\"wrap intro-grid\">\n          \u003cimg\n            class=\"intro-photo\"\n            data-photo=\"bride\"\n            src=\"assets/media/01554e73c448a0de6f1f8918-960.webp\"\n            alt=\"Bride-to-be portrait\"\n          / srcset=\"assets/media/801f9130b24a9e26957fc4df-320.webp 320w, assets/media/d03080fd56460da250b7ea75-640.webp 640w, assets/media/01554e73c448a0de6f1f8918-960.webp 960w, assets/media/2500099585d447404cd39997-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">A weekend for our favourite girl\u003c/div>\n            \u003ch2 class=\"serif\">She's found her person. \u003cem>We've got the weekend.\u003c/em>\u003c/h2>\n            \u003cp class=\"lead\" data-bind=\"tribute\">\n              Nadia is the friend who turns ordinary moments into stories we'll tell forever. So\n              before her next big chapter, we're giving her a weekend filled with the people, places\n              and little surprises she loves most.\n            \u003c/p>\n            \u003cp class=\"micro\">Hosted with love by her favourite people \u2661\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"itinerary\" id=\"weekend\">\n        \u003cdiv class=\"wrap\">\n          \u003cdiv class=\"section-head\">\n            \u003cdiv>\n              \u003cdiv class=\"eyebrow\">01 / The plan\u003c/div>\n              \u003ch2 class=\"serif\">\n                Three days.\u003cbr />\n                \u003cem>One for the books.\u003c/em>\n              \u003c/h2>\n            \u003c/div>\n            \u003cp>\n              Not just a schedule. Your actual weekend guide\u2014what's happening, when to arrive, and\n              where to be.\n            \u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"day-tabs\" role=\"tablist\" aria-label=\"Weekend itinerary\">\n            \u003cbutton type=\"button\" role=\"tab\" class=\"active\" data-day=\"0\" aria-selected=\"true\">\n              Friday \u00b7 Arrival\n            \u003c/button>\n            \u003cbutton type=\"button\" role=\"tab\" data-day=\"1\" aria-selected=\"false\">\n              Saturday \u00b7 T me=\"wish\"\n                  placeholder=\"Leave her a little love...\"\n                >\u003c/textarea>\n              \u003c/label>\n              \u003cbutton class=\"btn coral\" type=\"submit\">Send my response \u2197\u003c/button>\n            \u003c/form>\n            \u003cdiv class=\"confirm\" id=\"confirm\" role=\"status\">\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n    \u003c/main>\n    \u003cfooter>\n      \u003cdiv>\n        \u003cdiv class=\"brand\">The Last Fling\u003c/div>\n        \u003cdiv class=\"micro\">A weekend for \u003cspan data-bind=\"bride\">Nadia\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"micro\">VraxisRSVP \u00b7 Template 014 \u00b7 Prestige\u003c/div>\n    \u003c/footer>\n    \u003cdialog id=\"editor\">\n      \u003cdiv class=\"dialog-head\">\n        \u003ch2 class=\"serif\">Make it hers.\u003c/h2>\n        \u003cbutton class=\"btn\" id=\"editClose\" aria-label=\"Close personalisation\">\u2715\u003c/button>\n      \u003c/div>\n      \u003cp class=\"small\">\n        Preview personalisation only. Changes are not permanently saved. Photos are loaded locally\n        in this browser.\n      \u003c/p>\n      \u003cdiv class=\"edit-grid\">\n        \u003clabel>Bride's first name\u003cinput data-edit=\"bride\" value=\"Nadia\" /> \u003c/label>\n        \u003clabel\n          >Weekend date / display text\u003cinput data-edit=\"date\" value=\"20\u201322 March 2027\" />\n        \u003c/label>\n        \u003clabel>Destination\u003cinput data-edit=\"city\" value=\"Cape Town\" /> \u003c/label>\n        \u003clabel\n          >Accommodation / location details\u003ctextarea data-edit=\"venue\">\nSea Point, Cape Town \u00b7 Exact accommodation address shared with confirmed guests.\u003c/textarea>\n        \u003c/label>\n        \u003clabel\n          >Tribute to the bride\u003ctextarea data-edit=\"tribute\">\nNadia is the friend who turns ordinary moments into stories we'll tell forever. So
