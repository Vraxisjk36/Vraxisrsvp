<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>The Last Fling preview | VraxisRSVP</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f6f2eb;
        color: #24382f;
        font-family: Arial, sans-serif;
      }
      .preview-nav {
        min-height: 70px;
        padding: 14px clamp(16px, 4vw, 52px);
        display: flex;
        gap: 18px;
        align-items: center;
        justify-content: space-between;
        background: #fff;
        border-bottom: 1px solid #e0dcd3;
      }
      .brand {
        font:
          24px Georgia,
          serif;
        text-decoration: none;
        color: inherit;
      }
      .preview-nav a.cta {
        background: #24382f;
        color: #fff;
        text-decoration: none;
        padding: 14px 20px;
        font-size: 13px;
        font-weight: 700;
      }
      .preview-info {
        padding: 20px clamp(16px, 4vw, 52px);
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .preview-info a {
        color: inherit;
        text-decoration: none;
        font-size: 13px;
      }
      .preview-info b {
        font:
          24px Georgia,
          serif;
        font-weight: 400;
      }
      .preview-info span {
        color: #6c746c;
        font-size: 12px;
      }
      .preview-info .price {
        margin-left: auto;
        font-size: 13px;
        font-weight: bold;
      }
      #invitation {
        width: 100%;
        height: calc(100svh - 150px);
        min-height: 580px;
        border: 0;
        display: block;
        background: #fff;
      }
      @media (max-width: 650px) {
        .preview-nav {
          min-height: 62px;
        }
        .brand {
          font-size: 21px;
        }
        .preview-nav a.cta {
          padding: 12px;
          font-size: 12px;
        }
        .preview-info {
          padding: 15px 16px;
        }
        #invitation {
          height: calc(100svh - 135px);
          min-height: 520px;
        }
      }
    </style>
  </head>
  <body>
    <header class="preview-nav">
      <a class="brand" href="index.html">vraxisRSVP</a>
      <a class="cta" href="personalise.html?template=014">Use This Template ↗</a>
    </header>
    <div class="preview-info">
      <a href="catalogue.html">← Collection</a>
      <b>The Last Fling</b>
      <span>Bachelorette · Prestige</span>
      <span class="price">$24.00</span>
    </div>
    <iframe id="invitation" title="The Last Fling interactive invitation" allow="fullscreen">
    </iframe>
    <script>
      document.getElementById("invitation").src = "interior-014.html";
    </script>
    <script src="assets/site-nav.js" defer></script>
    <script src="assets/template-image-overrides.js?v=2" defer></script>
  </body>
</html>
