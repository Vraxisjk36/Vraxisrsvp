ize:clamp(48px,15vw,74px);line-height:1;filter:drop-shadow(0 0 16px #ffe59c);animation:mpPulse 2s ease-in-out infinite alternate}\n@keyframes mpPulse{to{transform:scale(1.2) rotate(14deg);filter:drop-shadow(0 0 34px #ffeab4)}}\n.mp-catch span:last-child{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#fff0d1}\n.mp-skip{position:absolute;z-index:4;bottom:max(22px,env(safe-area-inset-bottom));right:20px;background:#0b1736bb;color:#f2e7d2;border:1px solid #f2e7d255;padding:11px 18px;border-radius:100px;font-size:12px}\n.mp-card{position:absolute;z-index:5;top:50%;left:50%;width:min(83vw,370px);min-height:310px;transform:translate(-50%,-40%) scale(.6) rotate(-8deg);opacity:0;pointer-events:none;background:linear-gradient(145deg,#fff9eb,#f3e5c8);border:8px solid #f8efdc;box-shadow:0 25px 100px #020816a8, inset 0 0 0 1px #cbb894;color:#25334e;padding:35px 23px;display:flex;flex-direction:column;justify-content:center;text-align:center;transition:transform 1s cubic-bezier(.2,.75,.2,1),opacity .65s ease}\n.mp-card .mp-card-moon{font-size:42px;color:#a68c59;margin-bottom:18px}.mp-card h3{font-family:'Goudy Bookletter 1911',Georgia,serif;font-weight:400;font-size:40px;line-height:1.05;margin:0 0 14px}.mp-card p{font-family:Georgia,serif;font-style:italic;font-size:15px;line-height:1.6;margin:0}\n#moonPrologue.mp-opening .mp-content{opacity:0;transform:translateY(30px);transition:opacity .4s,transform .5s}\n#moonPrologue.mp-opening .mp-card{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0deg)}\n#moonPrologue.mp-opening .mp-orb{transform:translateX(-50%) scale(1.25);opacity:.55;transition:all 1s}\n@media(max-height:680px){.mp-orb{top:4%;width:110px}.mp-content{margin-top:115px}.mp-content h2{font-size:clamp(36px,8vw,56px)}.mp-content p{margin-bottom:8px}.mp-catch .mp-star{font-size:42px}}\n@media(prefers-reduced-motion:reduce){.mp-orb,.mp-photo,.mp-catch .mp-star,.mp-twinkles i{animation:none!important}#moonPrologue,.mp-card{transition-duration:.01ms!important}}\n\n/* V4: flying wish-star, magical card transformation */\n.mp-flight{position:fixed;left:0;top:0;z-index:9;width:72px;height:72px;display:grid;place-items:center;font-size:66px;line-height:1;color:#fff1ac;text-shadow:0 0 18px #ffeab4,0 0 45px #ffdf79;pointer-events:none;opacity:0;will-change:transform,opacity;filter:drop-shadow(0 0 14px #ffde8e)}\n.mp-flight:after{content:'✧  ·  ✦';position:absolute;left:-90px;top:28px;width:110px;font-size:21px;letter-spacing:12px;color:#ffeab4;opacity:.8;filter:blur(1px)}\n.mp-burst{position:absolute;z-index:7;left:50%;top:50%;width:10px;height:10px;border-radius:50%;pointer-events:none;opacity:0;box-shadow:0 0 0 1px #fff8cf,0 0 28px 13px #ffefb3;transform:translate(-50%,-50%) scale(0)}\n#moonPrologue.mp-bursting .mp-burst{animation:mpBurst .8s ease-out forwards}\n@keyframes mpBurst{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}65%{opacity:1;transform:translate(-50%,-50%) scale(15)}100%{opacity:0;transform:translate(-50%,-50%) scale(28)}}\n#moonPrologue.mp-flying .mp-catch{opacity:0;transition:opacity .2s}\n#moonPrologue.mp-flying .mp-content h2,#moonPrologue.mp-flying .mp-content p,#moonPrologue.mp-flying .mp-eyebrow{opacity:.18;transition:opacity .6s}\n#moonPrologue .mp-card{transition:transform .9s cubic-bezier(.2,1.25,.3,1),opacity .65s ease;box-shadow:0 20px 70px #080f2270,0 0 0 1px #fff7ddaa,0 0 65px #ffe9a75c}\n#moonPrologue.mp-opening .mp-card{animation:mpCardFloat 2.4s ease-in-out infinite alternate}\n@keyframes mpCardFloat{to{transform:translate(-50%,-52%) scale(1.015) rotate(1deg)}}\n@media(prefers-reduced-motion:reduce){#moonPrologue.mp-opening .mp-card{animation:none}.mp-flight{display:none}}\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv id=\"moonPrologue\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Moonlit Lullaby opening experience\">\u003cdiv class=\"mp-sky\">\u003c/div>\u003cdiv class=\"mp-photo\">\u003c/div>\u003cdiv class=\"mp-orb\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"mp-twinkles\" id=\"mpTwinkles\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"mp-hills\">\u003c/div>\u003cdiv class=\"mp-flight\" id=\"mpFlight\" aria-hidden=\"true\">✦\u003c/div>\u003cdiv class=\"mp-burst\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"mp-content\">\u003cdiv class=\"mp-eyebrow\">A little story is about to begin\u003c/div>\u003ch2>Before we meet\u003cbr>our little star…\u003c/h2>\u003cp>There is a story we have been dreaming of telling you. Catch a star to turn the first page.\u003c/p>\u003cbutton class=\"mp-catch\" id=\"mpCatch\" type=\"button\" aria-label=\"Catch the star and open the story\">\u003cspan class=\"mp-star\">✦\u003c/span>\u003cspan>Catch a star\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"mp-card\" aria-hidden=\"true\">\u003cdiv class=\"mp-card-moon\">☾ ✦\u003c/div>\u003ch3>Once upon\u003cbr>a little dream…\u003c/h3>\u003cp>With love, \u003cspan id=\"mpParents\">Mia &amp; Daniel\u003c/span>\u003c/p>\u003c/div>\u003cbutton class=\"mp-skip\" id=\"mpSkip\" type=\"button\">Skip opening →\u003c/button>\u003c/div>\u003cdiv class=\"sky\" id=\"sky\">\u003c/div>\u003cdiv class=\"shell\">\u003cheader class=\"top\">\u003cdiv class=\"brand\">Moonlit Lullaby \u003cdiv class=\"sub\">A story for someone small\u003c/div>\u003c/div>\u003cbutton class=\"btn\" id=\"editBtn\">Personalise ✎\u003c/button>\u003c/header>\u003cmain>\u003csection class=\"intro\">\u003cdiv>\u003cdiv class=\"moon\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"sub\" style=\"margin-top:40px\">Once upon a little dream\u003c/div>\u003ch1>\u003cspan id=\"heroHeading\">Our little dream\u003cbr>is coming true.\u003c/span>\u003c/h1>\u003cp>\u003cspan id=\"heroMessage\">Mia & Daniel are writing a new chapter together. And they would love you to be part of it.\u003c/span>\u003c/p>\u003cbutton class=\"btn primary\" id=\"readBtn\">Open our little story ↓\u003c/button>\u003c/div>\u003c/section>\u003csection class=\"book-area\" id=\"story\">\u003cdiv class=\"book-header\">\u003cdiv class=\"sub\">A love story in six chapters\u003c/div>\u003ch2>Turn the pages, follow the stars.\u003c/h2>\u003c/div>\u003cdiv class=\"book-wrap\">\u003cdiv class=\"book\" aria-live=\"polite\">\u003carticle class=\"page\" id=\"leftPage\">\u003c/article>\u003carticle class=\"page\" id=\"rightPage\">\u003c/article>\u003c/div>\u003cdiv class=\"book-controls\">\u003cbutton class=\"btn\" id=\"prev\" aria-label=\"Previous page\">← Back\u003c/button>\u003cdiv class=\"progress\" id=\"progress\" aria-label=\"Page progress\">\u003c/div>\u003cbutton class=\"btn primary\" id=\"next\" aria-label=\"Next page\">Next →\u003c/button>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"starwish\">\u003cdiv>\u003cdiv class=\"sub\">A wish upon a star\u003c/div>\u003ch2>A little wish,\u003cbr>a lifetime of love.\u003c/h2>\u003cp>The parents are collecting a sky full of wishes for their little one. Tap the star and make a wish for the baby. The stars are listening.\u003c/p>\u003cp class=\"small\">This is a playful moment for guests. Wishes written in the RSVP form are demonstration-only until the website's backend is connected.\u003c/p>\u003c/div>\u003cdiv class=\"wishfield\">\u003cbutton class=\"wishstar\" id=\"wishStar\" aria-label=\"Make a wish\">✦\u003c/button>\u003cdiv class=\"wishresult\" id=\"wishResult\">Tap the star\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"end\" id=\"rsvp\">\u003cdiv class=\"sub\">The next chapter begins with you\u003c/div>\u003ch2>Will you join us?\u003c/h2>\u003cp>We would love to celebrate this little miracle with you. Please let us know if you can come.\u003c/p>\u003cform class=\"form\" id=\"rsvpForm\">\u003clabel for=\"guest\">Your name\u003c/label>\u003cinput id=\"guest\" required placeholder=\"Your full name\">\u003clabel for=\"attendance\">Will you attend?\u003c/label>\u003cselect id=\"attendance\">\u003coption value=\"yes\">Joyfully accepts\u003c/option>\u003coption value=\"no\">Sends love from afar\u003c/option>\u003c/select>\u003cdiv id=\"guestCount\">\u003clabel for=\"count\">Number of guests\u003c/label>\u003cselect id=\"count\">\u003coption>1\u003c/option>\u003coption>2\u003c/option>\u003coption>3\u003c/option>\u003coption>4\u003c/option>\u003c/select>\u003c/div>\u003clabel for=\"message\">A little wish for baby (optional)\u003c/label>\u003ctextarea id=\"message\" placeholder=\"May your world always be full of wonder…\">\u003c/textarea>\u003cbutton class=\"btn primary\" type=\"submit\">Send my response\u003c/button>\u003cdiv class=\"feedback\" id=\"feedback\" role=\"status\">\u003c/div>\u003c/form>\u003c/section>\u003c/main>\u003cfooter class=\"footer\">MADE WITH LOVE · MOONLIT LULLABY · VRAXISRSVP\u003c/footer>\u003c/div>\u003caside class=\"drawer\" id=\"drawer\" aria-label=\"Personalise invitation\" aria-hidden=\"true\">\u003cbutton class=\"btn\" id=\"closeDrawer\">← Close\u003c/button>\u003ch2>Make it your story.\u003c/h2>\u003cp>Changes update this preview. They're not saved online.\u003c/p>\u003clabel>Parents' names\u003cinput id=\"editParents\" value=\"Mia & Daniel\">\u003c/label>\u003clabel>Baby's name or nickname\u003cinput id=\"editBaby\" value=\"our little star\">\u003c/label>\u003clabel>Event date\u003cinput id=\"editDate\" type=\"date\" value=\"2027-03-20\">\u003c/label>\u003clabel>Time\u003cinput id=\"editTime\" value=\"14:00\">\u003c/label>\u003clabel>Venue\u003cinput id=\"editVenue\" value=\"The Glasshouse, Rosebank\">\u003c/label>\u003clabel>City\u003cinput id=\"editCity\" value=\"Johannesburg\">\u003c/label>\u003clabel>Dress code\u003cinput id=\"editDress\" value=\"Soft colours & a little sparkle\">\u003c/label>\u003clabel>Message from the parents\u003ctextarea id=\"editMessage\">Before we hold you in our arms, we are already holding so much love for you in our hearts.\u003c/textarea>\u003c/label>\u003clabel>Our journey — how we found out\u003ctextarea id=\"editJourney\">We still remember the moment we found out. Suddenly, every little plan for tomorrow became a dream about you. We laughed, we cried, and we started imagining the beautiful life ahead.\u003c/textarea>\u003c/label>\u003clabel>Our promise to baby\u003ctextarea id=\"editPromise\">We promise you a home full of laughter, a place to belong, and love that will follow you wherever you go.\u003c/textarea>\u003c/label>\u003clabel>Personal invitation to our guests\u003ctextarea id=\"editInvite\">Before we meet our little one, we want to share this joy with the people who have loved us through every chapter.\u003c/textarea>\u003c/label>\u003clabel>Parents’ photograph URL (optional)\u003cinput id=\"editPhoto\" placeholder=\"https://...\">\u003c/label>\u003c/aside>\u003cscript>\n(function(){\nconst root=document.getElementById('moonPrologue');if(!root)return;\ndocument.body.classList.add('moon-locked');\nconst stars=document.getElementById('mpTwinkles');\nfor(let i=0;i\u003c48;i++){const star=document.createElement('i');star.style.left=((i*73+19)%100)+'%';star.style.top=((i*41+7)%75)+'%';star.style.setProperty('--delay',((i%11)*-.31)+'s');stars.appendChild(star)}\nlet done=false, timer;\nfunction finish(){if(done)return;done=true;clearTimeout(timer);root.classList.add('moon-gone');document.body.classList.remove('moon-locked');setTimeout(()=>{root.remove();},950)}\nfunction begin(){\n if(done||root.classList.contains('mp-flying')||root.classList.contains('mp-opening'))return;\n const parents=document.getElementById('editParents');if(parents)document.getElementById('mpParents').textContent=parents.value||'the parents';\n const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n if(reduce){root.classList.add('mp-opening');timer=setTimeout(finish,1150);return}\n root.classList.add('mp-flying');\n const source=document.querySelector('#mpCatch .mp-star').getBoundingClientRect();\n const flight=document.getElementById('mpFlight');\n const w=window.innerWidth,h=window.innerHeight;\n const startX=source.left+source.width/2-36,startY=source.top+source.height/2-36;\n flight.style.opacity='1';\n const frames=[\n  {transform:`translate3d(${startX}px,${startY}px,0) scale(.8) rotate(0deg)`,opacity:1,offset:0},\n  {transform:`translate3d(${w*.70}px,${h*.60}px,0) scale(.65) rotate(110deg)`,opacity:1,offset:.19},\n  {transform:`translate3d(${w*.12}px,${h*.32}px,0) scale(1.05) rotate(240deg)`,opacity:1,offset:.40},\n  {transform:`translate3d(${w*.62}px,${h*.16}px,0) scale(.65) rotate(420deg)`,opacity:1,offset:.61},\n  {transform:`translate3d(${w*.50-36}px,${h*.50-36}px,0) scale(1.9) rotate(600deg)`,opacity:1,offset:.90},\n  {transform:`translate3d(${w*.50-36}px,${h*.50-36}px,0) scale(.05) rotate(680deg)`,opacity:0,offset:1}\n ];\n let transitioned=false;\n function reveal(){if(transitioned||done)return;transitioned=true;flight.style.opacity='0';root.classList.add('mp-bursting');setTimeout(()=>root.classList.add('mp-opening'),170);timer=setTimeout(finish,1900)}\n try{const animation=flight.animate(frames,{duration:2450,easing:'ease-in-out',fill:'forwards'});animation.onfinish=reveal;animation.oncancel=reveal;setTimeout(reveal,2800)}catch(e){reveal()}\n}\ndocument.getElementById('mpCatch').addEventListener('click',begin);document.getElementById('mpSkip').addEventListener('click',finish);\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape'&&!done)finish()});\n})();\n\nconst $=id=>document.getElementById(id);let current=0;const data={parents:'Mia & Daniel',baby:'our little star',date:'2027-03-20',time:'14:00',venue:'The Glasshouse, Rosebank',city:'Johannesburg',dress:'Soft colours & a little sparkle',message:'Before we hold you in our arms, we are already holding so much love for you in our hearts.',photo:'',journey:'We still remember the moment we found out. Suddenly, every little plan for tomorrow became a dream about you. We laughed, we cried, and we started imagining the beautiful life ahead.',promise:'We promise you a home full of laughter, a place to belong, and love that will follow you wherever you go.',invite:'Befo
