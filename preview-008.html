assets/template-code/cb8879e74d01a4e89ffcbd2d.css\">\u003cscript src=\"assets/static-media.js?v=1\">\u003c/script>\u003c/head>\u003cbody>\u003cdiv id=\"moonPrologue\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Moonlit Lullaby opening experience\">\u003cdiv class=\"mp-sky\">\u003c/div>\u003cdiv class=\"mp-photo\">\u003c/div>\u003cdiv class=\"mp-orb\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"mp-twinkles\" id=\"mpTwinkles\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"mp-hills\">\u003c/div>\u003cdiv class=\"mp-flight\" id=\"mpFlight\" aria-hidden=\"true\">\u2726\u003c/div>\u003cdiv class=\"mp-burst\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"mp-content\">\u003cdiv class=\"mp-eyebrow\">A little story is about to begin\u003c/div>\u003ch2>Before we meet\u003cbr>our little star\u2026\u003c/h2>\u003cp>There is a story we have been dreaming of telling you. Catch a star to turn the first page.\u003c/p>\u003cbutton class=\"mp-catch\" id=\"mpCatch\" type=\"button\" aria-label=\"Catch the star and open the story\">\u003cspan class=\"mp-star\">\u2726\u003c/span>\u003cspan>Catch a star\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"mp-card\" aria-hidden=\"true\">\u003cdiv class=\"mp-card-moon\">\u263e \u2726\u003c/div>\u003ch3>Once upon\u003cbr>a little dream\u2026\u003c/h3>\u003cp>With love, \u003cspan id=\"mpParents\">Mia &amp; Daniel\u003c/span>\u003c/p>\u003c/div>\u003cbutton class=\"mp-skip\" id=\"mpSkip\" type=\"button\">Skip opening \u2192\u003c/button>\u003c/div>\u003cdiv class=\"sky\" id=\"sky\">\u003c/div>\u003cdiv class=\"shell\">\u003cheader class=\"top\">\u003cdiv class=\"brand\">Moonlit Lullaby \u003cdiv class=\"sub\">A story for someone small\u003c/div>\u003c/div>\u003cbutton class=\"btn\" id=\"editBtn\">Personalise \u270e\u003c/button>\u003c/header>\u003cmain>\u003csection class=\"intro\">\u003cdiv>\u003cdiv class=\"moon\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"sub\" style=\"margin-top:40px\">Once upon a little dream\u003c/div>\u003ch1>\u003cspan id=\"heroHeading\">Our little dream\u003cbr>is coming true.\u003c/span>\u003c/h1>\u003cp>\u003cspan id=\"heroMessage\">Mia & Daniel are writing a new chapter together. And they would love you to be part of it.\u003c/span>\u003c/p>\u003cbutton class=\"btn primary\" id=\"readBtn\">Open our little story \u2193\u003c/button>\u003c/div>\u003c/section>\u003csection class=\"book-area\" id=\"story\">\u003cdiv class=\"book-header\">\u003cdiv class=\"sub\">A love story in six chapters\u003c/div>\u003ch2>Turn the pages, follow the stars.\u003c/h2>\u003c/div>\u003cdiv class=\"book-wrap\">\u003cdiv class=\"book\" aria-live=\"polite\">\u003carticle class=\"page\" id=\"leftPage\">\u003c/article>\u003carticle class=\"page\" id=\"rightPage\">\u003c/article>\u003c/div>\u003cdiv class=\"book-controls\">\u003cbutton class=\"btn\" id=\"prev\" aria-label=\"Previous page\">\u2190 Back\u003c/button>\u003cdiv class=\"progress\" id=\"progress\" aria-label=\"Page progress\">\u003c/div>\u003cbutton class=\"btn primary\" id=\"next\" aria-label=\"Next page\">Next \u2192\u003c/button>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"starwish\">\u003cdiv>\u003cdiv class=\"sub\">A wish upon a star\u003c/div>\u003ch2>A little wish,\u003cbr>a lifetime of love.\u003c/h2>\u003cp>The parents are collecting a sky full of wishes for their little one. Tap the star and make a wish for the baby. The stars are listening.\u003c/p>\u003cp class=\"small\">This is a playful moment for guests. Wishes written in the RSVP form are demonstration-only until the website's backend is connected.\u003c/p>\u003c/div>\u003cdiv class=\"wishfield\">\u003cbutton class=\"wishstar\" id=\"wishStar\" aria-label=\"Make a wish\">\u2726\u003c/button>\u003cdiv class=\"wishresult\" id=\"wishResult\">Tap the star\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"end\" id=\"rsvp\">\u003cdiv class=\"sub\">The next chapter begins with you\u003c/div>\u003ch2>Will you join us?\u003c/h2>\u003cp>We would love to celebrate this little miracle with you. Please let us know if you can come.\u003c/p>\u003cform class=\"form\" id=\"rsvpForm\">\u003clabel for=\"guest\">Your name\u003c/label>\u003cinput id=\"guest\" required placeholder=\"Your full name\">\u003clabel for=\"attendance\">Will you attend?\u003c/label>\u003cselect id=\"attendance\">\u003coption value=\"yes\">Joyfully accepts\u003c/option>\u003coption value=\"no\">Sends love from afar\u003c/option>\u003c/select>\u003cdiv id=\"guestCount\">\u003clabel for=\"count\">Number of guests\u003c/label>\u003cselect id=\"count\">\u003coption>1\u003c/option>\u003coption>2\u003c/option>\u003coption>3\u003c/option>\u003coption>4\u003c/option>\u003c/select>\u003c/div>\u003clabel for=\"message\">A little wish for baby (optional)\u003c/label>\u003ctextarea id=\"message\" placeholder=\"May your world always be full of wonder\u2026\">\u003c/textarea>\u003cbutton class=\"btn primary\" type=\"submit\">Send my response\u003c/button>\u003cdiv class=\"feedback\" id=\"feedback\" role=\"status\">\u003c/div>\u003c/form>\u003c/section>\u003c/main>\u003cfooter class=\"footer\">MADE WITH LOVE \u00b7 MOONLIT LULLABY \u00b7 VRAXISRSVP\u003c/footer>\u003c/div>\u003caside class=\"drawer\" id=\"drawer\" aria-label=\"Personalise invitation\" aria-hidden=\"true\">\u003cbutton class=\"btn\" id=\"closeDrawer\">\u2190 Close\u003c/button>\u003ch2>Make it your story.\u003c/h2>\u003cp>Changes update this preview. They're not saved online.\u003c/p>\u003clabel>Parents' names\u003cinput id=\"editParents\" value=\"Mia & Daniel\">\u003c/label>\u003clabel>Baby's name or nickname\u003cinput id=\"editBaby\" value=\"our little star\">\u003c/label>\u003clabel>Event date\u003cinput id=\"editDate\" type=\"date\" value=\"2027-03-20\">\u003c/label>\u003clabel>Time\u003cinput id=\"editTime\" value=\"14:00\">\u003c/label>\u003clabel>Venue\u003cinput id=\"editVenue\" value=\"The Glasshouse, Rosebank\">\u003c/label>\u003clabel>City\u003cinput id=\"editCity\" value=\"Johannesburg\">\u003c/label>\u003clabel>Dress code\u003cinput id=\"editDress\" value=\"Soft colours & a little sparkle\">\u003c/label>\u003clabel>Message from the parents\u003ctextarea id=\"editMessage\">Before we hold you in our arms, we are already holding so much love for you in our hearts.\u003c/textarea>\u003c/label>\u003clabel>Our journey \u2014 how we found out\u003ctextarea id=\"editJourney\">We still remember the moment we found out. Suddenly, every little plan for tomorrow became a dream about you. We laughed, we cried, and we started imagining the beautiful life ahead.\u003c/textarea>\u003c/label>\u003clabel>Our promise to baby\u003ctextarea id=\"editPromise\">We promise you a home full of laughter, a place to belong, and love that will follow you wherever you go.\u003c/textarea>\u003c/label>\u003clabel>Personal invitation to our guests\u003ctextarea id=\"editInvite\">Before we meet our little one, we want to share this joy with the people who have loved us through every chapter.\u003c/textarea>\u003c/label>\u003clabel>Parents\u2019 photograph URL (optional)\u003cinput id=\"editPhoto\" placeholder=\"https://...\">\u003c/label>\u003c/aside>\u003cscript src=\"assets/template-code/1834c650fa92bf7b06e2adcd.js\">\u003c/script>\u003c/body>\u003c/html>";const frame=document.getElementById("invitation");frame.srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/template-image-overrides.js?v=zero-waste1" defer></script><script src="assets/templates.js?v=zero-waste1"></script><script src="assets/design-finishing.js?v=20261115b"></script><script src="assets/template-polish.js?v=zero-waste1"></script></body></html>
