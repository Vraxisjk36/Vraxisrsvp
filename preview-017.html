m:scale(1.08);animation:gateDrift 12s ease-in-out infinite alternate;will-change:transform}\n.new-garden-opening .gate-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,10,7,.72),rgba(3,10,7,.15) 35%,rgba(3,10,7,.68) 80%,rgba(3,10,7,.93))}\n.new-garden-opening .gate-content{position:relative;z-index:2;min-height:100%;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:72px 24px 38px;color:#f5f0e4}\n.gate-small{font:500 9px 'DM Sans',sans-serif;letter-spacing:.31em;color:#d8d1b9}\n.gate-ornament{font:30px Georgia,serif;color:#d1bd8b;margin:32px 0 10px;opacity:.85}\n.gate-title{font:400 clamp(62px,15vw,106px)/.93 'Cormorant Garamond',Georgia,serif;letter-spacing:-.04em;text-shadow:0 4px 28px #0008}\n.gate-title em{font-weight:300}\n.gate-rule{width:1px;height:54px;background:#d4c7a1;margin:29px 0 20px;opacity:.85}\n.gate-copy{font:italic 19px 'Cormorant Garamond',Georgia,serif;color:#e8e2d3;margin:0 0 32px}\n.new-garden-opening .gate-enter{padding:16px 24px;min-width:218px;border:1px solid #c8b48a!important;background:rgba(7,20,13,.4)!important;color:#f4efdf!important;font-size:11px;letter-spacing:.12em;backdrop-filter:blur(7px);cursor:pointer}\n.gate-enter span{margin-left:12px}\n.gate-foot{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));left:24px;right:24px;display:flex;justify-content:space-between;gap:8px;color:#c8c4b6;font:9px 'DM Sans',sans-serif;letter-spacing:.12em}\n.new-garden-opening.opening-exit .gate-content{animation:gateTextOut .65s ease forwards}\n.new-garden-opening.opening-exit .gate-visual{animation:gateReveal 1.4s cubic-bezier(.22,.75,.2,1) forwards}\n.new-garden-opening.opening-exit{animation:gateFade 1.45s ease forwards}\n.new-garden-opening.done{opacity:0!important;visibility:hidden!important;pointer-events:none!important;display:none!important}\n@keyframes gateDrift{from{transform:scale(1.08) translateY(0)}to{transform:scale(1.15) translateY(-1.5%)}}\n@keyframes gateReveal{from{transform:scale(1.08);filter:brightness(.52) saturate(.75)}to{transform:scale(1.35);filter:brightness(1.2) saturate(.95)}}\n@keyframes gateTextOut{to{opacity:0;transform:translateY(-18px)}}\n@keyframes gateFade{0%,38%{opacity:1}100%{opacity:0;visibility:hidden}}\n@media(prefers-reduced-motion:reduce){.new-garden-opening .gate-visual{animation:none}.new-garden-opening.opening-exit,.new-garden-opening.opening-exit .gate-content,.new-garden-opening.opening-exit .gate-visual{animation:none;opacity:0}}\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv class=\"opening new-garden-opening\" id=\"opening\">\u003cdiv class=\"gate-visual\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"gate-shade\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"gate-content\">\u003cdiv class=\"gate-small\">A PRIVATE INVITATION · NO. 017\u003c/div>\u003cdiv class=\"gate-ornament\" aria-hidden=\"true\">✧\u003c/div>\u003cdiv class=\"gate-title\">Midnight\u003cbr>\u003cem>Garden\u003c/em>\u003c/div>\u003cdiv class=\"gate-rule\">\u003c/div>\u003cp class=\"gate-copy\">An evening where love takes root.\u003c/p>\u003cbutton class=\"outline-btn gate-enter\" id=\"enter\">Step into the garden \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>\u003cdiv class=\"gate-foot\">AMELIA &amp; JULIAN \u003cspan>21 · 11 · 2027\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\u003cmain>\u003csection class=\"section hero center\" id=\"top\">\u003cdiv>\u003cdiv class=\"eyebrow\">Together with their families\u003c/div>\u003ch1 class=\"display\">Amelia \u003cspan>&amp;\u003c/span> Julian\u003c/h1>\u003cdiv class=\"sub serif\">request the pleasure of your company at their wedding\u003c/div>\u003cdiv class=\"eyebrow\">Saturday · 21 November · 2027\u003c/div>\u003c/div>\u003cdiv class=\"scroll\">SCROLL TO WANDER\u003c/div>\u003c/section>\n\u003csection class=\"chapter\" aria-label=\"Our story\">\u003cdiv class=\"art\" role=\"img\" aria-label=\"Engagement portrait of the couple in a botanical conservatory\">\u003c/div>\u003cdiv class=\"copy\">\u003cdiv class=\"eyebrow reveal\">I. A quiet beginning\u003c/div>\u003ch2 class=\"display reveal\">The beauty\u003cbr>of finding\u003cbr>you.\u003c/h2>\u003cp class=\"serif reveal\">In a world full of noise, we found something wonderfully quiet. A love that grew gently, then all at once.\u003c/p>\u003cp class=\"reveal\">We can't wait to begin our next chapter surrounded by the people who made our story possible.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"section glass\" id=\"glass\">\u003cdiv class=\"eyebrow reveal\">II. Behind the glass\u003c/div>\u003ch2 class=\"display reveal\">A secret\u003cbr>garden awaits.\u003c/h2>\u003cp class=\"small reveal\" style=\"max-width:320px\">There is a place we've been dreaming of sharing with you. Touch the glass to discover it.\u003c/p>\u003cdiv class=\"glasshouse\" id=\"glasshouse\">\u003cdiv class=\"inside\">\u003cdiv>\u003cdiv class=\"eyebrow\">The celebration\u003c/div>\u003ch3 class=\"display\">The Glasshouse\u003c/h3>\u003cdiv class=\"serif\" style=\"font-size:12px\">An evening among the orchids\u003c/div>\u003c/div>\u003c/div>\u003cbutton class=\"tap\" id=\"clearGlass\" aria-label=\"Reveal the wedding venue\">✧ &nbsp; Touch to reveal &nbsp; ✧\u003c/button>\u003c/div>\u003cdiv class=\"details\" id=\"venueDetails\">\u003cstrong>The Glasshouse Gardens\u003c/strong>\u003cdiv class=\"small\">Ceremony at 16:30 · Reception to follow\u003cbr>Illustrative venue details — personalise before publishing\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section schedule\">\u003cdiv class=\"eyebrow center reveal\">III. When evening falls\u003c/div>\u003ch2 class=\"display center reveal\">The night\u003cbr>unfolds.\u003c/h2>\u003cp class=\"small center reveal\" style=\"color:#536053;margin-bottom:45px\">Tap a moment to discover what's planned.\u003c/p>\u003cdiv class=\"events\">\u003cdiv class=\"event\" tabindex=\"0\" role=\"button\" aria-expanded=\"false\">\u003cdiv class=\"eyebrow\" style=\"color:#526b55\">16:00\u003c/div>\u003ch3>Welcome to the garden\u003c/h3>\u003cspan class=\"plus\">+\u003c/span>\u003cdiv class=\"note\">Arrive, settle in, and enjoy a welcome drink beneath the trees.\u003c/div>\u003c/div>\u003cdiv class=\"event\" tabindex=\"0\" role=\"button\" aria-expanded=\"false\">\u003cdiv class=\"eyebrow\" style=\"color:#526b55\">16:30\u003c/div>\u003ch3>The vows\u003c/h3>\u003cspan class=\"plus\">+\u003c/span>\u003cdiv class=\"note\">Join us for an intimate ceremony as the afternoon light begins to soften.\u003c/div>\u003c/div>\u003cdiv class=\"event\" tabindex=\"0\" role=\"button\" aria-expanded=\"false\">\u003cdiv class=\"eyebrow\" style=\"color:#526b55\">18:00\u003c/div>\u003ch3>Dinner by candlelight\u003c/h3>\u003cspan class=\"plus\">+\u003c/span>\u003cdiv class=\"note\">A shared table, beautiful food, and the company of our favourite people.\u003c/div>\u003c/div>\u003cdiv class=\"event\" tabindex=\"0\" role=\"button\" aria-expanded=\"false\">\u003cdiv class=\"eyebrow\" style=\"color:#526b55\">20:00\u003c/div>\u003ch3>Dance into the night\u003c/h3>\u003cspan class=\"plus\">+\u003c/span>\u003cdiv class=\"note\">Stay awhile. The best part of the evening is still ahead.\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"gallery\" aria-label=\"Botanical gallery\">\u003cdiv class=\"head\">\u003cdiv class=\"eyebrow reveal\">IV. Collected moments\u003c/div>\u003ch2 class=\"display reveal\">A little\u003cbr>wild beauty.\u003c/h2>\u003cp class=\"small reveal\">Swipe through three moments from the garden studies.\u003c/p>\u003c/div>\u003cdiv class=\"track\">\u003cdiv class=\"frame\" data-caption=\"I. The first bloom\" role=\"img\" aria-label=\"Botanical illustration one\">\u003c/div>\u003cdiv class=\"frame\" data-caption=\"II. The quiet hours\" role=\"img\" aria-label=\"Botanical illustration two\">\u003c/div>\u003cdiv class=\"frame\" data-caption=\"III. Under the stars\" role=\"img\" aria-label=\"Botanical illustration three\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section rsvp\">\u003cdiv class=\"card reveal\">\u003cdiv class=\"eyebrow\">V. A place for you\u003c/div>\u003ch2 class=\"display\">Your seat\u003cbr>awaits.\u003c/h2>\u003cp class=\"small\">Every beautiful evening is made by the people who share it.\u003c/p>\u003cdiv class=\"place\">\u003cdiv class=\"eyebrow\" style=\"color:#71816b\">Reserved with love for\u003c/div>\u003cdiv class=\"name\" id=\"placeName\">Your Name\u003c/div>\u003cdiv class=\"serif\" style=\"font-size:11px;margin-top:10px\">21 November 2027\u003c/div>\u003c/div>\u003cform id=\"rsvpForm\">\u003clabel for=\"guestName\" class=\"eyebrow\">Your name\u003c/label>\u003cinput id=\"guestName\" required maxlength=\"60\" placeholder=\"Enter your name\" autocomplete=\"name\">\u003clabel for=\"attendance\" class=\"eyebrow\">Will you join us?\u003c/label>\u003cselect id=\"attendance\" required>\u003coption value=\"\">Choose a response\u003c/option>\u003coption value=\"yes\">Joyfully accepts\u003c/option>\u003coption value=\"no\">Regretfully declines\u003c/option>\u003c/select>\u003cbutton type=\"submit\" class=\"outline-btn\">Seal my reply\u003c/button>\u003cdiv class=\"result\" id=\"rsvpResult\" aria-live=\"polite\">\u003c/div>\u003c/form>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"foot\">\u003cstrong>Amelia & Julian\u003c/strong>\u003cp class=\"eyebrow\">Under the stars, together.\u003c/p>\u003cbutton class=\"outline-btn\" id=\"replay\">Replay the opening\u003c/button>\u003cp style=\"font-size:10px;margin-top:35px\">VraxisRSVP · Concept preview 017 · RSVP is a demonstration\u003c/p>\u003c/footer>\n\u003cscript>const opening=document.getElementById('opening');let openingBusy=false;function enterGarden(){if(openingBusy)return;openingBusy=true;opening.classList.add('opening-exit');setTimeout(()=>{opening.classList.add('done');openingBusy=false},1450)}document.getElementById('enter').addEventListener('click',enterGarden);document.getElementById('replay').addEventListener('click',()=>{window.scrollTo({top:0,behavior:'instant'});opening.classList.remove('done','opening-exit');openingBusy=false;document.getElementById('enter').focus()});document.getElementById('clearGlass').addEventListener('click',()=>{document.getElementById('glasshouse').classList.add('clear');document.getElementById('venueDetails').classList.add('show')});document.querySelectorAll('.event').forEach(el=>{const toggle=()=>{el.classList.toggle('active');el.setAttribute('aria-expanded',el.classList.contains('active'))};el.addEventListener('click',toggle);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}})});const guest=document.getElementById('guestName');guest.addEventListener('input',()=>document.getElementById('placeName').textContent=guest.value.trim()||'Your Name');document.getElementById('rsvpForm').addEventListener('submit',e=>{e.preventDefault();const yes=document.getElementById('attendance').value==='yes';document.getElementById('rsvpResult').textContent=yes?'Your place card is ready. (Demo only — no RSVP was sent.)':'Your reply is noted in this preview only — no RSVP was sent.'});const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('seen');io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.reveal').forEach(el=>io.observe(el));\u003c/script>\u003c/body>\u003c/html>";document.getElementById('invitation').srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/template-image-overrides.js" defer></script><script src="assets/templates.js"></script><script src="assets/template-polish.js?v=1"></script></body></html>
