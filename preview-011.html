:absolute;left:50%;top:0;height:40px;border-left:2px solid #f9e6c3}.sun-mobile .bar{position:absolute;left:15%;right:15%;top:40px;border-top:3px solid #f9e6c3;border-radius:50%}.sun-mobile .dangle{position:absolute;top:42px;width:2px;height:55px;background:#f9e6c3;transform-origin:top;animation:sunSway 3.5s ease-in-out infinite alternate}.sun-mobile .dangle:after{content:attr(data-shape);position:absolute;top:45px;left:-13px;font-size:28px;color:#fff1c8;text-shadow:0 0 15px #fff9d477}.sun-mobile .dangle:nth-child(3){left:22%;animation-delay:-1s}.sun-mobile .dangle:nth-child(4){left:49%;height:70px;animation-delay:-2s}.sun-mobile .dangle:nth-child(5){left:76%;animation-delay:-.5s}\n.sun-particles{position:absolute;inset:0;z-index:8;pointer-events:none}.sun-spark{position:absolute;font-size:20px;animation:sunSpark 1.6s ease-out forwards}\n.sun-top{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;z-index:12;display:flex;justify-content:space-between;align-items:start;gap:12px}.sun-brand{font-family:'Italiana',Georgia,serif;font-size:clamp(22px,5vw,32px)}.sun-skip{border:1px solid #ffffff77;color:#fff;background:#1b292b66;padding:10px 14px;font-size:12px;backdrop-filter:blur(8px)}\n.sun-story{position:absolute;z-index:10;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(92vw,460px);text-align:center;padding:22px 24px 20px;background:#142b25dc;border:1px solid #ffffff44;box-shadow:0 18px 60px #0e211b77;backdrop-filter:blur(15px)}\n.sun-kicker{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#f3d9b3}.sun-heading{font-family:'Italiana',Georgia,serif;font-size:clamp(35px,9vw,58px);line-height:1.02;margin:12px 0}.sun-desc{font:italic 13px/1.65 'Libre Baskerville',Georgia,serif;color:#f2e9da;min-height:44px;margin:0 0 14px}.sun-action{background:#e9d3af;color:#253c32;border:0;padding:13px 22px;min-height:46px;width:100%;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}.sun-step{display:flex;justify-content:center;gap:8px;margin-top:15px}.sun-step span{width:22px;height:2px;background:#ffffff50;transition:background .4s}.sun-step span.active{background:#f4d5a6}\n#sunIntro.sun-open .sun-curtain.left{transform:translateX(-98%)}#sunIntro.sun-open .sun-curtain.right{transform:translateX(98%)}#sunIntro.sun-open .sun-lightbeam{opacity:1;transform:translateX(-50%) scale(1.3)}#sunIntro.sun-open .sun-room:before{opacity:1}\n#sunIntro.sun-crib-in .sun-crib{transform:translateX(-50%) translateY(0) scale(1)}#sunIntro.sun-crib-in .sun-mobile{opacity:1;transform:translate(-50%,0) scale(1)}\n#sunIntro.sun-final .sun-story{background:#f6eee1f0;color:#2d4538;border-color:#f6eee1}#sunIntro.sun-final .sun-kicker{color:#9d7659}#sunIntro.sun-final .sun-desc{color:#46564c}\n@keyframes sunSway{from{transform:rotate(-15deg)}to{transform:rotate(16deg)}}@keyframes sunSpark{from{opacity:1;transform:translateY(0) scale(.5)}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(80deg) scale(1.4)}}\n@media(max-height:680px){.sun-window{top:8%;height:57svh}.sun-crib{bottom:20%;height:145px;scale:.72;transform-origin:bottom center}.sun-mobile{bottom:calc(20% + 120px);scale:.75}.sun-story{padding:12px 18px 14px}.sun-heading{font-size:clamp(30px,7vw,43px);margin:6px 0}.sun-desc{font-size:12px;min-height:0;margin-bottom:9px}.sun-step{margin-top:9px}}\n@media(prefers-reduced-motion:reduce){#sunIntro *,#sunIntro *:before,#sunIntro *:after{animation:none!important;transition-duration:.01ms!important}}\n<\/style><\/head><body><div id=\"sunIntro\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Sunday With Love, the room we made\"><div class=\"sun-room\"><div class=\"sun-wall\"><\/div><div class=\"sun-floor\"><\/div><div class=\"sun-window\" id=\"sunWindow\"><div class=\"sun-horizon\"><\/div><div class=\"sun-window-cross\"><\/div><div class=\"sun-curtain left\"><\/div><div class=\"sun-curtain right\"><\/div><\/div><div class=\"sun-lightbeam\"><\/div><div class=\"sun-crib\" id=\"sunCrib\" role=\"button\" tabindex=\"-1\" aria-label=\"Discover the baby's room\"><div class=\"blanket\"><\/div><div class=\"rail\"><\/div><div class=\"head\"><\/div><div class=\"foot\"><\/div><\/div><div class=\"sun-mobile\"><div class=\"stem\"><\/div><div class=\"bar\"><\/div><div class=\"dangle\" data-shape=\"\u263e\"><\/div><div class=\"dangle\" data-shape=\"\u2726\"><\/div><div class=\"dangle\" data-shape=\"\u2661\"><\/div><\/div><div class=\"sun-particles\" id=\"sunParticles\"><\/div><\/div><div class=\"sun-top\"><span class=\"sun-brand\">Sunday, with love<\/span><button class=\"sun-skip\" id=\"sunSkip\" type=\"button\">Skip introduction<\/button><\/div><div class=\"sun-story\" aria-live=\"polite\"><span class=\"sun-kicker\" id=\"sunKicker\">A little something is changing<\/span><h1 class=\"sun-heading\" id=\"sunHeading\">There's room<br>for one more.<\/h1><p class=\"sun-desc\" id=\"sunDesc\">Every home holds a thousand stories. Ours is about to begin its sweetest chapter.<\/p><button class=\"sun-action\" id=\"sunAction\" type=\"button\">Open the curtains<\/button><div class=\"sun-step\"><span class=\"active\"><\/span><span><\/span><span><\/span><\/div><\/div><\/div><header class=\"top\"><div class=\"brand\">Sunday, With Love<\/div><button class=\"navbtn\" id=\"openEdit\">PERSONALISE <span aria-hidden=\"true\">\u2197<\/span><\/button><\/header><main><section class=\"hero\" id=\"home\"><div class=\"hero-copy\"><div class=\"eyebrow\">A celebration of a new beginning<\/div><h1 class=\"serif\">A little <span>more love.<\/span><\/h1><p class=\"subtitle\">Our family is growing, and we'd love nothing more than to celebrate this beautiful chapter with you.<\/p><div style=\"margin-top:30px\" class=\"eyebrow\">With love, <span data-text=\"parents\">Maya &amp; Daniel<\/span><\/div><\/div><div class=\"hero-photo\"><img data-img=\"hero\" src=\"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=1200&q=85\" alt=\"Portrait placeholder \u2014 upload a photograph of the parents\"><div class=\"photo-caption\"><span>Our story, still unfolding<\/span><span>01 \u2014 The beginning<\/span><\/div><\/div><\/section><div class=\"wrap introline\"><span>A personal invitation<\/span><span>Made with love, for the people we love<\/span><\/div><div class=\"rule\"><\/div><section class=\"letter\" id=\"letter\"><div class=\"wrap letter-grid\"><div><div class=\"eyebrow\">A note from us<\/div><h2 class=\"serif\">Dear <em class=\"italic\">everyone,<\/em><\/h2><\/div><div class=\"letter-text\"><p data-text=\"letter1\">Some of life's loveliest moments arrive quietly. A little heartbeat, a growing dream, and suddenly the world feels entirely new.<\/p><p data-text=\"letter2\">As we prepare to welcome our baby, we keep thinking about the people who have loved us through every chapter. We'd be so happy to have you beside us for this one.<\/p><p>Come as you are. Bring your stories, your laughter and your love. That is more than enough.<\/p><div class=\"signature\">With all our love, <span data-text=\"parents\">Maya &amp; Daniel<\/span><\/div><\/div><\/div><\/section><section class=\"memory\" id=\"memories\"><div class=\"wrap\"><div class=\"memory-head\"><div><div class=\"eyebrow\">Before we meet you<\/div><h2 class=\"serif\">The little<br>moments.<\/h2><\/div><p>A few pieces of the story that brought us here. Replace these photographs with the moments that mean the most to you.<\/p><\/div><div class=\"photo-grid\"><figure class=\"photo-item\"><img data-img=\"memory1\" src=\"https://images.unsplash.com/photo-1511895426328-dc8714191300?w=1100&q=85\" alt=\"Family memory placeholder\"><figcaption><span data-text=\"caption1\">The people who make a home<\/span><span>01<\/span><\/figcaption><\/figure><figure class=\"photo-item\"><img data-img=\"memory2\" src=\"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=800&q=85\" alt=\"Friends and family placeholder\"><figcaption><span data-text=\"caption2\">Every little blessing<\/span><span>02<\/span><\/figcaption><\/figure><figure class=\"photo-item\"><img data-img=\"memory3\" src=\"https://images.unsplash.com/photo-1491013516836-7db643ee125a?w=800&q=85\" alt=\"Baby shoes placeholder\"><figcaption><span data-text=\"caption3\">A new chapter begins<\/span><span>03<\/span><\/figcaption><\/figure><\/div><\/div><\/section><section class=\"invitation\" id=\"details\"><div class=\"wrap invitation-inner\"><div class=\"eyebrow\">Please join us<\/div><h2 class=\"serif\">Baby <span>shower.<\/span><\/h2><p class=\"description\">A slow afternoon, good company, something sweet and a whole lot of love. We can't wait to celebrate with you.<\/p><div class=\"detail-grid\"><div class=\"detail\"><div class=\"eyebrow\">When<\/div><strong data-text=\"dateDisplay\">Sunday, 22 November 2026<\/strong><small data-text=\"time\">14:00<\/small><\/div><div class=\"detail\"><div class=\"eyebrow\">Where<\/div><strong data-text=\"venue\">The Glasshouse<\/strong><small data-text=\"address\">Potchefstroom, South Africa<\/small><\/div><div class=\"detail\"><div class=\"eyebrow\">The mood<\/div><strong data-text=\"dress\">Soft neutrals<\/strong><small>Come comfortable, come as yourself<\/small><\/div><\/div><div class=\"actions\"><a class=\"outline\" id=\"directions\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://maps.google.com/?q=Potchefstroom\">GET DIRECTIONS \u2197<\/a><button class=\"outline\" id=\"calendar\">ADD TO CALENDAR \u2197<\/button><a class=\"outline\" href=\"#rsvp\">KINDLY RSVP \u2193<\/a><\/div><\/div><\/section><section class=\"parents\"><div class=\"wrap parents-grid\"><div class=\"parents-img\"><img data-img=\"parents\" src=\"https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=1100&q=85\" alt=\"Photograph placeholder for the parents\"><\/div><div class=\"parents-copy\"><div class=\"eyebrow\">From our hearts to yours<\/div><h2 class=\"serif\">The best is <span class=\"italic\" style=\"color:var(--terracotta)\">yet to come.<\/span><\/h2><p data-text=\"closing\">There are so many things we don't know about the days ahead. But we know our little one will be surrounded by extraordinary love. Thank you for being part of our story.<\/p><div class=\"signature\" data-text=\"parents\">Maya &amp; Daniel<\/div><\/div><\/div><\/section><section class=\"rsvp\" id=\"rsvp\"><div class=\"wrap rsvp-grid\"><div><div class=\"eyebrow\">Your presence means everything<\/div><h2 class=\"serif\">Will you <span style=\"display:block\">join us?<\/span><\/h2><p class=\"sub\">A seat, a sweet treat and a little celebration are waiting for you. Please let us know if you can make it.<\/p><div class=\"small\" style=\"margin-top:30px\">With love, <span data-text=\"parents\">Maya &amp; Daniel<\/span><\/div><\/div><form class=\"form\" id=\"rsvpForm\"><label for=\"guestName\">Your name<\/label><input id=\"guestName\" required placeholder=\"First and last name\" maxlength=\"90\"><label>Will you attend?<\/label><div class=\"choices\"><button type=\"button\" class=\"choice active\" data-attend=\"yes\" aria-pressed=\"true\">Joyfully accept<\/button><button type=\"button\" class=\"choice\" data-attend=\"no\" aria-pressed=\"false\">Send my love<\/button><\/div><div id=\"guestCountWrap\"><label for=\"guestCount\">Number of guests<\/label><select id=\"guestCount\"><option>1<\/option><option>2<\/option><option>3<\/option><option>4<\/option><\/select><\/div><label for=\"guestMessage\">A little note (optional)<\/label><textarea id=\"guestMessage\" placeholder=\"A wish for the parents and baby...\"><\/textarea><button class=\"submit\" type=\"submit\">SEND MY RESPONSE \u2197<\/button><div class=\"notice\" id=\"response\" role=\"status\" aria-live=\"polite\">Preview only: responses are not sent or stored online yet.<\/div><\/form><\/div><\/section><\/main><footer class=\"footer\"><span>Sunday, With Love \u00b7 A celebration of family<\/span><span>VraxisRSVP \u00b7 Template 011<\/span><\/footer><div class=\"scrim\" id=\"scrim\"><\/div><aside class=\"editpanel\" id=\"panel\" role=\"dialog\" aria-label=\"Personalise invitation\" aria-modal=\"true\"><div class=\"edithead\"><h2>Make it yours.<\/h2><button class=\"navbtn\" id=\"closeEdit\" aria-label=\"Close personalisation\">CLOSE \u00d7<\/button><\/div><p class=\"hint\">Edit the story and upload your own photographs. Changes appear immediately in this preview. They are not saved after the page closes.<\/p><div id=\"fields\"><\/div><h3 class=\"serif\" style=\"font-size:2rem;font-weight:400;margin-top:35px\">Your photographs<\/h3><p class=\"hint\">Choose photos from your device. For best results, use portraits for the cover and parents' photo, and a mix of portraits and candid images for the memories.<\/p><div id=\"uploads\"><\/div><\/aside><script>\nconst defaults={parents:'Maya & Daniel',letter1:\"Some of life's loveliest moments arrive quietly. A little heartbeat, a growing dream, and suddenly the world feels entirely new.\",letter2:\"As we prepare to welcome our baby, we keep thinking about the people who have loved us through every chapter. We'd be so happy to have you beside us for this one.\",closing:\"There are so many things we don't know about the days ahead. But we know our little one will be surrounded by extraordinary love. Thank you for being part of our story.\",dateDisplay:'Sunday, 22 November 2026',time:'14:00',venue:'The Glasshouse',address:'Potchefstroom, South Africa',dress:'Soft neutrals',caption1:'The people who make a home',caption2:'Every little blessing',caption3:'A new chapter begins'};const fields=[['parents','Parents\u2019 names'],['letter1','Letter \u2014 first paragraph'],['letter2','Letter \u2014 second paragraph'],['closing','Closing message'],['dateDisplay','Date (display)'],['time','Time'],['venue','Venue'],['address','Address'],['dress','Dress code'],['caption1','Photo one caption'],['caption2','Photo two caption'],['caption3','Photo three caption']];const fieldBox=document.getElementById('fields');fields.forEach(([key,label]) tener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('open'))togglePanel(false)});let attending=true;document.querySelectorAll('[data-attend]').forEach(btn=>btn.addEventListener('click',()=>{attending=btn.dataset.attend==='yes';document.querySelectorAll('[data-attend]').forEach(b=>{const active=b===btn;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.getElementById('guestCountWrap').hidden=!attending}));document.getElementById('rsvpForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('guestName').value.trim();if(!name)return;document.getElementById('response').textContent=attending?'Thank you, '+name+'! Your acceptance is shown in this preview only. It has not been sent.':'Thank you for your lovely response, '+name+'. This is a preview only; nothing has been sent.'});document.getElementById('calendar').addEventListener('click',()=>{const text=defaults.dateDisplay;const parsed=new Date(text+' '+defaults.time);if(Number.isNaN(parsed.getTime())){alert('Please use a valid date and time to add to calendar.');return}const start=new Date(parsed.getTime()),end=new Date(start.getTime()+3*3600000);const fmt=d=>d.toISOString().replace(/[-:]/g,'').replace(/\\.\\d{3}/,'');const esc=s=>s.replace(/\\\\/g,'\\\\\\\\').replace(/\\n/g,'\\\\n').replace(/,/g,'\\\\,').replace(/;/g,'\\\\;');const ics='BEGIN:VCALENDAR\\r\\nVERSION:2.0\\r\\nPRODID:-//VraxisRSVP//EN\\r\\nBEGIN:VEVENT\\r\\nUID:'+Date.now()+'@vraxisrsvp\\r\\nDTSTAMP:'+fmt(new Date())+'\\r\\nDTSTART:'+fmt(start)+'\\r\\nDTEND:'+fmt(end)+'\\r\\nSUMMARY:Baby Shower \u2014 '+esc(defaults.parents)+'\\r\\nLOCATION:'+esc(defaults.venue+', '+defaults.address)+'\\r\\nEND:VEVENT\\r\\nEND:VCALENDAR';const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));const a=document.createElement('a');a.href=url;a.download='sunday-with-love.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)});\n<\/script><script>(function(){const roo
