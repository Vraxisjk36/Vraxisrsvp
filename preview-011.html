=\"stylesheet\" href=\"assets/template-code/bd4451d3bdd33ab50c80f239.css\">\u003cscript src=\"assets/static-media.js?v=1\">\u003c/script>\u003c/head>\u003cbody>\u003cdiv class=\"intro\" id=\"intro\">\u003cdiv class=\"intro-content\">\u003cdiv class=\"sun\">\u003c/div>\u003cdiv class=\"envelope\">\u003cdiv class=\"small eyebrow\">A note for someone special\u003c/div>\u003ch1>Sunday,\u003cbr/>\u003ci>with love.\u003c/i>\u003c/h1>\u003cp>A little invitation. A very big reason to celebrate.\u003c/p>\u003cbutton class=\"pill\" id=\"open\">Open your invitation \u00a0 \u2733\u003c/button>\u003c/div>\u003cp class=\"small\" style=\"margin-top:25px;color:#4a5541\">Made with love, for the people we love\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"site\" id=\"site\">\u003cheader class=\"topbar\">\u003cdiv class=\"small\">SUNDAY, WITH LOVE.\u003c/div>\u003ca href=\"#details\">THE DAY\u003c/a>\u003ca href=\"#rsvp\">RSVP \u2197\u003c/a>\u003c/header>\u003csection class=\"hero\">\u003cdiv class=\"hero-copy\">\u003cdiv class=\"small\">A baby shower invitation \u00a0 / \u00a0 01\u003c/div>\u003ch1>There's\u003cbr/>room for\u003cbr/>\u003cem>one more.\u003c/em>\u003c/h1>\u003cp class=\"hero-caption\">Some of life's sweetest stories begin with the smallest people. We're getting ready to welcome someone wonderful \u2014 and we'd love you to celebrate with us.\u003c/p>\u003cdiv class=\"scrollcue\">SCROLL TO DISCOVER \u00a0 \u003cspan>\u2193\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"hero-image\">\u003cimg alt=\"A tender baby portrait representing the new arrival\" src=\"assets/media/a564f1396e64eab8368d48fa-960.webp\"/ srcset=\"assets/media/1b441a9046bf07562f1327c7-320.webp 320w, assets/media/30ca7dc9453f6d885f07e397-640.webp 640w, assets/media/a564f1396e64eab8368d48fa-960.webp 960w, assets/media/4a7ce7eba471739d83622935-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\" loading=\"lazy\">\u003cdiv class=\"image-label\">THE NEXT CHAPTER BEGINS HERE\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"note\">\u003cdiv class=\"container note-grid\">\u003cdiv class=\"reveal\">\u003cdiv class=\"number\">01.\u003c/div>\u003cdiv class=\"small eyebrow\">A letter from us\u003c/div>\u003ch2>A little\u003cbr/>\u003ci>more love.\u003c/i>\u003c/h2>\u003cp style=\"line-height:1.9;max-width:320px\">A gathering for the people who have made our story so special \u2014 before its newest chapter begins.\u003c/p>\u003c/div>\u003cdiv class=\"letter reveal\">\u003cdiv class=\"small eyebrow\">Dear family &amp; friends,\u003c/div>\u003cp>Our hearts are already growing in ways we never imagined. Soon, our family will grow too.\u003c/p>\u003cp>Before we meet our little one, we'd love to spend a beautiful Sunday with the people who mean the most to us. Come for the laughter, the stories, the little treats and the love.\u003c/p>\u003cp>Nothing elaborate is required. Just bring yourself \u2014 that's the part we can't wait for.\u003c/p>\u003cdiv class=\"signature\">With all our love \u2661\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"moments\">\u003cdiv class=\"container\">\u003cdiv class=\"small eyebrow reveal\">02 / The little things\u003c/div>\u003ch2 class=\"reveal\">The sweetest things\u003cbr/>\u003ci>are still to come.\u003c/i>\u003c/h2>\u003cdiv class=\"photo-grid\">\u003cimg alt=\"Baby portrait illustrating the little one being celebrated\" class=\"big reveal\" src=\"assets/media/a564f1396e64eab8368d48fa-960.webp\"/ srcset=\"assets/media/1b441a9046bf07562f1327c7-320.webp 320w, assets/media/30ca7dc9453f6d885f07e397-640.webp 640w, assets/media/a564f1396e64eab8368d48fa-960.webp 960w, assets/media/4a7ce7eba471739d83622935-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\" loading=\"lazy\">\u003cdiv class=\"reveal\">\u003cimg alt=\"Celebration table setting\" class=\"side\" src=\"assets/media/47041c11a10776d19a04dc94-960.webp\"/ srcset=\"assets/media/40c842c1874fcbc83a6d879b-320.webp 320w, assets/media/0f47c9dcaf645e9ecd3aefea-640.webp 639w, assets/media/47041c11a10776d19a04dc94-960.webp 960w, assets/media/58abd9787d3cd3e791bfb5d3-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\" loading=\"lazy\">\u003cp class=\"side-text\">A new little heartbeat.\u003cbr/>A whole lot of love.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"details\">\u003cdiv class=\"container chapter-grid\">\u003cdiv class=\"art reveal\">\u003cimg alt=\"Garden celebration setting\" src=\"assets/media/aab99cfc712023090aceeed3-960.webp\"/ srcset=\"assets/media/27f2b6bdc09e78a24bceb331-320.webp 319w, assets/media/feeba012fd96518c42f3c2e2-640.webp 640w, assets/media/aab99cfc712023090aceeed3-960.webp 960w, assets/media/853201c3cb7134d820660f38-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\" loading=\"lazy\">\u003c/div>\u003cdiv class=\"reveal\">\u003cdiv class=\"small eyebrow\">03 / Save a Sunday\u003c/div>\u003ch2>Let's make\u003cbr/>\u003ci>a memory.\u003c/i>\u003c/h2>\u003cdiv class=\"detail\">\u003cb>THE DAY\u003c/b>\u003cspan>Sunday, 22 November 2026\u003c/span>\u003c/div>\u003cdiv class=\"detail\">\u003cb>THE TIME\u003c/b>\u003cspan>12:00 in the afternoon\u003c/span>\u003c/div>\u003cdiv class=\"detail\">\u003cb>THE PLACE\u003c/b>\u003cspan>The Garden House\u003cbr/>Stellenbosch, South Africa\u003c/span>\u003c/div>\u003cdiv class=\"detail\">\u003cb>DRESS\u003c/b>\u003cspan>Sunday best, in soft and happy colours\u003c/span>\u003c/div>\u003cp style=\"line-height:1.8;font-size:14px;margin-top:30px\">Sample invitation details \u2014 personalise the date, venue and message before publishing.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"rsvp\" id=\"rsvp\">\u003cdiv class=\"container\">\u003cdiv class=\"small\">04 / An invitation for you\u003c/div>\u003ch2>Will you\u003cbr/>\u003ci>be there?\u003c/i>\u003c/h2>\u003cp class=\"sub\">A place at the table, something sweet, and a Sunday we'll remember. Please let us know if you'll join us.\u003c/p>\u003cform id=\"form\">\u003clabel for=\"name\">Your name\u003c/label>\u003cinput id=\"name\" name=\"name\" placeholder=\"Full name\" required=\"\"/>\u003clabel for=\"attendance\">Can you make it?\u003c/label>\u003cselect id=\"attendance\" name=\"attendance\">\u003coption value=\"yes\">Yes, I'll be there\u003c/option>\u003coption value=\"no\">Sorry, I can't make it\u003c/option>\u003c/select>\u003clabel for=\"guests\">Number of guests\u003c/label>\u003cselect id=\"guests\" name=\"guests\">\u003coption>1\u003c/option>\u003coption>2\u003c/option>\u003coption>3\u003c/option>\u003coption>4\u003c/option>\u003c/select>\u003cbutton class=\"pill\" type=\"submit\">Send my reply \u2197\u003c/button>\u003cdiv class=\"success\" id=\"success\" role=\"status\">Thank you! This preview has saved your response on this page only. Connect your RSVP backend before publishing.\u003c/div>\u003c/form>\u003c/div>\u003c/section>\u003cfooter class=\"end\">\u003cdiv class=\"small\">Until we meet\u003c/div>\u003ch2>With love,\u003cbr/>\u003ci>always.\u003c/i>\u003c/h2>\u003cp>SUNDAY, WITH LOVE. \u00a0 \u2733 \u00a0 A VRAXISRSVP INVITATION\u003c/p>\u003c/footer>\u003c/div>\u003cscript src=\"assets/template-code/f60392e213c09f3987b1fffc.js\">\u003c/script>\u003c/body>\u003c/html>";const frame=document.getElementById("invitation");frame.srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/template-image-overrides.js?v=zero-waste1" defer></script><script src="assets/templates.js?v=zero-waste1"></script><script src="assets/design-finishing.js?v=20261115b"></script><script src="assets/template-polish.js?v=zero-waste1"></script></body></html>
