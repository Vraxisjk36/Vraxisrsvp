<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personalise | VraxisRSVP</title></head><body><p>Opening your invitation builder… <a id="continue" href="catalogue.html">Continue</a></p><script>(()=>{const q=new URLSearchParams(location.search),id=q.get('template');let dest='catalogue.html';if(/^0(0[1-9]|1[0-9]|20)$/.test(id||'')){const next=new URLSearchParams({template:id});for(const key of ['draft','project'])if(/^[0-9a-f-]{36}$/i.test(q.get(key)||''))next.set(key,q.get(key));if(/^[1-6]$/.test(q.get('step')||''))next.set('step',q.get('step'));dest='start.html?'+next.toString()}document.getElementById('continue').href=dest;location.replace(dest)})();</script></body></html>
