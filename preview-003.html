y=Italiana&amp;display=swap\"\n      rel=\"stylesheet\"\n    />\n    \u003clink rel=\"stylesheet\" href=\"assets/template-code/0f14a1d0f70c27ed2c61b9f9.css\">\n    \u003clink rel=\"stylesheet\" href=\"assets/template-code/fc15388dcc1089fe84905d22.css\">\n  \n\u003clink rel=\"stylesheet\" href=\"assets/template-code/01c9034bbc4af738b593da19.css\">\n\n\u003clink rel=\"stylesheet\" href=\"assets/template-code/45659fb4032f90b34ef116dc.css\">\n\u003clink rel=\"stylesheet\" href=\"assets/template-code/720b6ddb52c070322736d3a1.css\">\n\u003cscript src=\"assets/static-media.js?v=1\">\u003c/script>\u003c/head>\n  \u003cbody>\n    \u003cdiv\n      aria-label=\"Open the wedding invitation\"\n      aria-modal=\"true\"\n      class=\"mv-intro\"\n      id=\"mvIntro\"\n      role=\"dialog\"\n    >\n      \u003cdiv class=\"mv-intro-photo\">\u003c/div>\n      \u003cdiv class=\"mv-intro-border\">\u003c/div>\n      \u003cdiv class=\"mv-intro-spine\">\u003c/div>\n      \u003cdiv class=\"mv-issue-vertical\">A PRIVATE WEDDING EDITION \u2014 MMXXVI\u003c/div>\n      \u003cdiv class=\"mv-intro-index\">VOL. 01 &nbsp; / &nbsp; FOREVER\u003c/div>\n      \u003cdiv class=\"mv-intro-top\">\n        \u003cspan>THE MODERN VOW\u003cbr />PRIVATE EDITION\u003c/span>\n        \u003cspan class=\"mv-intro-edition\">ISSUE NO. 001\u003cbr />AN INVITATION TO LOVE\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"mv-intro-content\">\n        \u003cp class=\"mv-intro-kicker\">You are cordially invited\u003c/p>\n        \u003ch2 class=\"mv-intro-names\">\n          \u003cspan id=\"mvIntroFirst\">Alex\u003c/span>\n          \u003cem>&amp;\u003c/em>\n          \u003cspan id=\"mvIntroSecond\">Mira\u003c/span>\n        \u003c/h2>\n        \u003cdiv class=\"mv-intro-rule\">\u003c/div>\n        \u003cdiv class=\"mv-intro-sub\">A love story, in print.\u003cbr />14 November 2026\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"mv-intro-controls\">\n        \u003cbutton class=\"mv-enter\" id=\"mvEnter\" type=\"button\">\n          TURN THE FIRST PAGE \u003cspan class=\"mv-arrow\" aria-hidden=\"true\">\u2192\u003c/span>\n        \u003c/button>\n        \u003cbutton class=\"mv-skip\" id=\"mvSkip\" type=\"button\">Skip intro\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"mv-intro-panel left\">\u003c/div>\n      \u003cdiv class=\"mv-intro-panel right\">\u003c/div>\n      \u003cdiv class=\"mv-editorial-reveal\" aria-hidden=\"true\">\n        \u003cdiv class=\"mv-reveal-photo\">\u003c/div>\n        \u003cdiv class=\"mv-reveal-paper\">\n          \u003cp>Chapter One\u003c/p>\n          \u003ch3>Every love\u003cbr />has a story.\u003c/h3>\n          \u003cp>This one is ours.\u003c/p>\n          \u003csmall>THE CELEBRATION BEGINS\u003c/small>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv aria-hidden=\"true\" class=\"reading-line\" id=\"readingLine\">\u003c/div>\n    \u003cheader class=\"nav\">\n      \u003ca class=\"brand\" href=\"#home\">THE MODERN VOW \u003cspan style=\"color: #8b8379\">/ 003\u003c/span> \u003c/a>\n      \u003cnav class=\"navlinks\">\n        \u003ca href=\"#story\">The Editorial\u003c/a>\n        \u003ca href=\"#moments\">Moments\u003c/a>\n        \u003ca href=\"#details\">The Occasion\u003c/a>\n        \u003ca href=\"#schedule\">Schedule\u003c/a>\n        \u003ca class=\"nav-rsvp\" href=\"#reply\">RSVP \u2197\u003c/a>\n      \u003c/nav>\n    \u003c/header>\n    \u003cmain>\n      \u003csection class=\"hero\" id=\"home\">\n        \u003cdiv class=\"hero-copy\">\n          \u003cdiv class=\"issue eyebrow\">\n            \u003cspan>Wedding issue / 001\u003c/span>\n            \u003cspan>Est. forever\u003c/span>\n          \u003c/div>\n          \u003cdiv>\n            \u003cp class=\"eyebrow\">The wedding of\u003c/p>\n            \u003ch1 id=\"heroNames\">\n              \u003cspan>Alex\u003c/span>\n              \u003cspan>&amp; Mira\u003c/span>\n            \u003c/h1>\n          \u003c/div>\n          \u003cdiv class=\"hero-bottom\">\n            \u003cp>Some stories are written in the stars. Ours is written in the moments between.\u003c/p>\n            \u003ca class=\"arrow-link\" href=\"#story\">Discover our story \u003cspan>\u2197\u003c/span> \u003c/a>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"hero-photo\">\n          \u003cimg\n            alt=\"Romantic wedding couple photographed in editorial style\"\n            id=\"heroImage\"\n            src=\"assets/media/08b9887c0bd559740fc76f33-960.webp\"\n          / srcset=\"assets/media/25b884cd9c2d340fd79f2dbb-320.webp 320w, assets/media/e7e12190a50c6f00367b3a59-640.webp 640w, assets/media/08b9887c0bd559740fc76f33-960.webp 960w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n          \u003cspan class=\"vertical\" id=\"heroDate\">14 November 2026 \u2014 You're invited\u003c/span>\n        \u003c/div>\n      \u003c/section>\n      \u003cdiv class=\"ticker\">\n        \u003cspan>A celebration of love\u003c/span>\n        \u003cspan>14 November 2026\u003c/span>\n        \u003cspan>Johannesburg \u00b7 South Africa\u003c/span>\n      \u003c/div>\n      \u003csection class=\"section editorial\" id=\"story\">\n        \u003cdiv class=\"intro reveal\">\n          \u003cdiv>\n            \u003cdiv class=\"eyebrow\">01 / The Editorial\u003c/div>\n            \u003ch2 class=\"section-title\">\n              Our\u003cbr />\n              \u003ci>story.\u003c/i>\n            \u003c/h2>\n          \u003c/div>\n          \u003cdiv>\n            \u003cp class=\"lead\">Not a perfect story. Our favourite one.\u003c/p>\n            \u003cp class=\"body\">\n              Every great love story begins somewhere. Ours began with a moment that didn't seem\n              extraordinary at the time\u2014and became everything.\n            \u003c/p>\n          \u003c/div>\n        \u003c/div>\n        \u003carticle class=\"story-spread reveal reveal\">\n          \u003cdiv class=\"story-img\" data-frame=\"EDITORIAL / 01\">\n            \u003cimg\n              alt=\"Friends sharing a joyful moment\"\n              loading=\"lazy\"\n              src=\"assets/media/ddd9da703115c7eb5948e32d-960.webp\"\n            / srcset=\"assets/media/bcfb6f2fca0dee4830424f25-320.webp 320w, assets/media/3582f32783025ab571c77123-640.webp 640w, assets/media/ddd9da703115c7eb5948e32d-960.webp 960w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n          \u003c/div>\n          \u003cdiv class=\"story-copy\">\n            \u003cdiv class=\"num\">\n              \u003cspan>01 / The first hello\u003c/span>\n              \u003cspan>2019\u003c/span>\n            \u003c/div>\n            \u003ch3>The day\u003cbr />it began.\u003c/h3>\n            \u003cp>\n              It started with a conversation neither of us wanted to end. One unexpected hello\n              became long walks, late-night calls and the kind of laughter that makes time\n              disappear.\n            \u003c/p>\n            \u003cp>We didn't know it then, but everything was about to change.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n        \u003carticle class=\"story-spread reverse reveal reveal\">\n          \u003cdiv class=\"story-img\" data-frame=\"EDITORIAL / 02\">\n            \u003cimg\n              alt=\"Couple sharing an intimate moment\"\n              loading=\"lazy\"\n              src=\"assets/media/effff5b877b953d00c6cf5a0-640.webp\"\n            / srcset=\"assets/media/a80e07889d8e6b25a40a7b57-320.webp 320w, assets/media/effff5b877b953d00c6cf5a0-640.webp 640w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n          \u003c/div>\n          \u003cdiv class=\"story-copy\">\n            \u003cdiv class=\"num\">\n              \u003cspan>02 / Everything between\u003c/span>\n              \u003cspan>2021\u20142025\u003c/span>\n            \u003c/div>\n            \u003ch3>All the\u003cbr />little things.\u003c/h3>\n            \u003cp>\n              The road trips. The ordinary Tuesdays. The milestones we celebrated and the difficult\n              days we walked through together.\n            \u003c/p>\n            \u003cp>\n              Somewhere in between all those small moments, we built a life that felt like home.\n            \u003c/p>\n          \u003c/div>\n        \u003c/article>\n        \u003csection aria-label=\"A moment in our story\" class=\"editorial-pause\">\n          \u003cdiv class=\"aside\">A note in the margins\u003cbr />02 / 03\u003cbr />Love, in every edition.\u003c/div>\n          \u003cp class=\"serif reveal\">\n            Not every moment was extraordinary. \u003cem>But every moment became ours.\u003c/em>\n          \u003c/p>\n        \u003c/section>\n        \u003carticle class=\"story-spread reveal reveal\">\n          \u003cdiv class=\"story-img\" data-frame=\"EDITORIAL / 03\">\n            \u003cimg alt=\"Elegant wedding scene\" loading=\"lazy\" src=\"assets/media/782201884a4496d4dba6bc8a-640.webp\" / srcset=\"assets/media/996e7d9f5ae8b301d1ab91c7-320.webp 320w, assets/media/782201884a4496d4dba6bc8a-640.webp 640w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n          \u003c/div>\n          \u003cdiv class=\"story-copy\">\n            \u003cdiv class=\"num\">\n              \u003cspan>03 / The next chapter\u003c/span>\n              \u003cspan>2026\u003c/span>\n            \u003c/div>\n            \u003ch3>Always\u003cbr />you.\u003c/h3>\n            \u003cp>\n              And then came the easiest yes. Now we get to begin the next chapter with the people\n              who have made our story richer, louder and more beautiful.\n            \u003c/p>\n            \u003cp>We would love for you to be there.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n      \u003c/section>\n      \u003csection class=\"quote\">\n        \u003cdiv class=\"eyebrow reveal\">A note from us\u003c/div>\n        \u003cp class=\"serif reveal\">\u201cIf we could do it all again, we'd still
