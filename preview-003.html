-row .when{font-size:36px}.schedule-row .what{font-size:28px}.schedule-row .note{font-size:11px}}\n@media(prefers-reduced-motion:reduce){.story-spread:not(.visible) .story-copy{opacity:1;transform:none}.story-spread .story-img img{transform:none}.schedule-row:before{transition:none}}\n<\/style><\/head><body><div aria-label=\"Open the wedding invitation\" aria-modal=\"true\" class=\"mv-intro\" id=\"mvIntro\" role=\"dialog\"><div class=\"mv-intro-photo\"><\/div><div class=\"mv-intro-border\"><\/div><div class=\"mv-intro-spine\"><\/div><div class=\"mv-issue-vertical\">A PRIVATE WEDDING EDITION \u2014 MMXXVI<\/div><div class=\"mv-intro-index\">VOL. 01 &nbsp; / &nbsp; FOREVER<\/div><div class=\"mv-intro-top\"><span>THE MODERN VOW<br/>PRIVATE EDITION<\/span><span class=\"mv-intro-edition\">ISSUE NO. 001<br/>AN INVITATION TO LOVE<\/span><\/div><div class=\"mv-intro-content\"><p class=\"mv-intro-kicker\">You are cordially invited<\/p><h2 class=\"mv-intro-names\"><span id=\"mvIntroFirst\">Alex<\/span><em>&amp;<\/em><span id=\"mvIntroSecond\">Mira<\/span><\/h2><div class=\"mv-intro-rule\"><\/div><div class=\"mv-intro-sub\">A love story, in print.<br/>14 November 2026<\/div><\/div><div class=\"mv-intro-controls\"><button class=\"mv-enter\" id=\"mvEnter\" type=\"button\">TURN THE FIRST PAGE <span class=\"mv-arrow\" aria-hidden=\"true\">\u2192<\/span><\/button><button class=\"mv-skip\" id=\"mvSkip\" type=\"button\">Skip intro<\/button><\/div><div class=\"mv-intro-panel left\"><\/div><div class=\"mv-intro-panel right\"><\/div><div class=\"mv-editorial-reveal\" aria-hidden=\"true\"><div class=\"mv-reveal-photo\"><\/div><div class=\"mv-reveal-paper\"><p>Chapter One<\/p><h3>Every love<br>has a story.<\/h3><p>This one is ours.<\/p><small>THE CELEBRATION BEGINS<\/small><\/div><\/div><\/div><div aria-hidden=\"true\" class=\"reading-line\" id=\"readingLine\"><\/div>\n<header class=\"nav\"><a class=\"brand\" href=\"#home\">THE MODERN VOW <span style=\"color:#8b8379\">/ 003<\/span><\/a><nav class=\"navlinks\"><a href=\"#story\">The Editorial<\/a><a href=\"#moments\">Moments<\/a><a href=\"#details\">The Occasion<\/a><a href=\"#schedule\">Schedule<\/a><a class=\"nav-rsvp\" href=\"#reply\">RSVP \u2197<\/a><\/nav><\/header>\n<main><section class=\"hero\" id=\"home\"><div class=\"hero-copy\"><div class=\"issue eyebrow\"><span>Wedding issue / 001<\/span><span>Est. forever<\/span><\/div><div><p class=\"eyebrow\">The wedding of<\/p><h1 id=\"heroNames\"><span>Alex<\/span><span>&amp; Mira<\/span><\/h1><\/div><div class=\"hero-bottom\"><p>Some stories are written in the stars. Ours is written in the moments between.<\/p><a class=\"arrow-link\" href=\"#story\">Discover our story <span>\u2197<\/span><\/a><\/div><\/div><div class=\"hero-photo\"><img alt=\"Romantic wedding couple photographed in editorial style\" id=\"heroImage\" src=\"https://images.unsplash.com/photo-1532712938310-34cb3982ef74?auto=format&amp;fit=crop&amp;w=1400&amp;q=85\"/><span class=\"vertical\" id=\"heroDate\">14 November 2026 \u2014 You're invited<\/span><\/div><\/section>\n<div class=\"ticker\"><span>A celebration of love<\/span><span>14 November 2026<\/span><span>Johannesburg \u00b7 South Africa<\/span><\/div>\n<section class=\"section editorial\" id=\"story\"><div class=\"intro reveal\"><div><div class=\"eyebrow\">01 / The Editorial<\/div><h2 class=\"section-title\">Our<br/><i>story.<\/i><\/h2><\/div><div><p class=\"lead\">Not a perfect story. Our favourite one.<\/p><p class=\"body\">Every great love story begins somewhere. Ours began with a moment that didn't seem extraordinary at the time\u2014and became everything.<\/p><\/div><\/div>\n<article class=\"story-spread reveal reveal\"><div class=\"story-img\" data-frame=\"EDITORIAL / 01\"><img alt=\"Friends sharing a joyful moment\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?auto=format&amp;fit=crop&amp;w=1200&amp;q=85\"/><\/div><div class=\"story-copy\"><div class=\"num\"><span>01 / The first hello<\/span><span>2019<\/span><\/div><h3>The day<br/>it began.<\/h3><p>It started with a conversation neither of us wanted to end. One unexpected hello became long walks, late-night calls and the kind of laughter that makes time disappear.<\/p><p>We didn't know it then, but everything was about to change.<\/p><\/div><\/article>\n<article class=\"story-spread reverse reveal reveal\"><div class=\"story-img\" data-frame=\"EDITORIAL / 02\"><img alt=\"Couple sharing an intimate moment\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&amp;fit=crop&amp;w=1200&amp;q=85\"/><\/div><div class=\"story-copy\"><div class=\"num\"><span>02 / Everything between<\/span><span>2021\u20142025<\/span><\/div><h3>All the<br/>little things.<\/h3><p>The road trips. The ordinary Tuesdays. The milestones we celebrated and the difficult days we walked through together.<\/p><p>Somewhere in between all those small moments, we built a life that felt like home.<\/p><\/div><\/article><section aria-label=\"A moment in our story\" class=\"editorial-pause\"><div class=\"aside\">A note in the margins<br/>02 / 03<br/>Love, in every edition.<\/div><p class=\"serif reveal\">Not every moment was extraordinary. <em>But every moment became ours.<\/em><\/p><\/section>\n<article class=\"story-spread reveal reveal\"><div class=\"story-img\" data-frame=\"EDITORIAL / 03\"><img alt=\"Elegant wedding scene\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&amp;fit=crop&amp;w=1200&amp;q=85\"/><\/div><div class=\"story-copy\"><div class=\"num\"><span>03 / The next chapter<\/span><span>2026<\/span><\/div><h3>Always<br/>you.<\/h3><p>And then came the easiest yes. Now we get to begin the next chapter with the people who have made our story richer, louder and more beautiful.<\/p><p>We would love for you to be there.<\/p><\/div><\/article><\/section>\n<section class=\"quote\"><div class=\"eyebrow reveal\">A note from us<\/div><p class=\"serif reveal\">\u201cIf we could do it all again, we'd still find each other.\u201d<\/p><div class=\"eyebrow reveal\">With love, Alex &amp; Mira<\/div><\/section>\n<section class=\"section contact\" id=\"moments\"><div class=\"contact-head reveal\"><div><div class=\"eyebrow\">02 / The Contact Sheet<\/div><h2 class=\"section-title\">The moments<br/><i>between.<\/i><\/h2><\/div><p class=\"muted\" style=\"max-width:250px;line-height:1.8\">Eight frames. One story. Tap a photograph to see it up close.<\/p><\/div><div class=\"contact-grid\" id=\"contactGrid\"><\/div><div class=\"contact-foot\"><span>Personal archive / 001\u2014008<\/span><span>Click to explore \u2197<\/span><\/div><\/section>\n<section class=\"occasion\" id=\"details\"><div class=\"topline\"><span class=\"eyebrow\">03 / The Occasion<\/span><span class=\"eyebrow\">You are invited<\/span><\/div><article class=\"occasion-panel\"><div class=\"occasion-image\"><img alt=\"Wedding ceremony setting\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&amp;fit=crop&amp;w=1500&amp;q=85\"/><\/div><div class=\"occasion-content\"><div><span class=\"eyebrow\">Act I / The vows<\/span><h3>The<br/>ceremony.<\/h3><\/div><div><div class=\"time\" id=\"ceremonyTime\">15:00<\/div><p class=\"place\" id=\"ceremonyPlace\">The Glasshouse<br/>Johannesburg, South Africa<\/p><p class=\"sub\">Please arrive 30 minutes early so we can begin together.<\/p><a class=\"arrow-link\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Johannesburg%20South%20Africa\" id=\"ceremonyMap\" rel=\"noopener\" target=\"_blank\">Get directions \u2197<\/a><\/div><\/div><\/article><article class=\"occasion-panel reception\"><div class=\"occasion-image\"><img alt=\"Atmospheric wedding reception tables\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&amp;fit=crop&amp;w=1500&amp;q=85\"/><\/div><div class=\"occasion-content\"><div><span class=\"eyebrow\">Act II / The celebration<\/span><h3>The<br/>reception.<\/h3><\/div><div><div class=\"time\" id=\"receptionTime\">18:00<\/div><p class=\"place\" id=\"receptionPlace\">The Grand Hall<br/>Johannesburg, South Africa<\/p><p class=\"sub\">Dinner, dancing and a night to remember. Dress code: Black tie optional.<\/p><a class=\"arrow-link\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Johannesburg%20South%20Africa\" id=\"receptionMap\" rel=\"noopener\" target=\"_blank\">Get directions \u2197<\/a><\/div><\/div><\/article><\/section>\n<section class=\"section running\" id=\"schedule\"><div class=\"eyebrow reveal\">04 / The Running Order<\/div><h2 class=\"section-title reveal\">A day to<br/><i>remember.<\/i><\/h2><div class=\"schedule\"><div class=\"schedule-row reveal\"><span class=\"when\">14:30<\/span><span class=\"what\">Guest arrival<\/span><span class=\"note\">Find your seat<\/span><\/div><div class=\"schedule-row reveal\"><span class=\"when\">15:00<\/span><span class=\"what\">The ceremony<\/span><span class=\"note\">We say \u201cI do\u201d<\/span><\/div><div class=\"schedule-row reveal\"><span class=\"when\">16:30<\/span><span class=\"what\">Cocktail hour<\/span><span class=\"note\">Raise a glass<\/span><\/div><div class=\"schedule-row reveal\"><span class=\"when\">18:00<\/span><span class=\"what\">Dinner &amp; speeches<\/span><span class=\"note\">The celebration begins<\/span><\/div><div class=\"schedule-row reveal\"><span class=\"when\">20:00<\/span><span class=\"what\">First dance<\/span><span class=\"note\">Then it's your turn<\/span><\/div><\/div><\/section>\n<section class=\"section rsvp\" id=\"reply\"><div class=\"rsvp-copy reveal\"><div class=\"eyebrow\">05 / The Reply<\/div><h2 class=\"section-title\">The<br/><i>reply.<\/i><\/h2><p>We saved a place for you. Kindly let us know whether you'll be joining us for the celebration.<\/p><p class=\"eyebrow\" style=\"margin-top:40px\">Please respond by 14 October 2026<\/p><\/div><form class=\"rsvp-form reveal\" id=\"rsvpForm\"><div class=\"top\"><span class=\"eyebrow\">Guest confirmation<\/span><span class=\"eyebrow\">No. 003<\/span><\/div><div class=\"field\"><label for=\"guestName\">Full name<\/label><input autocomplete=\"name\" id=\"guestName\" maxlength=\"100\" name=\"name\" placeholder=\"Your name\" required=\"\"/><\/div><fieldset class=\"field\" style=\"border:0;padding:0;margin:25px 0\"><legend>Will you be attending?<\/legend><div class=\"choices\"><label class=\"choice\"><input name=\"attendance\" required=\"\" type=\"radio\" value=\"yes\"/>Joyfully accepts<\/label><label class=\"choice\"><input name=\"attendance\" type=\"radio\" value=\"no\"/>Regretfully declines<\/label><\/div><\/fieldset><div hidden=\"\" id=\"attendingFields\"><div class=\"field\"><label for=\"guestCount\">Number of guests (including you)<\/label><select id=\"guestCount\" name=\"guests\"><option value=\"1\">1 guest<\/option><option value=\"2\">2 guests<\/option><option value=\"3\">3 guests<\/option><option value=\"4\">4 guests<\/option><\/select><\/div><div class=\"field\"><label for=\"dietary\">Dietary requirements<\/label><input id=\"dietary\" name=\"dietary\" placeholder=\"Optional\"/><\/div><\/div><div class=\"field\"><label for=\"message\">A note for the couple<\/label><textarea id=\"message\" name=\"message\" placeholder=\"Write a little something...\"><\/textarea><\/div><button class=\"submit\" type=\"submit\">Send your reply \u2197<\/button><p aria-live=\"polite\" class=\"form-status\" id=\"formStatus\"><\/p><\/form><div class=\"rsvp-confirmation\" hidden=\"\" id=\"rsvpConfirmation\" role=\"status\"><div class=\"eyebrow\">Guest register / preview<\/div><h3 class=\"serif\">Your reply,<br/><i>beautifully received.<\/i><\/h3><p id=\"confirmationText\">This is a preview. No response has been sent.<\/p><button id=\"editReply\" type=\"button\">Edit your response<\/button><\/div><\/section><\/main>\n<footer class=\"footer\"><span class=\"eyebrow\">The beginning of forever<\/span><h2 id=\"footerNames\">Alex <i>&amp;<\/i> Mira.<\/h2><div class=\"footer-bottom\"><span id=\"footerDate\">14 November 2026<\/span><span>Made with love \u00b7 The Modern Vow by VraxisRSVP<\/span><a href=\"#home\">Back to top \u2191<\/a><\/div><\/footer>\n<div aria-label=\"Photo viewer\" aria-modal=\"true\" class=\"lightbox\" id=\"lightbox\" role=\"dialog\"><div class=\"lightbox-top\"><span class=\"eyebrow\" id=\"lightboxCount\">01 / 08<\/span><button aria-label=\"Close photo viewer\" id=\"lightboxClose\">Close \u00d7<\/button><\/div><div class=\"lightbox-visual\"><img alt=\"Selected couple photograph\" id=\"lightboxImg\"/><\/div><div class=\"lightbox-bottom\"><p id=\"lightboxCaption\">A moment worth keeping.<\/p><div class=\"lightbox-nav\"><button aria-label=\"Previous photograph\" id=\"prevPhoto\">\u2190<\/button><button aria-label=\"Next photograph\" id=\"nextPhoto\">\u2192<\/button><\/div><\/div><\/div>\n<button class=\"editor-toggle\" id=\"editorToggle\">\u270e Personalise demo<\/button><aside class=\"editor\" id=\"editor\"><div class=\"editor-head\"><h2 class=\"serif\" style=\"font-size:37px;margin:0\">Personalise<\/h2><button aria-label=\"Close editor\" id=\"editorClose\">\u00d7<\/button><\/div><p>Prestige preview \u00b7 R399. Personalise the event details. Your changes are local to this tab. RSVPs are not sent to a server.<\/p><label>Partner 1<input id=\"editName1\" value=\"Alex\"/><\/label><label>Partner 2<input id=\"editName2\" value=\"Mira\"/><\/label><label>Wedding date<input id=\"editDate\" type=\"date\" value=\"2026-11-14\"/><\/label><label>Ceremony venue<input id=\"editCeremony\" value=\"The Glasshouse, Johannesburg, South Africa\"/><\/label><label>Reception venue<input id=\"editReception\" value=\"The Grand Hall, Johannesburg, South Africa\"/><\/label><label>Ceremony time<input id=\"editCeremonyTime\" type=\"time\" value=\"15:00\"/><\/label><label>Reception time<input id=\"editReceptionTime\" type=\"time\" value=\"18:00\"/><\/label><label>Hero photo URL<input id=\"editHeroPhoto\" placeholder=\"https://...\" type=\"url\"/><\/label><button class=\"apply\" id=\"applyEdits\">Apply changes<\/button><\/aside>\n<script>\n(()=>{'use strict';const $=s=>document.querySelector(s);const photos=[\n['https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=850&q=82','The way you make me laugh.'],\n['https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=850&q=82','Every road led to you.'],\n['https://images.unsplash.com/photo-1532712938310-34cb3982ef74?auto=format&fit=crop&w=850&q=82','Our favourite kind of day.'],\n['https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=850&q=82','The promise of forever.'],\n['https://images.unsplash.com/photo-1523438885200-e635ba2c371e?auto=format&fit=crop&w=850&q=82','The little moments.'],\n['https://images.unsplash.com/photo-1529636798458-92182e662485?auto=format&fit=crop&w=850&q=82','Somewhere we belong.'],\n['https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=850&q=82','A reason to celebrate.'],\n['https://images.unsplash.com/photo-1469371670807-013ccf25f16a?auto=format&fit=crop&w=850&q=82','This is just the beginning.']];let active=0;const grid=$('#contactGrid');photos.forEach(([url,caption],i)=>{const b=document.createElement('button');b.type='button';b.className='photo-tile reveal';b.setAttribute('aria-label',`View photo ${i+1}: ${caption}`);const im=document.createElement('img');im.src=url;im.loading='lazy';im.alt=caption;im.onerror=()=>{im.style.opacity='.15';b.style.background='#928a80'};const label=document.createElement('span');label.textContent=String(i+1).padStart(2,'0');b.append(im,label);b.addEventListener('click',()=>show(i));grid.append(b)});function show(i){active=(i+photos.length)%photos.length;$('#lightboxImg').src=photos[active][0];$('#lightboxImg').alt=photos[active][1];$('#lightboxCaption').textContent=photos[active][1];$('#lightboxCount').textContent=`${String(active+1).padStart(2,'0')} / 08`;$('#lightbox').classList.add('open');document.body.style.overflow='hidden';$('#lightboxClose').focus()}function close(){ $('#lightbox').classList.remove('open');document.body.style.overflow=''}$('#lightboxClose').addEventListener('click',close);$('#prevPhoto').addEventListener('click',()=>show(active-1));$('#nextPhoto').addEventListener('click',()=>show(active+1));$('#lightbox').addEventListener('click',e=>{if(e.target===$('#lightbox'))close()});document.addEventListener('keydown',e=>{if(!$('#lightbox').classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(active-1);if(e.key==='ArrowRight')show(active+1)});\nconst reveal=()=>{if(!('IntersectionObserver'in window)){document.querySelectorAll('.reveal').forEach(el=>el.classList.add('visible'));return}const obs=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(el=>obs.observe(el))};reveal();\ndocument.querySelectorAll('input[name=\"attendance\"]').forEach(r=>r.addEventListener('change',()=>{$('#attendingFields').hidden=document.querySelector('input[name=\"attendance\"]:checked')?.value!=='yes'}));$('#rsvpForm').addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.currentTarget);const name=String(data.get('name')||'Guest').trim();const attending=data.get('attendance');if(!attending){$('#formStatus').textContent='Please select whether you will attend.';return}$('#formStatus').textContent=`Thank you, ${name}! This is a preview: your ${attending==='yes'?'acceptance':'decline'} has not been sent. Live RSVPs will be connected when the VraxisRSVP platform is integrated.`;});\nfunction editorOpen(open){$('#editor').classList.toggle('open',open);$('#editorToggle').hidden=open}$('#editorToggle').addEventListener('click',()=>editorOpen(true));$('#editorClose').addEventListener('click',()=>editorOpen(false));$('#applyEdits').addEventListener('click',()=>{const a=$('#editName1').value.trim()||'Alex',b=$('#editName2').value.trim()||'Mira';$('#heroNames').replaceChildren();for(const t of [a,'& '+b]){const span=document.createElement('span');span.textContent=t;$('#heroNames').append(span)}$('#footerNames').textContent=`${a} & ${b}.`;const dt=$('#editDate').value;let display='14 November 2026';if(dt){const [y,m,d]=dt.split('-').map(Number);display=new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}$('#heroDate').textContent=display+' \u2014 You\\'re invited';$('#footerDate').textContent=display;$('#ceremonyPlace').textContent=$('#editCeremony').value;$('#receptionPlace').textContent=$('#editReception').value;$('#ceremonyTime').textContent=$('#editCeremonyTime').value;$('#receptionTime').textContent=$('#editReceptionTime').value;$('#ceremonyMap').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent($('#editCeremony').value);$('#receptionMap').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent($('#editReception').value);const photo=$('#editHeroPhoto').value.trim();if(/^https:\\/\\//i.test(photo))$('#heroImage').src=photo;editorOpen(false)});\n})();\n<\/script><script>\n(()=>{'use strict';\nconst progress=document.getElementById('readingLine');const nav=document.querySelector('.nav');let ticking=false;\nfunction update(){const max=Math.max(1,document.documentElement.scrollHeight-innerHeight);progress.style.width=Math.min(100,scrollY/max*100)+'%';nav.classList.toggle('scrolled',scrollY>35);ticking=false}\naddEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(update);ticking=true}},{passive:true});addEventListener('resize',update);update();\nconst rows=[...document.querySelectorAll('.schedule-row')];if('IntersectionObserver'in window){const ob=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){rows.forEach(x=>x.classList.remove('active'));e.target.classList.
