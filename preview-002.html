ress\">\n            \u003cspan> \u003c/span>\n            \u003cspan> \u003c/span>\n            \u003cspan> \u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"story-chapters\">\n          \u003carticle class=\"story-chapter reveal\">\n            \u003cdiv class=\"story-frame\">\n              \u003cimg\n                alt=\"A treasured memory from the couple's journey\"\n                loading=\"lazy\"\n                src=\"assets/media/9e82a0f3753a7c4f8ccff1b7-960.webp\"\n              / srcset=\"assets/media/d88e4ccab1d8610c6795f15d-320.webp 320w, assets/media/4fb6650c8b4e5990f564ffce-640.webp 639w, assets/media/9e82a0f3753a7c4f8ccff1b7-960.webp 960w, assets/media/9beb0152db52835b899ca53f-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n              \u003cspan class=\"frame-index\">01 / THE BEGINNING\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"story-words\">\n              \u003cspan class=\"eyebrow\">The first chapter\u003c/span>\n              \u003ch3>It began with \u003cem>hello.\u003c/em>\u003c/h3>\n              \u003cp>\n                One conversation became another. The hours slipped away, and somewhere between the\n                laughter and the little things, something beautiful began.\n              \u003c/p>\n              \u003cspan aria-hidden=\"true\" class=\"story-ornament\">\u2726\u003c/span>\n            \u003c/div>\n          \u003c/article>\n          \u003carticle class=\"story-chapter reverse reveal\">\n            \u003cdiv class=\"story-frame\">\n              \u003cimg\n                alt=\"An intimate portrait of the couple\"\n                loading=\"lazy\"\n                src=\"assets/media/7c1f8cf9189cafddd16d7ceb-960.webp\"\n              / srcset=\"assets/media/47bb236dc51d779f0d335a42-320.webp 320w, assets/media/c55430fb46b085d00c2b0d07-640.webp 640w, assets/media/7c1f8cf9189cafddd16d7ceb-960.webp 960w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n              \u003cspan class=\"frame-index\">02 / THE JOURNEY\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"story-words\">\n              \u003cspan class=\"eyebrow\">Through every season\u003c/span>\n              \u003ch3>A thousand little \u003cem>moments.\u003c/em>\u003c/h3>\n              \u003cp>\n                The spontaneous adventures. The quiet evenings. The dreams we made together. Love\n                was never just one grand gesture\u2014it was choosing each other, every day.\n              \u003c/p>\n              \u003cspan aria-hidden=\"true\" class=\"story-ornament\">\u2726\u003c/span>\n            \u003c/div>\n          \u003c/article>\n          \u003carticle class=\"story-chapter reveal\">\n            \u003cdiv class=\"story-frame story-final-frame\">\n              \u003cimg\n                alt=\"An elegant setting for the next chapter\"\n                loading=\"lazy\"\n                src=\"assets/media/9e82a0f3753a7c4f8ccff1b7-960.webp\"\n              / srcset=\"assets/media/d88e4ccab1d8610c6795f15d-320.webp 320w, assets/media/4fb6650c8b4e5990f564ffce-640.webp 639w, assets/media/9e82a0f3753a7c4f8ccff1b7-960.webp 960w, assets/media/9beb0152db52835b899ca53f-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n              \u003cspan class=\"frame-index\">03 / THE PROMISE\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"story-words\">\n              \u003cspan class=\"eyebrow\">And now, forever\u003c/span>\n              \u003ch3>The next chapter \u003cem>is ours.\u003c/em>\u003c/h3>\n              \u003cp>\n                Our favourite story is still being written. We cannot imagine beginning this next\n                chapter without the people who have loved us along the way.\n              \u003c/p>\n              \u003ca class=\"chapter-link\" href=\"#details\"\n                >Join us for the celebration \u003cspan>\u2197\u003c/
