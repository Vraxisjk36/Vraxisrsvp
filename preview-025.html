03cbr>aren\u2019t \u003cem>on the clock.\u003c/em>\u003c/p>\u003cp data-field=\"message\">After years of showing up, making a difference and giving so much, it\u2019s time for a chapter with a little more freedom.\u003c/p>\u003cdiv class=\"countdown\" data-countdown>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"boarding-pass reveal\">\u003cdiv>\u003cspan>DESTINATION\u003c/span>\u003ch2>Whatever\u003cbr>\u003cem>comes next.\u003c/em>\u003c/h2>\u003c/div>\u003cdiv>\u003cspan>TRAVELLING WITH\u003c/span>\u003cp>The people who made the journey worthwhile.\u003c/p>\u003cbutton class=\"text-button\" data-surprise aria-expanded=\"false\" type=\"button\">A note for the journey +\u003c/button>\u003cp class=\"surprise\" hidden>Less rushing. More living. And time for all the things we\u2019ve been meaning to do.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"event-details reveal\" id=\"details\">\u003cp class=\"eyebrow\">THE PARTICULARS\u003c/p>\u003ch2>A date worth\u003cbr>\u003cem>keeping.\u003c/em>\u003c/h2>\u003cdiv class=\"detail-grid\">\u003carticle>\u003cspan>WHEN\u003c/span>\u003cp data-field=\"date\">2027-11-20\u003c/p>\u003cp data-field=\"time\">18:30\u003c/p>\u003cbutton class=\"text-button\" data-calendar type=\"button\">Add to calendar \u2197\u003c/button>\u003c/article>\u003carticle>\u003cspan>WHERE\u003c/span>\u003cp data-field=\"venue\">The Glasshouse\u003c/p>\u003cp data-field=\"address\">Cape Town, South Africa\u003c/p>\u003ca data-map href=\"https://www.google.com/maps/search/?api=1&query=Cape+Town\" target=\"_blank\" rel=\"noopener\">Find your way \u2197\u003c/a>\u003c/article>\u003carticle>\u003cspan>THE DRESS CODE\u003c/span>\u003cp data-field=\"dress\">A little dressed up. Entirely yourself.\u003c/p>\u003cp class=\"fine\">Come ready to make a memory.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection class=\"program reveal\">\u003cp class=\"eyebrow\">THE SCENIC ROUTE\u003c/p>\u003ch2>A proper\u003cbr>\u003cem>send-off.\u003c/em>\u003c/h2>\u003cdiv data-program>\u003cdetails open>\u003csummary>First stop \u00b7 A familiar face\u003c/summary>\u003cp>Old friends, new stories and a drink to begin.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Along the way \u00b7 A toast to the years\u003c/summary>\u003cp>Remembering the work, the laughter and the difference one person can make.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Next destination \u00b7 A world of possibility\u003c/summary>\u003cp>Good food, a few photographs and all our wishes for the adventures ahead.\u003c/p>\u003c/details>\u003c/div>\u003c/section>\u003csection class=\"memories reveal\" aria-label=\"Celebration photographs\">\u003cp class=\"eyebrow\">A LITTLE OF OUR WORLD\u003c/p>\u003cdiv class=\"memory-grid\">\u003cbutton type=\"button\" data-lightbox=\"0\" aria-label=\"Enlarge celebration artwork\">\u003cimg data-photo=\"hero\" src=\"assets/covers/025.svg\" alt=\"Original celebration artwork\" loading=\"lazy\">\u003c/button>\u003cdiv>\u003ch2>Make room\u003cbr>for \u003cem>the moment.\u003c/em>\u003c/h2>\u003cp data-field=\"story\">Some days deserve more than a date in the diary. They deserve your favourite people, a little anticipation, and a story you will keep telling.\u003c/p>\u003cp data-field=\"giftNote\">Your company is the loveliest thing you could bring.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"reply reveal\" id=\"rsvp\">\u003cp class=\"eyebrow\">YOUR PLACE IS WAITING\u003c/p>\u003ch2 data-field=\"rsvpHeading\">Will you join us?\u003c/h2>\u003cp>It would mean the world to have you there.\u003c/p>\u003cform id=\"rsvpForm\">\u003clabel>Your name\u003cinput name=\"guest_name\" autocomplete=\"name\" required maxlength=\"100\" placeholder=\"Your full name\">\u003c/label>\u003clabel>Your response\u003cselect name=\"response\">\u003coption value=\"yes\">I wouldn\u2019t miss it\u003c/option>\u003coption value=\"no\">With you in spirit\u003c/option>\u003c/select>\u003c/label>\u003cbu
