ref="index.html">vraxisRSVP</a><a class="cta" href="personalise.html?template=019">Use This Template ↗</a></header><div class="preview-info"><a href="catalogue.html">← Collection</a><b>Leo’s Birthday Fair</b><span>Birthday · Signature</span><span class="price">$15.99</span></div><iframe id="invitation" title="Leo’s Birthday Fair interactive invitation" allow="fullscreen"></iframe><script>const TEMPLATE="\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#183d38\">\u003ctitle>Leo\u2019s 30th Birthday \u00b7 VraxisRSVP\u003c/title>\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\u003clink href=\"https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,600,30,1;9..144,800,30,1&family=Rye&display=swap\" rel=\"stylesheet\">\u003clink rel=\"stylesheet\" href=\"assets/template-code/f3a1f5218a2608e12cafd571.css\">\u003cscript src=\"assets/static-media.js?v=1\">\u003c/script>\u003c/head>\u003cbody>\u003cdiv class=\"noise\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"intro\" id=\"intro\">\u003cdiv class=\"bulbs\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"intro-stage\">\u003cp class=\"intro-overline\">A VERY SPECIAL INVITATION \u00b7 JULY 2027\u003c/p>\u003cp class=\"intro-script\">Tonight, the spotlight belongs to\u003c/p>\u003ch2 class=\"intro-name display\">LEO\u003cspan>!\u003c/span>\u003c/h2>\u003cp class=\"intro-thirty\">THIRTY YEARS OF STORIES. ONE UNFORGETTABLE NIGHT.\u003c/p>\u003cdiv class=\"intro-ticket\" id=\"introTicket\">\u003cdiv class=\"intro-ticket-left\">\u003cspan>THE GOLDEN ADMISSION\u003c/span>\u003cstrong>LEO'S\u003cbr>30TH\u003c/strong>\u003csmall>17 JULY 2027 \u00b7 ADMIT ONE\u003c/small>\u003c/div>\u003cdiv class=\"intro-ticket-right\">\u003cspan>ADMIT\u003cbr>ONE\u003c/span>\u003cspan class=\"ticket-hole\" aria-hidden=\"true\">\u003c/span>\u003c/div>\u003c/div>\u003cbutton class=\"intro-enter\" id=\"enter\">PUNCH MY TICKET \u003cspan aria-hidden=\"true\">\u2726\u003c/span>\u003c/button>\u003cp class=\"intro-hint\">Your invitation is waiting on the other side.\u003c/p>\u003c/div>\u003cdiv class=\"intro-curtain curtain-left\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"intro-curtain curtain-right\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"intro-flash\" aria-hidden=\"true\">\u003c/div>\u003c/div>\u003cmain class=\"site\" id=\"site\">\u003cheader class=\"topbar\">\u003cspan class=\"brand\">Leo\u2019s 30th\u003c/span>\u003cspan class=\"tag\">Est. 1997 \u00b7 Celebrating 30 years\u003c/span>\u003ca href=\"#rsvp\">Claim your place\u003c/a>\u003c/header>\u003csection class=\"hero\">\u003cdiv class=\"awning\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"hero-inner\">\u003cdiv class=\"stars\" aria-hidden=\"true\">\u2726 \u2727 \u2726\u003c/div>\u003cp class=\"eyebrow\">Ladies, gentlemen & everyone in between\u003c/p>\u003ch1 class=\"display\">LEO\u2019S\u003cbr>\u003cem>big night at the\u003c/em>FAIR\u003c/h1>\u003cp class=\"sub\">Come celebrate thirty extraordinary years of Leo\u003c/p>\u003cspan class=\"ribbon\">Saturday \u00b7 17 July \u00b7 2027\u003c/span>\u003cdiv class=\"round\">\u003cspan>THIRTY\u003cbr>\u003cb>30\u003c/b>\u003cbr>YEARS YOUNG\u003c/span>\u003c/div>\u003cp class=\"scroll-cue\">\u2193 &nbsp; The gates are open &nbsp; \u2193\u003c/p>\u003c/div>\u003c/section>\u003cdiv class=\"divider-wave\">\u003c/div>\u003csection class=\"section intro-story center\">\u003cdiv class=\"container reveal\">\u003cdiv class=\"ornament\">\u2737\u003c/div>\u003cp class=\"eyebrow\">Leo turns thirty\u003c/p>\u003ch2 class=\"serif section-heading\">Leo has never done\u003cbr>\u003cem>ordinary.\u003c/em>\u003c/h2>\u003cp class=\"lead\">Leo has spent thirty years making ordinary days unforgettable. Now it's his turn to gather everyone who's made the journey special\u2014for an evening of bright lights, old-school games, great food and even better company.\u003c/p>\u003cp class=\"lead\" style=\"margin-top:22px\">Come make another memory with Leo. Leave the grown-up worries at the gate.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"section fairground\" id=\"attractions\">\u003cdiv class=\"container\">\u003cdiv class=\"center reveal\">\u003cp class=\"eyebrow\">Explore the grounds\u003c/p>\u003ch2 class=\"serif section-heading\">Step inside\u003cbr>Leo\u2019s world.\u003c/h2>\u003cp class=\"lead\">Every attraction holds a little piece of Leo\u2019s birthday plans. Start with the big wheel.\u003c/p>\u003c/div>\u003cdiv class=\"booths\">\u003cbutton class=\"booth reveal\" data-booth=\"where\">\u003cdiv class=\"booth-roof\">\u003c/div>\u003cdiv class=\"booth-symbol\" aria-hidden=\"true\">\ud83c\udfa1\u003c/div>\u003ch3>The Big Wheel\u003c/h3>\u003cp>Give Leo\u2019s birthday wheel a proper spin to uncover the venue.\u003c/p>\u003csmall>Spin the wheel \u2197\u003c/small>\u003c/button>\u003cbutton class=\"booth reveal\" data-booth=\"when\">\u003cdiv class=\"booth-roof\">\u003c/div>\u003cdiv class=\"booth-symbol\" aria-hidden=\"true\">\ud83c\udf9f\ufe0f\u003c/div>\u003ch3>Lucky Numbers\u003c/h3>\u003cp>All the important numbers for the night.\u003c/p>\u003csmall>Reveal the details \u2197\u003c/small>\u003c/button>\u003cbutton class=\"booth reveal\" data-booth=\"wear\">\u003cdiv class=\"booth-roof\">\u003c/div>\u003cdiv class=\"booth-symbol\" aria-hidden=\"true\">\ud83c\udfa0\u003c/div>\u003ch3>The Dress-Up Tent\u003c/h3>\u003cp>What to wear when the lights come on.\u003c/p>\u003csmall>See the dress code \u2197\u003c/small>\u003c/button>\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"story-strip\">\u2726 &nbsp; GOOD TIMES GUARANTEED &nbsp; \u2726 &nbsp; NO REFUNDS ON FUN &nbsp; \u2726\u003c/div>\u003csection class=\"section photos\">\u003cdiv class=\"container center\">\u003cdiv class=\"reveal\">\u003cp class=\"eyebrow\">The moments that matter\u003c/p>\u003ch2 class=\"serif section-heading\">Collect memories,\u003cbr>not souvenirs.\u003c/h2>\u003cp class=\"lead\">Leo\u2019s favourite memories have always been made with the people who show up. This time, you\u2019re part of the story.\u003c/p>\u003c/div>\u003cdiv class=\"photo-grid\">\u003cfigure class=\"photo reveal\">\u003cimg src=\"assets/media/f36f7e109484120794bc15b2-960.webp\" alt=\"Birthday party decorations\" loading=\"lazy\" srcset=\"assets/media/b3858d78691d77881ae478b7-320.webp 320w, assets/media/9320196cb60456aae577b40f-640.webp 640w, assets/media/f36f7e109484120794bc15b2-960.webp 960w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\u003cfigcaption>Make a wish, make a memory.\u003c/figcaption>\u003c/figure>\u003cfigure class=\"photo reveal\">\u003cimg src=\"assets/media/2ca57966a2d95ad7a9c4ce78-640.webp\" alt=\"Celebration table with festive decorations\" loading=\"lazy\" srcset=\"assets/media/2c415a174aaa509c20f4884b-320.webp 320w, assets/media/2ca57966a2d95ad7a9c4ce78-640.webp 639w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\u003cfigcaption>Come for the party. Stay for the people.\u003c/figcaption>\u003c/figure>\u003c/div>\u003cp class=\"photo-note\">Demo photographs are placeholders; replace with the host's images before publishing.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"section schedule\">\u003cdiv class=\"container\">\u003cdiv class=\"center reveal\">\u003cp class=\"eyebrow\">Your evening programme\u003c/p>\u003ch2 class=\"serif section-heading\">Tonight's attractions\u003c/h2>\u003cp class=\"lead\">Here\u2019s what Leo has planned for his big night.\u003c/p>\u003c/div>\u003cdiv class=\"schedule-list\">\u003cdiv class=\"schedule-item reveal\">\u003ctime>17:30\u003c/time>\u003cdiv>\u003ch3>Gates open\u003c/h3>\u003cp>Arrive, grab a drink, find your people.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"schedule-item reveal\">\u003ctime>18:30\u003c/time>\u003cdiv>\u003ch3>Games & good company\u003c/h3>\u003cp>Friendly competition, questionable prizes.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"schedule-item reveal\">\u003ctime>19:30\u003c/time>\u003cdiv>\u003ch3>Feast time\u003c/h3>\u003cp>Food worth clearing your schedule for.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"schedule-item reveal\">\u003ctime>21:00\u003c/time>\u003cdiv>\u003ch3>The big birthday moment\u003c/h3>\u003cp>Cake, candles, music and a little magic.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section rsvp\" id=\"rsvp\">\u003cdiv class=\"container center\">\u003cdiv class=\"reveal\">\u003cp class=\"eyebrow\">Final stop \u00b7 The ticket office\u003c/p>\u003ch2 class=\"serif section-heading\">Will you celebrate\u003cbr>with Leo?\u003c/h2>\u003cp class=\"lead\">Leo saved a place for you. Tell him if you\u2019ll be there to celebrate.\u003c/p>\u003c/div>\u003cdiv class=\"rsvp-card reveal\">\u003cform id=\"rsvpForm\">\u003cdiv class=\"form-grid\">\u003cdiv class=\"field\">\u003clabel for=\"guest\">Your name\u003c/label>\u003cinput id=\"guest\" required placeholder=\"Full name\" maxlength=\"100\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"attendance\">Will you attend?\u003c/label>\u003cselect id=\"attendance\" required>\u003coption value=\"\">Choose an option\u003c/option>\u003coption value=\"yes\">I'll be there!\u003c/option>\u003coption value=\"no\">Sorry, can't make it\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cdiv class=\"form-grid\">\u003cdiv class=\"field\">\u003clabel for=\"partySize\">Number of guests\u003c/label>\u003cselect id=\"partySize\">\u003coption value=\"1\">Just me\u003c/option>\u003coption value=\"2\">Two of us\u003c/option>\u003coption value=\"3\">Three of us\u003c/option>\u003coption value=\"4\">Four of us\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"song\">Your dance-floor request\u003c/label>\u003cinput id=\"song\" placeholder=\"Optional song request\" maxlength=\"100\">\u003c/div>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"message\">A message for Leo\u003c/label>\u003ctextarea id=\"message\" placeholder=\"A little birthday note (optional)\" maxlength=\"500\">\u003c/textarea>\u003c/div>\u003cbutton class=\"submit\" type=\"submit\">Send my RSVP ticket \u2192\u003c/button>\u003cp style=\"font-size:.7rem;color:#756e5c;margin-top:17px\">Prototype only: submissions are not sent or stored.\u003c/p>\u003c/form>\u003cdiv class=\"response\" id=\"response\" role=\"status\" aria-live=\"polite\">\u003cdiv style=\"font-size:3rem\">\ud83c\udf9f\ufe0f\u003c/div>\u003ch3>Ticket stamped!\u003c/h3>\u003cp id=\"responseText\">\u003c/p>\u003cbutton class=\"admit\" id=\"again\">Back to the fair\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003cfooter class=\"footer\">\u003cdiv class=\"display\">Leo can\u2019t wait to see you.\u003c/div>\u003cp>LEO'S 30TH \u00b7 17 JULY 2027\u003c/p>\u003cp style=\"opacity:.6;margin-top:40px\">A VraxisRSVP invitation \u00b7 Template 019\u003c/p>\u003c/footer>\u003c/main>\u003cdiv class=\"wheel-overlay\" id=\"wheelOverlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"wheelTitle\" aria-hidden=\"true\">\u003cdiv class=\"wheel-scene\">\u003cbutton class=\"wheel-close\" id=\"wheelClose\" aria-label=\"Close wheel\">\u00d7\u003c/button>\u003cp class=\"eyebrow\">LEO\u2019S BIG WHEEL\u003c/p>\u003ch2 class=\"serif\" id=\"wheelTitle\">One spin. One surprise.\u003c/h2>\u003cp class=\"wheel-instruction\" id=\"wheelInstruction\">Give the wheel a spin to find out where we\u2019re celebrating.\u003c/p>\u003cdiv class=\"wheel-frame\">\u003cdiv class=\"wheel-pointer\" aria-hidden=\"true\">\u25bc\u003c/div>\u003cdiv class=\"wheel-disc\" id=\"wheelDisc\">\u003cspan class=\"wheel-center\">LEO\u003cbr>\u003cb>30\u003c/b>\u003c/span>\u003cspan class=\"wheel-mark mark-one\">\u2726\u003c/span>\u003cspan class=\"wheel-mark mark-two\">\u2605\u003c/span>\u003cspan class=\"wheel-mark mark-three\">\u2726\u003c/span>\u003cspan class=\"wheel-mark mark-four\">\u2605\u003c/span>\u003c/div>\u003c/div>\u003cbutton class=\"wheel-spin\" id=\"wheelSpin\">SPIN THE BIG WHEEL\u003c/button>\u003cdiv class=\"wheel-prize\" id=\"wheelPrize\" aria-live=\"polite\">\u003cp class=\"eyebrow\">THE WHEEL HAS SPOKEN\u003c/p>\u003ch3>Meet Leo at the Fairground Pavilion!\u003c/h3>\u003cp>24 Oak Avenue, Johannesburg, South Africa \u00b7 Saturday, 17 July 2027 \u00b7 Gates open 17:30\u003c/p>\u003csmall>Fictional demonstration venue\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"modal\" id=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modalTitle\">\u003cdiv class=\"modal-card\">\u003cbutton class=\"modal-close\" id=\"closeModal\" aria-label=\"Close\">\u00d7\u003c/button>\u003cdiv style=\"font-size:2.5rem\" id=\"modalIcon\">\u2726\u003c/div>\u003cp class=\"eyebrow\" id=\"modalKicker\">\u003c/p>\u003ch3 class=\"serif\" id=\"modalTitle\">\u003c/h3>\u003cp id=\"modalText\">\u003c/p>\u003cbutton class=\"admit\" id=\"modalDone\">Back to the fair \u2192\u003c/button>\u003c/div>\u003c/div>\u003cscript src=\"assets/template-code/2918611212a35f23dce1f501.js\">\u003c/script>\u003c/body>\u003c/html>";const frame=document.getElementById("invitation");frame.srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/template-image-overrides.js?v=zero-waste1" defer></script><script src="assets/templates.js?v=zero-waste1"></script><script src="assets/design-finishing.js?v=20261115b"></script><script src="assets/template-polish.js?v=zero-waste1"></script></body></html>
