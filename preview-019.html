cript\">Tonight, the spotlight belongs to\u003c/p>\u003ch2 class=\"intro-name display\">LEO\u003cspan>!\u003c/span>\u003c/h2>\u003cp class=\"intro-thirty\">THIRTY YEARS OF STORIES. ONE UNFORGETTABLE NIGHT.\u003c/p>\u003cdiv class=\"intro-ticket\" id=\"introTicket\">\u003cdiv class=\"intro-ticket-left\">\u003cspan>THE GOLDEN ADMISSION\u003c/span>\u003cstrong>LEO'S\u003cbr>30TH\u003c/strong>\u003csmall>17 JULY 2027 · ADMIT ONE\u003c/small>\u003c/div>\u003cdiv class=\"intro-ticket-right\">\u003cspan>ADMIT\u003cbr>ONE\u003c/span>\u003cspan class=\"ticket-hole\" aria-hidden=\"true\">\u003c/span>\u003c/div>\u003c/div>\u003cbutton class=\"intro-enter\" id=\"enter\">PUNCH MY TICKET \u003cspan aria-hidden=\"true\">✦\u003c/span>\u003c/button>\u003cp class=\"intro-hint\">Your invitation is waiting on the other side.\u003c/p>\u003c/div>\u003cdiv class=\"intro-curtain curtain-left\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"intro-curtain curtain-right\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"intro-flash\" aria-hidden=\"true\">\u003c/div>\u003c/div>\u003cmain class=\"site\" id=\"site\">\u003cheader class=\"topbar\">\u003cspan class=\"brand\">Leo’s 30th\u003c/span>\u003cspan class=\"tag\">Est. 1997 · Celebrating 30 years\u003c/span>\u003ca href=\"#rsvp\">Claim your place\u003c/a>\u003c/header>\u003csection class=\"hero\">\u003cdiv class=\"awning\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"hero-inner\">\u003cdiv class=\"stars\" aria-hidden=\"true\">✦ ✧ ✦\u003c/div>\u003cp class=\"eyebrow\">Ladies, gentlemen & everyone in between\u003c/p>\u003ch1 class=\"display\">LEO’S\u003cbr>\u003cem>big night at the\u003c/em>FAIR\u003c/h1>\u003cp class=\"sub\">Come celebrate thirty extraordinary years of Leo\u003c/p>\u003cspan class=\"ribbon\">Saturday · 17 July · 2027\u003c/span>\u003cdiv class=\"round\">\u003cspan>THIRTY\u003cbr>\u003cb>30\u003c/b>\u003cbr>YEARS YOUNG\u003c/span>\u003c/div>\u003cp class=\"scroll-cue\">↓ &nbsp; The gates are open &nbsp; ↓\u003c/p>\u003c/div>\u003c/section>\u003cdiv class=\"divider-wave\">\u003c/div>\u003csection class=\"section intro-story center\">\u003cdiv class=\"container reveal\">\u003cdiv class=\"ornament\">✷\u003c/div>\u003cp class=\"eyebrow\">Leo turns thirty\u003c/p>\u003ch2 class=\"serif section-heading\">Leo has never done\u003cbr>\u003cem>ordinary.\u003c/em>\u003c/h2>\u003cp class=\"lead\">Leo has spent thirty years making ordinary days unforgettable. Now it's his turn to gather everyone who's made the journey special—for an evening of bright lights, old-school games, great food and even better company.\u003c/p>\u003cp class=\"lead\" style=\"margin-top:22px\">Come make another memory with Leo. Leave the grown-up worries at the gate.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"section fairground\" id=\"attractions\">\u003cdiv class=\"container\">\u003cdiv class=\"center reveal\">\u003cp class=\"eyebrow\">Explore the grounds\u003c/p>\u003ch2 class=\"serif section-heading\">Step inside\u003cbr>Leo’s world.\u003c/h2>\u003cp class=\"lead\">Every attraction holds a little piece of Leo’s birthday plans. Start with the big wheel.\u003c/p>\u003c/div>\u003cdiv class=\"booths\">\u003cbutton class=\"booth reveal\" data-booth=\"where\">\u003cdiv class=\"booth-roof\">\u003c/div>\u003cdiv class=\"booth-symbol\" aria-hidden=\"true\">🎡\u003c/div>\u003ch3>The Big Wheel\u003c/h3>\u003cp>Give Leo’s birthday wheel a proper spin to uncover the venue.\u003c/p>\u003csmall>Spin the wheel ↗\u003c/small>\u003c/button>\u003cbutton class=\"booth reveal\" data-booth=\"when\">\u003cdiv class=\"booth-roof\">\u003c/div>\u003cdiv class=\"booth-symbol\" aria-hidden=\"true\">🎟️\u003c/div>\u003ch3>Lucky Numbers\u003c/h3>\u003cp>All the important numbers for the night.\u003c/p>\u003csmall>Reveal the details ↗\u003c/small>\u003c/button>\u003cbutton class=\"booth reveal\" data-booth=\"wear\">\u003cdiv class=\"booth-roof\">\u003c/div>\u003cdiv class=\"booth-symbol\" aria-hidden=\"true\">🎠\u003c/div>\u003ch3>The Dress-Up Tent\u003c/h3>\u003cp>What to wear when the lights come on.\u003c/p>\u003csmall>See the dress code ↗\u003c/small>\u003c/button>\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"story-strip\">✦ &nbsp; GOOD TIMES GUARANTEED &nbsp; ✦ &nbsp; NO REFUNDS ON FUN &nbsp; ✦\u003c/div>\u003csection class=\"section photos\">\u003cdiv class=\"container center\">\u003cdiv class=\"reveal\">\u003cp class=\"eyebrow\">The moments that matter\u003c/p>\u003ch2 class=\"serif section-heading\">Collect memories,\u003cbr>not souvenirs.\u003c/h2>\u003cp class=\"lead\">Leo’s favourite memories have always been made with the people who show up. This time, you’re part of the story.\u003c/p>\u003c/div>\u003cdiv class=\"photo-grid\">\u003cfigure class=\"photo reveal\">\u003cimg src=\"https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=1100&q=85&auto=format&fit=crop\" alt=\"Birthday party decorations\" loading=\"lazy\">\u003cfigcaption>Make a wish, make a memory.\u003c/figcaption>\u003c/figure>\u003cfigure class=\"photo reveal\">\u003cimg src=\"https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?w=900&q=85&auto=format&fit=crop\" alt=\"Celebration table with festive decorations\" loading=\"lazy\">\u003cfigcaption>Come for the party. Stay for the people.\u003c/figcaption>\u003c/figure>\u003c/div>\u003cp class=\"photo-note\">Demo photographs are placeholders; replace with the host's images before publishing.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"section schedule\">\u003cdiv class=\"container\">\u003cdiv class=\"center reveal\">\u003cp class=\"eyebrow\">Your evening programme\u003c/p>\u003ch2 class=\"serif section-heading\">Tonight's attractions\u003c/h2>\u003cp class=\"lead\">Here’s what Leo has planned for his big night.\u003c/p>\u003c/div>\u003cdiv class=\"schedule-list\">\u003cdiv class=\"schedule-item reveal\">\u003ctime>17:30\u003c/time>\u003cdiv>\u003ch3>Gates open\u003c/h3>\u003cp>Arrive, grab a drink, find your people.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"schedule-item reveal\">\u003ctime>18:30\u003c/time>\u003cdiv>\u003ch3>Games & good company\u003c/h3>\u003cp>Friendly competition, questionable prizes.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"schedule-item reveal\">\u003ctime>19:30\u003c/time>\u003cdiv>\u003ch3>Feast time\u003c/h3>\u003cp>Food worth clearing your schedule for.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"schedule-item reveal\">\u003ctime>21:00\u003c/time>\u003cdiv>\u003ch3>The big birthday moment\u003c/h3>\u003cp>Cake, candles, music and a little magic.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section rsvp\" id=\"rsvp\">\u003cdiv class=\"container center\">\u003cdiv class=\"reveal\">\u003cp class=\"eyebrow\">Final stop · The ticket office\u003c/p>\u003ch2 class=\"serif section-heading\">Will you celebrate\u003cbr>with Leo?\u003c/h2>\u003cp class=\"lead\">Leo saved a place for you. Tell him if you’ll be there to celebrate.\u003c/p>\u003c/div>\u003cdiv class=\"rsvp-card reveal\">\u003cform id=\"rsvpForm\">\u003cdiv class=\"form-grid\">\u003cdiv class=\"field\">\u003clabel for=\"guest\">Your name\u003c/label>\u003cinput id=\"guest\" required placeholder=\"Full name\" maxlength=\"100\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"attendance\">Will you attend?\u003c/label>\u003cselect id=\"attendance\" required>\u003coption value=\"\">Choose an option\u003c/option>\u003coption value=\"yes\">I'll be there!\u003c/option>\u003coption value=\"no\">Sorry, can't make it\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cdiv class=\"form-grid\">\u003cdiv class=\"field\">\u003clabel for=\"partySize\">Number of guests\u003c/label>\u003cselect id=\"partySize\">\u003coption value=\"1\">Just me\u003c/option>\u003coption value=\"2\">Two of us\u003c/option>\u003coption value=\"3\">Three of us\u003c/option>\u003coption value=\"4\">Four of us\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"song\">Your dance-floor request\u003c/label>\u003cinput id=\"song\" placeholder=\"Optional song request\" maxlength=\"100\">\u003c/div>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"message\">A message for Leo\u003c/label>\u003ctextarea id=\"message\" placeholder=\"A little birthday note (optional)\" maxlength=\"500\">\u003c/textarea>\u003c/div>\u003cbutton class=\"submit\" type=\"submit\">Send my RSVP ticket →\u003c/button>\u003cp style=\"font-size:.7rem;color:#756e5c;margin-top:17px\">Prototype only: submissions are not sent or stored.\u003c/p>\u003c/form>\u003cdiv class=\"response\" id=\"response\" role=\"status\" aria-live=\"polite\">\u003cdiv style=\"font-size:3rem\">🎟️\u003c/div>\u003ch3>Ticket stamped!\u003c/h3>\u003cp id=\"responseText\">\u003c/p>\u003cbutton class=\"admit\" id=\"again\">Back to the fair\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003cfooter class=\"footer\">\u003cdiv class=\"display\">Leo can’t wait to see you.\u003c/div>\u003cp>LEO'S 30TH · 17 JULY 2027\u003c/p>\u003cp style=\"opacity:.6;margin-top:40px\">A VraxisRSVP invitation · Template 019\u003c/p>\u003c/footer>\u003c/main>\u003cdiv class=\"wheel-overlay\" id=\"wheelOverlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"wheelTitle\" aria-hidden=\"true\">\u003cdiv class=\"wheel-scene\">\u003cbutton class=\"wheel-close\" id=\"wheelClose\" aria-label=\"Close wheel\">×\u003c/button>\u003cp class=\"eyebrow\">LEO’S BIG WHEEL\u003c/p>\u003ch2 class=\"serif\" id=\"wheelTitle\">One spin. One surprise.\u003c/h2>\u003cp class=\"wheel-instruction\" id=\"wheelInstruction\">Give the wheel a spin to find out where we’re celebrating.\u003c/p>\u003cdiv class=\"wheel-frame\">\u003cdiv class=\"wheel-pointer\" aria-hidden=\"true\">▼\u003c/div>\u003cdiv class=\"wheel-disc\" id=\"wheelDisc\">\u003cspan class=\"wheel-center\">LEO\u003cbr>\u003cb>30\u003c/b>\u003c/span>\u003cspan class=\"wheel-mark mark-one\">✦\u003c/span>\u003cspan class=\"wheel-mark mark-two\">★\u003c/span>\u003cspan class=\"wheel-mark mark-three\">✦\u003c/span>\u003cspan class=\"wheel-mark mark-four\">★\u003c/span>\u003c/div>\u003c/div>\u003cbutton class=\"wheel-spin\" id=\"wheelSpin\">SPIN THE BIG WHEEL\u003c/button>\u003cdiv class=\"wheel-prize\" id=\"wheelPrize\" aria-live=\"polite\">\u003cp class=\"eyebrow\">THE WHEEL HAS SPOKEN\u003c/p>\u003ch3>Meet Leo at the Fairground Pavilion!\u003c/h3>\u003cp>24 Oak Avenue, Johannesburg, South Africa · Saturday, 17 July 2027 · Gates open 17:30\u003c/p>\u003csmall>Fictional demonstration venue\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"modal\" id=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modalTitle\">\u003cdiv class=\"modal-card\">\u003cbutton class=\"modal-close\" id=\"closeModal\" aria-label=\"Close\">×\u003c/button>\u003cdiv style=\"font-size:2.5rem\" id=\"modalIcon\">✦\u003c/div>\u003cp class=\"eyebrow\" id=\"modalKicker\">\u003c/p>\u003ch3 class=\"serif\" id=\"modalTitle\">\u003c/h3>\u003cp id=\"modalText\">\u003c/p>\u003cbutton class=\"admit\" id=\"modalDone\">Back to the fair →\u003c/button>\u003c/div>\u003c/div>\u003cscript>\nconst intro=document.getElementById('intro'),site=document.getElementById('site');let entered=false;function enter(){if(entered)return;entered=true;intro.classList.add('punched');document.getElementById('enter').disabled=true;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;setTimeout(()=>{intro.classList.add('gates-open');site.classList.add('ready');document.body.style.overflow=''},reduced?0:680);setTimeout(()=>{intro.classList.add('exit');document.querySelector('.topbar a').focus({preventScroll:true})},reduced?30:2100)}document.body.style.overflow='hidden';document.getElementById('enter').addEventListener('click',enter);const info={where:{icon:'🎡',kicker:'The Big Wheel',title:'Meet us at the fair',text:'The Fairground Pavilion · 24 Oak Avenue, Johannesburg, South Africa. Doors open at 17:30. This is fictional demo venue information.'},when:{icon:'🎟️',kicker:'Lucky Numbers',title:'17 · 07 · 27',text:'Saturday, 17 July 2027. Gates open at 17:30; festivities run into the night. RSVP by 3 July 2027.'},wear:{icon:'🎠',kicker:'The Dress-Up Tent',title:'Retro & ready',text:'Think vintage denim, bold stripes, playful prints, colourful accessories and comfortable dancing shoes. No costume required—just a little personality.'}};const modal=document.getElementById('modal');let lastTrigger=null;function closeModal(){modal.classList.remove('open');lastTrigger?.focus()}const wheelOverlay=document.getElementById('wheelOverlay'),wheelDisc=document.getElementById('wheelDisc'),wheelSpin=document.getElementById('wheelSpin'),wheelPrize=document.getElementById('wheelPrize');let wheelRotation=0,wheelTimer=null,wheelBusy=false;function openWheel(trigger){lastTrigger=trigger;wheelOverlay.classList.add('open');wheelOverlay.setAttribute('aria-hidden','false');wheelOverlay.querySelector('.wheel-close').focus()}function closeWheel(){if(wheelBusy)return;wheelOverlay.classList.remove('open');wheelOverlay.setAttribute('aria-hidden','true');lastTrigger?.focus()}document.getElementById('wheelClose').addEventListener('click',closeWheel);wheelOverlay.addEventListener('click',e=>{if(e.target===wheelOverlay)closeWheel()});wheelSpin.addEventListener('click',()=>{if(wheelBusy)return;wheelBusy=true;wheelPrize.classList.remove('show');wheelSpin.disabled=true;wheelSpin.textContent='THE WHEEL IS SPINNING…';wheelRotation+=1800+Math.floor(Math.random()*4)*90+45;wheelDisc.style.transform=`rotate(${wheelRotation}deg)`;clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{wheelBusy=false;wheelSpin.disabled=false;wheelSpin.textContent='SPIN AGAIN';wheelPrize.classList.add('show');document.getElementById('wheelInstruction').textContent='Leo’s celebration destination is revealed!';},matchMedia('(prefers-reduced-motion: reduce)').matches?30:4200)});document.querySelectorAll('[data-booth]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.booth==='where'){openWheel(b);return}lastTrigger=b;const d=info[b.dataset.booth];document.getElementById('modalIcon').textContent=d.icon;document.getElementById('modalKicker').textContent=d.kicker;document.getElementById('modalTitle').textContent=d.title;document.getElementById('modalText').textContent=d.text;modal.classList.add('open');document.getElementById('closeModal').focus()}));document.getElementById('closeModal').onclick=closeModal;document.getElementById('modalDone').onclick=closeModal;modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&wheelOverlay.classList.contains('open'))closeWheel();if(e.key==='Escape'&&modal.classList.contains('open'))closeModal();if(e.key==='Tab'&&modal.classList.contains('open')){const controls=[document.getElementById('closeModal'),document.getElementById('modalDone')];if(e.shiftKey&&document.activeElement===controls[0]){e.preventDefault();controls[1].focus()}else if(!e.shiftKey&&document.activeElement===controls[1]){e.preventDefault();controls[0].focus()}}});const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(e=>io.observe(e));document.getElementById('rsvpForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('guest').value.trim();const yes=document.getElementById('attendance').value==='yes';document.getElementById('responseText').textContent=yes?`Thanks, ${name}! This is a demo confirmation—your RSVP has not been submitted.`:`Thanks for letting us know, ${name}. This is a demo confirmation—your RSVP has not been submitted.`;e.target.style.display='none';document.getElementById('response').classList.add('show')});document.getElementById('again').onclick=()=>{document.getElementById('response').classList.remove('show');const f=document.getElementById('rsvpForm');f.reset();f.style.display='block'};\n\u003c/script>\u003c/body>\u003c/html>";document.getElementById('invitation').srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/template-image-overrides.js" defer></script></body></html>
