-size:.91rem;line-height:1.55}.page-no{bottom:10px}.turn-leaf{display:none!important}.story-stage{padding:72px 0}.wl-hint{bottom:3%}}\n@media(prefers-reduced-motion:reduce){.wl-object,.wl-skything,.wl-ground,.wl-spark,.wl-discovery{animation:none!important}}\n<\/style><\/head><body><div aria-label=\"Little Wonderland storybook opening\" aria-modal=\"true\" class=\"wl-intro\" id=\"wonderIntro\" role=\"dialog\">\n<div class=\"wl-backdrop\"><\/div><div class=\"wl-topline\">A LITTLE WONDERLAND <span>\u2726<\/span> A STORY FOR OUR LITTLE ONE<\/div>\n<div class=\"wl-stage\" id=\"wlStage\"><div class=\"wl-book\" id=\"wlBook\">\n<div class=\"wl-spread\"><div class=\"wl-sky\"><\/div><div class=\"wl-sun\"><\/div><div class=\"wl-hill rear\"><\/div><div class=\"wl-hill front\"><\/div><div class=\"wl-scene tree one\"><span>\u273f<\/span><\/div><div class=\"wl-scene tree two\"><span>\u273f<\/span><\/div><div class=\"wl-scene mushroom\">\u2726<\/div><div aria-label=\"Touch the butterfly\" class=\"wl-scene butterfly\" id=\"wlButterfly\" role=\"button\" tabindex=\"0\">\ud83e\udd8b<\/div><div class=\"wl-scene blooms\">\u273f \u00b7 \u273d \u00b7 \u273f<\/div><div class=\"wl-story\"><small>OUR NEXT CHAPTER<\/small><strong>A little wonder<br/>is on the way.<\/strong><span data-wi-parents=\"\">Maya &amp; Daniel<\/span><\/div><\/div>\n<div class=\"wl-cover\" id=\"wlCover\"><div class=\"wl-cover-inner\"><span class=\"wl-foil\">\u2727 \u00b7 \u2726 \u00b7 \u2727<\/span><small>AN INVITATION TO CELEBRATE<\/small><h2>Little<br/><em>Wonderland<\/em><\/h2><div class=\"wl-cover-art\">\u273f<span>\u2740<\/span>\u273f<\/div><p>A story about the smallest person<br/>and the biggest kind of love.<\/p><span class=\"wl-emboss\">A KEEPSAKE STORYBOOK<\/span><\/div><\/div>\n<\/div><div class=\"wl-book-shadow\"><\/div><\/div>\n<div class=\"wl-bottom\"><p class=\"wl-hint\" id=\"wlHint\">A story is waiting to unfold.<\/p><button class=\"wl-action\" id=\"wlAction\" type=\"button\">Open the storybook <span>\u2197<\/span><\/button><button class=\"wl-skip\" id=\"wlSkip\" type=\"button\">Skip opening<\/button><\/div>\n<div aria-hidden=\"true\" class=\"wl-sparkles\" id=\"wlSparkles\"><\/div><\/div><header class=\"top\"><div><div class=\"brand\">Little Wonderland<\/div><small>VraxisRSVP \u00b7 Prestige<\/small><\/div><button class=\"btn light\" id=\"editBtn\" type=\"button\">\u270e Personalise<\/button><\/header><main><section class=\"hero\" id=\"home\"><span class=\"leaf l\">\u2767<\/span><span class=\"leaf r\">\u2767<\/span><div class=\"wrap\"><div class=\"flourish\">\u2727 \u273f \u2727<\/div><div class=\"eyebrow\">A little world of love is growing<\/div><h1>Our sweetest<br/>adventure begins.<\/h1><p class=\"family\">With love, <strong data-bind=\"parents\">Maya &amp; Daniel<\/strong><\/p><img alt=\"Family portrait placeholder\" class=\"hero-portrait\" id=\"heroPhoto\" src=\"https://images.unsplash.com/photo-1511895426328-dc8714191300?w=900&amp;q=85\"/><p>We have a wonderful little reason to celebrate. And our story wouldn't be complete without you.<\/p><div class=\"hero-actions\"><button class=\"btn cta\" id=\"openBook\" type=\"button\">Open our storybook \u2193<\/button><a class=\"btn light cta\" href=\"#details\">Event details<\/a><\/div><\/div><\/section><section class=\"chapter center\" id=\"welcome\"><div class=\"wrap intro\"><div class=\"eyebrow\">A story written with love<\/div><h2>Once upon a little wonder\u2026<\/h2><p>Before the tiny clothes, the sleepy cuddles and the first hello, there was a dream shared by two people. This is our story, and we'd love you to be part of its next chapter.<\/p><div class=\"ornament\"><\/div><p class=\"eyebrow\">Turn the pages below<\/p><\/div><\/section><section class=\"story-stage\" id=\"storybook\"><div class=\"wrap\"><div class=\"stage-head\"><div class=\"eyebrow\">An interactive keepsake<\/div><h2>Our little storybook<\/h2><p>Five little worlds, five chapters of your story. Touch the glowing objects to discover a hidden wish on every page.<\/p><\/div><div class=\"book-wrap\"><div aria-label=\"Interactive pop-up storybook\" class=\"book\" id=\"book\"><div class=\"spread\"><div class=\"page left\"><div class=\"page-copy\"><div class=\"eyebrow\" id=\"chapterLabel\">Chapter one<\/div><h3 id=\"chapterTitle\">It started with a little dream.<\/h3><p id=\"chapterBody\">Somewhere between ordinary days and extraordinary hopes, we began imagining the little person who would change our world.<\/p><div class=\"page-no\" id=\"leftPage\">01<\/div><\/div><\/div><div class=\"page right\"><div class=\"popscene scene-1\" id=\"scene\"><div class=\"sky\"><\/div><div class=\"sun\"><\/div><div class=\"cloud\"><\/div><div class=\"hill\"><\/div><div class=\"hill h2\"><\/div><div class=\"paper-object tree\"><\/div><div class=\"paper-object house\"><div class=\"door\"><\/div><\/div><div class=\"paper-object tree second\"><\/div><div class=\"butterfly\">\u2726<\/div><\/div><div class=\"page-no\" id=\"rightPage\">02<\/div><\/div><\/div><div class=\"spine\"><\/div><div aria-hidden=\"true\" class=\"turn-leaf\" id=\"turnLeaf\"><div class=\"turn-face front\"><div class=\"turn-deco\"><div class=\"mini-moon\"><\/div><span>Once upon a little wonder...<\/span><\/div><\/div><div class=\"turn-face back\"><div class=\"turn-deco\"><div class=\"mini-moon\"><\/div><span>Another page of our story<\/span><\/div><\/div><\/div><\/div><\/div><div class=\"book-controls\"><button class=\"btn light\" id=\"prevPage\" type=\"button\">\u2190 Previous page<\/button><span aria-live=\"polite\" class=\"count\" id=\"pageCount\">1 / 5<\/span><button class=\"btn\" id=\"nextPage\" type=\"button\">Next page \u2192<\/button><\/div><div class=\"wl-page-action\"><button type=\"button\" id=\"wlDiscover\">\u2726 Discover this page\u2019s secret<\/button><\/div><div aria-label=\"Story chapters\" class=\"dots\" id=\"dots\"><\/div><p class=\"hint\">Paper layers unfold in perspective. For comfort, animations respect reduced-motion settings.<\/p><\/div><\/section><section class=\"chapter parents\" id=\"our-story\"><div class=\"wrap parents-grid\"><div><img alt=\"Parents' photo placeholder\" id=\"parentsPhoto\" src=\"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=1100&amp;q=85\"/><\/div><div><div class=\"eyebrow\">A note from us<\/div><h2>Before we meet you, little one.<\/h2><p class=\"quote\" id=\"parentQuote\">\u201cWe haven't held you yet, but you've already filled our lives with so much love.\u201d<\/p><p id=\"parentStory\">We can't wait for the day we get to meet you. Until then, we're gathering our favourite people to celebrate the love that's already growing around you.<\/p><p>With all our love,<br/><strong data-bind=\"parents\">Maya &amp; Daniel<\/strong><\/p><\/div><\/div><\/section><section class=\"chapter details\" id=\"details\"><div class=\"wrap\"><div class=\"eyebrow\">Please join us<\/div><h2>A celebration for our little one<\/h2><p>We would be delighted to have you there as we celebrate this new beginning together.<\/p><div class=\"details-grid\"><div class=\"detail\"><div class=\"eyebrow\">The date<\/div><b id=\"dateDisplay\">Saturday, 21 March 2027<\/b><p id=\"timeDisplay\">14:00<\/p><\/div><div class=\"detail\"><div class=\"eyebrow\">The place<\/div><b id=\"venueDisplay\">The Glasshouse<\/b><p id=\"addressDisplay\">Potchefstroom, South Africa<\/p><\/div><div class=\"detail\"><div class=\"eyebrow\">A little note<\/div><b id=\"dressDisplay\">Garden pastels<\/b><p>Come as you are, with love in your heart.<\/p><\/div><\/div><a class=\"btn\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Potchefstroom\" id=\"mapLink\" rel=\"noopener noreferrer\" target=\"_blank\">Find the venue \u2197<\/a> <button class=\"btn light\" id=\"calendarBtn\" type=\"button\">Add to calendar<\/button><\/div><\/section><section class=\"chapter wish\" id=\"wishes\"><div class=\"wrap wish-grid\"><div><div class=\"eyebrow\">A little keepsake<\/div><h2>A wish for our baby<\/h2><p>Every child deserves a world full of kind words. Leave a wish, a hope, or a little piece of wisdom for the newest member of our family.<\/p><p>Tap the star to discover a little blessing. You can leave your own message with your RSVP.<\/p><button class=\"btn\" id=\"wishBtn\" type=\"button\">Make a wish \u2727<\/button><\/div><div aria-live=\"polite\" class=\"starboard\"><div class=\"stars\"><\/div><div class=\"star\">\u2726<\/div><p id=\"wishText\">May your days be full of wonder, and your heart always know how loved you are.<\/p><\/div><\/div><\/section><section class=\"chapter rsvp center\" id=\"rsvp\"><div class=\"wrap\"><div class=\"eyebrow\">We saved a place for you<\/div><h2>Will you celebrate with us?<\/h2><p>We'd love to see you there. Please let us know.<\/p><form id=\"rsvpForm\"><div class=\"field\"><label for=\"guestName\">Your name<\/label><input id=\"guestName\" maxlength=\"90\" placeholder=\"Your full name\" required=\"\"/><\/div><div class=\"field\"><label>Will you be joining us?<\/label><div class=\"choice\"><label><input checked=\"\" name=\"attending\" type=\"radio\" value=\"yes\"/> Joyfully accepts<\/label><label><input name=\"attending\" type=\"radio\" value=\"no\"/> Sends love from afar<\/label><\/div><\/div><div id=\"attendingFields\"><div class=\"field\"><label for=\"guestCount\">Number of guests (including you)<\/label><select id=\"guestCount\"><option>1<\/option><option>2<\/option><option>3<\/option><option>4<\/option><option>5<\/option><\/select><\/div><div class=\"field\"><label for=\"diet\">Dietary notes (optional)<\/label><input id=\"diet\" maxlength=\"200\" placeholder=\"Anything we should know?\"/><\/div><\/div><div class=\"field\"><label for=\"message\">A wish for baby (optional)<\/label><textarea id=\"message\" maxlength=\"700\" placeholder=\"Dear little one\u2026\"><\/textarea><\/div><button class=\"btn\" style=\"width:100%\" type=\"submit\">Send my response \u2661<\/button><p style=\"font-size:.75rem;text-align:center;color:#687b70\">Preview only \u2014 responses are not saved or sent to the hosts yet.<\/p><\/form><\/div><\/section><\/main><footer class=\"footer\"><div class=\"wrap\"><div class=\"serif\" style=\"font-size:2.2rem\">The best stories begin with love.<\/div><p><span data-bind=\"parents\">Maya &amp; Daniel<\/span> \u00b7 Made with wonder<\/p><p>Little Wonderland \u00b7 VraxisRSVP Prestige Template 010<\/p><\/div><\/footer><div class=\"scrim\" id=\"scrim\"><\/div><aside aria-hidden=\"true\" aria-label=\"Personalise invitation\" class=\"drawer\" id=\"drawer\"><div class=\"drawer-head\"><h3>Make it yours<\/h3><button class=\"btn light\" id=\"closeEdit\" type=\"button\">Close \u2715<\/button><\/div><p>Preview changes live. Photo uploads stay in this browser session until your invitation is published through VraxisRSVP.<\/p><div class=\"field\"><label for=\"editParents\">Parents' names<\/label><input id=\"editParents\" value=\"Maya &amp; Daniel\"/><\/div><div class=\"field\"><label for=\"editChapter1\">Our first chapter<\/label><textarea id=\"editChapter1\">Somewhere between ordinary days and extraordinary hopes, we began imagining the little person who would change our world.<\/textarea><\/div><div class=\"field\"><label for=\"editChapter2\">Our journey<\/label><textarea id=\"editChapter2\">We found out that our family was growing, and suddenly every tomorrow felt brighter than the one before.<\/textarea><\/div><div class=\"field\"><label for=\"editChapter3\">Our hopes<\/label><textarea id=\"editChapter3\">We dream of tiny hands, big adventures, bedtime stories and a lifetime of being your biggest cheerleaders.<\/textarea><\/div><div class=\"field\"><label for=\"editParentQuote\">A note to baby<\/label><textarea id=\"editParentQuote\">\u201cWe haven't held you yet, but you've already filled our lives with so much love.\u201d<\/textarea><\/div><div class=\"field\"><label for=\"editParentStory\">Parents' message<\/label><textarea id=\"editParentStory\">We can't wait for the day we get to meet you. Until then, we're gathering our favourite people to celebrate the love that's already growing around you.<\/textarea><\/div><div class=\"field\"><label for=\"editDate\">Event date<\/label><input id=\"editDate\" type=\"date\" value=\"2027-03-21\"/><\/div><div class=\"field\"><label for=\"editTime\">Time<\/label><input id=\"editTime\" type=\"time\" value=\"14:00\"/><\/div><div class=\"field\"><label for=\"editVenue\">Venue<\/label><input id=\"editVenue\" value=\"The Glasshouse\"/><\/div><div class=\"field\"><label for=\"editAddress\">Address<\/label><input id=\"editAddress\" value=\"Potchefstroom, South Africa\"/><\/div><div class=\"field\"><label for=\"editDress\">Dress code<\/label><input id=\"editDress\" value=\"Garden pastels\"/><\/div><div class=\"field\"><label for=\"uploadHero\">Cover family photo<\/label><div class=\"upload\"><input accept=\"image/*\" id=\"uploadHero\" type=\"file\"/><\/div><\/div><div class=\"field\"><label for=\"uploadParents\">Parents' story photo<\/label><div class=\"upload\"><input accept=\"image/*\" id=\"uploadParents\" type=\"file\"/><\/div><\/div><small>Sample content is for demonstration. Images and edits are not uploaded to a server.<\/small><\/aside><div class=\"toast\" id=\"toast\" role=\"status\"><\/div><script>\n(()=>{'use strict';const $=id=>document.getElementById(id);const chapters=[{label:'Chapter one',title:'It started with a little dream.',body:'Somewhere between ordinary days and extraordinary hopes, we began imagining the little person who would change our world.'},{label:'Chapter two',title:'Then everything changed.',body:'We found out that our family was growing, and suddenly every tomorrow felt brighter than the one before.'},{label:'Chapter three',title:'A thousand little hopes.',body:'We dream of tiny hands, big adventures, bedtime stories and a lifetime of being your biggest cheerleaders.'},{label:'Chapter four',title:'A world waiting for you.',body:'There are so many people who already love you. We cannot wait for you to meet the be
