:root{
--ink:#202a25;
--cream:#f6f2eb;
--muted:#6e766d;
--green:#29493d;
--line:#dddcd2}
*{
box-sizing:border-box}
html{
scroll-behavior:smooth}
body{
margin:0;
background:var(--cream);
color:var(--ink);
font-family:'DM Sans',sans-serif}
a{
color:inherit;
text-decoration:none}
button,input,select,textarea{
font:inherit}
button{
cursor:pointer}
.serif,h1,h2,h3{
font-family:'Playfair Display',Georgia,serif;
font-weight:400}
h1{
font-size:clamp(3rem,7vw,7.5rem);
line-height:1.04;
letter-spacing:-.045em;
margin:0}
h2{
font-size:clamp(2.3rem,4vw,4.4rem);
line-height:1.12;
letter-spacing:-.035em;
margin:0 0 20px}
p{
line-height:1.7}
small,.eyebrow{
font-size:.74rem;
letter-spacing:.19em;
text-transform:uppercase;
font-weight:700}
.eyebrow{
color:#9c7962}
.wrap{
max-width:1320px;
margin:auto;
padding:0 5vw}
header{
position:sticky;
top:0;
z-index:100;
background:#f6f2ebee;
backdrop-filter:blur(16px);
border-bottom:1px solid #e3dfd6}
.nav{
height:78px;
display:flex;
align-items:center;
gap:35px}
.logo{
font-family:Georgia,serif;
font-size:1.65rem;
letter-spacing:-.06em;
margin-right:auto}
.logo b{
color:#a36b54;
font-weight:400}
.links{
display:flex;
gap:26px;
align-items:center;
font-size:.85rem}
.links a:hover{
color:#a36b54}
.btn{
border:1px solid var(--ink);
background:transparent;
padding:15px 24px;
display:inline-flex;
align-items:center;
justify-content:center;
gap:10px;
font-weight:700;
font-size:.86rem;
transition:transform .2s,background .2s}
.btn:hover{
transform:translateY(-2px)}
.btn.dark{
background:var(--ink);
color:white}
.btn.light{
background:#f6f2eb;
color:var(--ink);
border-color:#f6f2eb}
.btn:disabled{
opacity:.35;
cursor:not-allowed}
.section{
padding:110px 0}
.section-head{
display:flex;
justify-content:space-between;
align-items:end;
gap:20px;
margin-bottom:35px}
.hero{
min-height:780px;
min-height:calc(100svh - 78px);
background:#16281f;
color:white;
position:relative;
overflow:hidden;
display:grid;
align-items:center}
.hero-photo{
position:absolute;
inset:0;
background:linear-gradient(90deg,#13241ff2 0%,#13241fd4 36%,#13241f22 85%),url('https://images.unsplash.com/photo-1519741497674-611481863552?w=1600&q=85') center/cover;
transform:scale(1.08);
animation:herozoom 14s ease-out both}
.hero-inner{
position:relative;
z-index:2;
max-width:850px;
padding:90px 0}
.hero h1 em{
color:#e4c6a8;
font-weight:400}
.hero p{
max-width:530px;
color:#e4e6dc;
font-size:1.1rem}
.hero-actions{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:35px}
.hero-scroll{
position:absolute;
bottom:30px;
left:5vw;
letter-spacing:.18em;
font-size:.68rem}
.floating-note{
position:absolute;
right:7%;
bottom:12%;
width:220px;
background:#f4e8d7;
color:#473a32;
padding:24px;
transform:rotate(8deg);
box-shadow:0 25px 60px #0006;
animation:float 5s ease-in-out infinite;
z-index:2}
.floating-note .serif{
font-size:2rem}
.marquee{
overflow:hidden;
background:#e8ded0;
padding:18px 0;
white-space:nowrap;
font-size:.76rem;
letter-spacing:.2em}
.marquee span{
display:inline-block;
animation:marquee 26s linear infinite}
.cards{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:22px}
.tile{
background:#fff;
border:1px solid var(--line);
overflow:hidden;
transition:transform .25s,box-shadow .25s}
.tile:hover{
transform:translateY(-6px);
box-shadow:0 18px 45px #26382b18}
.tile-art{
height:310px;
position:relative;
overflow:hidden;
display:grid;
place-items:center;
background:linear-gradient(135deg,#dfc9b7,#e8e0d4)}
.tile-art img{
width:100%;
height:100%;
object-fit:cover;
transition:transform .5s}
.tile:hover img{
transform:scale(1.05)}
.tile-art .mock{
font:italic 2.1rem Georgia,serif;
text-align:center;
padding:20px;
color:#42362e}
.tile-body{
padding:23px}
.tile-body h3{
font-size:1.65rem;
margin:8px 0}
.tile-body p{
color:var(--muted);
font-size:.85rem;
margin:4px 0 16px}
.tile-bottom{
display:flex;
justify-content:space-between;
align-items:center}
.chip{
border:1px solid #c5c9c0;
padding:8px 14px;
background:transparent;
font-size:.82rem}
.chip.active{
background:var(--ink);
color:white}
.filters{
display:flex;
flex-wrap:wrap;
gap:9px;
margin:30px 0}
.intro{
padding:90px 0 55px;
background:#eae5dc}
.intro p{
max-width:720px}
.split{
display:grid;
grid-template-columns:1fr 1fr;
gap:6vw;
align-items:center}
.visual{
min-height:500px;
background:linear-gradient(145deg,#c7b29d,#e9dcd0);
display:grid;
place-items:center;
position:relative;
overflow:hidden}
.visual:before{
content:'✦';
font-size:16rem;
color:#fff6;
animation:spin 35s linear infinite}
.quote{
font:italic 2rem Georgia,serif}
.dark-section{
background:#1d3229;
color:#fff}
.dark-section p{
color:#cdd9d0}
.steps{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px}
.step{
padding:28px;
border-top:1px solid #b5c5b7}
.step strong{
font:italic 2rem Georgia,serif;
color:#d5bda2}
.step h3{
font-size:1.5rem}
.footer{
background:#17251e;
color:#fff;
padding:65px 0 25px}
.footer a{
color:#d9e4d8}
.footgrid{
display:grid;
grid-template-columns:2fr 1fr 1fr;
gap:45px}
.footgrid a{
display:block;
margin:12px 0}
.copyright{
border-top:1px solid #506257;
margin-top:45px;
padding-top:22px;
font-size:.8rem;
color:#a6b4a9}
.onboard{
max-width:920px;
margin:0 auto;
padding:55px 22px 100px;
min-height:75vh}
.progress{
height:4px;
background:#dddcd3;
margin:25px 0 45px}
.progress>div{
height:100%;
background:#a47960;
transition:width .35s}
.panel{
background:#fff;
border:1px solid var(--line);
padding:clamp(24px,5vw,55px)}
.choices{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin:30px 0}
.choice{
padding:24px;
text-align:left;
background:#faf8f3;
border:1px solid #dcd8cf;
min-height:90px}
.choice.selected{
border:2px solid #375a47;
background:#eaf0e9}
.actions{
display:flex;
justify-content:space-between;
gap:15px;
margin-top:30px}
.field{
display:block;
margin:20px 0}
.field span{
display:block;
font-size:.8rem;
font-weight:700;
margin-bottom:9px}
.field input,.field select,.field textarea{
width:100%;
border:1px solid #c8c8be;
background:#fff;
padding:15px;
border-radius:0}
.mini-templates{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
max-height:500px;
overflow:auto}
.mini{
border:1px solid #ddd;
padding:14px;
text-align:left;
background:white}
.mini.selected{
outline:3px solid #52735c}
.mini img{
width:100%;
height:120px;
object-fit:cover}
.auth{
max-width:490px;
margin:80px auto;
background:#fff;
padding:40px;
border:1px solid var(--line)}
.studio-layout{
display:grid;
grid-template-columns:330px 1fr;
min-height:calc(100svh - 78px)}
.studio-sidebar{
background:#fff;
border-right:1px solid var(--line);
padding:26px;
overflow:auto;
max-height:calc(100svh - 78px)}
.studio-view{
background:#dedbd4;
min-height:75vh;
display:grid;
place-items:center;
padding:24px}
.studio-view iframe{
width:100%;
height:calc(100svh - 150px);
border:0;
background:white;
box-shadow:0 15px 55px #0002}
.studio-view.phone iframe{
max-width:430px}
.mobile-tabs{
display:none}
.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#253d30;
color:white;
padding:14px 22px;
z-index:999;
display:none}
.journal-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px}
.article{
background:white;
padding:30px;
border:1px solid var(--line)}
.article h3{
font-size:1.7rem}
.policy{
max-width:840px;
margin:80px auto;
padding:0 22px}
.policy h2{
font-size:2rem;
margin-top:45px}
@keyframes herozoom{
to{
transform:scale(1)}
}
@keyframes float{
50%{
transform:translateY(-17px) rotate(5deg)}
}
@keyframes marquee{
to{
transform:translateX(-50%)}
}
@keyframes spin{
to{
transform:rotate(360deg)}
}
@media(max-width:800px){
.nav{
height:68px;
gap:12px}
.links{
gap:12px;
font-size:.73rem;
overflow:auto}
.links a:nth-child(3),.links a:nth-child(4){
display:none}
.nav .btn{
padding:10px}
.hero{
min-height:720px}
.hero-inner{
padding:80px 0 180px}
.floating-note{
right:8%;
bottom:45px;
width:145px;
padding:14px}
.floating-note .serif{
font-size:1.3rem}
.cards,.steps,.journal-grid{
grid-template-columns:repeat(2,minmax(0,1fr))}
.split{
grid-template-columns:1fr}
.section{
padding:70px 0}
.tile-art{
height:210px}
.footgrid{
grid-template-columns:1fr 1fr}
.footgrid>div:first-child{
grid-column:span 2}
.studio-layout{
display:block}
.studio-sidebar{
max-height:none}
.studio-view{
padding:0;
min-height:calc(100svh - 125px)}
.studio-view iframe{
height:calc(100svh - 125px);
box-shadow:none}
.mobile-tabs{
display:flex;
position:sticky;
top:68px;
z-index:30;
background:white;
border-bottom:1px solid #ddd}
.mobile-tabs button{
flex:1;
padding:16px;
border:0;
background:#fff}
.mobile-tabs button.active{
background:#29493d;
color:white}
.studio-layout[data-tab=preview] .studio-sidebar{
display:none}
.studio-layout[data-tab=edit] .studio-view{
display:none}
}
@media(max-width:530px){
.links a:nth-child(2){
display:none}
.logo{
font-size:1.3rem}
.nav{
gap:9px}
.cards,.journal-grid{
grid-template-columns:1fr 1fr;
gap:10px}
.tile-art{
height:170px}
.tile-body{
padding:12px}
.tile-body h3{
font-size:1.25rem}
.tile-body p{
font-size:.75rem}
.steps{
grid-template-columns:1fr}
.choices{
grid-template-columns:1fr}
.section-head{
align-items:start;
flex-direction:column}
.intro{
padding:60px 0 30px}
.hero h1{
font-size:3.4rem}
.panel{
padding:22px}
.mini-templates{
grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){
*,*:before,*:after{
animation:none!important;
transition:none!important}
}
