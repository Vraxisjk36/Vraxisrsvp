div><div class=\"lg-frame\"><div class=\"lg-inside\"><\/div><div class=\"lg-door left\"><\/div><div class=\"lg-door right\"><\/div><\/div><div class=\"lg-center\"><p class=\"lg-kicker\">An invitation from <span id=\"lgParents\">Olivia &amp; James<\/span><\/p><h2>Something<br><em>beautiful<\/em><br>is growing.<\/h2><p class=\"lg-sub\">Come through the garden gate.<\/p><\/div><div class=\"lg-action\"><button id=\"lgEnter\" type=\"button\">Open the garden gates \u273f<\/button><p>Tap to step into our little celebration<\/p><\/div><\/div><a class=\"skip\" href=\"#garden\">Skip to invitation details<\/a><nav><a class=\"brand\" href=\"#home\">the little garden <span aria-hidden=\"true\">\u273f<\/span><\/a><a href=\"#rsvp\">Kindly RSVP \u2197<\/a><\/nav><header class=\"hero\" id=\"home\"><div class=\"stem left\" aria-hidden=\"true\"><svg viewBox=\"0 0 240 650\"><path d=\"M110 680Q130 400 95 30\" fill=\"none\" stroke=\"#748f73\" stroke-width=\"5\"/><path d=\"M114 520Q-10 470 22 360Q100 375 114 520M110 430Q205 340 218 280Q120 305 110 430M105 310Q15 240 30 160Q112 190 105 310M99 210Q190 140 198 80Q105 100 99 210\" fill=\"#a0b99b\" stroke=\"#698a70\" stroke-width=\"2\"/><g transform=\"translate(94 55)\"><circle r=\"35\" fill=\"#d8b2a1\"/><circle cx=\"-24\" cy=\"-20\" r=\"25\" fill=\"#e8c5b1\"/><circle cx=\"24\" cy=\"-18\" r=\"25\" fill=\"#e8c5b1\"/><circle cx=\"-20\" cy=\"23\" r=\"25\" fill=\"#e8c5b1\"/><circle cx=\"22\" cy=\"22\" r=\"25\" fill=\"#e8c5b1\"/><circle r=\"15\" fill=\"#d9b56e\"/><\/g><\/svg><\/div><div class=\"stem right\" aria-hidden=\"true\"><svg viewBox=\"0 0 240 650\"><path d=\"M130 680Q105 390 135 25\" fill=\"none\" stroke=\"#748f73\" stroke-width=\"5\"/><path d=\"M124 500Q210 435 225 345Q138 355 124 500M130 410Q20 335 15 270Q120 300 130 410M130 300Q220 215 208 160Q132 180 130 300M133 200Q30 120 38 65Q125 95 133 200\" fill=\"#a0b99b\" stroke=\"#698a70\" stroke-width=\"2\"/><g transform=\"translate(134 50)\"><circle cx=\"-20\" cy=\"-16\" r=\"27\" fill=\"#f2e2bc\"/><circle cx=\"21\" cy=\"-15\" r=\"27\" fill=\"#f2e2bc\"/><circle cx=\"-21\" cy=\"23\" r=\"27\" fill=\"#f2e2bc\"/><circle cx=\"20\" cy=\"23\" r=\"27\" fill=\"#f2e2bc\"/><circle r=\"15\" fill=\"#d9b56e\"/><\/g><\/svg><\/div><div class=\"hero-inner wrap\"><div class=\"eyebrow\">A little one is on the way<\/div><h1>Oh, baby.<br><em>Let's bloom.<\/em><\/h1><p>Something wonderful is growing. Join us for an afternoon of love, laughter and a little celebration.<\/p><div class=\"date\" data-date-text>Sunday \u00b7 18 April 2027<\/div><a class=\"btn\" href=\"#garden\">Step into the garden <span aria-hidden=\"true\">\u2197<\/span><\/a><\/div><div class=\"scroll-note\">Scroll to explore \u2193<\/div><\/header><section class=\"intro wrap reveal\"><div class=\"eyebrow\">With hearts full of joy<\/div><div class=\"smallrule\"><\/div><p class=\"lead\">Please join us as we shower <em data-parent-names>Olivia & James<\/em> with love before their sweetest little adventure begins.<\/p><p>We saved you a place among the flowers.<\/p><\/section><section class=\"garden\" id=\"garden\"><div class=\"garden-head wrap reveal\"><div class=\"eyebrow\">A garden of little surprises<\/div><h2>Every flower<br>has a story.<\/h2><p>Tap the four garden treasures to discover everything you need to know about our celebration.<\/p><\/div><div class=\"garden-scene\" aria-label=\"Interactive garden with four invitation details\"><div class=\"sun\"><\/div><div class=\"hills\"><\/div><div class=\"garden-path\"><\/div><div class=\"garden-art\" aria-hidden=\"true\"><svg viewBox=\"0 0 250 350\"><path d=\"M42 315V155L125 80L208 155V315Z\" fill=\"#e9eee2\" stroke=\"#748c73\" stroke-width=\"5\"/><path d=\"M20 158L125 52L230 158\" fill=\"none\" stroke=\"#748c73\" stroke-width=\"8\"/><path d=\"M125 83V315M43 155H207M42 228H208\" stroke=\"#8fa28d\" stroke-width=\"4\"/><path d=\"M94 315V250Q125 215 156 250V315\" fill=\"#b6c7b0\" stroke=\"#748c73\" stroke-width=\"4\"/><path d=\"M60 172H106V211H60ZM145 172H190V211H145Z\" fill=\"#f4e4b8\" stroke=\"#91a28d\" stroke-width=\"3\"/><path d=\"M5 318H245\" stroke=\"#637e62\" stroke-width=\"8\"/><circle cx=\"60\" cy=\"310\" r=\"26\" fill=\"#8eac87\"/><circle cx=\"195\" cy=\"308\" r=\"29\" fill=\"#8eac87\"/><\/svg><\/div><button class=\"garden-object one\" data-modal=\"date\"><span class=\"picture\" aria-hidden=\"true\">\ud83c\udf3c<\/span><span class=\"tag\">The flower \u00b7 When<\/span><\/button><button class=\"garden-object two\" data-modal=\"place\"><span class=\"picture\" aria-hidden=\"true\">\ud83c\udfe1<\/span><span class=\"tag\">The greenhouse \u00b7 Where<\/span><\/button><button class=\"garden-object three\" data-modal=\"dress\"><span class=\"picture\" aria-hidden=\"true\">\ud83c\udf80<\/span><span class=\"tag\">The ribbon \u00b7 What to wear<\/span><\/button><button class=\"garden-object four\" data-modal=\"gifts\"><span class=\"picture\" aria-hidden=\"true\">\u2709\ufe0f<\/span><span class=\"tag\">The letter \u00b7 A little note<\/span><\/button><\/div><div class=\"garden-discovery\" aria-live=\"polite\"><span id=\"gardenProgress\">0 of 4 garden treasures discovered<\/span><div class=\"discovery-track\" aria-hidden=\"true\"><span id=\"discoveryFill\"><\/span><\/div><p>Every little discovery brings us closer to the celebration.<\/p><\/div><p class=\"garden-help\">\u273f Four treasures to discover \u00b7 Tap each to open<\/p><\/section><section class=\"seed-section\" id=\"seed\"><div class=\"seed-copy\"><span class=\"eyebrow\">A little interactive keepsake<\/span><h2>Every beautiful thing <em>begins small.<\/em><\/h2><p>Plant a tiny wish for the little one. Give it a moment, a little sunshine, and watch something lovely grow.<\/p><button type=\"button\" class=\"btn seed-btn\" id=\"plantSeed\">Plant a little wish \u273f<\/button><p class=\"seed-hint\" id=\"seedStatus\" role=\"status\">A little patch of earth is waiting.<\/p><\/div><div class=\"seed-world\" aria-label=\"Interactive growing flower\"><div class=\"seed-sun\"><\/div><div class=\"seed-cloud\"><\/div><div class=\"seed-plant\" id=\"seedPlant\"><div class=\"seed-bloom\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><b><\/b><\/div><div class=\"seed-stalk\"><\/div><div class=\"seed-leaf l\"><\/div><div class=\"seed-leaf r\"><\/div><\/div><div class=\"seed-ground\"><\/div><span class=\"seed-caption\">A WISH, IN BLOOM<\/span><\/div><\/section><section class=\"story wrap\"><div class=\"story-grid\"><div class=\"story-photo reveal\"><img src=\"https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=1000&q=85\" alt=\"Soft, tender photograph celebrating a new baby\" loading=\"lazy\" id=\"storyImage\"><\/div><div class=\"story-copy reveal\"><div class=\"eyebrow\">A note from the parents<\/div><h2>Our smallest<br>greatest love.<\/h2><p data-parent-message>There are so many things we haven't met yet \u2014 tiny fingers, sleepy smiles, and a whole new kind of love. Before our little one arrives, we'd love to gather with the people who already make our world feel like home.<\/p><p class=\"quote\">\u201cThe sweetest things begin small.\u201d<\/p><p>With love, <span data-parent-names>Olivia & James<\/span><\/p><\/div><\/div><\/section><section class=\"details\" id=\"details\"><div class=\"wrap\"><div class=\"eyebrow center\">A little reminder<\/div><h2>Save a place<br>among the flowers.<\/h2><div class=\"detail-grid\"><div class=\"detail reveal\"><div class=\"symbol\">\u263c<\/div><h3>The day<\/h3><p data-date-long>Sunday, 18 April 2027<\/p><p data-time>14:00 \u2013 17:00<\/p><\/div><div class=\"detail reveal\"><div class=\"symbol\">\u2302<\/div><h3>The place<\/h3><p data-venue>The Glasshouse Garden<\/p><p data-address>Johannesburg, South Africa<\/p><\/div><div class=\"detail reveal\"><div class=\"symbol\">\u2740<\/div><h3>The feeling<\/h3><p data-dress>Garden party attire<\/p><p>Soft colours, comfortable shoes, happy hearts.<\/p><\/div><\/div><div class=\"center\"><a class=\"btn outline\" id=\"mapLink\" href=\"https://www.google.com/maps/search/?api=1&query=Johannesburg%20South%20Africa\" target=\"_blank\" rel=\"noopener\">Find the garden \u2197<\/a> <button class=\"btn\" id=\"calendarButton\" type=\"button\">Add to calendar \u2197<\/button><\/div><\/div><\/section><section class=\"wish wrap reveal\" id=\"wishes\"><div class=\"eyebrow\">A little wish for baby<\/div><h2>Words to grow with.<\/h2><p>Leave a little wish, a piece of advice, or a message for the newest member of the family.<\/p><div class=\"wish-paper\"><label for=\"wishText\" class=\"eyebrow\">Dear little one...<\/label><textarea id=\"wishText\" maxlength=\"350\" placeholder=\"May your days be full of wonder...\"><\/textarea><button class=\"btn\" id=\"addWish\" type=\"button\">Place your wish in the garden \u273f<\/button><p class=\"note\">Preview only. Wishes are kept in this browser until the RSVP backend is connected.<\/p><\/div><div class=\"wish-list\" id=\"wishList\" aria-live=\"polite\"><\/div><\/section><section class=\"rsvp\" id=\"rsvp\"><div class=\"rsvp-inner reveal\"><div class=\"eyebrow\">Your presence is a gift<\/div><h2>Will you join us?<\/h2><p>We'd love to celebrate this little beginning with you. Kindly reply by <span data-deadline>4 April 2027<\/span>.<\/p><form id=\"rsvpForm\"><div class=\"field\"><label for=\"guestName\">Your name<\/label><input id=\"guestName\" required maxlength=\"100\" placeholder=\"Your full name\"><\/div><div class=\"field\"><span class=\"eyebrow\">Will you be there?<\/span><div class=\"radio-row\"><label><input type=\"radio\" name=\"attendance\" value=\"yes\" required> Joyfully accepts<\/label><label><input type=\"radio\" name=\"attendance\" value=\"no\"> Sends love from afar<\/label><\/div><\/div><div id=\"attendingFields\"><div class=\"field\"><label for=\"guestCount\">Number of guests (including you)<\/label><select id=\"guestCount\"><option value=\"1\">1 guest<\/option><option value=\"2\">2 guests<\/option><option value=\"3\">3 guests<\/option><option value=\"4\">4 guests<\/option><\/select><\/div><div class=\"field\"><label for=\"diet\">Dietary notes (optional)<\/label><input id=\"diet\" maxlength=\"200\" placeholder=\"Anything we should know?\"><\/div><\/div><div class=\"field\"><label for=\"rsvpMessage\">A message for the parents (optional)<\/label><textarea id=\"rsvpMessage\" maxlength=\"400\" placeholder=\"Sending you so much love...\"><\/textarea><\/div><button class=\"btn\" type=\"submit\">Send my reply \u2197<\/button><\/form><div id=\"rsvpConfirm\" class=\"confirmation hidden\" role=\"status\"><\/div><p class=\"note\">Demonstration form \u2014 submissions are not sent or saved online.<\/p><\/div><\/section><footer class=\"footer\"><div class=\"serif\">the little garden \u273f<\/div><div>Made with love for <span data-parent-names>Olivia & James<\/span><\/div><div>VraxisRSVP \u00b7 Template 007<\/div><\/footer><button class=\"edit-toggle\" id=\"editToggle\" type=\"button\">\u270e Personalise<\/button><aside class=\"editor\" id=\"editor\" aria-label=\"Personalisation panel\" aria-hidden=\"true\"><div class=\"editor-head\"><h3>Make it yours.<\/h3><button id=\"closeEditor\" aria-label=\"Close personalisation\">\u00d7<\/button><\/div><p class=\"note\">Edit the sample details and see them update live. Changes remain in this browser.<\/p><div id=\"editorFields\"><\/div><button class=\"btn\" id=\"resetEditor\" type=\"button\">Reset sample details<\/button><\/aside><div class=\"modal\" id=\"detailModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modalTitle\"><div class=\"paper-card\"><button class=\"close\" id=\"closeModal\" aria-label=\"Close detail\">\u00d7<\/button><div class=\"eyebrow\" id=\"modalEyebrow\">A garden treasure<\/div><h2 id=\"modalTitle\">The day<\/h2><div id=\"modalBody\"><\/div><\/div><\/div><script>\n(()=>{'use strict';const $=(s)=>document.querySelector(s),$$=(s)=>[...document.querySelectorAll(s)];const defaults={parents:'Olivia & James',date:'2027-04-18',time:'14:00',end:'17:00',venue:'The Glasshouse Garden',address:'Johannes 2.0','PRODID:-//VraxisRSVP//Little Garden//EN','BEGIN:VEVENT','UID:little-garden-007@vraxisrsvp','DTSTAMP:20261112T000000Z','DTSTART:'+dt(data.date,data.time),'DTEND:'+dt(data.date,data.end),'SUMMARY:'+clean('Baby shower for '+data.parents),'LOCATION:'+clean(data.venue+', '+data.address),'DESCRIPTION:Please join us for a baby shower.','END:VEVENT','END:VCALENDAR'].join('\\r\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));a.download='little-garden-baby-shower.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if('IntersectionObserver'in window){const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.12});$$('.reveal').forEach(el=>io.observe(el))}else $$('.reveal').forEach(el=>el.classList.add('visible'));\nconst discoveries=new Set();$$('.garden-object').forEach(button=>button.addEventListener('click',()=>{discoveries.add(button.dataset.modal);button.classList.add('discovered');$('#gardenProgress').textContent=discoveries.size+' of 4 garden treasures discovered';$('#discoveryFill').style.width=(discoveries.size/4*100)+'%';if(discoveries.size===4)$('#gardenProgress').textContent='All four treasures discovered \u2014 the garden is yours! \u273f'}));\n$('#plantSeed').addEventListener('click',()=>{const flower=$('#seedPlant');flower.classList.remove('grown');void flower.offsetWidth;flower.classList.add('grown');$('#seedStatus').textContent='A little wish is growing. May this baby be surrounded by love, always.';$('#plantSeed').textContent='Plant another wish \u21bb'});\n})();\n<\/script><script>(function(){const root=document.getElementById('lgArrival');if(!root)return;document.documentElement.classList.add('garden-intro-lock');const name=document.querySelector('[data-parent-names]');const label=document.getElementById('lgParents');if(name&&label)label.textContent=name.textContent;let f
