little one is on the way\u003c/div>\n        \u003ch1>\n          Oh, baby.\u003cbr />\n          \u003cem>Let's bloom.\u003c/em>\n        \u003c/h1>\n        \u003cp>\n          Something wonderful is growing. Join us for an afternoon of love, laughter and a little\n          celebration.\n        \u003c/p>\n        \u003cdiv class=\"date\" data-date-text>Sunday \u00b7 18 April 2027\u003c/div>\n        \u003ca class=\"btn\" href=\"#garden\">Step into the garden \u003cspan aria-hidden=\"true\">\u2197\u003c/span> \u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"scroll-note\">Scroll to explore \u2193\u003c/div>\n    \u003c/header>\n    \u003csection class=\"intro wrap reveal\">\n      \u003cdiv class=\"eyebrow\">With hearts full of joy\u003c/div>\n      \u003cdiv class=\"smallrule\">\u003c/div>\n      \u003cp class=\"lead\">\n        Please join us as we shower \u003cem data-parent-names>Olivia & James\u003c/em> with love before their\n        sweetest little adventure begins.\n      \u003c/p>\n      \u003cp>We saved you a place among the flowers.\u003c/p>\n    \u003c/section>\n    \u003csection class=\"garden\" id=\"garden\">\n      \u003cdiv class=\"garden-head wrap reveal\">\n        \u003cdiv class=\"eyebrow\">A garden of little surprises\u003c/div>\n        \u003ch2>Every flower\u003cbr />has a story.\u003c/h2>\n        \u003cp>\n          Tap the four garden treasures to discover everything you need to know about our\n          celebration.\n        \u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"garden-scene\" aria-label=\"Interactive garden with four invitation details\">\n        \u003cdiv class=\"sun\">\u003c/div>\n        \u003cdiv class=\"hills\">\u003c/div>\n        \u003cdiv class=\"garden-path\">\u003c/div>\n        \u003cdiv class=\"garden-art\" aria-hidden=\"true\">\n          \u003csvg viewBox=\"0 0 250 350\">\n            \u003cpath\n              d=\"M42 315V155L125 80L208 155V315Z\"\n              fill=\"#e9eee2\"\n              stroke=
