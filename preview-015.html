etter-spacing:.08em;text-transform:uppercase}.action.secondary{background:transparent;color:var(--forest)}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.dark{background:var(--deep);color:var(--paper)}.block{padding:88px 0}.toast-layout{display:grid;grid-template-columns:.85fr 1.15fr;gap:55px;align-items:start}.toast-layout p{font-size:14px;line-height:1.9}.toast-card{background:var(--light);color:var(--ink);padding:32px;position:relative;box-shadow:9px 9px 0 #7d806b}.toast-card:before{content:'PRIVATE LEDGER · VOL 01';font:10px 'IBM Plex Mono';letter-spacing:.14em;color:#817b6e}.toast-card h3{font:700 30px 'Barlow Condensed';text-transform:uppercase;margin:25px 0 12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0}.tabs button{background:transparent;color:inherit;border:1px solid #8a8e7e;padding:11px 14px;font:11px 'IBM Plex Mono'}.tabs button.active{background:var(--gold);color:var(--deep);border-color:var(--gold)}.toast-card textarea,.toast-card input,.rsvp input,.rsvp textarea,.rsvp select,.drawer input,.drawer textarea{width:100%;padding:13px 12px;background:transparent;border:1px solid #aaa492;border-radius:0;color:inherit;min-width:0}.toast-card textarea{min-height:105px;resize:vertical}.field{display:grid;gap:7px;margin:13px 0}.field label{font:10px 'IBM Plex Mono';text-transform:uppercase;letter-spacing:.1em}.toast-list{margin-top:25px;display:grid;gap:12px;max-height:360px;overflow:auto}.toast-entry{border-top:1px solid #bdb5a3;padding:15px 0}.toast-entry p{margin:8px 0;font-size:13px}.toast-entry strong{font:12px 'IBM Plex Mono'}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:32px}.photos img{width:100%;height:280px;object-fit:cover;filter:grayscale(.55) sepia(.12)}.rsvp{background:var(--light);padding:80px 0}.rsvp-inner{display:grid;grid-template-columns:1fr 1fr;gap:70px}.rsvp form{display:grid;gap:13px}.rsvp select{background:var(--light)}.foot{padding:28px 0;background:var(--forest);color:#d8d0be;display:flex;justify-content:center;text-align:center}.drawer{position:fixed;z-index:50;right:0;top:0;height:100dvh;width:min(420px,100%);background:var(--light);box-shadow:-10px 0 40px #0005;padding:25px;overflow:auto;transform:translateX(105%);transition:transform .3s}.drawer.open{transform:none}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer-head button{background:transparent;border:1px solid var(--line);padding:8px 12px}.drawer .field{margin:16px 0}.drawer h3{font:700 24px 'Barlow Condensed';text-transform:uppercase;margin:30px 0 8px}.hint{font:11px/1.6 'IBM Plex Mono';color:#706e63}.toast-status{font:12px 'IBM Plex Mono';min-height:16px;color:#706d57}.hide{display:none!important}@media(max-width:760px){.hero-inner{display:flex;flex-direction:column}.hero-copy{min-height:480px;padding:50px 33px 35px}.hero h1{font-size:clamp(78px,21vw,150px)}.hero-image{min-height:370px}.intro,.toast-layout,.rsvp-inner{grid-template-columns:1fr;gap:24px}.intro{padding:60px 0}.block,.details,.rsvp{padding:60px 0}.details-grid{grid-template-columns:1fr}.detail,.detail+.detail{border-left:0;border-bottom:1px solid var(--line);padding:24px 0}.photos img{height:165px}.toast-card{padding:23px;box-shadow:5px 5px 0 #7d806b}.seal{width:82px;height:82px;font-size:9px}.hero-bottom p{font-size:11px}.top strong{font-size:15px}}@media(max-width:390px){.hero h1{font-size:73px}.hero-copy{padding:43px 27px 30px}.photos img{height:115px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader class=\"top\">\u003cstrong>THE BROTHERHOOD \u003cspan style=\"color:#a99b7b\">/ 015\u003c/span>\u003c/strong>\u003cbutton type=\"button\" id=\"editBtn\" class=\"mono\">CUSTOMISE ↗\u003c/button>\u003c/header>\u003cmain>\u003csection class=\"hero\" id=\"home\">\u003cdiv class=\"hero-inner\">\u003cdiv class=\"hero-copy\">\u003cdiv class=\"hero-kicker mono\">A PRIVATE INVITATION · GENTLEMEN ONLY\u003c/div>\u003cdiv>\u003ch1 class=\"cond\">THE\u003cbr>BROTHER\u003cbr>HOOD.\u003c/h1>\u003cp class=\"name\">A proper send-off for \u003cem data-text=\"groom\">Daniel\u003c/em>.\u003c/p>\u003c/div>\u003cdiv class=\"hero-bottom\">\u003cp data-text=\"tagline\">Good friends. Old stories. One night worth remembering.\u003c/p>\u003cdiv class=\"seal\">THE\u003cbr>FINAL\u003cbr>SEND-OFF\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"hero-image\">\u003cimg data-photo=\"hero\" src=\"https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=1000&q=85\" alt=\"Classic gentleman's portrait\">\u003cspan class=\"caption mono\">THE MAN OF THE HOUR / \u003cspan data-text=\"groom\">DANIEL\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"wrap intro\">\u003cdiv>\u003cspan class=\"mono smalltag\">01 / THE OCCASION\u003c/span>\u003c/div>\u003cdiv>\u003ch2 class=\"cond\">HERE'S TO\u003cbr>THE MAN.\u003c/h2>\u003cp data-text=\"tribute\">Before Daniel starts his next chapter, we're bringing together the men who've been part of the story so far. No fuss. No speeches required. Just good company and a proper send-off.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"quote\">\u003cdiv class=\"wrap\">\u003cspan class=\"mono smalltag\">A NOTE FROM THE BEST MAN\u003c/span>\u003cblockquote data-text=\"quote\">“We've known him through every questionable haircut and every brilliant decision. This one's for Daniel.”\u003c/blockquote>\u003cspan class=\"mono\" data-text=\"organiser\">— Michael, Best Man\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wrap details\" id=\"details\">\u003cdiv class=\"section-top\">\u003cspan class=\"mono smalltag\">02 / THE ARRANGEMENTS\u003c/span>\u003cspan class=\"mono\">KEEP THIS BETWEEN US\u003c/span>\u003c/div>\u003cdiv class=\"details-grid\">\u003cdiv class=\"detail\">\u003cspan class=\"mono\">THE DATE\u003c/span>\u003cb data-text=\"date\">SATURDAY\u003cbr>21 NOVEMBER\u003c/b>\u003cp data-text=\"dateNote\">2026 · Save the date\u003c/p>\u003c/div>\u003cdiv class=\"detail\">\u003cspan class=\"mono\">THE HOUR\u003c/span>\u003cb data-text=\"time\">18:00\u003c/b>\u003cp data-text=\"timeNote\">Arrive on time. The first round waits for no one.\u003c/p>\u003c/div>\u003cdiv class=\"detail\">\u003cspan class=\"mono\">THE PLACE\u003c/span>\u003cb data-text=\"venue\">THE OLD\u003cbr>FOUNDRY\u003c/b>\u003cp data-text=\"address\">14 Foundry Road, Johannesburg\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"buttons\">\u003ca class=\"action\" id=\"directions\" href=\"https://www.google.com/maps/search/?api=1&query=Johannesburg\" target=\"_blank\" rel=\"noopener\">GET DIRECTIONS ↗\u003c/a>\u003ca class=\"action secondary\" href=\"#rsvp\">CONFIRM YOUR PLACE ↓\u003c/a>\u003c/div>\u003cp style=\"margin-top:26px;font-size:13px;line-height:1.9;max-width:700px\" data-text=\"extra\">Dress code: smart casual. If there's anything else you need to know, the best man will be in touch.\u003c/p>\u003c/section>\u003csection class=\"dark block\" id=\"ledger\">\u003cdiv class=\"wrap toast-layout\">\u003cdiv>\u003cspan class=\"mono\" style=\"color:#b7a37d\">03 / THE BROTHERHOOD LEDGER\u003c/span>\u003ch2 class=\"cond\">LEAVE\u003cbr>YOUR\u003cbr>MARK.\u003c/h2>\u003cp>Every groom has a few stories that deserve to be remembered. Leave a toast, an old memory, or a piece of advice. We'll collect the best ones for the man himself.\u003c/p>\u003cp class=\"mono\" style=\"color:#a89f88\">NO PUBLIC FEED · PREVIEW ENTRIES ONLY\u003c/p>\u003c/div>\u003cdiv class=\"toast-card\">\u003ch3>THE BOOK OF WORDS\u003c/h3>\u003cdiv class=\"tabs\" role=\"group\" aria-label=\"Message type\">\u003cbutton class=\"active\" type=\"button\" data-kind=\"Toast\">A TOAST\u003c/button>\u003cbutton type=\"button\" data-kind=\"Memory\">A MEMORY\u003c/button>\u003cbutton type=\"button\" data-kind=\"Advice\">SOME ADVICE\u003c/button>\u003c/div>\u003cform id=\"toastForm\">\u003cdiv class=\"field\">\u003clabel for=\"toastName\">YOUR NAME\u003c/label>\u003cinput id=\"toastName\" required maxlength=\"60\" placeholder=\"Your name\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"toastText\">YOUR WORDS\u003c/label>\u003ctextarea id=\"toastText\" required maxlength=\"450\" placeholder=\"To the man of the hour...\">\u003c/textarea>\u003c/div>\u003cbutton class=\"action\" type=\"submit\">SIGN THE LEDGER ↗\u003c/button>\u003c/form>\u003cp class=\"toast-status\" id=\"toastStatus\" aria-live=\"polite\">\u003c/p>\u003cdiv class=\"toast-list\" id=\"toastList\">\u003cdiv class=\"toast-entry\">\u003cspan class=\"mono\">A TOAST · 001\u003c/span>\u003cp>To the stories we can tell, and the ones we probably shouldn't.\u003c/p>\u003cstrong>— THE BEST MAN\u003c/strong>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"wrap block\">\u003cdiv class=\"section-top\">\u003cspan class=\"mono smalltag\">04 / THROUGH THE YEARS\u003c/span>\u003cspan class=\"mono\">A FEW GOOD MOMENTS\u003c/span>\u003c/div>\u003ch2 class=\"cond\">THE GOOD\u003cbr>OLD DAYS.\u003c/h2>\u003cp style=\"font-size:14px;line-height:1.8;max-width:630px\">A few photographs of the man we know. Replace these with your own favourites—school days, road trips, or the memories only the crew understands.\u003c/p>\u003cdiv class=\"photos\">\u003cimg data-photo=\"memory1\" alt=\"Memory photograph one\" src=\"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=700&q=80\">\u003cimg data-photo=\"memory2\" alt=\"Memory photograph two\" src=\"https://images.unsplash.com/photo-1500534623283-312aade485b7?w=700&q=80\">\u003cimg data-photo=\"memory3\" alt=\"Memory photograph three\" src=\"https://images.unsplash.com/photo-1517457373958-b7bdd4587205?w=700&q=80\">\u003c/div>\u003c/section>\u003csection class=\"rsvp\" id=\"rsvp\">\u003cdiv class=\"wrap rsvp-inner\">\u003cdiv>\u003cspan class=\"mono smalltag\">05 / THE ROLL CALL\u003c/span>\u003ch2 class=\"cond\">COUNT\u003cbr>ME IN.\u003c/h2>\u003cp style=\"font-size:14px;line-height:1.9;max-width:390px\">A small gathering deserves a proper headcount. Let the organiser know whether you'll be there.\u003c/p>\u003cp class=\"mono\" data-text=\"rsvpNote\">PLEASE RESPOND BY 15 NOVEMBER\u003c/p>\u003c/div>\u003cform id=\"rsvpForm\">\u003cdiv class=\"field\">\u003clabel for=\"guest\">FULL NAME\u003c/label>\u003cinput id=\"guest\" required maxlength=\"80\" placeholder=\"Your name\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"attendance\">ATTENDANCE\u003c/label>\u003cselect id=\"attendance\">\u003coption value=\"yes\">I'll be there\u003c/option>\u003coption value=\"no\">Can't make it\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"note\">MESSAGE FOR THE ORGANISER (OPTIONAL)\u003c/label>\u003ctextarea id=\"note\" rows=\"3\" maxlength=\"350\" placeholder=\"Anything we should know?\">\u003c/textarea>\u003c/div>\u003cbutton type=\"submit\" class=\"action\">SEND MY RESPONSE ↗\u003c/button>\u003cp class=\"toast-status\" id=\"rsvpStatus\" aria-live=\"polite\">\u003c/p>\u003c/form>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"foot mono\">THE BROTHERHOOD · A VRAXISRSVP INVITATION\u003c/footer>\u003caside class=\"drawer\" id=\"drawer\" aria-label=\"Template personalisation\">\u003cdiv class=\"drawer-head\">\u003cstrong class=\"cond\" style=\"font-size:28px\">CUSTOMISE THE BROTHERHOOD\u003c/strong>\u003cbutton type=\"button\" id=\"closeEdit\">✕\u003c/button>\u003c/div>\u003cp class=\"hint\">This template has its own fields. No forced multi-day itinerary or packing list. Edits and photos are preview-only until connected to the publishing system.\u003c/p>\u003ch3>THE GROOM & THE STORY\u003c/h3>\u003cdiv id=\"editFields\">\u003c/div>\u003ch3>YOUR PHOTOGRAPHS\u003c/h3>\u003cdiv id=\"photoFields\">\u003c/div>\u003cbutton type=\"button\" class=\"action\" id=\"resetBtn\" style=\"margin:24px 0\">RESET TEXT\u003c/button>\u003c/aside>\u003cscript>\n(()=>{'use strict';const $=s=>document.querySelector(s);const all=s=>[...document.querySelectorAll(s)];const fields=[['groom','Groom name'],['tagline','Opening line'],['tribute','Tribute to the groom'],['quote','Best man’s note'],['organiser','Best man / organiser'],['date','Date (display text)'],['dateNote','Date detail'],['time','Meeting time'],['timeNote','Time detail'],['venue','Venue'],['address','Address'],['extra','Additional details / dress code'],['rsvpNote','RSVP deadline']];const defaults={};fields.forEach(([k])=>defaults[k]=$(`[data-text=\"${k}\"]`)?.textContent||'');const box=$('#editFields');fields.forEach(([k,label])=>{const outer=document.createElement('div');outer.className='field';const lab=document.createElement('label');lab.textContent=label;const el=['tribute','quote','extra','tagline'].includes(k)?document.createElement('textarea'):document.createElement('input');el.value=defaults[k];el.addEventListener('input',()=>{all(`[data-text=\"${k}\"]`).forEach(node=>node.textContent=el.value);if(k==='address')$('#directions').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(el.value)});outer.append(lab,el);box.append(outer)});const photoBox=$('#photoFields');['hero','memory1','memory2','memory3'].forEach(k=>{const outer=document.createElement('div');outer.className='field';const lab=document.createElement('label');lab.textContent=k==='hero'?'Groom portrait':k.replace('memory','Memory photo ');const input=document.createElement('input');input.type='file';input.accept='image/*';let lastUrl;input.addEventListener('change',()=>{const file=input.files?.[0];if(!file)return;if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(file);$(`[data-photo=\"${k}\"]`).src=lastUrl});outer.append(lab,input);photoBox.append(outer)});$('#editBtn').onclick=()=>$('#drawer').classList.add('open');$('#closeEdit').onclick=()=>$('#drawer').classList.remove('open');$('#resetBtn').onclick=()=>{box.querySelectorAll('input,textarea').forEach((el,i)=>{el.value=defaults[fields[i][0]];all(`[data-text=\"${fields[i][0]}\"]`).forEach(n=>n.textContent=el.value)})};let kind='Toast',count=1;all('[data-kind]').forEach(btn=>btn.onclick=()=>{kind=btn.dataset.kind;all('[data-kind]').forEach(b=>b.classList.toggle('active',b===btn))});$('#toastForm').addEventListener('submit',e=>{e.preventDefault();const name=$('#toastName').value.trim(),words=$('#toastText').value.trim();if(!name||!words)return;count++;const item=document.createElement('div');item.className='toast-entry';const tag=document.createElement('span');tag.className='mono';tag.textContent=kind.toUpperCase()+' · '+String(count).padStart(3,'0');const p=document.createElement('p');p.textContent=words;const by=document.createElement('strong');by.textContent='— '+name.toUpperCase();item.append(tag,p,by);$('#toastList').prepend(item);$('#toastText').value='';$('#toastStatus').textContent='Added to this preview. Not yet saved online.'});$('#rsvpForm').addEventListener('submit',e=>{e.preventDefault();$('#rsvpStatus').textContent='Response previewed. Publishing/backend connection is required to send it to the organiser.'});})();\n\u003c/script>\u003cstyle id=\"vraxis-opening-style\">#vraxisOpening{position:fixed;inset:0;z-index:2147483640;background:#171c19;color:#e8dfcb;display:grid;place-items:center;text-align:center;padding:32px 20px;transition:opacity .85s ease,visibility .85s ease}#vraxisOpening.dismissed{opacity:0;visibility:hidden;pointer-events:none}#vraxisOpening .opening-inner{max-width:680px;animation:openingRise 1s ease both}#vraxisOpening .opening-mark{font:600 11px/1.5 Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase}#vraxisOpening h2{font:normal clamp(46px,9vw,94px)/1.04 Georgia,serif;letter-spacing:-.055em;margin:36px 0 22px;color:inherit}#vraxisOpening .opening-rule{width:54px;height:1px;background:currentColor;margin:24px auto;opacity:.6}#vraxisOpening .opening-sub{font:12px/1.7 Arial,sans-serif;letter-spacing:.22em;margin:0 0 42px}#vraxisOpening button{border:1px solid currentColor;background:transparent;color:inherit;min-height:54px;padding:14px 28px;font:700 11px Arial,sans-serif;letter-
