"index.html">vraxisRSVP</a><a class="cta" href="personalise.html?template=015">Use This Template ↗</a></header><div class="preview-info"><a href="catalogue.html">← Collection</a><b>The Brotherhood</b><span>Bachelor Party · Signature</span><span class="price">$15.99</span></div><iframe id="invitation" title="The Brotherhood interactive invitation" allow="fullscreen"></iframe><script>const TEMPLATE="\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#20251e\">\u003ctitle>The Brotherhood \u2014 VraxisRSVP 015\u003c/title>\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\u003clink href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\u003clink rel=\"stylesheet\" href=\"assets/template-code/06c04b1845255df2515a7317.css\">\u003cscript src=\"assets/static-media.js?v=1\">\u003c/script>\u003c/head>\u003cbody>\u003cheader class=\"top\">\u003cstrong>THE BROTHERHOOD \u003cspan style=\"color:#a99b7b\">/ 015\u003c/span>\u003c/strong>\u003cbutton type=\"button\" id=\"editBtn\" class=\"mono\">CUSTOMISE \u2197\u003c/button>\u003c/header>\u003cmain>\u003csection class=\"hero\" id=\"home\">\u003cdiv class=\"hero-inner\">\u003cdiv class=\"hero-copy\">\u003cdiv class=\"hero-kicker mono\">A PRIVATE INVITATION \u00b7 GENTLEMEN ONLY\u003c/div>\u003cdiv>\u003ch1 class=\"cond\">THE\u003cbr>BROTHER\u003cbr>HOOD.\u003c/h1>\u003cp class=\"name\">A proper send-off for \u003cem data-text=\"groom\">Daniel\u003c/em>.\u003c/p>\u003c/div>\u003cdiv class=\"hero-bottom\">\u003cp data-text=\"tagline\">Good friends. Old stories. One night worth remembering.\u003c/p>\u003cdiv class=\"seal\">THE\u003cbr>FINAL\u003cbr>SEND-OFF\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"hero-image\">\u003cimg data-photo=\"hero\" src=\"assets/media/a14ebc15d7fed1679fd8841f-960.webp\" alt=\"Classic gentleman's portrait\" srcset=\"assets/media/1e08745e0df1f6265002b270-320.webp 320w, assets/media/33068888e47e177b4ec2b0a4-640.webp 640w, assets/media/a14ebc15d7fed1679fd8841f-960.webp 960w, assets/media/b1a278011ef202007701313c-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\u003cspan class=\"caption mono\">THE MAN OF THE HOUR / \u003cspan data-text=\"groom\">DANIEL\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"wrap intro\">\u003cdiv>\u003cspan class=\"mono smalltag\">01 / THE OCCASION\u003c/span>\u003c/div>\u003cdiv>\u003ch2 class=\"cond\">HERE'S TO\u003cbr>THE MAN.\u003c/h2>\u003cp data-text=\"tribute\">Before Daniel starts his next chapter, we're bringing together the men who've been part of the story so far. No fuss. No speeches required. Just good company and a proper send-off.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"quote\">\u003cdiv class=\"wrap\">\u003cspan class=\"mono smalltag\">A NOTE FROM THE BEST MAN\u003c/span>\u003cblockquote data-text=\"quote\">\u201cWe've known him through every questionable haircut and every brilliant decision. This one's for Daniel.\u201d\u003c/blockquote>\u003cspan class=\"mono\" data-text=\"organiser\">\u2014 Michael, Best Man\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wrap details\" id=\"details\">\u003cdiv class=\"section-top\">\u003cspan class=\"mono smalltag\">02 / THE ARRANGEMENTS\u003c/span>\u003cspan class=\"mono\">KEEP THIS BETWEEN US\u003c/span>\u003c/div>\u003cdiv class=\"details-grid\">\u003cdiv class=\"detail\">\u003cspan class=\"mono\">THE DATE\u003c/span>\u003cb data-text=\"date\">SATURDAY\u003cbr>21 NOVEMBER\u003c/b>\u003cp data-text=\"dateNote\">2026 \u00b7 Save the date\u003c/p>\u003c/div>\u003cdiv class=\"detail\">\u003cspan class=\"mono\">THE HOUR\u003c/span>\u003cb data-text=\"time\">18:00\u003c/b>\u003cp data-text=\"timeNote\">Arrive on time. The first round waits for no one.\u003c/p>\u003c/div>\u003cdiv class=\"detail\">\u003cspan class=\"mono\">THE PLACE\u003c/span>\u003cb data-text=\"venue\">THE OLD\u003cbr>FOUNDRY\u003c/b>\u003cp data-text=\"address\">14 Foundry Road, Johannesburg\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"buttons\">\u003ca class=\"action\" id=\"directions\" href=\"https://www.google.com/maps/search/?api=1&query=Johannesburg\" target=\"_blank\" rel=\"noopener\">GET DIRECTIONS \u2197\u003c/a>\u003ca class=\"action secondary\" href=\"#rsvp\">CONFIRM YOUR PLACE \u2193\u003c/a>\u003c/div>\u003cp style=\"margin-top:26px;font-size:13px;line-height:1.9;max-width:700px\" data-text=\"extra\">Dress code: smart casual. If there's anything else you need to know, the best man will be in touch.\u003c/p>\u003c/section>\u003csection class=\"dark block\" id=\"ledger\">\u003cdiv class=\"wrap toast-layout\">\u003cdiv>\u003cspan class=\"mono\" style=\"color:#b7a37d\">03 / THE BROTHERHOOD LEDGER\u003c/span>\u003ch2 class=\"cond\">LEAVE\u003cbr>YOUR\u003cbr>MARK.\u003c/h2>\u003cp>Every groom has a few stories that deserve to be remembered. Leave a toast, an old memory, or a piece of advice. We'll collect the best ones for the man himself.\u003c/p>\u003cp class=\"mono\" style=\"color:#a89f88\">NO PUBLIC FEED \u00b7 PREVIEW ENTRIES ONLY\u003c/p>\u003c/div>\u003cdiv class=\"toast-card\">\u003ch3>THE BOOK OF WORDS\u003c/h3>\u003cdiv class=\"tabs\" role=\"group\" aria-label=\"Message type\">\u003cbutton class=\"active\" type=\"button\" data-kind=\"Toast\">A TOAST\u003c/button>\u003cbutton type=\"button\" data-kind=\"Memory\">A MEMORY\u003c/button>\u003cbutton type=\"button\" data-kind=\"Advice\">SOME ADVICE\u003c/button>\u003c/div>\u003cform id=\"toastForm\">\u003cdiv class=\"field\">\u003clabel for=\"toastName\">YOUR NAME\u003c/label>\u003cinput id=\"toastName\" required maxlength=\"60\" placeholder=\"Your name\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"toastText\">YOUR WORDS\u003c/label>\u003ctextarea id=\"toastText\" required maxlength=\"450\" placeholder=\"To the man of the hour...\">\u003c/textarea>\u003c/div>\u003cbutton class=\"action\" type=\"submit\">SIGN THE LEDGER \u2197\u003c/button>\u003c/form>\u003cp class=\"toast-status\" id=\"toastStatus\" aria-live=\"polite\">\u003c/p>\u003cdiv class=\"toast-list\" id=\"toastList\">\u003cdiv class=\"toast-entry\">\u003cspan class=\"mono\">A TOAST \u00b7 001\u003c/span>\u003cp>To the stories we can tell, and the ones we probably shouldn't.\u003c/p>\u003cstrong>\u2014 THE BEST MAN\u003c/strong>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"wrap block\">\u003cdiv class=\"section-top\">\u003cspan class=\"mono smalltag\">04 / THROUGH THE YEARS\u003c/span>\u003cspan class=\"mono\">A FEW GOOD MOMENTS\u003c/span>\u003c/div>\u003ch2 class=\"cond\">THE GOOD\u003cbr>OLD DAYS.\u003c/h2>\u003cp style=\"font-size:14px;line-height:1.8;max-width:630px\">A few photographs of the man we know. Replace these with your own favourites\u2014school days, road trips, or the memories only the crew understands.\u003c/p>\u003cdiv class=\"photos\">\u003cimg data-photo=\"memory1\" alt=\"Memory photograph one\" src=\"assets/media/1f2a281cf6625ab7e6343a17-960.webp\" srcset=\"assets/media/34697a04d266a3eea7714cbe-320.webp 320w, assets/media/a69d6ca877197b90b2b9ab78-640.webp 640w, assets/media/1f2a281cf6625ab7e6343a17-960.webp 960w, assets/media/7198e54f4c138eab005dd69f-1440.webp 1439w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\" loading=\"lazy\">\u003cimg data-photo=\"memory2\" alt=\"Memory photograph two\" src=\"assets/media/eb5a41801ce1fdf029a7c54e-960.webp\" srcset=\"assets/media/2f05923816cda9faad43f33e-320.webp 319w, assets/media/30fd91d825e3dddacc73c6f7-640.webp 640w, assets/media/eb5a41801ce1fdf029a7c54e-960.webp 960w, assets/media/d869655248dc18e511428f26-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\" loading=\"lazy\">\u003cimg data-photo=\"memory3\" alt=\"Memory photograph three\" src=\"assets/media/b46dda8a53ec7a1417a4ca00-960.webp\" srcset=\"assets/media/8234e4a445152145dcc8e9c0-320.webp 320w, assets/media/b8adff5b86a88c7920b069e9-640.webp 639w, assets/media/b46dda8a53ec7a1417a4ca00-960.webp 960w, assets/media/41ea7d333df5750f53accec4-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\" loading=\"lazy\">\u003c/div>\u003c/section>\u003csection class=\"rsvp\" id=\"rsvp\">\u003cdiv class=\"wrap rsvp-inner\">\u003cdiv>\u003cspan class=\"mono smalltag\">05 / THE ROLL CALL\u003c/span>\u003ch2 class=\"cond\">COUNT\u003cbr>ME IN.\u003c/h2>\u003cp style=\"font-size:14px;line-height:1.9;max-width:390px\">A small gathering deserves a proper headcount. Let the organiser know whether you'll be there.\u003c/p>\u003cp class=\"mono\" data-text=\"rsvpNote\">PLEASE RESPOND BY 15 NOVEMBER\u003c/p>\u003c/div>\u003cform id=\"rsvpForm\">\u003cdiv class=\"field\">\u003clabel for=\"guest\">FULL NAME\u003c/label>\u003cinput id=\"guest\" required maxlength=\"80\" placeholder=\"Your name\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"attendance\">ATTENDANCE\u003c/label>\u003cselect id=\"attendance\">\u003coption value=\"yes\">I'll be there\u003c/option>\u003coption value=\"no\">Can't make it\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"note\">MESSAGE FOR THE ORGANISER (OPTIONAL)\u003c/label>\u003ctextarea id=\"note\" rows=\"3\" maxlength=\"350\" placeholder=\"Anything we should know?\">\u003c/textarea>\u003c/div>\u003cbutton type=\"submit\" class=\"action\">SEND MY RESPONSE \u2197\u003c/button>\u003cp class=\"toast-status\" id=\"rsvpStatus\" aria-live=\"polite\">\u003c/p>\u003c/form>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"foot mono\">THE BROTHERHOOD \u00b7 A VRAXISRSVP INVITATION\u003c/footer>\u003caside class=\"drawer\" id=\"drawer\" aria-label=\"Template personalisation\">\u003cdiv class=\"drawer-head\">\u003cstrong class=\"cond\" style=\"font-size:28px\">CUSTOMISE THE BROTHERHOOD\u003c/strong>\u003cbutton type=\"button\" id=\"closeEdit\">\u2715\u003c/button>\u003c/div>\u003cp class=\"hint\">This template has its own fields. No forced multi-day itinerary or packing list. Edits and photos are preview-only until connected to the publishing system.\u003c/p>\u003ch3>THE GROOM & THE STORY\u003c/h3>\u003cdiv id=\"editFields\">\u003c/div>\u003ch3>YOUR PHOTOGRAPHS\u003c/h3>\u003cdiv id=\"photoFields\">\u003c/div>\u003cbutton type=\"button\" class=\"action\" id=\"resetBtn\" style=\"margin:24px 0\">RESET TEXT\u003c/button>\u003c/aside>\u003cscript src=\"assets/template-code/ea6ec901f663813b4ca29cf9.js\">\u003c/script>\u003c/body>\u003c/html>";const frame=document.getElementById("invitation");frame.srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/template-image-overrides.js?v=zero-waste1" defer></script><script src="assets/templates.js?v=zero-waste1"></script><script src="assets/design-finishing.js?v=20261115b"></script><script src="assets/template-polish.js?v=zero-waste1"></script></body></html>
