-light b\"><\/div><div class=\"bri-grain\"><\/div><div class=\"bri-flash\" id=\"briFlash\"><\/div><div class=\"bri-film\"><\/div><div class=\"bri-top\"><b>THE GIRLS' ISSUE.<\/b><button class=\"bri-skip\" id=\"briSkip\" type=\"button\">Skip intro \u2197<\/button><\/div><div class=\"bri-camera\">COVER SHOOT / LIVE<\/div><div class=\"bri-stage\"><div class=\"bri-mag\" id=\"briMag\" role=\"button\" tabindex=\"0\" aria-label=\"Interact with the magazine\"><div class=\"bri-inside\"><span class=\"bri-kicker\">AN EXCLUSIVE INVITATION<\/span><h2>Before she says<br><i>\u201cI do\u201d...<\/i><\/h2><img class=\"bri-inner-photo\" id=\"briInsidePhoto\" src=\"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=1100&amp;q=85\" alt=\"Bride portrait\"><p>...we're celebrating the girl who means everything.<\/p><span class=\"bri-kicker\">TURN THE PAGE \u00b7 JOIN THE CELEBRATION<\/span><\/div><div class=\"bri-cover\"><img id=\"briCoverPhoto\" src=\"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=1100&amp;q=85\" alt=\"Cover girl portrait\"><div class=\"bri-title\">THE <span>BRIDE<\/span> EDIT<\/div><div class=\"bri-coverline\"><strong id=\"briBrideName\">SOPHIA<br>THE MOMENT.<\/strong><small>BRIDAL SHOWER SPECIAL \u00b7 001<\/small><\/div><\/div><\/div><\/div><div class=\"bri-step\"><p class=\"bri-instruction\" id=\"briInstruction\">A cover star deserves her moment.<\/p><button class=\"bri-action\" id=\"briAction\" type=\"button\">START THE COVER SHOOT \u2197<\/button><\/div><div class=\"bri-counter\" id=\"briCounter\">01 / 03<\/div><\/div><main><div class=\"wrap hero\"><div class=\"issue tiny\"><span>Bridal Shower Special<\/span><span>Issue No. 001 \u00b7 One Very Loved Bride<\/span><\/div><h1 class=\"mast\">THE <span>BRIDE<\/span> EDIT<\/h1><div class=\"cover\"><div class=\"coveraside\"><div><span class=\"eyebrow\">Cover Story<\/span><h2>She's the<br>moment.<\/h2><p>Before the vows, there's one afternoon dedicated to our favourite girl.<\/p><\/div><span class=\"sticker\">100%<br>BRIDE<br>ENERGY<\/span><\/div><div class=\"coverphoto\"><img data-img=\"cover\" src=\"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=1100&q=85\" alt=\"Portrait of the bride\"><div class=\"photofoot\" data-text=\"bride\">SOPHIA<\/div><\/div><div class=\"coveraside right\"><div><span class=\"eyebrow\">The Main Event<\/span><h2>One girl.<br>All the love.<\/h2><p>A shower, a toast and a whole lot of memories before she says I do.<\/p><\/div><p class=\"tiny\">Made with love by her favourite people \u2197<\/p><\/div><\/div><\/div><div class=\"marquee\"><div>THE GIRLS ARE GETTING TOGETHER \u2733 FOR THE BRIDE \u2733 ONE MORE REASON TO CELEBRATE \u2733 THE GIRLS ARE GETTING TOGETHER \u2733 FOR THE BRIDE \u2733 ONE MORE REASON TO CELEBRATE \u2733&nbsp;<\/div><\/div>\n<section><div class=\"wrap profile\"><img class=\"reveal\" data-img=\"portrait\" src=\"https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900&q=85\" alt=\"Bride portrait\"><div class=\"reveal\"><span class=\"eyebrow\">01 / The Cover Girl<\/span><h2 class=\"headline\">Meet the<br><em>main character.<\/em><\/h2><p class=\"quote\" data-text=\"tribute\">\u201cShe's the one who shows up, laughs the loudest, and makes every ordinary day a story worth telling.\u201d<\/p><div class=\"fact\"><span>The girl we're celebrating<\/span><strong data-text=\"bride\">Sophia<\/strong><\/div><div class=\"fact\"><span>Official status<\/span><strong>Very loved, soon-to-be married<\/strong><\/div><div class=\"fact\"><span>Her people<\/span><strong>All of us, obviously.<\/strong><\/div><\/div><\/div><\/section>\n<section class=\"quiz\"><div class=\"wrap\"><div class=\"reveal\" style=\"text-align:center\"><span class=\"eyebrow\" style=\"color:#254ba3\">02 / The Bride Files<\/span><h2 class=\"headline\">How well do you<br><em>know her?<\/em><\/h2><p>Three questions. No pressure. Well, maybe a little.<\/p><\/div><div class=\"quizbox reveal\"><div class=\"progress\" id=\"qProgress\">QUESTION 01 OF 03<\/div><div class=\"question\" id=\"qText\"><\/div><div class=\"choices\" id=\"qChoices\"><\/div><p class=\"muted\" id=\"qNote\">Just for fun \u2014 no answers are sent or saved.<\/p><button class=\"pill\" id=\"qRestart\" style=\"display:none;margin-top:18px\">Play again \u21bb<\/button><\/div><\/div><\/section>\n<section><div class=\"wrap\"><div class=\"galleryhead reveal\"><div><span class=\"eyebrow\">03 / The Camera Roll<\/span><h2 class=\"headline\">Proof she's<br><em>iconic.<\/em><\/h2><\/div><p style=\"max-width:280px\">A few of our favourite moments with the girl of the hour. Tap a photo for a closer look.<\/p><\/div><div class=\"contact\"><button class=\"shot reveal\" style=\"--angle:-2deg\" data-photo=\"0\"><img data-img=\"memory1\" src=\"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=650&q=85\" alt=\"Friends together\"><span>01 / THE GIRLS<\/span><\/button><button class=\"shot reveal\" style=\"--angle:2deg\" data-photo=\"1\"><img data-img=\"memory2\" src=\"https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=650&q=85\" alt=\"Celebration\"><span>02 / THE GOOD TIMES<\/span><\/button><button class=\"shot reveal\" style=\"--angle:-1deg\" data-photo=\"2\"><img data-img=\"memory3\" src=\"https://images.unsplash.com/photo-1527529482837-4698179dc6ce?w=650&q=85\" alt=\"Friends at a party\"><span>03 / MORE PLEASE<\/span><\/button><button class=\"shot reveal\" style=\"--angle:3deg\" data-photo=\"3\"><img data-img=\"memory4\" src=\"https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=650&q=85\" alt=\"Party decorations\"><span>04 / FOREVER FAVOURITE<\/span><\/button><\/div><\/div><\/section>\n<section class=\"lore\" id=\"brideLore\"><div class=\"wrap\"><div class=\"section-rule\"><span>03 / The Inside Scoop<\/span><span>For her people, by her people<\/span><\/div><div class=\"lore-top reveal\"><h2 class=\"headline\">The stories<br><em>behind the girl.<\/em><\/h2><p>Everyone knows the bride. Her favourite people know the little things. A few pages from the unofficial, very affectionate guide to <strong data-text=\"bride\">Sophia<\/strong>.<\/p><\/div><div class=\"lore-tabs\" role=\"tablist\" aria-label=\"Bride stories\"><button class=\"lore-tab\" role=\"tab\" aria-selected=\"true\" data-lore=\"0\">THE ORIGIN STORY<\/button><button class=\"lore-tab\" role=\"tab\" aria-selected=\"false\" data-lore=\"1\">THE SIGNATURE MOVE<\/button><button class=\"lore-tab\" role=\"tab\" aria-selected=\"false\" data-lore=\"2\">THE LOVE NOTE<\/button><\/div><div class=\"lore-feature reveal\" aria-live=\"polite\"><div class=\"lore-image\"><img id=\"lorePhoto\" data-img=\"portrait\" src=\"https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900&q=85\" alt=\"A favourite portrait of the bride\"><\/div><div class=\"lore-copy\"><span class=\"lore-counter\" id=\"loreCount\">01 / 03 \u00b7 THE INSIDE SCOOP<\/span><h3 id=\"loreTitle\">It started with her.<\/h3><p id=\"loreBody\">The friend who makes ordinary afternoons feel like something worth remembering. Every group has one. We're lucky ours is her.<\/p><span class=\"tiny\">An unofficial love letter from the girls \u2665<\/span><\/div><\/div><div class=\"pullquote reveal\">The best thing about this bride? She's even better off camera.<\/div><\/div><\/section><section class=\"event\"><div class=\"wrap eventgrid\"><div class=\"reveal\"><span class=\"eyebrow\">04 / You're Invited<\/span><h2 class=\"headline\">Let's shower<br><em data-text=\"bride\">Sophia<\/em><br>with love.<\/h2><p style=\"font-size:19px;line-height:1.6\" data-text=\"invite\">Join us for a gorgeous afternoon of good food, happy tears, stories we probably shouldn't tell, and all the love our girl deserves.<\/p><p class=\"tiny\" style=\"color:var(--yellow);margin-top:35px\">Come hungry. Come happy. Come ready to celebrate.<\/p><\/div><div class=\"reveal\"><div class=\"details\"><div class=\"detail\"><b>When<\/b><div><strong id=\"dateDisplay\">Saturday, 12 December 2026<\/strong><br><span id=\"timeDisplay\">12:00 PM<\/span><\/div><\/div><div class=\"detail\"><b>Where<\/b><div><strong id=\"venueDisplay\">The Glasshouse Caf\u00e9<\/strong><br><span id=\"addressDisplay\">Johannesburg, South Africa<\/span><\/div><\/div><div class=\"detail\"><b>Dress<\/b><div id=\"dressDisplay\">A little colour. A lot of personality.<\/div><\/div><div class=\"detail\"><b>Hosted by<\/b><div id=\"hostDisplay\">Her favourite girls<\/div><\/div><\/div><div class=\"eventactions\"><a id=\"mapLink\" href=\"https://www.google.com/maps/search/?api=1&query=Johannesburg\" target=\"_blank\" rel=\"noopener\">Directions \u2197<\/a><a id=\"calendarLink\" href=\"#\" download=\"bridal-shower.ics\">Add to calendar \u2197<\/a><\/div><\/div><\/div><\/section>\n<section class=\"tear\" id=\"keepsake\"><div class=\"wrap tear-grid\"><div class=\"reveal\"><span class=\"eyebrow\">A little something for your camera roll<\/span><h2 class=\"headline\">Consider this<br><em>your official invite.<\/em><\/h2><p style=\"font-size:18px;line-height:1.7;max-width:450px\">The bride deserves a whole issue. You deserve a little keepsake. Personalise your name and save your invitation card for the day.<\/p><\/div><div class=\"tear-ticket reveal\" id=\"ticket\"><div class=\"section-rule\"><span>THE GIRLS' ISSUE<\/span><span>ADMIT ONE<\/span><\/div><div class=\"tiny\" style=\"color:var(--red);margin-top:28px\">A CELEBRATION FOR<\/div><div class=\"ticket-name\" id=\"ticketBride\">SOPHIA<\/div><div class=\"tiny\">THE BRIDAL SHOWER \u00b7 GIRLS' EDITION<\/div><div class=\"ticket-rule\"><\/div><div class=\"tiny\" id=\"ticketWhen\">SATURDAY, 12 DECEMBER 2026<\/div><div class=\"tiny\" id=\"ticketWhere\" style=\"margin-top:8px\">THE GLASSHOUSE CAF\u00c9<\/div><div class=\"ticket-rule\"><\/div><label for=\"ticketGuest\">THIS INVITE BELONGS TO<input id=\"ticketGuest\" placeholder=\"Your name\" maxlength=\"45\" style=\"margin-top:8px\"><\/label><div class=\"ticket-actions\"><button id=\"saveTicket\" type=\"button\">Save my card \u2193<\/button><button id=\"printTicket\" class=\"secondary\" type=\"button\">Print card \u2197<\/button><\/div><p class=\"ticket-status\" id=\"ticketStatus\" role=\"status\">A keepsake, not an RSVP. Please confirm below.<\/p><\/div><\/div><\/section><section class=\"rsvp\"><div class=\"wrap rsvpgrid\"><div class=\"reveal\"><span class=\"eyebrow\">05 / The Guest List<\/span><h2 class=\"headline\">You coming,<br><em>girl?<\/em><\/h2><p class=\"note\">\u201cIt wouldn't be the same without you. Let's make this one unforgettable.\u201d<\/p><p class=\"muted\">Please RSVP by <span id=\"deadlineDisplay\">1 December 2026<\/span>.<\/p><\/div><form class=\"reveal\" id=\"rsvpForm\"><label>Your name<input required name=\"name\" placeholder=\"First and last name\"><\/label><label>Can you make it?<select name=\"attendance\" required id=\"attendance\"><option value=\"yes\">Yes, wouldn't miss it!<\/option><option value=\"no\">Sending all my love<\/option><\/select><\/label><label id=\"guestsWrap\">Number attending<select name=\"guests\"><option value=\"1\">Just me<\/option><option value=\"2\">2 guests<\/option><option value=\"3\">3 guests<\/option><\/select><\/label><label>Leave a note for the bride<textarea name=\"wish\" placeholder=\"A little love note...\"><\/textarea><\/label><button class=\"cta\" type=\"submit\">Send my RSVP \u2197<\/button><p class=\"muted\">Demo preview only. Responses aren't stored or delivered until the RSVP backend is connected.<\/p><div id=\"rsvpResult\" aria-live=\"polite\"><\/div><\/form><\/div><\/section><\/main><footer class=\"wrap foot\"><span class=\"logo\">The Girls' Issue.<\/span><span class=\"tiny\">Made for <span data-text=\"bride\">Sophia<\/span> \u00b7 Before the vows<\/span><\/footer>\n<div class=\"backdrop\" id=\"backdrop\"><\/div><aside class=\"editor\" id=\"editor\" aria-label=\"Personalisation\"><button class=\"pill close\" id=\"editClose\">Close \u2715<\/button><h2>Make it hers.<\/h2><p class=\"muted\">Edit the invitation in this browser. Changes are local to this preview.<\/p><div id=\"editFields\"><\/div><h3>Replace photographs<\/h3><p class=\"muted\">Choose images from your device. Images are previewed locally and are not uploaded.<\/p><div id=\"photoFields\"><\/div><button class=\"cta\" id=\"resetDemo\" style=\"margin:20px 0\">Reset demo<\/button><\/aside><div class=\"lightbox\" id=\"lightbox\"><button id=\"lightClose\">Close \u2715<\/button><img id=\"lightImg\" alt=\"Selected memory\"><\/div>\n<script>\nconst defaults={bride:'Sophia',tribute:'\u201cShe\u2019s the one who shows up, laughs the loudest, and makes every ordinary day a story worth telling.\u201d',invite:'Join us for a gorgeous afternoon of good food, happy tears, stories we probably shouldn\u2019t tell, and all the love our girl deserves.',date:'2026-12-12',time:'12:00',venue:'The Glasshouse Caf\u00e9',address:'Johannesburg, South Africa',dress:'A little colour. A lot of personality.',host:'Her favourite girls',deadline:'2026-12-01'};let data={...defaults};const prettyDate=v=>{const a=(v||'').split('-').map(Number);return a.length===3&&a.every(Boolean)?new Date(a[0],a[1]-1,a[2]).toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):v};const prettyTime=v=>{let [h,m]=(v||'12:00').split(':').map(Number);return `${h%12||12}:${String(m||0).padStart(2,'0')} ${h>=12?'PM':'AM'}`};function render(){document.querySelectorAll('[data-text]').forEach(el=>{el.textContent=data[el.dataset.text]||''});['date','time','venue','address','dress','host','deadline'].forEach(k=>{const el=document.getElementById(k+'Display');if(el)el.textContent=k==='date'||k==='deadline'?prettyDate(data[k]):k==='time'?prettyTime(data[k]):data[k]});document.getElementById('mapLink').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(data.venue+' '+data.address);let [y,mo,d]=data.date.split('-');let [hh,mm]=data.time.split(':');let start=new Date(Number(y),Number(mo)-1,Number(d),Number(hh),Number(mm));let end=new Date(start.getTime()+3*3600000);const stamp=t=>t.toISOString().replace(/[-:]/g,'').replace(/\\.\\d{3}/,'');let ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//VraxisRSVP//Bridal Edit//EN','BEGIN:VEVENT','DTSTART:'+stamp(start),'DTEND:'+stamp(end),'SUMMARY:'+data.bride+' Bridal Shower','LOCATION:'+data.venue+', '+data.address,'DESCRIPTION:Join us to celebrate the bride!','END:VEVENT','END:VCALENDAR'].join('\\r\\n');let link=document.getElementById('calendarLink');if(link.dataset.blob)URL.revokeObjectURL(link.dataset.blob);link.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));link.dataset.blob=link.href}render();const fields=[['bride','Bride\u2019s name'],['tribute','Tribute to the bride','textarea'],['invite','Invitation message','textarea'],['date','Date','date'],['time','Time','time'],['venue','Venue'],['address','Address'],['dress','Dress code'],['host','Hosted by'],['deadline','RSVP deadline','date']];const editFields=document.getElementById('editFields');fields.forEach(([key,label,type])=>{const wrap=document.createElement('label');wrap.textContent=label;const el=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')el.type=type||'text';el.value=data[key];el.addEventListener('input',()=>{data[key]=el.value;render()});wrap.appendChild(el);editFields.appendChild(wrap)});const photoFields=document.getElementById('photoFields');['cover','portrait','memory1','memory2','memory3','memory4'].forEach(key=>{let label=document.createElement('label');label.textContent=key.replace(/\\d/g,' $&');let input=document.createElement('input');input.type='file';input.accept='image/*';input.addEventListener('change',()=>{const file=input.files?.[0];if(!file)return;if(file.size>12*1024*1024){alert('Choose an image under 12 MB.');return}const url=URL.createObjectURL(file);document.querySelectorAll(`[data-img=\"${key}\"]`).forEach(img=>{if(img.dataset.objectUrl)URL.revokeObjectURL(img.dataset.objectUrl);img.src=url;img.dataset.objectUrl=url})});label.appendChild(input);photoFields.appendChild(label)});const editor=document.getElementById('editor'),backdrop=document.getElementById('backdrop');function toggleEditor(open){editor.classList.toggle('open',open);backdrop.classList.toggle('open',open)}document.getElementById('editOpen').onclick=()=>toggleEditor(true);document.getElementById('editClose').onclick=()=>toggleEditor(false);backdrop.onclick=()=>toggleEditor(false);document.getElementById('resetDemo').onclick=()=>location.reload();document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{document.getElementById('lightImg').src=b.querySelector('img').src;document.getElementById('lightbox').classList.add('open')});document.getElementById('lightClose').onclick=()=>document.getElementById('lightbox').classList.remove('open');document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')e.currentTarget.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape'){toggleEditor(false);document.getElementById('lightbox').classList.remove('open')}});\nconst questions=[{q:'What is her ideal Saturday?',a:['Brunch and a long catch-up','A spontaneous road trip','A cosy night in'],note:'Only her girls know for sure.'},{q:'What would she bring to a deserted island?',a:['Her entire skincare routine','Her best friend','A suitcase of snacks'],note:'We know she would overpack.'},{q:'What makes her happiest?',a:['A room full of her favourite people','A surprise getaway','A really good playlist'],note:'All answers are probably correct.'}];let qi=0;function showQ(){const box=document.getElementById('qChoices');box.innerHTML='';document.getElementById('qProgress').textContent=`QUESTION ${String(qi+1).padStart(2,'0')} OF 03`;document.getElementById('qText').textContent=questions[qi].q;document.getElementById('qNote').textContent=questions[qi].note;questions[qi].a.forEach((answer,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode  friend, sister and extraordinary woman she already is.'};\nconst loreTitles=['It started with her.','Classic bride behaviour.','Before the big day.'];\nlet loreIndex=0;let loreValues={...loreDefaults};\nfunction drawLore(){document.getElementById('loreCount').textContent=String(loreIndex+1).padStart(2,'0')+' / 03 \u00b7 THE INSIDE SCOOP';document.getElementById('loreTitle').textContent=loreTitles[loreIndex];document.getElementById('loreBody').textContent=loreValues['lore'+(loreIndex+1)];document.querySelectorAll('[data-lore]').forEach(b=>b.setAttribute('aria-selected',String(Number(b.dataset.lore)===loreIndex)));}\ndocument.querySelectorAll('[data-lore]').forEach(b=>b.addEventListener('click',()=>{loreIndex=Number(b.dataset.lore);drawLore()}));\nconst editTarget=document.getElementById('editFields');if(editTarget){const heading=document.createElement('h3');heading.textContent='The Inside Scoop \u00b7 stories';editTarget.appendChild(heading);Object.entries(loreDefaults).forEach(([key,val],i)=>{const lab=document.createElement('label');lab.textContent=['Origin story','Signature move','Love note'][i];const area=document.createElement('textarea');area.rows=3;area.value=val;area.addEventListener('input',()=>{loreValues[key]=area.value;drawLore()});lab.appendChild(area);editTarget.appendChild(lab)})}\nfunction updateTicket(){document.getElementById('ticketBride').textContent=(data.bride||'THE BRIDE').toUpperCase();document.getElementById('ticketWhen').textContent=prettyDate(data.date).toUpperCase()+' \u00b7 '+prettyTime(data.time);document.getElementById('ticketWhere').textContent=(data.venue||'VENUE TO FOLLOW').toUpperCase()}\nconst ticketObserver=new MutationObserver(updateTicket);document.querySelectorAll('[data-text=\"bride\"]').forEach(el=>ticketObserver.observe(el,{childList:true}));['dateDisplay','timeDisplay','venueDisplay'].forEach(id=>ticketObserver.observe(document.getElementById(id),{childList:true,subtree:true}));updateTicket();\ndocument.getElementById('saveTicket').addEventListener('click',()=>{const canvas=document.createElement('canvas');canvas.width=900;canvas.height=1250;const c=canvas.getContext('2d');c.fillStyle='#fff7e7';c.fillRect(0,0,900,1250);c.strokeStyle='#23221e';c.lineWidth=8;c.strokeRect(24,24,852,1202);c.fillStyle='#bf292b';c.fillRect(55,55,790,85);c.fillStyle='white';c.font='bold 32px Arial';c.textAlign='center';c.fillText('THE GIRLS\u2019 ISSUE \u00b7 ADMIT ONE',450,111);c.fillStyle='#23221e';c.font='bold 30px Arial';c.fillText('A CELEBRATION FOR',450,255);c.font='bold 90px Georgia';let bride=(data.bride||'THE BRIDE').toUpperCase();while(c.measureText(bride).width>770&&c.font.match(/\\d+/)&&parseInt(c.font)<200){let n=parseInt(c.font);c.font='bold '+(n-4)+'px Georgia';if(n<32)break}c.fillText(bride,450,390);c.font='bold 27px Arial';c.fillText('THE BRIDAL SHOWER',450,465);c.strokeStyle='#9a8e7a';c.setLineDash([12,14]);c.beginPath();c.moveTo(90,525);c.lineTo(810,525);c.stroke();c.setLineDash([]);c.font='bold 28px Arial';c.fillText(prettyDate(data.date).toUpperCase(),450,620);c.fillText(prettyTime(data.time)+' \u00b7 '+(data.venue||'').toUpperCase(),450,685);c.font='22px Arial';c.fillText('INVITED GUEST',450,815);c.font='bold 46px Georgia';let guest=(document.getElementById('ticketGuest').value||'YOU, OBVIOUSLY').trim().slice(0,45);while(c.measureText(guest).width>740){c.font='bold '+(parseInt(c.font.match(/\\d+/)[0])-2)+'px Georgia'}c.fillText(guest,450,885);c.fillStyle='#bf292b';c.font='bold 25px Arial';c.fillText('MADE WITH LOVE FOR HER FAVOURITE PEOPLE \u2665',450,1100);const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='the-girls-issue-invitation.png';a.click();document.getElementById('ticketStatus').textContent='Your keepsake card is ready. Remember to RSVP below.'});\ndocument.getElementById('printTicket').addEventListener('click',()=>{document.getElementById('ticketStatus').textContent='Tip: Save your card first, then print or share the image from your device.'});\n<\/script><script id=\"bri-intro-js\">(()=>{const intro=document.getElementById('briIntro'),action=document.getElementById('briAction'),mag=document.getElementById('briMag'),skip=document.getElementById('briSkip'),flash=document.getElementById('briFlash'),instruction=document.getElementById('briInstruction'),counter=document.getElementById('briCounter');let phase=0,busy=false;document.body.classList.add('bri-locked');function sync(){const photo=document.querySelector('.coverphoto img');if(photo){document.getElementById('briCoverPhoto').src=photo.src;document.getElementById('briInsidePhoto').src=photo.src}const name=document.querySelector('[data-text=\"bride\"]');if(name){const n=name.textContent.trim();document.getElementById('briBrideName').textContent=n.toUpperCase()+' \u00b7 THE MOMENT.'}}sync();function close(){intro.hidden=true;document.body.classList.remove('bri-locked');window.scrollTo(0,0)}function next(){if(busy)return;sync();if(phase===0){busy=true;flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');phase=1;intro.dataset.phase='1';instruction.textContent='The cover is yours. Open the issue.';action.textContent='OPEN HER ISSUE \u2197';counter.textContent='02 / 03';setTimeout(()=>busy=false,850)}else if(phase===1){busy=true;phase=2;intro.dataset.phase='2';instruction.textContent='An entire issue dedicated to her.';action.textContent='ENTER THE GIRLS\u2019 ISSUE \u2197';counter.textContent='03 / 03';setTimeout(()=>busy=false,1550)}else{busy=true;intro.classList.add('bri-zooming');const r=mag.getBoundingClientRect();const z=document.createElement('div');z.className='bri-zoom-surface';Object.assign(z.style,{top:r.top+'px',left:r.left+'px',width:r.width+'px',height:r.height+'px',borderRadius:'2px'});const coverPhoto=document.querySelector('.coverphoto img');const bride=document.querySelector('[data-text=\"bride\"]');const page=document.createElement('div');page.className='bri-zoom-page';page.innerHTML='<div class=\"bri-zoom-label\">
