lay:ital,wght@0,400;0,500;1,400&amp;display=swap\" rel=\"stylesheet\"/>\u003clink rel=\"stylesheet\" href=\"assets/template-code/a5fe3e02a36792efd396f8c6.css\">\u003cscript src=\"assets/static-media.js?v=1\">\u003c/script>\u003c/head>\u003cbody>\u003cdiv class=\"shell\">\u003cheader class=\"top\">\u003cdiv class=\"brand\">VRAXIS\u003cspan style=\"color:#a77d7c\">RSVP\u003c/span>\u003c/div>\u003csmall>THE BRIDAL EDIT \u00b7 ISSUE 012\u003c/small>\u003cbutton onclick=\"openEditor()\">Personalise \u2197\u003c/button>\u003c/header>\u003cmain>\u003csection class=\"hero\">\u003cdiv class=\"hero-copy\">\u003cdiv>\u003cdiv class=\"eyebrow\">A celebration of the bride-to-be \u00b7 Vol. 01\u003c/div>\u003ch1 class=\"display\">The\u003cbr/>\u003cem class=\"ital\">bride\u003c/em>\u003cbr/>edit.\u003c/h1>\u003cp class=\"hero-intro\">A beautiful afternoon for \u003cstrong data-text=\"bride\">Isabella\u003c/strong>, before the best chapter begins.\u003c/p>\u003c/div>\u003cdiv class=\"hero-foot\">\u003cspan>YOU'RE INVITED\u003cbr/>TO HER BRIDAL SHOWER\u003c/span>\u003cspan>SCROLL TO DISCOVER \u2193\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"hero-img\">\u003cimg alt=\"Isabella, the bride-to-be\" data-img=\"hero\" src=\"assets/media/8cc169b3846373e1a5bd7d6f-960.webp\"/ srcset=\"assets/media/c1b6f3be1eec5ced85221307-320.webp 320w, assets/media/678c2aa3c19af874aae89881-640.webp 640w, assets/media/8cc169b3846373e1a5bd7d6f-960.webp 960w, assets/media/9aed63671296a55cf8891786-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\u003cdiv class=\"vertical\">An afternoon for Isabella\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"index\">\u003cspan>01 / The Bride\u003c/span>\u003cspan>02 / The Memories\u003c/span>\u003cspan>03 / The Celebration\u003c/span>\u003c/div>\u003csection class=\"section tribute\" id=\"bride\">\u003cdiv class=\"tribute-layout\">\u003cdiv class=\"tribute-image reveal\">\u003cimg alt=\"Fashion editorial portrait for the bridal shower\" data-img=\"tribute\" loading=\"lazy\" src=\"assets/media/01554e73c448a0de6f1f8918-960.webp\"/ srcset=\"assets/media/801f9130b24a9e26957fc4df-320.webp 320w, assets/media/d03080fd56460da250b7ea75-640.webp 640w, assets/media/01554e73c448a0de6f1f8918-960.webp 960w, assets/media/2500099585d447404cd39997-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\u003cdiv class=\"stamp\">To the\u003cbr/>future\u003cbr/>Mrs.\u003c/div>\u003c/div>\u003cdiv class=\"reveal\">\u003cdiv class=\"eyebrow\">A little love letter \u00b7 01\u003c/div>\u003ch2 class=\"serif\">Here's to \u003cem>her.\u003c/em>\u003c/h2>\u003cp data-text=\"tribute\">The one who turns ordinary days into the best memories. The friend who shows up, loves fiercely, and somehow makes every room feel a little warmer. Before she says \u201cI do,\u201d we're gathering her favourite people to celebrate every wonderful thing that makes her, her.\u003c/p>\u003cdiv class=\"signature\" data-text=\"signoff\">With love, her favourite people \u2661\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section gallery\" id=\"memories\">\u003cdiv class=\"section-head reveal\">\u003cdiv>\u003cdiv class=\"eyebrow\">The moments that made her \u00b7 02\u003c/div>\u003ch2 class=\"display\">A few favourite\u003cbr/>\u003cspan class=\"ital\">memories.\u003c/span>\u003c/h2>\u003c/div>\u003cp class=\"aside\">Three little snapshots of a life full of love. Tap any photograph to take a closer look.\u003c/p>\u003c/div>\u003cdiv class=\"gallery-grid\">\u003cfigure class=\"reveal\" onclick=\"viewPhoto(0)\">\u003cimg alt=\"Friends celebrating the bride-to-be\" data-img=\"memory1\" loading=\"lazy\" src=\"assets/media/1f2a281cf6625ab7e6343a17-960.webp\"/ srcset=\"assets/media/34697a04d266a3eea7714cbe-320.webp 320w, assets/media/a69d6ca877197b90b2b9ab78-640.webp 640w, assets/media/1f2a281cf6625ab7e6343a17-960.webp 960w, assets/media/7198e54f4c138eab005dd69f-1440.webp 1439w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\u003cfigcaption>\u003cspan data-text=\"caption1\">The beginning of everything\u003c/span>\u003cspan>01\u003c/span>\u003c/figcaption>\u003c/figure>\u003cfigure class=\"reveal\" onclick=\"viewPhoto(1)\">\u003cimg alt=\"A fashion editorial portrait\" data-img=\"memory2\" loading=\"lazy\" src=\"assets/media/01554e73c448a0de6f1f8918-960.webp\"/ srcset=\"assets/media/801f9130b24a9e26957fc4df-320.webp 320w, assets/media/d03080fd56460da250b7ea75-640.webp 640w, assets/media/01554e73c448a0de6f1f8918-960.webp 960w, assets/media/2500099585d447404cd39997-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\u003cfigcaption>\u003cspan data-text=\"caption2\">Our favourite days\u003c/span>\u003cspan>02\u003c/span>\u003c/figcaption>\u003c/figure>\u003cfigure class=\"reveal\" onclick=\"viewPhoto(2)\">\u003cimg alt=\"Friends celebrating together\" data-img=\"memory3\" loading=\"lazy\" src=\"assets/media/cb63928edee31e3bfc3abcd0-960.webp\"/ srcset=\"assets/media/c8d1880048f8b95a789c1bed-320.webp 319w, assets/media/63490ff8972ffae09cc07b77-640.webp 640w, assets/media/cb63928edee31e3bfc3abcd0-960.webp 960w, assets/media/7befd06fd6087b3283a0aa6a-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\u003cfigcaption>\u003cspan data-text=\"caption3\">More to come\u003c/span>\u003cspan>03\u003c/span>\u003c/figcaption>\u003c/figure>\u003c/div>\u003c/section>\u003csection class=\"invitation\" id=\"details\">\u003cdiv class=\"eyebrow reveal\">The official invitation \u00b7 03\u003c/div>\u003ch2 class=\"serif reveal\">Let's shower \u003cem data-text=\"bride\">Isabella\u003c/em>\u003cbr/>with \u003cem>love.\u003c/em>\u003c/h2>\u003cp class=\"invite-note reveal\" data-text=\"invitation\">Before the wedding bells, there's one afternoon reserved for laughter, heartfelt toasts, beautiful memories and the people who love her most. We would be delighted to celebrate with you.\u003c/p>\u003cdiv class=\"details reveal\">\u003cdiv class=\"detail\">\u003cdiv class=\"eyebrow\">When\u003c/div>\u003cstrong data-text=\"dateDisplay\">Saturday, 21 March 2027\u003c/strong>\u003cspan data-text=\"time\">12:00 PM \u2014 4:00 PM\u003c/span>\u003c/div>\u003cdiv class=\"detail\">\u003cdiv class=\"eyebrow\">Where\u003c/div>\u003cstrong data-text=\"venue\">The Conservatory\u003c/strong>\u003cspan data-text=\"address\">Johannesburg, South Africa\u003c/span>\u003c/div>\u003cdiv class=\"detail\">\u003cdiv class=\"eyebrow\">Dress code\u003c/div>\u003cstrong data-text=\"dress\">Garden Chic\u003c/strong>\u003cspan data-text=\"dressNote\">Soft colours and your Sunday best\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"invite-actions\">\u003ca href=\"https://maps.google.com/?q=Johannesburg%20South%20Africa\" id=\"maps\" rel=\"noopener\" target=\"_blank\">Directions \u2197\u003c/a>\u003ca href=\"#rsvp\">RSVP for the afternoon \u2197\u003c/a>\u003ca href=\"#\" id=\"calendar\">Add to calendar \u2193\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"dress\">\u003cdiv class=\"dress-photo\">\u003cimg alt=\"Celebration table setting\" data-img=\"dress\" loading=\"lazy\" src=\"assets/media/47041c11a10776d19a04dc94-960.webp\"/ srcset=\"assets/media/40c842c1874fcbc83a6d879b-320.webp 320w, assets/media/0f47c9dcaf645e9ecd3aefea-640.webp 639w, assets/media/47041c11a10776d19a04dc94-960.webp 960w, assets/media/58abd9787d3cd3e791bfb5d3-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\u003c/div>\u003cdiv class=\"dress-content\">\u003cdiv class=\"eyebrow\">A note on the afternoon\u003c/div>\u003ch2 class=\"display\">Come\u003cbr/>\u003cspan class=\"ital\">as you\u003c/span>\u003cbr/>are.\u003c/h2>\u003cp>Wear something you feel beautiful in. Bring a story about our bride, your biggest smile, and an appetite for a lovely afternoon together.\u003c/p>\u003cdiv class=\"eyebrow\" style=\"margin-top:24px\">Our little colour story\u003c/div>\u003cdiv class=\"swatches\">\u003cspan style=\"background:#f2e9dd\">\u003c/span>\u003cspan style=\"background:#b89b89\">\u003c/span>\u003cspan style=\"background:#c7b9a3\">\u003c/span>\u003cspan style=\"background:#7b4d50\">\u003c/span>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"rsvp\" id=\"rsvp\">\u003cdiv class=\"reveal\">\u003cdiv class=\"eyebrow\">A seat saved just for you \u00b7 04\u003c/div>\u003ch2 class=\"display\">Will you\u003cbr/>\u003cspan class=\"ital\">join us?\u003c/span>\u003c/h2>\u003cp>We'd love to celebrate with you. Kindly let us know if you'll be joining \u003cspan data-text=\"bride\">Isabella\u003c/span>'s bridal shower.\u003c/p>\u003cp class=\"eyebrow\" style=\"color:var(--wine)\">Kindly reply by \u003cspan data-text=\"deadline\">10 March 2027\u003c/span>\u003c/p>\u003c/div>\u003cform class=\"form reveal\" id=\"rsvpForm\">\u003cdiv class=\"field\">\u003clabel for=\"guest\">Your full name\u003c/label>\u003cinput autocomplete=\"name\" id=\"guest\" placeholder=\"Your name\" required=\"\"/>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"attendance\">Will you attend?\u003c/label>\u003cselect id=\"attendance\" required=\"\">\u003coption value=\"\">Select your response\u003c/option>\u003coption value=\"yes\">Joyfully accepts\u003c/option>\u003coption value=\"no\">Regretfully declines\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\" hidden=\"\" id=\"guestCountWrap\">\u003clabel for=\"count\">Number of guests (including you)\u003c/label>\u003cselect id=\"count\">\u003coption>1\u003c/option>\u003coption>2\u003c/option>\u003coption>3\u003c/option>\u003coption>4\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"note\">A note for the bride (optional)\u003c/label>\u003ctextarea id=\"note\" placeholder=\"A little love for the bride-to-be\u2026\">\u003c/textarea>\u003c/div>\u003cbutton class=\"submit\" type=\"submit\">Send my response \u2197\u003c/button>\u003cdiv aria-live=\"polite\" id=\"confirmation\">\u003c/div>\u003csmall style=\"color:var(--muted);line-height:1.7\">Preview mode: responses are not saved or sent. Online RSVP will be enabled when connected to VraxisRSVP.\u003c/small>\u003c/form>\u003c/section>\u003c/main>\u003cfooter class=\"footer\">\u003cspan>Made with love, for \u003cspan data-text=\"bride\">Isabella\u003c/span>.\u003c/span>\u003cspan>THE BRIDAL EDIT \u00b7 VRAXISRSVP\u003c/span>\u003c/footer>\u003c/div>\u003cbutton class=\"editor-toggle\" onclick=\"openEditor()\">\u270e Personalise\u003c/button>\u003caside aria-label=\"Invitation personalisation\" class=\"editor\" id=\"editor\">\u003cdiv class=\"editor-head\">\u003ch2>Make it hers.\u003c/h2>\u003cbutton aria-label=\"Close editor\" onclick=\"closeEditor()\">\u00d7\u003c/button>\u003c/div>\u003cp style=\"font-size:13px;line-height:1.8;color:var(--muted)\">Update the bride's story, celebration details and photographs. Changes appear instantly in this preview.\u003c/p>\u003cdiv class=\"editgroup\">\u003ch3>01 \u00b7 The bride\u003c/h3>\u003clabel>Bride's name\u003cinput data-edit=\"bride\" value=\"Isabella\"/>\u003c/label>\u003clabel>Tribute\u003ctextarea data-edit=\"tribute\">The one who turns ordinary days into the best memories. The friend who shows up, loves fiercely, and somehow makes every room feel a little warmer. Before she says \u201cI do,\u201d we're gathering her favourite people to celebrate every wonderful thing that makes her, her.\u003c/textarea>\u003c/label>\u003clabel>Tribute signature\u003cinput data-edit=\"signoff\" value=\"With love, her favourite people \u2661\"/>\u003c/label>\u003clabel>Invitation message\u003ctextarea data-edit=\"invitation\">Before the wedding bells, there's one afternoon reserved for laughter, heartfelt toasts, beautiful memories and the people who love her most. We would be delighted to celebrate with you.\u003c/textarea>\u003c/label>\u003c/div>\u003cdiv class=\"editgroup\">\u003ch3>02 \u00b7 Celebration details\u003c/h3>\u003clabel>Display date\u003cinput data-edit=\"dateDisplay\" value=\"Saturday, 21 March 2027\"/>\u003c/label>\u003clabel>Event date for calendar\u003cinput id=\"eventDate\" type=\"date\" value=\"2027-03-21\"/>\u003c/label>\u003clabel>Start time for calendar\u003cinput id=\"eventTime\" type=\"time\" value=\"12:00\"/>\u003c/label>\u003clabel>Displayed time\u003cinput data-edit=\"time\" value=\"12:00 PM \u2014 4:00 PM\"/>\u003c/label>\u003clabel>Venue\u003cinput data-edit=\"venue\" value=\"The Conservatory\"/>\u003c/label>\u003clabel>Address\u003cinput data-edit=\"address\" value=\"Johannesburg, South Africa\"/>\u003c/label>\u003clabel>Dress code\u003cinput data-edit=\"dress\" value=\"Garden Chic\"/>\u003c/label>\u003clabel>Dress note\u003cinput data-edit=\"dressNote\" value=\"Soft colours and your Sunday best\"/>\u003c/label>\u003clabel>RSVP deadline\u003cinput data-edit=\"deadline\" value=\"10 March 2027\"/>\u003c/label>\u003c/div>\u003cdiv class=\"editgroup\">\u003ch3>03 \u00b7 Photo memories\u003c/h3>\u003csmall>Choose photographs from your device. These are temporary in-browser previews; they won't be uploaded or permanently saved yet.\u003c/small>\u003clabel>Cover portrait\u003cinput accept=\"image/*\" data-upload=\"hero\" type=\"file\"/>\u003c/label>\u003clabel>Bride tribute\u003cinput accept=\"image/*\" data-upload=\"tribute\" type=\"file\"/>\u003c/label>\u003clabel>Memory 1\u003cinput accept=\"image/*\" data-upload=\"memory1\" type=\"file\"/>\u003c/label>\u003clabel>Memory 2\u003cinput accept=\"image/*\" data-upload=\"memory2\" type=\"file\"/>\u003c/label>\u003clabel>Memory 3\u003cinput accept=\"image/*\" data-upload=\"memory3\" type=\"file\"/>\u003c/label>\u003clabel>Tablescape\u003cinput accept=\"image/*\" data-upload=\"dress\" type=\"file\"/>\u003c/label>\u003clabel>Memory 1 caption\u003cinput data-edit=\"caption1\" value=\"The beginning of everything\"/>\u003c/label>\u003clabel>Memory 2 caption\u003cinput data-edit=\"caption2\" value=\"Our favourite days\"/>\u003c/label>\u003clabel>Memory 3 caption\u003cinput data-edit=\"caption3\" value=\"More to come\"/>\u003c/label>\u003c/div>\u003cbutton class=\"submit\" onclick=\"closeEditor()\" style=\"width:100%;margin:20px 0\">View invitation \u2197\u003c/button>\u003c/aside>\u003cdiv aria-label=\"Photo viewer\" aria-modal=\"true\" class=\"lightbox\" id=\"lightbox\" role=\"dialog\">\u003cbutton aria-label=\"Close photo\" onclick=\"closePhoto()\">\u00d7\u003c/button>\u003cdiv>\u003cimg alt=\"Selected bridal memory\" id=\"largePhoto\"/>\u003cp id=\"photoCaption\">\u003c/p>\u003c/div>\u003c/div>\u003cscript src=\"assets/template-code/ea6f54aa12df020c8ea736fa.js\">\u003c/script>\u003c/body>\u003c/html>";const frame=document.getElementById("invitation");frame.srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/template-image-overrides.js?v=zero-waste1" defer></script><script src="assets/templates.js?v=zero-waste1"></script><script src="assets/design-finishing.js?v=20261115b"></script><script src="assets/template-polish.js?v=zero-waste1"></script></body></html>
