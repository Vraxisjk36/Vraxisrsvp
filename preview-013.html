TCHEN COLLECTION\u003c/small>\n\u003cstrong>Recipes for\u003cbr/>a lovely life.\u003c/strong>\n\u003csmall>EST. WITH LOVE ♡\u003c/small>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"tin-body\">\n\u003cdiv class=\"tabs\" id=\"tinTabs\">\n\u003cbutton class=\"tab active\" data-card=\"0\">The bride\u003c/button>\n\u003cbutton class=\"tab\" data-card=\"1\">The invitation\u003c/button>\n\u003cbutton class=\"tab\" data-card=\"2\">The secret ingredient\u003c/button>\n\u003cbutton class=\"tab\" data-card=\"3\">From the girls\u003c/button>\n\u003c/div>\n\u003cdiv aria-live=\"polite\" class=\"card-area\" id=\"cardArea\">\u003c/div>\n\u003cdiv class=\"tin-actions\">\n\u003cbutton id=\"nextCard\">Pull out another card →\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"section shell split\">\n\u003cdiv class=\"note\">\n\u003cdiv class=\"eyebrow\">A handwritten note\u003c/div>\n\u003ch3>Dear \u003cspan data-text=\"bride\">Mia\u003c/span>,\u003c/h3>\n\u003cp id=\"letterText\">\n            You have always been the one who turns ordinary afternoons into stories we'll tell\n            forever. Before this next beautiful chapter begins, we want one more afternoon of\n            laughter, good food and all your favourite people.\n          \u003c/p>\n\u003cp class=\"serif\" style=\"font-style: italic; font-size: 21px\">\n            With all our love,\u003cbr/>The girls ♡\n          \u003c/p>\n\u003c/div>\n\u003cdiv>\n\u003cimg alt=\"Friends gathered for a warm pre-wedding celebration\" class=\"photo2\" data-photo=\"friends\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAgEASABIAAD/4gxYSUNDX1BST0ZJTEUAAQEAAAxITGlubwIQAABtbnRyUkdCIFhZWiAHzgACAAkABgAxAABhY3NwTVNGVAAAAABJRUMgc1JHQgAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLUhQICAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABFjcHJ0AAABUAAAADNkZXNjAAABhAAAAGx3dHB0AAAB8AAAABRia3B0AAACBAAAABRyWFlaAAACGAAAABRnWFlaAAACLAAAABRiWFlaAAACQAAAABRkbW5kAAACVAAAAHBkbWRkAAACxAAAAIh2dWVkAAA ">\n\u003cdiv class=\"eyebrow\">You're invited\u003c/div>\n\u003ch2 class=\"serif\" style=\"max-width: 780px\">\n            Come for the tea.\u003cbr/>\n\u003cem>Stay for the memories.\u003c/em>\n\u003c/h2>\n\u003cp>\n            Join us for \u003cstrong data-text=\"bride\">Mia\u003c/strong>'s kitchen tea—an afternoon of\n            favourite recipes, good company and plenty of laughter.\n          \u003c/p>\n\u003cdiv class=\"details\">\n\u003cdiv class=\"detail\">\n\u003csmall>When\u003c/small>\n\u003cstrong id=\"dateView\">Saturday, 21 March 2027\u003c/strong>\n\u003cdiv id=\"timeView\">12:00 PM\u003c/div>\n\u003c/div>\n\u003cdiv class=\"detail\">\n\u003csmall>Where\u003c/small>\n\u003cstrong id=\"venueView\">The Sunday Table\u003c/strong>\n\u003cdiv id=\"addressView\">Potchefstroom, South Africa\u003c/div>\n\u003c/div>\n\u003cdiv class=\"detail\">\n\u003csmall>Come dressed in\u003c/small>\n\u003cstrong id=\"dressView\">Something sunny\u003c/strong>\n\u003cdiv>Whatever makes you feel lovely\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"hero-actions\">\n\u003ca class=\"btn\" href=\"https://maps.google.com/?q=Potchefstroom\" id=\"directions\" rel=\"noopener\" target=\"_blank\">Get directions ↗\u003c/a>\n\u003cbutton class=\"btn alt\" id=\"calendar\">Add to calendar\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"section submission\">\n\u003cdiv class=\"shell contribute\">\n\u003cdiv>\n\u003cdiv class=\"eyebrow\">A keepsake she'll treasure\u003c/div>\n\u003ch2 class=\"serif\">Add something to the \u003cem>recipe box.\u003c/em>\u003c/h2>\n\u003cp>\n              Share a family recipe, a piece of marriage advice or a favourite memory. One day,\n              these little notes could become a collection she'll keep forever.\n            \u003c/p>\n\u003cp class=\"smallprint\">\n              Demo preview: contributions appear on this device only. Online collection and\n              moderation will be connected when the invitation is published through VraxisRSVP.\n            \u003c/p>\n\u003cdiv class=\"contributions\" id=\"contributions\">\n\u003cdiv class=\"guest-note\">\n                “Never stop finding reasons to laugh together.”\u003csmall>— From someone who loves you\u003c/small>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cform class=\"form\" id=\"recipeForm\">\n\u003cdiv class=\"eyebrow\">Leave your little something\u003c/div>\n\u003clabel class=\"field\" for=\"contributor\">Your name\u003c/label>\n\u003cinput id=\"contributor\" placeholder=\"Your name\" required=\"\"/>\n\u003clabel class=\"field\" for=\"kind\">What are you sharing?\u003c/label>\n\u003cselect id=\"kind\">\n\u003coption>Family recipe\u003c/option>\n\u003coption>Marriage advice\u003c/option>\n\u003coption>Favourite memory\u003c/option>\n\u003c/select>\n\u003clabel class=\"field\" for=\"contribution\">Your note\u003c/label>\n\u003ctextarea id=\"contribution\" maxlength=\"700\" placeholder=\"Write from the heart...\" required=\"\">\u003c/textarea>\n\u003cbutton class=\"btn\" type=\"submit\">Add to the recipe box ♡\u003c/button>\n\u003c/form>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"section rsvp\" id=\"rsvp\">\n\u003cdiv class=\"shell\">\n\u003cdiv class=\"eyebrow\" style=\"color: #f1c980\">ONE MORE PLACE AT THE TABLE?\u003c/div>\n\u003ch2 class=\"serif\">\n            We saved a seat\u003cbr/>\n\u003cem>for you.\u003c/em>\n\u003c/h2>\n\u003cp>\n            Let us know if you'll be joining us to celebrate \u003cspan data-text=\"bride\">Mia\u003c/span>.\n          \u003c/p>\n\u003cform class=\"form\" id=\"rsvpForm\">\n\u003clabel class=\"field\" for=\"guestName\">Your name\u003c/label>\n\u003cinput id=\"guestName\" placeholder=\"Full name\" required=\"\"/>\n\u003clabel class=\"field\" for=\"attendance\">Will you join us?\u003c/label>\n\u003cselect id=\"attendance\">\n\u003coption value=\"yes\">Wouldn't miss it!\u003c/option>\n\u003coption value=\"no\">Sending love from afar\u003c/option>\n\u003c/select>\n\u003cdiv id=\"attendingFields\">\n\u003clabel class=\"field\" for=\"guestCount\">Number of guests\u003c/label>\n\u003cselect id=\"guestCount\">\n\u003coption>1\u003c/option>\n\u003coption>2\u003c/option>\n\u003coption>3\u003c/option>\n\u003coption>4\u003c/option>\n\u003c/select>\n\u003clabel class=\"field\" for=\"dietary\">Dietary notes (optional)\u003c/label>\n\u003cinput id=\"dietary\" placeholder=\"Anything we should know?\"/>\n\u003c/div>\n\u003clabel class=\"field\" for=\"guestMessage\">A note for the bride (optional)\u003c/label>\n\u003ctextarea id=\"guestMessage\" placeholder=\"Something sweet to say...\">\u003c/textarea>\n\u003cbutton class=\"btn\" type=\"submit\">Send my response ♡\u003c/button>\n\u003cp class=\"smallprint\">Preview only: your RSVP is not sent or saved online yet.\u003c/p>\n\u003c/form>\n\u003c/div>\n\u003c/section>\n\u003c/main>\n\u003cfooter class=\"footer\">\n      Made with love for \u003cspan data-text=\"bride\">Mia\u003c/span> · Something Sweet · VraxisRSVP\n    \u003c/footer>\n\u003cdiv class=\"drawer-back\" id=\"drawerBack\">\u003c/div>\n\u003caside aria-label=\"Personalise invitation\" class=\"drawer\" id=\"drawer\">\n\u003cdiv class=\"drawer-head\">\n\u003ch2 class=\"serif\" style=\"margin: 0\">Make it yours\u003c/h2>\n\u003cbutton aria-label=\"Close\" class=\"close\" id=\"editClose\">×\u003c/button>\n\u003c/div>\n\u003cp class=\"smallprint\">\n        Changes update this preview. Uploaded photos are not stored after you close the file.\n      \u003c/p>\n\u003clabel for=\"editBride\">Bride's first name\u003c/label>\n\u003cinput id=\"editBride\" value=\"Mia\"/>\n\u003clabel for=\"editLetter\">Letter from the girls\u003c/label>\n\u003ctextarea id=\"editLetter\">\nYou have always been the one who turns ordinary afternoons into stories we'll tell forever. Before this next beautiful chapter begins, we want one more afternoon of laughter, good food and all your favourite people.\u003c/textarea>\n\u003clabel for=\"editDate\">Date\u003c/label>\n\u003cinput id=\"editDate\" type=\"date\" value=\"2027-03-21\"/>\n\u003clabel for=\"editTime\">Time\u003c/label>\n\u003cinput id=\"editTime\" type=\"time\" value=\"12:00\"/>\n\u003clabel for=\"editVenue\">Venue\u003c/label>\n\u003cinput id=\"editVenue\" value=\"The Sunday Table\"/>\n\u003clabel for=\"editAddress\">Address\u003c/label>\n\u003cinput id=\"editAddress\" value=\"Potchefstroom, South Africa\"/>\n\u003clabel for=\"editDress\">Dress code\u003c/label>\n\u003cinput id=\"editDress\" value=\"Something sunny\"/>\n\u003clabel for=\"editHero\">Bride's photograph\u003c/label>\n\u003cinput accept=\"image/*\" id=\"editHero\" type=\"file\"/>\n\u003clabel for=\"editFriends\">Friends' photograph\u003c/label>\n\u003cinput accept=\"image/*\" id=\"editFriends\" type=\"file\"/>\n\u003cp class=\"smallprint\">Tip: the best results come from bright, natural photographs.\u003c/p>\n\u003cbutton class=\"btn\" id=\"doneEdit\">Done editing\u003c/button>\n\u003c/aside>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\">\u003c/div>\n\u003cscript>\n      const $ = (s) => document.querySelector(s),\n        $$ = (s) => document.querySelectorAll(s);\n      const state = {\n        bride: \"Mia\",\n        date: \"2027-03-21\",\n        time: \"12:00\",\n        venue: \"The Sunday Table\",\n        address: \"Potchefstroom, South Africa\",\n        dress: \"Something sunny\",\n      };\n      let active = 0;\n      const cards = [\n        () => ({\n          k: \"01 / THE BRIDE\",\n          title: `The ${state.bride} Recipe`,\n          body: `Ingredients:\\n1 generous heart\\nA ridiculous amount of laughter\\nA pinch of mischief\\nA lifetime of unforgettable memories\\n\\nMethod: Bring together everyone who loves ${state.bride}. Stir in good food and celebrate generously.`,\n        }),\n        () => ({\n          k: \"02 / THE MAIN EVENT\",\n          title: \"A Kitchen Tea, Made with Love\",\n          body: `For: ${state.bride}\\nDate: ${formatDate()} at ${formatTime()}\\nWhere: ${state.venue}\\n\\nMethod: Arrive with an appetite, your favourite stories and a little something sweet to share.`,\n        }),\n        () => ({\n          k: \"03 / THE SECRET INGREDIENT\",\n          title: \"A Beautiful Marriage\",\n          body: \"Ingredients:\\nTwo people who choose each other\\nA generous helping of patience\\nPlenty of laughter\\nA lifetime of tiny adventures\\n\\nMethod: Mix with love. Keep making memories.\",\n        }),\n        () => ({\n          k: \"04 / FROM THE GIRLS\",\n          title: \"A Note Just for You\",\n          body: $(\"#editLetter\").value,\n        }),\n      ];\n      function formatDate() {\n        const [y, m, d] = state.date.split(\"-\").map(Number);\n        return new Date(y, m - 1, d).toLocaleDateString(\"en-ZA\", {\n          weekday: \"long\",\n          day: \"numeric\",\n          month: \"long\",\n          year: \"numeric\",\n        });\n      }\n      function formatTime() {\n        const [h, m] = state.time.split(\":\").map(Number);\n        return new Date(2027, 0, 1, h, m).toLocaleTimeString(\"en-ZA\", {\n          hour: \"numeric\",\n          minute: \"2-digit\",\n        });\n      }\n      function renderCard() {\n        const c = cards[active]();\n        const area = $(\"#cardArea\");\n        area.replaceChildren();\n        const el = document.createElement(\"article\");\n        el.className = \"recipe-card\";\n        const k = document.createElement(\"div\");\n        k.className = \"tiny\";\n        k.textContent = c.k;\n        const h = document.createElement(\"h3\");\n        h.textContent = c.title;\n        const rule = document.createElement(\"div\");\n        rule.className = \"rule\";\n        const p = document.createElement(\"p\");\n        p.textContent = c.body;\n        el.append(k, h, rule, p);\n        area.append(el);\n        $$(\"[data-card]\").forEach((b) => {\n          const selected = Number(b.dataset.card) === active;\n          b.classList.toggle(\"active\", selected);\n          b.setAttribute(\"aria-pressed\", String(selected));\n        });\n      }\n      function chooseCard(n) {\n        active = n;\n        $(\"#tinBox\").classList.add(\"open\");\n        renderCard();\n      }\n      $$(\"[data-card]\").forEach((b) =>\n        b.addEventListener(\"click\", () => chooseCard(Number(b.dataset.card))),\n      );\n      $(\"#nextCard\").addEventListener(\"click\", () => chooseCard((active + 1) % cards.length));\n      renderCard();\n      function toast(message) {\n        const el = $(\"#toast\");\n        el.textContent = message;\n        el.classList.add(\"show\");\n        clearTimeout(window.toastTimer);\n        window.toastTimer = setTimeout(() => el.classList.remove(\"show\"), 3300);\n      }\n      function openDrawer(open) {\n        $(\"#drawer\").classList.toggle(\"show\", open);\n        $(\"#drawerBack\").classList.toggle(\"show\", open);\n      }\n      $(\"#editOpen\").onclick = () => openDrawer(true);\n      $(\"#editClose\").onclick =\n        $(\"#doneEdit\").onclick =\n        $(\"#drawerBack\").onclick =\n          () => openDrawer(false);\n      function sync() {\n        state.bride = $(\"#editBride\").value.trim() || \"the bride\";\n        state.date = $(\"#editDate\").value || \"2027-03-21\";\n        state.time = $(\"#editTime\").value || \"12:00\";\n        state.venue = $(\"#editVenue\").value.trim() || \"Venue to be announced\";\n        state.address = $(\"#editAddress\").value.trim();\n        state.dress = $(\"#editDress\").value.trim();\n        $$('[data-text=\"bride\"]').forEach((e) => (e.textContent = state.bride));\n        $(\"#letterText\").textContent = $(\"#editLetter\").value;\n        $(\"#dateView\").textContent = formatDate();\n        $(\"#timeView\").textContent = formatTime();\n        $(\"#venueView\").textContent = state.venue;\n        $(\"#addressView\").textContent = state.address;\n        $(\"#dressView\").textContent = state.dress;\n        $(\"#directions\").href =\n          \"https://www.google.com/maps/search/?api=1&query=\" +\n          encodeURIComponent(state.address || state.venue);\n        renderCard();\n      }\n      [\n        \"editBride\",\n        \"editLetter\",\n        \"editDate\",\n        \"editTime\",\n        \"editVenue\",\n        \"editAddress\",\n        \"editDress\",\n      ].forEach((id) => $(\"#\" + id).addEventListener(\"input\", sync));\n      [\"hero\", \"friends\"].forEach((name) =>\n        $(\"#edit\" + name[0].toUpperCase() + name.slice(1)).addEventListener(\"change\", (e) => {\n          const file = e.target.files[0];\n          if (!file) return;\n          if (!file.type.startsWith(\"image/\")) return toast(\"Please choose an image file.\");\n          const img = $(`[data-photo=\"${name}\"]`);\n          if (img.dataset.objectUrl) URL.revokeObjectURL(img.dataset.objectUrl);\n          const url = URL.createObjectURL(file);\n          img.src = url;\n          img.dataset.objectUrl = url;\n          toast(\"Photo updated in this preview.\");\n        }),\n      );\n      $(\"#recipeForm\").addEventListener(\"submit\", (e) => {\n        e.preventDefault();\n        const note = document.createElement(\"div\");\n        note.className = \"guest-note\";\n        note.textContent = \"“\" + $(\"#contribution\").value.trim() + \"”\";\n        const author = document.createElement(\"small\");\n        author.textContent = \"— \" + $(\"#contributor\").value.trim() + \" · \" + $(\"#kind\").value;\n        note.append(author);\n        $(\"#contributions\").prepend(note);\n        e.target.reset();\n        toast(\"Added to this preview recipe box ♡\");\n      });\n      $(\"#attendance\").addEventListener(\n        \"change\",\n        () => ($(\"#attendingFields\").hidden = $(\"#attendance\").value === \"no\"),\n      );\n      $(\"#rsvpForm\").addEventListener(\"submit\", (e) => {\n        e.preventDefault();\n        toast(\n          $(\"#attendance\").value === \"yes\"\n            ? \"Your seat is reserved in this demo ♡\"\n            : \"Your love has been noted in this demo ♡\",\n        );\n        e.target.reset();\n        $(\"#attendingFields\").hidden = false;\n      });\n      $(\"#calendar\").addEventListener(\"click\", () => {\n        const dt = state.date.replaceAll(\"-\", \"\");\n        const tm = state.time.replace(\":\", \"\");\n        const start = dt + \"T\" + tm + \"00\";\n        const endH = (Number(state.time.slice(0, 2)) + 3) % 24;\n        const end = dt + \"T\" + String(endH).padStart(2, \"0\") + state.time.slice(3) + \"00\";\n        const esc = (s) =>\n          String(s)\n            .replaceAll(\"\\\\\", \"\\\\\\\\\")\n            .replaceAll(\",\", \"\\\\,\")\n            .replaceAll(\";\", \"\\\\;\")\n            .replaceAll(\"\\n\", \"\\\\n\");\n        const ics = [\n          \"BEGIN:VCALENDAR\",\n          \"VERSION:2.0\",\n          \"PRODID:-//VraxisRSVP//Something Sweet//EN\",\n          \"BEGIN:VEVENT\",\n          \"UID:something-sweet-\" + Date.now() + \"@vraxisrsvp\",\n          \"DTSTAMP:\" +\n            new Date()\n              .toISOString()\n              .replace(/[-:]/g, \"\")\n              .replace(/\\.\\d{3}/, \"\"),\n          \"DTSTART:\" + start,\n          \"DTEND:\" + end,\n          \"SUMMARY:\" + esc(state.bride + \"'s Kitchen Tea\"),\n          \"LOCATION:\" + esc(state.venue + \", \" + state.address),\n          \"DESCRIPTION:Come for the tea. Stay for the memories.\",\n          \"END:VEVENT\",\n          \"END:VCALENDAR\",\n        ].join(\"\\r\\n\");\n        const a = document.createElement(\"a\");\n        a.href = URL.createObjectURL(new Blob([ics], { type: \"text/calendar\" }));\n        a.download = \"something-sweet-kitchen-tea.ics\";\n        a.click();\n        setTimeout(() => URL.revokeObjectURL(a.href), 3000);\n      });\n      sync();\n    \u003c/script>\n\u003cscript>\n      (() => {\n        const intro = document.getElementById(\"sweetIntro\");\n        const action = document.getElementById(\"sweetAction\");\n        const hint = document.getElementById(\"sweetHint\");\n        const skip = document.getElementById(\"sweetSkip\");\n        let step = 0,\n          closing = false;\n        document.documentElement.classList.add(\"sweet-locked\");\n        function finish() {\n          if (closing) return;\n          closing = true;\n          intro.classList.add(\"sweet-finish\");\n          document.documentElement.classList.remove(\"sweet-locked\");\n          setTimeout(() => {\n            intro.remove();\n          }, 1350);\n        }\n        function advance() {\n          if (step === 0) {\n            step = 1;\n            intro.dataset.step = \"1\";\n            action.textContent = \"Take your invitation ♡\";\n            hint.textContent = \"A recipe made especially for you\";\n            return;\n          }\n          if (step === 1) {\n            step = 2;\n            intro.dataset.step = \"2\";\n            action.textContent = \"Step into the celebration →\";\n            hint.textContent = \"Every beautiful memory begins somewhere\";\n            return;\n          }\n          finish();\n        }\n        action.addEventListener(\"click\", advance);\n        skip.addEventListener(\"click\", finish);\n        document.addEventListener(\"keydown\", (e) => {\n          if (!intro.isConnected) return;\n          if (e.key === \"Escape\") finish();\n        });\n        const bride = document.getElementById(\"editBride\");\n        if (bride) {\n          const sync = () => {\n            document.getElementById(\"sweetBride\").textContent = bride.value.trim() || \"the bride\";\n          };\n          bride.addEventListener(\"input\", sync);\n          sync();\n        }\n      })();\n    \u003c/script>\n\u003c/body>\n\u003c/html>";const frame=document.getElementById("invitation");frame.srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/template-image-overrides.js" defer></script></body></html>
