t=\"date\">SUNDAY, 14 NOVEMBER 2027\u003c/div>\n          \u003cdiv class=\"hero-scroll reveal\">\n            \u003cspan>SCROLL INTO OUR STORY\u003c/span>\n            \u003cspan class=\"scroll-line\"> \u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"letter\" id=\"letter\">\n        \u003cdiv class=\"shell\">\n          \u003cdiv class=\"eyebrow reveal\">A LETTER TO OUR FAVOURITE PEOPLE\u003c/div>\n          \u003ch2 class=\"serif reveal\">\n            Some moments are\u003cbr />\n            \u003ci>meant to be shared.\u003c/i>\n          \u003c/h2>\n          \u003cp class=\"body reveal\" data-text=\"letter\">\n            Of all the beautiful things life has given us, finding each other is our favourite. Now,\n            with full hearts, we invite you to be part of the day we begin our forever.\n          \u003c/p>\n          \u003cdiv class=\"signature reveal\">Alexander & Miranda\u003c/div>\n          \u003cdiv class=\"eyebrow reveal\" style=\"margin-top: 50px\">TAP OUR SEAL FOR A LITTLE NOTE\u003c/div>\n          \u003cbutton class=\"seal-button reveal\" id=\"seal\" aria-expanded=\"false\" aria-controls=\"secret\">\n            A&M\n          \u003c/button>\n          \u003cdiv class=\"secret\" id=\"secret\">\n            “The best part of our story is getting to share this chapter with you.”\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"memory\" id=\"story\">\n        \u003cdiv class=\"memory-head reveal\">\n          \u003cdiv class=\"eyebrow gold\">CHAPTER ONE · THE STORY SO FAR\u003c/div>\n          \u003ch2 class=\"serif\">\n            Before the\u003cbr />\n            \u003ci>forever.\u003c/i>\n          \u003c/h2>\n          \u003cp>Every love story is a collection of little moments. Here are a few of ours.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"memory-scene reveal\">          \u003cbutton class=\"photo a\" data-light=\"m amme\">\n        \u003cdiv class=\"eyebrow gold reveal\">CHAPTER THREE · OUR WEDDING DAY\u003c/div>\n        \u003ch2 class=\"serif reveal\">\n          The beautiful\u003cbr />\n          \u003ci>little details.\u003c/i>\n        \u003c/h2>\n        \u003cdiv class=\"timeline-list\">\n          \u003cdiv class=\"timeline-row reveal\">\n            \u003cstrong>14:30\u003c/strong>\n            \u003ch3>Guests arrive\u003c/h3>\n            \u003cp>Find your seat and settle into the afternoon.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"timeline-row reveal\">\n            \u003cstrong data-text=\"ceremonyTime\">15:00\u003c/strong>\n            \u003ch3>The ceremony\u003c/h3>\n            \u003cp>Our promises, witnessed by our favourite people.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"timeline-row reveal\">\n            \u003cstrong>16:30\u003c/strong>\n            \u003ch3>Golden-hour celebrations\u003c/h3>\n            \u003cp>Photographs, cocktails and a little time together.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"timeline-row reveal\">\n            \u003cstrong data-text=\"receptionTime\">18:00\u003c/strong>\n            \u003ch3>Dinner & dancing\u003c/h3>\n            \u003cp>Good food, heartfelt speeches and unforgettable memories.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n        \u003cp style=\"margin: 35px auto 0; max-width: 540px; font: italic 25px var(--serif)\">\n          Dress code: \u003cspan data-text=\"dress\">Formal garden elegance\u003c/span>\n        \u003c/p>\n      \u003c/section>\n      \u003csection class=\"rsvp\" id=\"rsvp\">\n        \u003cdiv class=\"rsvp-inner\">\n          \u003cdiv class=\"eyebrow reveal\">ONE LAST THING\u003c/div>\n          \u003ch2 class=\"serif reveal\">\n            Will you\u003cbr />\n            \u003ci>join us?\u003c/i>\n          \u003c/h2>\n          \u003cp class=\"introtext reveal\">The day wouldn't be the same without you.\u003c/p>\n          \u003cform id=\"rsvpForm\" class=\"reveal\">\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"guest\">Your name\u003c/label>\n              \u003cinput id=\"guest\" name=\"guest\" required placeholder=\"Your full name\" />\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"attendance\">Your response\u003c/label>\n              \u003cselect id=\"attendance\" name=\"attendance\">\n                \u003coption value=\"yes\">Joyfully accepts\u003c/option>\n                \u003coption value=\"no\">Regretfully declines\u003c/option>\n              \u003c/select>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"count\">Number of guests\u003c/label>\n              \u003cselect id=\"count\" name=\"count\">\n                \u003coption>1\u003c/option>\n                \u003coption>2\u003c/option>\n                \u003coption>3\u003c/option>\n                \u003coption>4\u003c/option>\n              \u003c/select>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"message\">A note for the couple\u003c/label>\n              \u003ctextarea id=\"message\" name=\"message\" placeholder=\"Leave a little love...\">\u003c/textarea>\n            \u003c/div>\n            \u003cbutton class=\"button dark\" type=\"submit\">SEND MY RESPONSE ↗\u003c/button>\n            \u003cdiv class=\"thankyou\" id=\"thanks\" role=\"status\">\n              Thank you for being part of our story. ♥\u003cbr />\n              \u003csmall style=\"font: 12px var(--sans)\"\n                >Demo preview: your response has not been submitted to a server.\u003c/small\n              >\n            \u003c/div>\n          \u003c/form>\n        \u003c/div>\n      \u003c/section>\n    \u003c/main>\n    \u003cfooter class=\"footer\">\n      \u003cdiv class=\"eyebrow gold\">WITH ALL OUR LOVE\u003c/div>\n      \u003ch2>Alexander & Miranda\u003c/h2>\n      \u003cp>14 November 2027\u003c/p>\n      \u003cbutton class=\"button ghost\" id=\"replay\">REPLAY THE OPENING ↗\u003c/button>\n      \u003cp style=\"font-size: 10px; letter-spacing: 0.18em; margin-top: 50px; opacity: 0.6\">\n        VRAXISRSVP · THE HEIRLOOM COLLECTION\n      \u003c/p>\n    \u003c/footer>\n    \u003cdiv class=\"lightbox\" id=\"lightbox\" role=\"dialog\" aria-label=\"Photograph viewer\">\n      \u003cbutton id=\"closeLight\">CLOSE ✕\u003c/button>\n      \u003cimg id=\"lightImage\" alt=\"Enlarged wedding memory\" />\n    \u003c/div>\n    \u003caside class=\"edit-panel\" id=\"editPanel\" aria-label=\"Personalisation\">\n      \u003cheader>\n        \u003ch2>Make it yours.\u003c/h2>\n        \u003cbutton class=\"x\" id=\"editClose\" aria-label=\"Close\">×\u003c/button>\n      \u003c/header>\n      \u003cp style=\"font-size: 12px; line-height: 1.7\">\n        Preview the personalisation of this wedding invitation. Edits and photo uploads are local to\n        this browser session.\n      \u003c/p>\n      \u003cdiv id=\"fields\">\u003c/div>\n      \u003ch3>Wedding photographs\u003c/h3>\n      \u003cdiv id=\"photos\">\u003c/div>\n      \u003cbutton class=\"button dark\" id=\"editDone\">BACK TO INVITATION\u003c/button>\n    \u003c/aside>\n    \u003cscript>\n      const $ = (s) => document.querySelector(s),\n        $$ = (s) => [...document.querySelectorAll(s)];\n      const intro = $('#intro');\n      function closeIntro() {\n        intro.classList.add('is-opening');\n        setTimeout(() => {\n          intro.classList.add('is-gone');\n          intro.classList.remove('is-opening');\n        }, 1000);\n      }\n      $('#openIntro').addEventListener('click', closeIntro);\n      $('#skipIntro').addEventListener('click', () => intro.classList.add('is-gone'));\n      $('#replay').addEventListener('click', () => {\n        window.scrollTo({ top: 0, behavior: 'instant' });\n        intro.classList.remove('is-gone');\n      });\n      const observer = new IntersectionObserver(\n        (entries) =>\n          entries.forEach((e) => {\n            if (e.isIntersecting) {\n              e.target.classList.add('visible');\n              observer.unobserve(e.target);\n            }\n          }),\n        { threshold: 0.08 },\n      );\n      $$('.reveal').forEach((el) => observer.observe(el));\n      window.addEventListener(\n        'scroll',\n        () => {\n          $('#progress').style.width =\n            (100 * scrollY) / Math.max(1, document.documentElement.scrollHeight - innerHeight) +\n            '%';\n        },\n        { passive: true },\n      );\n      $('#seal').addEventListener('click', () => {\n        const s = $('#secret');\n        s.classList.toggle('show');\n        $('#seal').setAttribute('aria-expanded', s.classList.contains('show'));\n      });\n      $$('[data-light]').forEach((b) =>\n        b.addEventListener('click', () => {\n          let img = $(`[data-photo=\"${b.dataset.light}\"]`);\n          if (img) {\n            $('#lightImage').src = img.src;\n            $('#lightbox').classList.add('open');\n          }\n        }),\n      );\n      $('#closeLight').addEventListener('click', () => $('#lightbox').classList.remove('open'));\n      $('#lightbox').addEventListener('click', (e) => {\n        if (e.target.id === 'lightbox') $('#lightbox').classList.remove('open');\n      });\n      document.addEventListener('keydown', (e) => {\n        if (e.key === 'Escape') {\n          $('#lightbox').classList.remove('open');\n          $('#editPanel').classList.remove('open');\n        }\n      });\n      $('#rsvpForm').addEventListener('submit', (e) => {\n        e.preventDefault();\n        $('#thanks').style.display = 'block';\n      });\n      const editor = $('#editPanel');\n      $('#editOpen').addEventListener('click', () => editor.classList.add('open'));\n      $('#editClose').addEventListener('click', () => editor.classList.remove('open'));\n      $('#editDone').addEventListener('click', () => editor.classList.remove('open'));\n      const editFields = [\n        ['first', 'First name'],\n        ['second', 'Second name'],\n        ['date', 'Wedding date'],\n        ['letter', 'Personal letter'],\n        ['ceremonyTime', 'Ceremony time'],\n        ['ceremonyVenue', 'Ceremony venue'],\n        ['ceremonyLocation', 'Ceremony location'],\n        ['receptionTime', 'Reception time'],\n        ['receptionVenue', 'Reception venue'],\n        ['dress', 'Dress code'],\n      ];\n      editFields.forEach(([key, label]) => {\n        let value = $(`[data-text=\"${key}\"]`)?.textContent || '';\n        let wrap = document.createElement('div');\n        wrap.className = 'field';\n        let lab = document.createElement('label');\n        lab.textContent = label;\n        let inp = document.createElement(key === 'letter' ? 'textarea' : 'input');\n        inp.value = value;\n        inp.addEventListener('input', () => {\n          $$(`[data-text=\"${key}\"]`).forEach((el) => (el.textContent = inp.value));\n          if (key === 'first' || key === 'second') {\n            $('.signature').textContent =\n              $('[data-text=\"first\"]').textContent + ' & ' + $('[data-text=\"second\"]').textContent;\n            $('.footer h2').textContent = $('.signature').textContent;\n          }\n          if (key === 'ceremonyLocation')\n            $('#ceremonyMap').href =\n              'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(inp.value);\n        });\n        wrap.append(lab, inp);\n        $('#fields').append(wrap);\n      });\n      ['couple', 'memory', 'memory2', 'ceremony', 'reception'].forEach((key) => {\n        let wrap = document.createElement('div');\n        wrap.className = 'field';\n        let lab = document.createElement('label');\n        lab.textContent = key + ' photo';\n        let inp = document.createElement('input');\n        inp.type = 'file';\n        inp.accept = 'image/*';\n        inp.addEventListener('change', () => {\n          let f = inp.files?.[0];\n          if (!f) return;\n          let reader = new FileReader();\n          reader.onload = () => {\n            $$(`[data-photo=\"${key}\"]`).forEach((img) => (img.src = reader.result));\n          };\n          reader.readAsDataURL(f);\n        });\n        wrap.append(lab, inp);\n        $('#photos').append(wrap);\n      });\n    \u003c/script>\n  \u003c/body>\n\u003c/html>";const frame=document.getElementById("invitation");frame.srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/curated-media.js" defer></script><script src="assets/template-image-overrides.js?v=4" defer></script><script src="assets/templates.js"></script><script src="assets/template-polish.js?v=1"></script></body></html>
