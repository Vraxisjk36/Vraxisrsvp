14px}\n .memory-scene{width:100%;overflow:clip}\n .photo.a{left:0}.photo.b{right:0}\n .intro-inner{max-width:100vw}\n}\n<\/style><style>.hero .bg{object-position:center 40%}.intro-image{object-fit:contain}<\/style><\/head><body><div class=\"scroll-progress\" id=\"progress\"><\/div><div class=\"intro\" id=\"intro\"><div class=\"intro-bg\"><\/div><div class=\"intro-inner\"><div class=\"eyebrow intro-top\">A PRIVATE INVITATION \u00b7 14 NOVEMBER 2027<\/div><img class=\"intro-image\" src=\"assets/invitation-media/heirloom-ribbon.webp\" alt=\"Ivory embossed wedding envelope tied with burgundy ribbon and wax seal\"><h1 class=\"serif\">The Heirloom<\/h1><p>Made with love. Opened by you.<\/p><button class=\"button\" id=\"openIntro\">Unseal your invitation &nbsp; \u2197<\/button><button class=\"skip\" id=\"skipIntro\">Skip opening<\/button><\/div><\/div><div class=\"site-top\"><span class=\"mark\">A <span class=\"gold\">&<\/span> M<\/span><button class=\"nav-btn\" id=\"editOpen\">PERSONALISE \u270e<\/button><\/div><main id=\"main\"><section class=\"stage full hero\" id=\"home\"><img class=\"bg\" src=\"assets/invitation-media/003.webp\" alt=\"Wedding couple exchanging vows\" data-photo=\"couple\"><div class=\"veil\"><\/div><div class=\"hero-content\"><div class=\"eyebrow reveal\">THE WEDDING OF<\/div><h1 class=\"serif reveal\"><span data-text=\"first\">Alexander<\/span><span class=\"gold\" style=\"font-size:.65em;font-style:italic;line-height:1.15\">&<\/span><span data-text=\"second\">Miranda<\/span><\/h1><div class=\"hero-date reveal\" data-text=\"date\">SUNDAY, 14 NOVEMBER 2027<\/div><div class=\"hero-scroll reveal\"><span>SCROLL INTO OUR STORY<\/span><span class=\"scroll-line\"><\/span><\/div><\/div><\/section><section class=\"letter\" id=\"letter\"><div class=\"shell\"><div class=\"eyebrow reveal\">A LETTER TO OUR FAVOURITE PEOPLE<\/div><h2 class=\"serif reveal\">Some moments are<br><i>meant to be shared.<\/i><\/h2><p class=\"body reveal\" data-text=\"letter\">Of all the beautiful things life has given us, finding each other is our favourite. Now, with full hearts, we invite you to be part of the day we begin our forever.<\/p><div class=\"signature reveal\">Alexander & Miranda<\/div><div class=\"eyebrow reveal\" style=\"margin-top:50px\">TAP OUR SEAL FOR A LITTLE NOTE<\/div><button class=\"seal-button reveal\" id=\"seal\" aria-expanded=\"false\" aria-controls=\"secret\">A&M<\/button><div class=\"secret\" id=\"secret\">\u201cThe best part of our story is getting to share this chapter with you.\u201d<\/div><\/div><\/section><section class=\"memory\" id=\"story\"><div class=\"memory-head reveal\"><div class=\"eyebrow gold\">CHAPTER ONE \u00b7 THE STORY SO FAR<\/div><h2 class=\"serif\">Before the<br><i>forever.<\/i><\/h2><p>Every love story is a collection of little moments. Here are a few of ours.<\/p><\/div><div class=\"memory-scene reveal\"><button class=\"photo a\" data-light=\"memory\" aria-label=\"View first memory\"><img src=\"assets/invitation-media/002.webp\" alt=\"Wedding couple in a ballroom\" data-photo=\"memory\"><\/button><button class=\"photo b\" data-light=\"memory2\" aria-label=\"View second memory\"><img src=\"assets/invitation-media/003.webp\" alt=\"Black and white wedding portrait\" data-photo=\"memory2\"><\/button><div class=\"memory-note\">It was always you.<small>EST. OUR FAVOURITE DAY<\/small><\/div><\/div><div class=\"gallery-controls\"><button data-light=\"memory\">VIEW MEMORY 01 \u2197<\/button><button data-light=\"memory2\">VIEW MEMORY 02 \u2197<\/button><\/div><\/section><section class=\"moment stage\" id=\"moment\"><img class=\"bg\" src=\"assets/invitation-media/candles.webp\" alt=\"Candlelit wedding table\"><div class=\"veil\"><\/div><div class=\"reveal\"><div class=\"eyebrow gold\">CHAPTER TWO \u00b7 THE PROMISE<\/div><h2>And so, our<br><i>forever begins.<\/i><\/h2><div class=\"eyebrow\">WE WOULD LOVE YOU TO BE THERE<\/div><\/div><\/section><section class=\"details\" id=\"details\"><div class=\"eyebrow reveal\" style=\"text-align:center\">THE DAY WE SAY I DO<\/div><h2 class=\"serif reveal\">A day to<br><i>remember.<\/i><\/h2><div class=\"details-grid\"><article class=\"detail-card reveal\"><img src=\"assets/invitation-media/chapel.webp\" alt=\"Flower-lined church aisle\" data-photo=\"ceremony\"><div class=\"detail-copy\"><div class=\"eyebrow gold\">01 / THE CEREMONY<\/div><h3>Our vows.<\/h3><p><strong data-text=\"ceremonyTime\">15:00<\/strong><br><span data-text=\"ceremonyVenue\">The Rosewood Estate<\/span><br><span data-text=\"ceremonyLocation\">Stellenbosch, South Africa<\/span><\/p><a id=\"ceremonyMap\" href=\"https://www.google.com/maps/search/?api=1&query=Stellenbosch\" target=\"_blank\" rel=\"noopener\">GET DIRECTIONS \u2197<\/a><\/div><\/article><article class=\"detail-card reveal\"><img src=\"assets/invitation-media/candles.webp\" alt=\"Candlelit reception table\" data-photo=\"reception\"><div class=\"detail-copy\"><div class=\"eyebrow gold\">02 / THE CELEBRATION<\/div><h3>Then, we dance.<\/h3><p><strong data-text=\"receptionTime\">18:00<\/strong><br><span data-text=\"receptionVenue\">The Rosewood Estate<\/span><br>Dinner, dancing and a night to remember.<\/p><a href=\"#programme\">DISCOVER THE EVENING \u2197<\/a><\/div><\/article><\/div><\/section><section class=\"timeline\" id=\"programme\"><div class=\"eyebrow gold reveal\">CHAPTER THREE \u00b7 OUR WEDDING DAY<\/div><h2 class=\"serif reveal\">The beautiful<br><i>little details.<\/i><\/h2><div class=\"timeline-list\"><div class=\"timeline-row reveal\"><strong>14:30<\/strong><h3>Guests arrive<\/h3><p>Find your seat and settle into the afternoon.<\/p><\/div><div class=\"timeline-row reveal\"><strong data-text=\"ceremonyTime\">15:00<\/strong><h3>The ceremony<\/h3><p>Our promises, witnessed by our favourite people.<\/p><\/div><div class=\"timeline-row reveal\"><strong>16:30<\/strong><h3>Golden-hour celebrations<\/h3><p>Photographs, cocktails and a little time together.<\/p><\/div><div class=\"timeline-row reveal\"><strong data-text=\"receptionTime\">18:00<\/strong><h3>Dinner & dancing<\/h3><p>Good food, heartfelt speeches and unforgettable memories.<\/p><\/div><\/div><p style=\"margin:35px auto 0;max-width:540px;font:italic 25px var(--serif)\">Dress code: <span data-text=\"dress\">Formal garden elegance<\/span><\/p><\/section><section class=\"rsvp\" id=\"rsvp\"><div class=\"rsvp-inner\"><div class=\"eyebrow reveal\">ONE LAST THING<\/div><h2 class=\"serif reveal\">Will you<br><i>join us?<\/i><\/h2><p class=\"introtext reveal\">The day wouldn't be the same without you.<\/p><form id=\"rsvpForm\" class=\"reveal\"><div class=\"field\"><label for=\"guest\">Your name<\/label><input id=\"guest\" name=\"guest\" required placeholder=\"Your full name\"><\/div><div class=\"field\"><label for=\"attendance\">Your response<\/label><select id=\"attendance\" name=\"attendance\"><option value=\"yes\">Joyfully accepts<\/option><option value=\"no\">Regretfully declines<\/option><\/select><\/div><div class=\"field\"><label for=\"count\">Number of guests<\/label><select id=\"count\" name=\"count\"><option>1<\/option><option>2<\/option><option>3<\/option><option>4<\/option><\/select><\/div><div class=\"field\"><label for=\"message\">A note for the couple<\/label><textarea id=\"message\" name=\"message\" placeholder=\"Leave a little love...\"><\/textarea><\/div><button class=\"button dark\" type=\"submit\">SEND MY RESPONSE \u2197<\/button><div class=\"thankyou\" id=\"thanks\" role=\"status\">Thank you for being part of our story. \u2665<br><small style=\"font:12px var(--sans)\">Demo preview: your response has not been submitted to a server.<\/small><\/div><\/form><\/div><\/section><\/main><footer class=\"footer\"><div class=\"eyebrow gold\">WITH ALL OUR LOVE<\/div><h2>Alexander & Miranda<\/h2><p>14 November 2027<\/p><button class=\"button ghost\" id=\"replay\">REPLAY THE OPENING \u2197<\/button><p style=\"font-size:10px;letter-spacing:.18em;margin-top:50px;opacity:.6\">VRAXISRSVP \u00b7 THE HEI oto';let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.addEventListener('change',()=>{let f=inp.files?.[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{$$(`[data-photo=\"${key}\"]`).forEach(img=>img.src=reader.result)};reader.readAsDataURL(f)});wrap.append(lab,inp);$('#photos').append(wrap)});\n<\/script><\/body><\/html>";const frame=document.getElementById("invitation");frame.srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/curated-media.js" defer></script><script src="assets/template-image-overrides.js?v=4" defer></script></body></html>
