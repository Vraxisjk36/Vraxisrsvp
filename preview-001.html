t+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700&display=swap\"\n      rel=\"stylesheet\"\n    />\n    \u003clink rel=\"stylesheet\" href=\"assets/template-code/d1a6dbefd08fe7c61a0b56a5.css\">\n  \u003cscript src=\"assets/static-media.js?v=1\">\u003c/script>\u003c/head>\n  \u003cbody>\n    \u003cdiv class=\"scroll-progress\" id=\"progress\">\u003c/div>\n    \u003cdiv class=\"intro\" id=\"intro\">\n      \u003cdiv class=\"intro-bg\">\u003c/div>\n      \u003cdiv class=\"intro-inner\">\n        \u003cdiv class=\"eyebrow intro-top\">A PRIVATE INVITATION \u00b7 14 NOVEMBER 2027\u003c/div>\n        \u003cimg\n          class=\"intro-image\"\n          src=\"assets/media/84df55dd43fa59bca762457e-640.webp\"\n          alt=\"Ivory embossed wedding envelope tied with burgundy ribbon and wax seal\"\n        / srcset=\"assets/media/0d30e38778b2897b48fb3701-320.webp 320w, assets/media/84df55dd43fa59bca762457e-640.webp 640w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n        \u003ch1 class=\"serif\">The Heirloom\u003c/h1>\n        \u003cp>Made with love. Opened by you.\u003c/p>\n        \u003cbutton class=\"button\" id=\"openIntro\">Unseal your invitation &nbsp; \u2197\u003c/button>\n        \u003cbutton class=\"skip\" id=\"skipIntro\">Skip opening\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"site-top\">\n      \u003cspan class=\"mark\">A \u003cspan class=\"gold\">&\u003c/span> M\u003c/span>\n      \u003cbutton class=\"nav-btn\" id=\"editOpen\">PERSONALISE \u270e\u003c/button>\n    \u003c/div>\n    \u003cmain id=\"main\">\n      \u003csection class=\"stage full hero\" id=\"home\">\n        \u003cimg\n          class=\"bg\"\n          src=\"assets/media/9b70e9c2978facb7ad968b9c-640.webp\"\n          alt=\"Romantic wedding portrait\"\n          data-photo=\"couple\"\n        / srcset=\"assets/media/07f9769b6955d18d86be7222-320.webp 320w, assets/media/9b70e9c2978facb7ad968b9c-640.webp 640w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\" loading=\"lazy\">\n        \u003cdiv class=\"veil\">\u003c/div>\n        \u003cdiv class=\"hero-content\">\n          \u003cdiv class=\"eyebrow reveal\">THE WEDDING OF\u003c/div>\n          \u003ch1 class=\"serif reveal\">\n            \u003cspan data-text=\"first\">Alexander\u003c/span>\n            \u003cspan class=\"gold\" style=\"font-size: 0.65em; font-style: italic; line-height: 1.15\"\n              >&\u003c/span\n            >\n            \u003cspan data-text=\"second\">Miranda\u003c/span>\n          \u003c/h1>\n          \u003cdiv class=\"hero-date reveal\" data-text=\"date\">SUNDAY, 14 NOVEMBER 2027\u003c/div>\n          \u003cdiv class=\"hero-scroll reveal\">\n            \u003cspan>SCROLL INTO OUR STORY\u003c/span>\n            \u003cspan class=\"scroll-line\"> \u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"letter\" id=\"letter\">\n        \u003cdiv class=\"shell\">\n          \u003cdiv class=\"eyebrow reveal\">A LETTER TO OUR FAVOURITE PEOPLE\u003c/div>\n          \u003ch2 class=\"serif reveal\">\n            Some moments are\u003cbr />\n            \u003ci>meant to be shared.\u003c/i>\n          \u003c/h2>\n          \u003cp class=\"body reveal\" data-text=\"letter\">\n            Of all the beautiful things life has given us, finding each other is our favourite. Now,\n            with full hearts, we invite you to be part of the day we begin our forever.\n          \u003c/p>\n          \u003cdiv class=\"signature reveal\">Alexander & Miranda\u003c/div>\n          \u003cdiv class=\"eyebrow reveal\" style=\"margin-top: 50px\">TAP OUR SEAL FOR A LITTLE NOTE\u003c/div>\n          \u003cbutton class=\"seal-button reveal\" id=\"seal\" aria-expanded=\"false\" aria-controls=\"secret\">\n            A&M\n          \u003c/button>\n          \u003cdiv class=\"secret\" id=\"secret\">\n            \u201cThe best part of our story is getting to share this chapter with you.\u201d\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"memory\" id=\"story\">\n        \u003cdiv class=\"memory-head reveal\">\n          \u003cdiv class=\"eyebrow gold\">CHAPTER ONE \u00b7 THE STORY SO FAR\u003c/div>\n          \u003ch2 class=\"serif\">\n            Before the\u003cbr />\n            \u003ci>forever.\u003c/i>\n          \u003c/h2>\n          \u003cp>Every love story is a collection of little moments. Here are a few of ours.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"memory-scene reveal\">          \u003cbutton class=\"photo a\" data-light=\"memory\" aria-label=\"View first memory\">\n            \u003cimg src=\"assets/media/7d3f88bd7c668e62a726aae3-320.webp\" alt=\"Couple memory\" data-photo=\"memory\" / srcset=\"assets/media/7d3f88bd7c668e62a726aae3-320.webp 320w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\" loading=\"lazy\">\n          \u003c/button>\n          \u003cbutton class=\"photo b\" data-light=\"memory2\" aria-label=\"View second memory\">\n            \u003cimg\n              src=\"assets/media/7d3f88bd7c668e62a726aae3-320.webp\"\n              alt=\"Another memory\"\n              data-photo=\"memory2\"\n            / srcset=\"assets/media/7d3f88bd7c668e62a726aae3-320.webp 320w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\" loading=\"lazy\">\n          \u003c/button>\n          \u003cdiv class=\"memory-note\">It was always you.\u003csmall>EST. OUR FAVOURITE DAY\u003c/small>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"gallery-controls\">\n          \u003cbutton data-light=\"memory\">VIEW MEMORY 01 \u2197\u003c/button>\n          \u003cbutton data-light=\"memory2\">VIEW MEMORY 02 \u2197\u003c/button>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"moment stage\" id=\"moment\">\n        \u003cimg\n          class=\"bg\"\n          src=\"assets/media/08b9887c0bd559740fc76f33-960.webp\"\
