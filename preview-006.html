-width:142px}}\n@media(prefers-reduced-motion:reduce){#reel-intro *,#reel-intro *:before,#reel-intro *:after{animation:none!important;transition-duration:.01ms!important}}\n<\/style><\/head><body><div aria-label=\"Amara's private screening\" aria-modal=\"true\" id=\"reel-intro\" role=\"dialog\"><div class=\"reel-grain\"><\/div><header class=\"reel-top\"><span>AFTER HOURS <i> / <\/i> A PRIVATE SCREENING<\/span><button id=\"reel-skip\" type=\"button\">SKIP INTRO \u2197<\/button><\/header><div class=\"reel-beam\"><\/div><main class=\"reel-stage\"><div class=\"reel-kicker\" id=\"reel-kicker\">A STORY IN THREE FRAMES<\/div><h1 class=\"reel-title\" id=\"reel-title\">The moments that made <em id=\"reel-name\">Amara<\/em><\/h1><div class=\"reel-machine\"><div class=\"reel-strip\" id=\"reel-strip\"><div aria-hidden=\"true\" class=\"reel-perfs\"><\/div><div class=\"reel-window\"><img alt=\"A memory of the birthday celebrant\" id=\"reel-image\" src=\"https://images.unsplash.com/photo-1517841905240-472988babdf9?w=1000&amp;q=85\"/><div class=\"reel-image-shade\"><\/div><div class=\"reel-counter\"><span id=\"reel-number\">01<\/span> / 03<\/div><\/div><div aria-hidden=\"true\" class=\"reel-perfs\"><\/div><\/div><div class=\"reel-sprocket left\"><\/div><div class=\"reel-sprocket right\"><\/div><\/div><div aria-live=\"polite\" class=\"reel-caption\"><span id=\"reel-chapter\">FRAME 01 \u2014 THE BEGINNING<\/span><p id=\"reel-memory\">Every unforgettable story starts somewhere.<\/p><\/div><div class=\"reel-actions\"><button aria-label=\"Previous memory\" id=\"reel-back\" type=\"button\">\u2190<\/button><div class=\"reel-dots\" id=\"reel-dots\"><span class=\"on\"><\/span><span><\/span><span><\/span><\/div><button id=\"reel-next\" type=\"button\">NEXT FRAME \u2192<\/button><\/div><p class=\"reel-hint\">SWIPE THE FILM TO EXPLORE<\/p><\/main><section aria-hidden=\"true\" class=\"reel-final\" id=\"reel-final\"><div class=\"reel-final-photo\"><\/div><div class=\"reel-final-content\"><span>THE FINAL FRAME \u00b7 AN INVITATION<\/span><p>Now showing<\/p><h2 id=\"reel-final-name\">Amara<\/h2><em>A night in her honour.<\/em><button id=\"reel-enter\" type=\"button\">ENTER THE CELEBRATION \u2197<\/button><\/div><\/section><div class=\"reel-bottom\">35 MM / MEMORIES IN MOTION <span>VRAXISRSVP \u00b7 006<\/span><\/div><\/div><div class=\"grain\"><\/div><div class=\"progress\" id=\"progress\"><\/div><header class=\"top\"><a class=\"logo\" href=\"#top\">AFTER HOURS<span style=\"color:var(--gold)\">.<\/span><\/a><nav><a href=\"#honour\">The Honour<\/a><a href=\"#details\">The Invitation<\/a><a href=\"#programme\">The Evening<\/a><a href=\"#gallery\">Gallery<\/a><a href=\"#rsvp\">RSVP<\/a><\/nav><button onclick=\"document.querySelector('#rsvp').scrollIntoView({behavior:'smooth'})\">Guest Register \u2197<\/button><\/header><main><section class=\"hero\" id=\"top\"><div aria-hidden=\"true\" class=\"honour-hero-image\"><\/div><div class=\"honour-hero-content\"><div class=\"honour-kicker\">AN INVITATION TO CELEBRATE <span data-bind=\"name\">Amara<\/span><\/div><div class=\"honour-rule\"><\/div><p class=\"honour-script\">A life worth celebrating<\/p><h1 class=\"serif\"><span data-bind=\"name\">Amara<\/span><small>turns<\/small><b data-bind=\"age\">30<\/b><\/h1><p class=\"honour-tag\">Thirty years of stories. One unforgettable night.<\/p><div class=\"honour-actions\"><a class=\"goldbtn\" href=\"#memories\">Discover her story \u2193<\/a><a class=\"honour-link\" href=\"#details\">The invitation \u2197<\/a><\/div><p class=\"honour-date\">SATURDAY \u00b7 14 NOVEMBER 2026<\/p><\/div><\/section><div class=\"ticker\"><span>THE OCCASION / 40 YEARS<\/span><span>THE HOST / <span data-bind=\"name\">Amara<\/span><\/span><span>THE DRESS / BLACK TIE<\/span><span>THE NIGHT / YOURS<\/span><\/div><section class=\"intro\" id=\"honour\"><div class=\"wrap reveal\"><div class=\"eyebrow\">FOR THE ONE WHO MAKES LIFE BRIGHTER<\/div><div class=\"rule\"><\/div><h2 class=\"serif\">Not just another birthday.<br/><i>Her story, celebrated.<\/i><\/h2><p>Every person carries a thousand beautiful moments. This evening is for the laughter, the lessons, the people who stayed, and all the chapters still waiting to be written.<\/p><div class=\"intro-signature\">With love, from all of us \u2661<\/div><\/div><\/section><section class=\"memory-chapters\" id=\"memories\"><div class=\"wrap\"><div class=\"memory-header reveal\"><span class=\"eyebrow\">01 / A LIFE IN CHAPTERS<\/span><h2 class=\"serif\">The making of <em data-bind=\"name\">Amara<\/em><\/h2><p>Three chapters. A thousand moments. A story that's still being written.<\/p><\/div><div class=\"memory-chapter reveal\"><div class=\"memory-photo\"><img alt=\"A warm portrait representing early memories\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1517841905240-472988babdf9?w=1200&amp;q=85\"/><span>01 / THE BEGINNING<\/span><\/div><div class=\"memory-copy\"><span class=\"eyebrow\">THE EARLY CHAPTERS<\/span><div class=\"memory-number\">01<\/div><h3 class=\"serif\">Where it<br/><i>all began.<\/i><\/h3><p id=\"memoryText1\">Before the big dreams and unforgettable nights, there was a girl with a bright smile and a world of possibilities ahead. Every beautiful story has a beginning. This is hers.<\/p><div class=\"memory-foot\">A LITTLE GIRL. A BIG WORLD.<\/div><\/div><\/div><div class=\"memory-chapter reverse reveal\"><div class=\"memory-photo\"><img alt=\"A portrait representing the journey of becoming\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=1200&amp;q=85\"/><span>02 / THE BECOMING<\/span><\/div><div class=\"memory-copy\"><span class=\"eyebrow\">ALL THE YEARS BETWEEN<\/span><div class=\"memory-number\">02<\/div><h3 class=\"serif\">Becoming<br/><i>herself.<\/i><\/h3><p id=\"memoryText2\">Through every change, every unexpected turn and every brave new beginning, she became more herself. The woman we know today is made of courage, tenderness and a little magic.<\/p><div class=\"memory-foot\">EVERY VERSION, WORTH LOVING.<\/div><\/div><\/div><div class=\"memory-chapter reveal\"><div class=\"memory-photo\"><img alt=\"An elegant celebratory portrait\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=1200&amp;q=85\"/><span>03 / THE CELEBRATION<\/span><\/div><div class=\"memory-copy\"><span class=\"eyebrow\">THE NEXT BEAUTIFUL CHAPTER<\/span><div class=\"memory-number\">03<\/div><h3 class=\"serif\">And now,<br/><i>the best part.<\/i><\/h3><p id=\"memoryText3\">Thirty looks beautiful on her. Not because of a number, but because of everything it represents: the memories made, the love given, and the extraordinary life still unfolding.<\/p><div class=\"memory-foot\">THE STORY CONTINUES WITH YOU.<\/div><\/div><\/div><\/div><\/section><section class=\"interlude\"><div class=\"reveal\"><p>A PERSONAL INVITATION FROM <span data-bind=\"name\">Amara<\/span><\/p><blockquote id=\"hostQuote\">\u201cI've been lucky enough to share so many beautiful moments with you. I couldn't imagine celebrating this one without you.\u201d<\/blockquote><p>LET'S MAKE ANOTHER MEMORY TOGETHER.<\/p><\/div><\/section><section class=\"details\" id=\"details\"><div class=\"wrap\"><div class=\"section-head reveal\"><div><div class=\"eyebrow\">02 / THE CELEBRATION<\/div><h2 class=\"serif\">Come celebrate with me.<\/h2><\/div><span class=\"eyebrow\">Strictly by invitation<\/span><\/div><div class=\"detail-grid\"><div class=\"detail-feature reveal\"><img alt=\"Elegant evening event venue\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1519167758481-83f550bb49b3?w=1200&amp;q=85\"/><div class=\"text\"><div class=\"eyebrow\">Your destination<\/div><h3 data-bind=\"venue\">The Glasshouse<\/h3><p data-bind=\"address\">Johannesburg, South Africa<\/p><a href=\"https://www.google.com/maps/search/?api=1&amp;query=Johannesburg%20South%20Africa\" id=\"directions\" rel=\"noopener\" target=\"_blank\">Get directions \u2197<\/a><\/div><\/div><div class=\"detail-card reveal\"><div><div class=\"eyebrow\">The date to remember<\/div><div class=\"date\"><span id=\"day\">14<\/span><small id=\"monthYear\">NOVEMBER \u00b7 2026<\/small><\/div><div class=\"split-rule\"><\/div><div class=\"eyebrow\">Arrival time<\/div><h3 data-bind=\"time\">18:30 \u2014 Late<\/h3><p>We recommend arriving on time. The best evenings begin together.<\/p><\/div><div><div class=\"split-rule\"><\/div><div class=\"eyebrow\">The dress code<\/div><h3>Black Tie, Reimagined.<\/h3><p>Make an entrance. Dark tailoring, evening silhouettes, statement details.<\/p><a href=\"#dress\">View the style note \u2197<\/a><div style=\"height:20px\"><\/div><a href=\"#\" id=\"calendar\">Add to calendar \u2197<\/a><\/div><\/div><\/div><\/div><\/section><section class=\"schedule\" id=\"programme\"><div class=\"wrap\"><div class=\"section-head reveal\"><div><div class=\"eyebrow\">03 / The evening unfolds<\/div><h2 class=\"serif\">A night to remember.<\/h2><\/div><span class=\"eyebrow\">Tap an act to explore<\/span><\/div><div class=\"schedule-layout\"><div class=\"scene-visual\"><img alt=\"Evening programme atmosphere\" id=\"sceneImage\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=1000&amp;q=85\"/><div class=\"scene-caption\" id=\"sceneCaption\">Act I \u00b7 The arrival<\/div><\/div><div id=\"sceneRows\"><div class=\"scene-row active\" data-scene=\"0\" role=\"button\" tabindex=\"0\"><time>18:30<\/time><div><h3>The Arrival<\/h3><p>The first glass is poured. Familiar faces meet under warm lights. The night begins.<\/p><\/div><b>\u2197<\/b><\/div><div class=\"scene-row\" data-scene=\"1\" role=\"button\" tabindex=\"0\"><time>19:15<\/time><div><h3>The First Toast<\/h3><p>Champagne, conversation and the first moments worth remembering.<\/p><\/div><b>\u2197<\/b><\/div><div class=\"scene-row\" data-scene=\"2\" role=\"button\" tabindex=\"0\"><time>20:00<\/time><div><h3>At the Table<\/h3><p>An intimate dinner, beautifully served, with stories that never grow old.<\/p><\/div><b>\u2197<\/b><\/div><div class=\"scene-row\" data-scene=\"3\" role=\"button\" tabindex=\"0\"><time>21:30<\/time><div><h3>In Her Honour<\/h3><p>A few words, a little laughter, and a celebration of the woman behind the evening.<\/p><\/div><b>\u2197<\/b><\/div><div class=\"scene-row\" data-scene=\"4\" role=\"button\" tabindex=\"0\"><time>22:00<\/time><div><h3>After Hours<\/h3><p>The formalities end. The lights dim. The night becomes whatever we make it.<\/p><\/div><b>\u2197<\/b><\/div><\/div><\/div><\/div><\/section><section class=\"gallery\" id=\"gallery\"><div class=\"wrap\"><div class=\"section-head reveal\"><div><div class=\"eyebrow\">04 / The private collection<\/div><h2 class=\"serif\">The moments that made her.<\/h2><\/div><span class=\"eyebrow\">Tap to view \u00b7 Swipe on mobile<\/span><\/div><div class=\"gallery-grid\" id=\"galleryGrid\"><button class=\"gallery-item\" data-index=\"0\"><img alt=\"Portrait one\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=1000&amp;q=80\"/><span>01 / The portrait<\/span><\/button><button class=\"gallery-item\" data-index=\"1\"><img alt=\"Portrait two\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1517841905240-472988babdf9?w=800&amp;q=80\"/><span>02 / The smile<\/span><\/button><button class=\"gallery-item\" data-index=\"2\"><img alt=\"Portrait three\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=800&amp;q=80\"/><span>03 / The moment<\/span><\/button><button class=\"gallery-item\" data-index=\"3\"><img alt=\"Portrait four\" loading=\"lazy\" src=\"https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?w=1100&amp;q=80\"/><span>04 / The story continues<\/span><\/button><\/div><\/div><\/section><section class=\"dress\" id=\"dress\"><div class=\"wrap dress-layout\"><div class=\"reveal\"><div class=\"eyebrow\">05 / The style note<\/div><h2 class=\"serif\">Dress like<br/>the night<br/>is yours.<\/h2><p>Black tie, but never ordinary. Think beautifully cut suits, sculptural eveningwear, satin, velvet, and the confidence to make the room yours.<\/p><div class=\"swatches\"><i style=\"background:#111\"><\/i><i style=\"background:#f2e7d5\"><\/i><i style=\"background:#455748\"><\/i><i style=\"background:#ae8d58\"><\/i><\/div><\/div><div aria-label=\"Formal evening style inspiration\" class=\"dress-img reveal\" role=\"img\"><\/div><\/div><\/section><section class=\"rsvp\" id=\"rsvp\"><div class=\"wrap rsvp-layout\"><div class=\"reveal\"><div class=\"eyebrow\">06 / A SEAT SAVED FOR YOU<\/div><h2 class=\"serif\">Will you celebrate with me?<\/h2><p>The only thing missing from this celebration is you. Please let me know if you can make it.<\/p><p><strong>Kindly reply by 01 November 2026.<\/strong><\/p><\/div><form class=\"reveal\" id=\"rsvpForm\"><div id=\"formFields\"><div class=\"eyebrow\" style=\"color:#88704d;margin-bottom:28px\">Private attendance confirmation<\/div><div class=\"field\"><label for=\"guestName\">Your full name<\/label><input id=\"guestName\" maxlength=\"100\" placeholder=\"As it appears on your invitation\" required=\"\"/><\/div><div class=\"field\"><label>Will you be joining us?<\/label><div class=\"choices\"><button aria-pressed=\"false\" class=\"choice\" data-answer=\"yes\" type=\"button\">Delighted to attend<\/button><button aria-pressed=\"false\" class=\"choice\" data-answer=\"no\" type=\"button\">Regretfully decline<\/button><\/div><\/div><div hidden=\"\" id=\"attendingFields\"><div class=\"field\"><label for=\"guestCount\">Number of guests<\/label><select id=\"guestCount\"><option value=\"1\">Just me<\/option><option value=\"2\">Two guests<\/option><option value=\"3\">Three guests<\/option><option value=\"4\">Four guests<\/option><\/select><\/div><div class=\"field\"><label for=\"dietary\">Dietary notes (optional)<\/label><input id=\"dietary\" maxlength=\"250\" placeholder=\"Anything we should know?\"/><\/div><\/div><div class=\"field\"><label for=\"message\">A note for <span data-bind=\"name\">Amara<\/span> (optional)<\/label><textarea id=\"message\" maxlength=\"500\" placeholder=\"Leave a birthday wish...\" rows=\"3\"><\/textarea><\/div><button class=\"goldbtn\" type=\"submit\">Confirm my response \u2197<\/button><p style=\"font-size:11px;margin-bottom:0\">Preview only \u2014 no response is transmitted or saved.<\/p><\/div><div aria-live=\"polite\" class=\"success\" id=\"success\"><div class=\"eyebrow\" style=\"color:#88704d\">Your response<\/div><h3>With gratitude.<\/h3><p id=\"responseText\"><\/p><button class=\"goldbtn\" id=\"editResponse\" type=\"button\">Edit response<\/button><\/div><\/form><\/div><\/section><\/main><footer class=\"footer\"><div class=\"wrap\"><p>One night only \u00b7 An evening in honour of <span data-bind=\"name\">Amara<\/span><\/p><h2>AFTER HOURS.<\/h2><a class=\"outline\" href=\"#top\">Back to the beginning \u2191<\/a><small>VraxisRSVP \u00b7 Template 006 \u00b7 Prestige Collection \u00b7 Demonstration<\/small><\/div><\/footer><div aria-label=\"Photo gallery\" aria-modal=\"true\" class=\"lightbox\" id=\"lightbox\" role=\"dialog\"><button aria-label=\"Close gallery\" class=\"lbclose\" id=\"lbclose\">\u00d7<\/button><button aria-label=\"Previous photo\" class=\"lbprev\" id=\"lbprev\">\u2039<\/button><img alt=\"Selected gallery photograph\" id=\"lbimage\"/><button aria-label=\"Next photo\" class=\"lbnext\" id=\"lbnext\">\u203a<\/button><div class=\"lbcap\" id=\"lbcap\"><\/div><\/div><div class=\"studio\"><div class=\"studio-panel\" id=\"studioPanel\"><h3>Personalise your invitation.<\/h3><p style=\"font-size:11px;line-height:1.6\">Changes update this preview. Export your settings for later integration.<\/p><label for=\"editName\">Guest of honour<\/label><input id=\"editName\" value=\"Amara\"/><label for=\"editAge\">Milestone age<\/label><input id=\"editAge\" max=\"120\" min=\"1\" type=\"number\" value=\"30\"/><label for=\"editDate\">Event date<\/label><input id=\"editDate\" type=\"date\" value=\"2026-11-14\"/><label for=\"editTime\">Arrival time<\/label><input id=\"editTime\" value=\"18:30 \u2014 Late\"/><label for=\"editVenue\">Venue<\/label><input id=\"editVenue\" value=\"The Glasshouse\"/><label for=\"editAddress\">Location<\/label><input id=\"editAddress\" value=\"Johannesburg, South Africa\"/><label for=\"editTribute\">Tribute paragraph<\/label><textarea id=\"editTribute\" rows=\"4\">Thirty years of becoming, loving, growing and making ordinary days extraordinary. Tonight we celebrate all of it\u2014and all that is still to come.<\/textarea><label for=\"editHero\">Hero image URL<\/label><input id=\"editHero\" placeholder=\"https://...\"/><label for=\"editPortrait\">Portrait image URL<\/label><input id=\"editPortrait\" placeholder=\"https://...\"/><label for=\"editMemory1\">Chapter 1 \u2014 The Beginning<\/label><textarea id=\"editMemory1\" rows=\"3\">Before the big dreams and unforgettable nights, there was a girl with a bright smile and a world of possibilities ahead. Every beautiful story has a beginning. This is hers.<\/textarea><label for=\"editMemory2\">Chapter 2 \u2014 The Becoming<\/label><textarea id=\"editMemory2\" rows=\"3\">Through every change, every unexpected turn and every brave new beginning, she became more herself. The woman we know today is made of courage, tenderness and a little magic.<\/textarea><label for=\"editMemory3\">Chapter 3 \u2014 The Celebration<\/label><textarea id=\"editMemory3\" rows=\"3\">Thirty looks beautiful on her. Not because of a number, but because of everything it represents: the memories made, the love given, and the extraordinary life still unfolding.<\/textarea><label for=\"editQuote\">A note from the host<\/label><textarea id=\"editQuote\" rows=\"3\">I've been lucky enough to share so many beautiful moments with you. I couldn't imagine celebrating this one without you.<\/textarea><button id=\"exportSettings\">Export personalisation JSON<\/button><\/div><button aria-expanded=\"fal
