e-shade\">\u003c/div>\n              \u003cdiv class=\"reel-counter\">\u003cspan id=\"reel-number\">01\u003c/span> / 03\u003c/div>\n            \u003c/div>\n            \u003cdiv aria-hidden=\"true\" class=\"reel-perfs\">\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"reel-sprocket left\">\u003c/div>\n          \u003cdiv class=\"reel-sprocket right\">\u003c/div>\n        \u003c/div>\n        \u003cdiv aria-live=\"polite\" class=\"reel-caption\">\n          \u003cspan id=\"reel-chapter\">FRAME 01 \u2014 THE BEGINNING\u003c/span>\n          \u003cp id=\"reel-memory\">Every unforgettable story starts somewhere.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"reel-actions\">\n          \u003cbutton aria-label=\"Previous memory\" id=\"reel-back\" type=\"button\">\u2190\u003c/button>\n          \u003cdiv class=\"reel-dots\" id=\"reel-dots\">\n            \u003cspan class=\"on\"> \u003c/span>\n            \u003cspan> \u003c/span>\n            \u003cspan> \u003c/span>\n          \u003c/div>\n          \u003cbutton id=\"reel-next\" type=\"button\">NEXT FRAME \u2192\u003c/button>\n        \u003c/div>\n        \u003cp class=\"reel-hint\">SWIPE THE FILM TO EXPLORE\u003c/p>\n      \u003c/main>\n      \u003csection aria-hidden=\"true\" class=\"reel-final\" id=\"reel-final\">\n        \u003cdiv class=\"reel-final-photo\">\u003c/div>\n        \u003cdiv class=\"reel-final-content\">\n          \u003cspan>THE FINAL FRAME \u00b7 AN INVITATION\u003c/span>\n          \u003cp>Now showing\u003c/p>\n          \u003ch2 id=\"reel-final-name\">Amara\u003c/h2>\n          \u003cem>A night in her honour.\u003c/em>\n          \u003cbutton id=\"reel-enter\" type=\"button\">ENTER THE CELEBRATION \u2197\u003c/button>\n        \u003c/div>\n      \u003c/section>\n      \u003cdiv class=\"reel-bottom\">35 MM / MEMORIES IN MOTION \u003cspan>VRAXISRSVP \u00b7 006\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"grain\">\u003c/div>\n    \u003cdiv class=\"progress\" id=\"progress\">\u003c/div>\n    \u003cheader class=\"top\">\n      \u003ca class=\"logo\" href=\"#top\">AFTER HOURS\u003cspan style=\"color: var(--gold)\">.\u003c/span> \u003c/a>\n      \u003cnav>\n        \u003ca href=\"#honour\">The Honour\u003c/a>\n        \u003ca href=\"#details\">The Invitation\u003c/a>\n        \u003ca href=\"#programme\">The Evening\u003c/a>\n        \u003ca href=\"#gallery\">Gallery\u003c/a>\n        \u003ca href=\"#rsvp\">RSVP\u003c/a>\n      \u003c/nav>\n      \u003cbutton onclick=\"document.querySelector('#rsvp').scrollIntoView({ behavior: 'smooth' })\">\n        Guest Register \u2197\n      \u003c/button>\n    \u003c/header>\n    \u003cmain>\n      \u003csection class=\"hero\" id=\"top\">\n        \u003cdiv aria-hidden=\"true\" class=\"honour-hero-image\">\u003c/div>\n        \u003cdiv class=\"honour-hero-content\">\n          \u003cdiv class=\"honour-kicker\">\n            AN INVITATION TO CELEBRATE \u003cspan data-bind=\"name\">Amara\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"honour-rule\">\u003c/div>\n          \u003cp class=\"honour-script\">A life worth celebrating\u003c/p>\n          \u003ch1 class=\"serif\">\n            \u003cspan data-bind=\"name\">Amara\u003c/span>\n            \u003csmall>turns\u003c/small>\n            \u003cb data-bind=\"age\">30\u003c/b>\n          \u003c/h1>\n          \u003cp class=\"honour-tag\">Thirty years of stories. One unforgettable night.\u003c/p>\n          \u003cdiv class=\"honour-actions\">\n            \u003ca class=\"goldbtn\" href=\"#memories\">Discover her story \u2193\u003c/a>\n            \u003ca class=\"honour-link\" href=\"#details\">The invitation \u2197\u003c/a>\n          \u003c/div>\n          \u003cp class=\"honour-date\">SATURDAY \u00b7 14 NOVEMBER 2026\u003c/p>\n        \u003c/div>\n      \u003c/section>\n      \u003cdiv class=\"ticker\">\n        \u003cspan>THE OCCASION / 40 YEARS\u003c/span>\n        \u003cspan>THE HOST / \u003cspan data-bind=\"name\">Amara\u003c/span> \u003c/span>\n        \u003cspan>THE DRESS / BLACK TIE\u003c/span>\n        \u003cspan>THE NIGHT / YOURS\u003c/span>\n      \u003c/div>\n      \u003csection class=\"intro\" id=\"honour\">\n        \u003cdiv class=\"wrap reveal\">\n          \u003cdiv class=\"eyebrow\">FOR THE ONE WHO MAKES LIFE BRIGHTER\u003c/div>\n          \u003cdiv class=\"rule\">\u003c/div>\n          \u003ch2 class=\"serif\">\n            Not just another birthday.\u003cbr />\n            \u003ci>Her story, celebrated.\u003c/i>\n          \u003c/h2>\n          \u003cp id=\"tribute\">\n            Every person carries a thousand beautiful moments. This evening is for the laughter, the\n            lessons, the people who stayed, and all the chapters still waiting to be written.\n          \u003c/p>\n          \u003cdiv class=\"intro-signature\">With love, from all of us \u2661\u003c/div>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"memory-chapters\" id=\"memories\">\n        \u003cdiv class=\"wrap\">\n          \u003cdiv class=\"memory-header reveal\">\n            \u003cspan class=\"eyebrow\">01 / A LIFE IN CHAPTERS\u003c/span>\n            \u003ch2 class=\"serif\">The making of \u003cem data-bind=\"name\">Amara\u003c/em>\u003c/h2>\n            \u003cp>Three chapters. A thousand moments. A story that's still being written.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"memory-chapter reveal\">\n            \u003cdiv class=\"memory-photo\">\n              \u003cimg\n                alt=\"A warm portrait representing early memories\"\n                loading=\"lazy\"\n                src=\"assets/media/6e619f01882e6c12f484d632-960.webp\"\n              / srcset=\"assets/media/af5d2f696d42d455049ebca7-320.webp 320w, assets/media/cd3b294805692295584e668b-640.webp 640w, assets/media/6e619f01882e6c12f484d632-960.webp 960w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n              \u003cspan>01 / THE BEGINNING\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"memory-copy\">\n              \u003cspan class=\"eyebrow\">THE EARLY CHAPTERS\u003c/span>\n              \u003cdiv class=\"memory-number\">01\u003c/div>\n              \u003ch3 class=\"serif\">\n                Where it\u003cbr />\n                \u003ci>all began.\u003c/i>\n              \u003c/h3>\n              \u003cp id=\"memoryText1\">\n                Before the big dreams and unforgettable nights, there was a girl with a bright smile\n                and a world of possibilities ahead. Every beautiful story has a beginning. This is\n                hers.\n              \u003c/p>\n              \u003cdiv class=\"memory-foot\">A LITTLE GIRL. A BIG WORLD.\u003c/div>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"memory-chapter reverse reveal\">\n            \u003cdiv class=\"memory-photo\">\n              \u003cimg\n                alt=\"A portrait representing the journey of becoming\"\n                loading=\"lazy\"\n                src=\"assets/media/1853599e6a21760c652bd5d6-960.webp\"\n              / srcset=\"assets/media/04415ef16fd73c9aa7b3ef34-320.webp 320w, assets/media/c36f46d338bec2c271dc144f-640.webp 640w, assets/media/1853599e6a21760c652bd5d6-960.webp 960w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n              \u003cspan>02 / THE BECOMING\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"memory-copy\">\n              \u003cspan class=\"eyebrow\">ALL THE YEARS BETWEEN\u003c/span>\n              \u003cdiv class=\"memory-number\">02\u003c/div>\n              \u003ch3 class=\"serif\">\n                Becoming\u003cbr />\n                \u003ci>herself.\u003c/i>\n              \u003c/h3>\n              \u003cp id=\"memoryText2\">\n                Through every change, every unexpected turn and every brave new beginning, she\n                became more herself. The woman we know today is made of courage, tenderness and a\n                little magic.\n              \u003c/p>\n              \u003cdiv class=\"memory-foot\">EVERY VERSION, WORTH LOVING.\u003c/div>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"memory-chapter reveal\">\n            \u003cdiv class=\"memory-photo\">\n              \u003cimg\n                alt=\"An elegant celebratory portrait\"\n                loading=\"lazy\"\n                src=\"assets/media/a947cb572fbe4c83d653c2b1-640.webp\"\n              / srcset=\"assets/media/94daca53aed7a3724987d111-320.webp 320w, assets/media/a947cb572fbe4c83d653c2b1-640.webp 640w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n              \u003cspan>03 / THE CELEBRATION\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"memory-copy\">\n              \u003cspan class=\"eyebrow\">THE NEXT BEAUTIFUL CHAPTER\u003c/span>\n              \u003cdiv class=\"memory-number\">03\u003c/div>\n              \u003ch3 class=\"serif\">\n                And now,\u003cbr />\n                \u003ci>the best part.\u003c/i>\n              \u003c/h3>\n              \u003cp id=\"memoryText3\">\n                Thirty looks beautiful on her. Not because of a number, but because of everything it\n                represents: the memories made, the love given, and the extraordinary life still\n                unfolding.\n              \u003c/p>\n              \u003cdiv class=\"memory-foot\">THE STORY CONTINUES WITH YOU.\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"interlude\">\n        \u003cdiv class=\"reveal\">\n          \u003cp>A PERSONAL INVITATION FROM \u003cspan data-bind=\"name\">Amara\u003c/span>\u003c/p>\n          \u003cblockquote id=\"hostQuote\">\n            \u201cI've been lucky enough to share so many beautiful moments with you. I couldn't imagine\n            celebrating this one without you.\u201d\n          \u003c/blockquote>\n          \u003cp>LET'S MAKE ANOTHER MEMORY TOGETHER.\u003c/p>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"details\" id=\"details\">\n        \u003cdiv class=\"wrap\">\n          \u003cdiv class=\"section-head reveal\">\n            \u003cdiv>\n              \u003cdiv class=\"eyebrow\">02 / THE CELEBRATION\u003c/div>\n              \u003ch2 class=\"serif\">Come celebrate with me.\u003c/h2>\n            \u003c/div>\n            \u003cspan class=\"eyebrow\">Strictly by invitation\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"detail-grid\">\n            \u003cdiv class=\"detail-feature reveal\">\n              \u003cimg\n                alt=\"Elegant evening event venue\"\n                loading=\"lazy\"\n                src=\"assets/media/2c271c5f52631165e7a42720-960.webp\"\n              / srcset=\"assets/media/16ac3bab5995d3689dd573d7-320.webp 320w, assets/media/2a03700cd6a817f7b21979da-640.webp 640w, assets/media/2c271c5f52631165e7a42720-960.webp 960w, assets/media/3b4afb56de7ab6044438649b-1440.webp 1439w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n              \u003cdiv class=\"text\">\n                \u003cdiv class=\"eyebrow\">Your destination\u003c/div>\n                \u003ch3 data-bind=\"venue\">The Glasshouse\u003c/h3>\n                \u003cp data-bind=\"address\">Johannesburg, South Africa\u003c/p>\n                \u003ca\n                  href=\"https://www.google.com/maps/search/?api=1&amp;query=Johannesburg%20South%20Africa\"\n                  id=\"directions\"\n                  rel=\"noopener\"\n                  target=\"_blank\"\n                  >Get directions \u2197\u003c/a\n                >\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"detail-card reveal\">\n              \u003cdiv>\n                \u003cdiv class=\"eyebrow\">The date to remember\u003c/div>\n                \u003cdiv class=\"date\">\n                  \u003cspan id=\"day\">14\u003c/span>\n                  \u003csmall id=\"monthYear\">NOVEMBER \u00b7 2026\u003c/small>\n                \u003c/div>\n                \u003cdiv class=\"split-rule\">\u003c/div>\n                \u003cdiv class=\"eyebrow\">Arrival time\u003c/div>\n                \u003ch3 data-bind=\"time\">18:30 \u2014 Late\u003c/h3>\n                \u003cp>We recommend arriving on time. The best evenings begin together.\u003c/p>\n              \u003c/div>\n              \u003cdiv>\n                \u003cdiv class=\"split-rule\">\u003c/div>\n                \u003cdiv class=\"eyebrow\">The dress code\u003c/div>\n                \u003ch3>Black Tie, Reimagined.\u003c/h3>\n                \u003cp>Make an entrance. Dark tailoring, evening silhouettes, statement details.\u003c/p>\n                \u003ca href=\"#dress\">View the style note \u2197\u003c/a>\n                \u003cdiv style=\"height: 20px\">\u003c/div>\n                \u003ca href=\"#\" id=\"calendar\">Add to calendar \u2197\u003c/a>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"schedule\" id=\"programme\">\n        \u003cdiv class=\"wrap\">\n          \u003cdiv class=\"section-head reveal\">\n            \u003cdiv>\n              \u003cdiv class=\"eyebrow\">03 / The evening unfolds\u003c/div>\n              \u003ch2 class=\"serif\">A night to remember.\u003c/h2>\n            \u003c/div>\n            \u003cspan class=\"eyebrow\">Tap an act to explore\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"schedule-layout\">\n            \u003cdiv class=\"scene-visual\">\n              \u003cimg\n                alt=\"Guests celebrating together at an evening party\"\n                id=\"sceneImage\"\n                loading=\"lazy\"\n                src=\"assets/media/dfe38ffb72c4cd7e23664e71-960.webp\"\n              / srcset=\"assets/media/7a5849d6b2e8a69f00d7d2ec-320.webp 320w, assets/media/e33e80bd3ba639e44d08eb45-640.webp 639w, assets/media/dfe38ffb72c4cd7e23664e71-960.webp 960w, assets/media/eef9af5a8946fb750af6f38b-1440.webp 1440w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n              \u003cdiv class=\"scene-caption\" id=\"sceneCaption\">Act I \u00b7 The arrival\u003c/div>\n            \u003c/div>\n            \u003cdiv id=\"sceneRows\">\n              \u003cdiv class=\"scene-row active\" data-scene=\"0\" role=\"button\" tabindex=\"0\">\n                \u003ctime>18:30\u003c/time>\n                \u003cdiv>\n                  \u003ch3>The Arrival\u003c/h3>\n                  \u003cp>\n                    The first glass is poured. Familiar faces meet under warm lights. The night\n                    begins.\n                  \u003c/p>\n                \u003c/div>\n                \u003cb>\u2197\u003c/b>\n              \u003c/div>\n              \u003cdiv class=\"scene-row\" data-scene=\"1\" role=\"button\" tabindex=\"0\">\n                \u003ctime>19:15\u003c/time>\n                \u003cdiv>\n                  \u003ch3>The First Toast\u003c/h3>\n                  \u003cp>Champagne, conversation and the first moments worth remembering.\u003c/p>\n                \u003c/div>\n                \u003cb>\u2197\u003c/b>\n              \u003c/div>\n              \u003cdiv class=\"scene-row\" data-scene=\"2\" role=\"button\" tabindex=\"0\">\n                \u003ctime>20:00\u003c/time>\n                \u003cdiv>\n                  \u003ch3>At the Table\u003c/h3>\n                  \u003cp>An intimate dinner, beautifully served, with stories that never grow old.\u003c/p>\n                \u003c/div>\n                \u003cb>\u2197\u003c/b>\n              \u003c/div>\n              \u003cdiv class=\"scene-row\" data-scene=\"3\" role=\"button\" tabindex=\"0\">\n                \u003ctime>21:30\u003c/time>\n                \u003cdiv>\n                  \u003ch3>In Her Honour\u003c/h3>\n                  \u003cp>\n                    A few words, a little laughter, and a celebration of the woman behind the\n                    evening.\n                  \u003c/p>\n                \u003c/div>\n                \u003cb>\u2197\u003c/b>\n              \u003c/div>\n              \u003cdiv class=\"scene-row\" data-scene=\"4\" role=\"button\" tabindex=\"0\">\n                \u003ctime>22:00\u003c/time>\n                \u003cdiv>\n                  \u003ch3>After Hours\u003c/h3>\n                  \u003cp>The formalities end. The lights dim. The night becomes whatever we make it.\u003c/p>\n                \u003c/div>\n                \u003cb>\u2197\u003c/b>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"gallery\" id=\"gallery\">\n        \u003cdiv class=\"wrap\">\n          \u003cdiv class=\"section-head reveal\">\n            \u003cdiv>\n              \u003cdiv class=\"eyebrow\">04 / The private collection\u003c/div>\n              \u003ch2 class=\"serif\">The moments that made her.\u003c/h2>\n            \u003c/div>\n            \u003cspan class=\"eyebrow\">Tap to view \u00b7 Swipe on mobile\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"gallery-grid\" id=\"galleryGrid\">\n            \u003cbutton class=\"gallery-item\" data-index=\"0\">\n              \u003cimg\n                alt=\"Portrait one\"\n                loading=\"lazy\"\n                src=\"assets/media/1853599e6a21760c652bd5d6-960.webp\"\n              / srcset=\"assets/media/04415ef16fd73c9aa7b3ef34-320.webp 320w, assets/media/c36f46d338bec2c271dc144f-640.webp 640w, assets/media/1853599e6a21760c652bd5d6-960.webp 960w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n              \u003cspan>01 / The portrait\u003c/span>\n            \u003c/button>\n            \u003cbutton class=\"gallery-item\" data-index=\"1\">\n              \u003cimg\n                alt=\"Portrait two\"\n                loading=\"lazy\"\n                src=\"assets/media/6e619f01882e6c12f484d632-960.webp\"\n              / srcset=\"assets/media/af5d2f696d42d455049ebca7-320.webp 320w, assets/media/cd3b294805692295584e668b-640.webp 640w, assets/media/6e619f01882e6c12f484d632-960.webp 960w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n              \u003cspan>02 / The smile\u003c/span>\n            \u003c/button>\n            \u003cbutton class=\"gallery-item\" data-index=\"2\">\n              \u003cimg\n                alt=\"Portrait three\"\n                loading=\"lazy\"\n                src=\"assets/media/a947cb572fbe4c83d653c2b1-640.webp\"\n              / srcset=\"assets/media/94daca53aed7a3724987d111-320.webp 320w, assets/media/a947cb572fbe4c83d653c2b1-640.webp 640w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n              \u003cspan>03 / The moment\u003c/span>\n            \u003c/button>\n            \u003cbutton class=\"gallery-item\" data-index=\"3\">\n              \u003cimg\n                alt=\"Portrait four\"\n                loading=\"lazy\"\n                src=\"assets/media/fe0da5db08f01f55dc7bd531-640.webp\"\n              / srcset=\"assets/media/6568ebbe3ec2c8f0888f8bbf-320.webp 320w, assets/media/fe0da5db08f01f55dc7bd531-640.webp 640w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\n              \u003cspan>04 / The story continues\u003c/span>\n            \u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"dress\" id=\"dress\">\n        \u003cdiv class=\"wrap dress-layout\">\n          \u003cdiv class=\"reveal\">\n            \u003cdiv class=\"eyebrow\">05 / The style note\u003c/div>\n            \u003ch2 class=\"serif\">Dress like\u003cbr />the night\u003cbr />is yours.\u003c/h2>\n            \u003cp>\n              Black tie, but never ordinary. Think beautifully cut suits, sculptural eveningwear,\n              satin, velvet, and the confidence to make the room yours.\n            \u003c/p>\n            \u003cdiv class=\"swatches\">\n              \u003ci style=\"background: #111\"> \u003c/i>\n              \u003ci style=\"background: #f2e7d5\"> \u003c/i>\n              \u003ci style=\"background: #455748\"> \u003c/i>\n              \u003ci style=\"background: #ae8d58\"> \u003c/i>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv\n            aria-label=\"Formal evening style inspiration\"\n            class=\"dress-img reveal\"\n            role=\"img\"\n          >\u003c/div>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"rsvp\" id=\"rsvp\">\n        \u003cdiv class=\"wrap rsvp-layout\">\n          \u003cdiv class=\"reveal\">\n            \u003cdiv class=\"eyebrow\">06 / A SEAT SAVED FOR YOU\u003c/div>\n            \u003ch2 class=\"serif\">Will you celebrate with me?\u003c/h2>\n            \u003cp>\n              The only thing missing from this celebration is you. Please let me know if you can\n              make it.\n            \u003c/p>\n            \u003cp>\n              \u003cstrong>Kindly reply by 01 November 2026.\u003c/strong>\n            \u003c/p>\n          \u003c/div>\n          \u003cform class=\"reveal\" id=\"rsvpForm\">\n            \u003cdiv id=\"formFields\">\n              \u003cdiv class=\"eyebrow\" style=\"color: #88704d; margin-bottom: 28px\">\n                Private attendance confirmation\n              \u003c/div>\n              \u003cdiv class=\"field\">\n                \u003clabel for=\"guestName\">Your full name\u003c/label>\n                \u003cinput\n                  id=\"guestName\"\n                  maxlength=\"100\"\n                  placeholder=\"As it appears on your invitation\"\n                  required=\"\"\n                />\n              \u003c/div>\n              \u003cdiv class=\"field\">\n                \u003clabel>Will you be joining us?\u003c/label>\n                \u003cdiv class=\"choices\">\n                  \u003cbutton aria-pressed=\"false\" class=\"choice\" data-answer=\"yes\" type=\"button\">\n                    Delighted to attend\n                  \u003c/button>\n                  \u003cbutton aria-pressed=\"false\" class=\"choice\" data-answer=\"no\" type=\"button\">\n                    Regretfully decline\n                  \u003c/button>\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv hidden=\"\" id=\"attendingFields\">\n                \u003cdiv class=\"field\">\n                  \u003clabel for=\"guestCount\">Number of guests\u003c/label>\n                  \u003cselect id=\"guestCount\">\n                    \u003coption value=\"1\">Just me\u003c/option>\n                    \u003coption value=\"2\">Two guests\u003c/option>\n                    \u003coption value=\"3\">Three guests\u003c/option>\n                    \u003coption value=\"4\">Four guests\u003c/option>\n                  \u003c/select>\n                \u003c/div>\n                \u003cdiv class=\"field\">\n                  \u003clabel for=\"dietary\">Dietary notes (optional)\u003c/label>\n                  \u003cinput id=\"dietary\" maxlength=\"250\" placeholder=\"Anything we should know?\" />\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv class=\"field\">\n                \u003clabel for=\"message\"\n                  >A note for \u003cspan data-bind=\"name\">Amara\u003c/span> (optional)\u003c/label\n                >\n                \u003ctextarea\n                  id=\"message\"\n                  maxlength=\"500\"\n                  placeholder=\"Leave a birthday wish...\"\n                  rows=\"3\"\n                >\u003c/textarea>\n              \u003c/div>\n              \u003cbutton class=\"goldbtn\" type=\"submit\">Confirm my response \u2197\u003c/button>\n              \u003cp style=\"font-size: 11px; margin-bottom: 0\">\n                Preview only \u2014 no response is transmitted or saved.\n              \u003c/p>\n            \u003c/div>\n            \u003cdiv aria-live=\"polite\" class=\"success\" id=\"success\">\n              \u003cdiv class=\"eyebrow\" style=\"color: #88704d\">Your response\u003c/div>\n              \u003ch3>With gratitude.\u003c/h3>\n              \u003cp id=\"responseText\">\u003c/p>\n              \u003cbutton class=\"goldbtn\" id=\"editResponse\" type=\"button\">Edit response\u003c/button>\n            \u003c/div>\n          \u003c/form>\n        \u003c/div>\n      \u003c/section>\n    \u003c/main>\n    \u003cfooter class=\"footer\">\n      \u003cdiv class=\"wrap\">\n        \u003cp>One night only \u00b7 An evening in honour of \u003cspan data-bind=\"name\">Amara\u003c/span>\u003c/p>\n        \u003ch2>AFTER HOURS.\u003c/h2>\n        \u003ca class=\"outline\" href=\"#top\">Back to the beginning \u2191\u003c/a>\n        \u003csmall>VraxisRSVP \u00b7 Template 006 \u00b7 Prestige Collection \u00b7 Demonstration\u003c/small>\n      \u003c/div>\n    \u003c/footer>\n    \u003cdiv aria-label=\"Photo gallery\" aria-modal=\"true\" class=\"lightbox\" id=\"lightbox\" role=\"dialog\">\n      \u003cbutton aria-label=\"Close gallery\" class=\"lbclose\" id=\"lbclose\">\u00d7\u003c/button>\n      \u003cbutton aria-label=\"Previous photo\" class=\"lbprev\" id=\"lbprev\">\u2039\u003c/button>\n      \u003cimg alt=\"Selected gallery photograph\" id=\"lbimage\" />\n      \u003cbutton aria-label=\"Next photo\" class=\"lbnext\" id=\"lbnext\">\u203a\u003c/button>\n      \u003cdiv class=\"lbcap\" id=\"lbcap\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"studio\">\n      \u003cdiv class=\"studio-panel\" id=\"studioPanel\">\n        \u003ch3>Personalise your invitation.\u003c/h3>\n        \u003cp style=\"font-size: 11px; line-height: 1.6\">\n          Changes update this preview. Export your settings for later integration.\n        \u003c/p>\n        \u003clabel for=\"editName\">Guest of honour\u003c/label>\n        \u003cinput id=\"editName\" value=\"Amara\" />\n        \u003clabel for=\"editAge\">Milestone age\u003c/label>\n        \u003cinput id=\"editAge\" max=\"120\" min=\"1\" type=\"number\" value=\"30\" />\n        \u003clabel for=\"editDate\">Event date\u003c/label>\n        \u003cinput id=\"editDate\" type=\"date\" value=\"2026-11-14\" />\n        \u003clabel for=\"editTime\">Arrival time\u003c/label>\n        \u003cinput id=\"editTime\" value=\"18:30 \u2014 Late\" />\n        \u003clabel for=\"editVenue\">Venue\u003c/label>\n        \u003cinput id=\"editVenue\" value=\"The Glasshouse\" />\n        \u003clabel for=\"editAddress\">Location\u003c/label>\n        \u003cinput id=\"editAddress\" value=\"Johannesburg, South Africa\" />\n        \u003clabel for=\"editTribute\">Tribute paragraph\u003c/label>\n        \u003ctextarea id=\"editTribute\" rows=\"4\">\nThirty years of becoming, loving, growing and making ordinary days extraordinary. Tonight we celebrate all of it\u2014and all that is still to come.\u003c/textarea>\n        \u003clabel for=\"editHero\">Hero image URL\u003c/label>\n        \u003cinput id=\"editHero\" placeholder=\"https://...\" />\n        \u003clabel for=\"editPortrait\">Portrait image URL\u003c/label>\n        \u003cinput id=\"editPortrait\" placeholder=\"https://...\" />\n        \u003clabel for=\"editMemory1\">Chapter 1 \u2014 The Beginning\u003c/label>\n        \u003ctextarea id=\"editMemory1\" rows=\"3\">\nBefore the big dreams and unforgettable nights, there was a girl with a bright smile and a world of possibilities ahead. Every beautiful story has a beginning. This is hers.\u003c/textarea>\n        \u003clabel for=\"editMemory2\">Chapter 2 \u2014 The Becoming\u003c/label>\n        \u003ctextarea id=\"editMemory2\" rows=\"3\">\nThrough every change, every unexpected turn and every brave new beginning, she became more herself. The woman we know today is made of courage, tenderness and a little magic.\u003c/textarea>\n        \u003clabel for=\"editMemory3\">Chapter 3 \u2014 The Celebration\u003c/label>\n        \u003ctextarea id=\"editMemory3\" rows=\"3\">\nThirty looks beautiful on her. Not because of a number, but because of everything it represents: the memories made, the love given, and the extraordinary life still unfolding.\u003c/textarea>\n        \u003clabel for=\"editQuote\">A note from the host\u003c/label>\n        \u003ctextarea id=\"editQuote\" rows=\"3\">\nI've been lucky enough to share so many beautiful moments with you. I couldn't imagine celebrating this one without you.\u003c/textarea>\n        \u003cbutton id=\"exportSettings\">Export personalisation JSON\u003c/button>\n      \u003c/div>\n      \u003cbutton aria-expanded=\"false\" class=\"studio-toggle\" id=\"studioToggle\">\u2726 PERSONALISE\u003c/button>\n    \u003c/div>\n    \u003cscript src=\"assets/template-code/cee2d9367e39da6df6d55691.js\">\u003c/script>\n    \u003clink rel=\"stylesheet\" href=\"assets/template-code/60984052872e6025b9edbbfb.css\">\n    \u003cscript src=\"assets/template-code/050bcfd64283e64836622798.js\">\u003c/script>\n  \u003c/body>\n\u003c/html>\n";const frame=document.getElementById("invitation");frame.srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/template-image-overrides.js?v=zero-waste1" defer></script><script src="assets/templates.js?v=zero-waste1"></script><script src="assets/design-finishing.js?v=20261115b"></script><script src="assets/template-polish.js?v=zero-waste1"></script></body></html>
