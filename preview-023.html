pcap\" data-field=\"message\">For every late night, every small victory and every person who helped along the way. The work is done. The world is waiting.\u003c/p>\u003ch2 data-field=\"title\">This is only\u003cbr>\u003cem>the beginning.\u003c/em>\u003c/h2>\u003ca class=\"text-button\" href=\"#details\">Read the invitation \u2193\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"chapter-quote reveal\">\u003cspan class=\"eyebrow\">A NOTE IN THE MARGIN\u003c/span>\u003ch2>Not the end\u003cbr>of the story.\u003cbr>\u003cem>The start of it.\u003c/em>\u003c/h2>\u003c/section>\u003csection class=\"event-details reveal\" id=\"details\">\u003cp class=\"eyebrow\">THE PARTICULARS\u003c/p>\u003ch2>A date worth\u003cbr>\u003cem>keeping.\u003c/em>\u003c/h2>\u003cdiv class=\"detail-grid\">\u003carticle>\u003cspan>WHEN\u003c/span>\u003cp data-field=\"date\">2027-11-20\u003c/p>\u003cp data-field=\"time\">18:30\u003c/p>\u003cbutton class=\"text-button\" data-calendar type=\"button\">Add to calendar \u2197\u003c/button>\u003c/article>\u003carticle>\u003cspan>WHERE\u003c/span>\u003cp data-field=\"venue\">The Glasshouse\u003c/p>\u003cp data-field=\"address\">Cape Town, South Africa\u003c/p>\u003ca data-map href=\"https://www.google.com/maps/search/?api=1&query=Cape+Town\" target=\"_blank\" rel=\"noopener\">Find your way \u2197\u003c/a>\u003c/article>\u003carticle>\u003cspan>THE DRESS CODE\u003c/span>\u003cp data-field=\"dress\">A little dressed up. Entirely yourself.\u003c/p>\u003cp class=\"fine\">Come ready to make a memory.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection class=\"program reveal\">\u003cp class=\"eyebrow\">TABLE OF CONTENTS\u003c/p>\u003ch2>A chapter\u003cbr>\u003cem>to remember.\u003c/em>\u003c/h2>\u003cdiv data-program>\u003cdetails open>\u003csummary>I. The people who made it possible\u003c/summary>\u003cp>We begin with gratitude, good company, and a well-deserved toast.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>II. A table of our own\u003c/summary>\u003cp>An unhurried meal to celebrate the work and the journey.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>III. To whatever comes next\u003c/summary>\u003cp>A few words, a few photographs, and the first memories of a new chapter.\u003c/p>\u003c/details>\u003c/div>\u003c/section>\u003csection class=\"memories reveal\" aria-label=\"Celebration photographs\">\u003cp class=\"eyebrow\">A LITTLE OF OUR WORLD\u003c/p>\u003cdiv class=\"memory-grid\">\u003cbutton type=\"button\" data-lightbox=\"0\" aria-label=\"Enlarge celebration artwork\">\u003cimg data-photo=\"hero\" src=\"assets/covers/023.svg\" alt=\"Original celebration artwork\" loading=\"lazy\">\u003c/button>\u003cdiv>\u003ch2>Make room\u003cbr>for \u003cem>the moment.\u003c/em>\u003c/h2>\u003cp data-field=\"story\">Some days deserve more than a date in the diary. They deserve your favourite people, a little anticipation, and a story you will keep telling.\u003c/p>\u003cp data-field=\"giftNote\">Your company is the loveliest thing you could bring.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"reply reveal\" id=\"rsvp\">\u003cp class=\"eyebrow\">YOUR PLACE IS WAITING\u003c/p>\u003ch2 data-field=\"rsvpHeading\">Will you join us?\u003c/h2>\u003cp>It would mean the world to have you there.\u003c/p>\u003cform id=\"rsvpForm\">\u003clabel>Your name\u003cinput name=\"guest_name\" autocomplete=\"name\" required maxlength=\"100\" placeholder=\"Your full name\">\u003c/label>\u003clabel>Your response\u003cselect name=\"response\">\u003coption value=\"yes\">I wouldn\u2019t miss it\u003c/option>\u003coption value=\"no\">With you in spirit\u003c/option>\u003c/select>\u003c/label>\u003cbutton type=\"submit\" class=\"primary\">Send my reply \u2197\u003c/button>\u003cp role=\"status\" class=\"preview-reply\">\u003c/p>\u003c/form>\u003cp data-field=\"deadline\" class=\"fine\">\u003c/p>\u003c/section>\u003cfooter>\u003cp class=\"eyebrow\">WITH LOVE & ANTICIPATION\u003c/p>\u003cp clas
