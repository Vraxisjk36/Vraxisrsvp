cta" href="personalise.html?template=020">Use This Template ↗</a></header><div class="preview-info"><a href="catalogue.html">← Collection</a><b>Captain Ethan’s Superhero Birthday</b><span>Birthday · Signature</span><span class="price">$15.99</span></div><iframe id="invitation" title="Captain Ethan’s Superhero Birthday interactive invitation" allow="fullscreen"></iframe><script>const TEMPLATE="\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#10294a\">\u003ctitle>Captain Ethan \u2022 Issue No. 006\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003clink rel=\"stylesheet\" href=\"assets/template-code/b5b03d9092fdc55193b19d8d.css\">\u003cscript src=\"assets/static-media.js?v=1\">\u003c/script>\u003c/head>\u003cbody>\n\u003cdiv class=\"intro\" id=\"intro\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"introTitle\">\u003cdiv class=\"sky\">\u003c/div>\u003cdiv class=\"burst\">\u003c/div>\u003cdiv class=\"moon\">\u003c/div>\u003cdiv class=\"skyline\" aria-hidden=\"true\">\u003cdiv class=\"building\" style=\"height:64%\">\u003c/div>\u003cdiv class=\"building\" style=\"height:92%\">\u003c/div>\u003cdiv class=\"building\" style=\"height:72%\">\u003c/div>\u003cdiv class=\"building\" style=\"height:100%\">\u003c/div>\u003cdiv class=\"building\" style=\"height:61%\">\u003c/div>\u003cdiv class=\"building\" style=\"height:82%\">\u003c/div>\u003cdiv class=\"building\" style=\"height:70%\">\u003c/div>\u003cdiv class=\"building\" style=\"height:96%\">\u003c/div>\u003c/div>\u003cdiv class=\"intro-inner\">\u003cspan class=\"alert\">\u26a1 Incoming hero alert\u003c/span>\u003ch1 id=\"introTitle\">Hero City\u003cbr>Needs You!\u003c/h1>\u003cp>Captain Ethan is turning SIX, and he's assembling his ultimate birthday squad. One very important mission awaits.\u003c/p>\u003cbutton class=\"btn mission-start\" id=\"start\">Accept Mission \u2192\u003c/button>\u003cp class=\"issue\">TOP SECRET \u2022 INVITATION FOR ETHAN'S HERO SQUAD\u003c/p>\u003c/div>\u003cdiv class=\"dispatch\">\u003c/div>\u003c/div>\n\u003cdiv class=\"site\" id=\"site\">\n\u003cheader>\u003cdiv class=\"container nav\">\u003cdiv class=\"brand\">CAPTAIN \u003cb>ETHAN\u003c/b> \u2605\u003c/div>\u003cnav class=\"nav-links\" aria-label=\"Main\">\u003ca href=\"#missions\">Missions\u003c/a>\u003ca href=\"#city\">Hero City\u003c/a>\u003ca href=\"#rsvp\">RSVP\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\n\u003cmain>\n\u003csection class=\"cover\">\u003cdiv class=\"dots halftone\">\u003c/div>\u003cdiv class=\"container cover-inner\">\u003cdiv class=\"cover-copy\">\u003cdiv class=\"issue-strip\">THE AMAZING ADVENTURES \u2022 ISSUE NO. 006\u003c/div>\u003ch2>CAPTAIN\u003cbr>ETHAN!\u003c/h2>\u003cdiv class=\"sub\">The birthday hero turns SIX!\u003c/div>\u003cp class=\"introline\">Suit up, sidekick! Ethan's biggest adventure yet is almost here \u2014 and no hero can save the day alone.\u003c/p>\u003ca href=\"#missions\" class=\"btn\">See Your Missions \u2193\u003c/a>\u003c/div>\u003cdiv class=\"hero-art\" role=\"img\" aria-label=\"Original comic-style illustration of Captain Ethan in a blue suit and red cape\">\u003cdiv class=\"burst\">\u003c/div>\u003cdiv class=\"cape\">\u003c/div>\u003cdiv class=\"arm left\">\u003c/div>\u003cdiv class=\"arm right\">\u003c/div>\u003cdiv class=\"body\">\u003c/div>\u003cdiv class=\"neck\">\u003c/div>\u003cdiv class=\"belt\">\u003c/div>\u003cdiv class=\"badge\">E\u003c/div>\u003cdiv class=\"head\">\u003cdiv class=\"hair\">\u003c/div>\u003cdiv class=\"mask\">\u003c/div>\u003cdiv class=\"eyes\">\u003c/div>\u003c/div>\u003cdiv class=\"fist\">\u003c/div>\u003cdiv class=\"caption\">POW! \u2605\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003cdiv class=\"ticker\">\u003cdiv class=\"ticker-inner\">\u2605 SIX YEARS OF AWESOME \u2605 ONE EPIC BIRTHDAY \u2605 HERO SQUAD ASSEMBLE \u2605\u003c/div>\u003c/div>\n\u003csection class=\"section story\">\u003cdiv class=\"container story-grid\">\u003cdiv class=\"reveal\">\u003cdiv class=\"kicker\">Origin Story \u2022 Chapter One\u003c/div>\u003ch2>Every hero has a beginning.\u003c/h2>\u003cp>Six years ago, a little legend named \u003cstrong>Ethan\u003c/strong> arrived on the scene. Since then, he's been filling every day with big laughs, brave adventures, and super-sized imagination.\u003c/p>\u003cp>Now it's time for his greatest mission yet: \u003cstrong>turning six!\u003c/strong> And the best part? You're invited to be on his team.\u003c/p>\u003c/div>\u003cdiv class=\"panel-art reveal\" aria-label=\"Comic panel celebrating Ethan's sixth birthday\">\u003cdiv class=\"circle\">\u003c/div>\u003cdiv class=\"big6\">6\u003c/div>\u003cdiv class=\"speech\">WOW!\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section missions\" id=\"missions\">\u003cdiv class=\"container\">\u003cdiv class=\"kicker\">Classified \u2022 Hero Squad Briefing\u003c/div>\u003ch2>Three secret\u003cbr>missions.\u003c/h2>\u003cp>Tap each mission file to unlock the details of Ethan's big day.\u003c/p>\u003cdiv class=\"mission-grid\">\u003cbutton class=\"mission-card reveal\" data-mission=\"hq\">\u003cdiv class=\"visual halftone\">\u003cdiv class=\"symbol\">HQ\u003c/div>\u003c/div>\u003cdiv class=\"copy\">\u003cdiv class=\"kicker\">Mission 001\u003c/div>\u003ch3>Find Headquarters\u003c/h3>\u003cp>Discover where Captain Ethan is gathering his team.\u003c/p>\u003cspan class=\"open\">Open mission file \u2197\u003c/span>\u003c/div>\u003c/button>\u003cbutton class=\"mission-card reveal\" data-mission=\"time\">\u003cdiv class=\"visual halftone\">\u003cdiv class=\"symbol\">06\u003c/div>\u003c/div>\u003cdiv class=\"copy\">\u003cdiv class=\"kicker\">Mission 002\u003c/div>\u003ch3>Synchronise Watches\u003c/h3>\u003cp>Every superhero needs to know when the action starts.\u003c/p>\u003cspan class=\"open\">Open mission file \u2197\u003c/span>\u003c/div>\u003c/button>\u003cbutton class=\"mission-card reveal\" data-mission=\"suit\">\u003cdiv class=\"visual halftone\">\u003cdiv class=\"symbol\">\u2605\u003c/div>\u003c/div>\u003cdiv class=\"copy\">\u003cdiv class=\"kicker\">Mission 003\u003c/div>\u003ch3>Choose Your Disguise\u003c/h3>\u003cp>Find out what to wear for Ethan's epic celebration.\u003c/p>\u003cspan class=\"open\">Open mission file \u2197\u003c/span>\u003c/div>\u003c/button>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section city-section\" id=\"city\">\u003cdiv class=\"container\">\u003cdiv class=\"kicker\">Explore \u2022 Ethan's Hero City\u003c/div>\u003ch2>The city is\u003cbr>your playground.\u003c/h2>\u003cp>Captain Ethan has planned a whole afternoon of super-powered fun. Tap a building to see what's happening inside.\u003c/p>\u003cdiv class=\"city halftone\">\u003cdiv class=\"sun\">\u003c/div>\u003cbutton class=\"city-stop\" data-mission=\"academy\">\u003cspan class=\"roof\">\u2605\u003c/span>\u003cspan>Training Academy\u003c/span>\u003c/button>\u003cbutton class=\"city-stop\" data-mission=\"power\">\u003cspan class=\"roof\">\u26a1\u003c/span>\u003cspan>Power Station\u003c/span>\u003c/button>\u003cbutton class=\"city-stop\" data-mission=\"hq\">\u003cspan class=\"roof\">HQ\u003c/span>\u003cspan>Hero Headquarters\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"city-note\">\u2605 Tap any building to explore Ethan's party plans.\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section schedule\">\u003cdiv class=\"container\">\u003cdiv class=\"kicker\">Official \u2022 Mission Timeline\u003c/div>\u003ch2>Operation:\u003cbr>Birthday!\u003c/h2>\u003cdiv class=\"schedule-list\">\u003cdiv class=\"schedule-row reveal\">\u003ctime>13:00\u003c/time>\u003cdiv>\u003cstrong>Heroes Assemble\u003c/strong>\u003cp>Check in at headquarters and meet the squad.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"schedule-row reveal\">\u003ctime>13:30\u003c/time>\u003cdiv>\u003cstrong>Superpower Training\u003c/strong>\u003cp>Games, challenges and top-secret hero activities.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"schedule-row reveal\">\u003ctime>15:00\u003c/time>\u003cdiv>\u003cstrong>Power-Up Break\u003c/strong>\u003cp>Snacks, birthday cake and a very important wish.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"schedule-row reveal\">\u003ctime>16:00\u003c/time>\u003cdiv>\u003cstrong>Mission Complete\u003c/strong>\u003cp>Every hero heads home with a story to tell.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"rsvp\" id=\"rsvp\">\u003cdiv class=\"container rsvp-wrap\">\u003cdiv>\u003cdiv class=\"kicker\">Final Mission \u2022 Hero Recruitment\u003c/div>\u003ch2>Captain Ethan\u003cbr>needs YOU!\u003c/h2>\u003cp>Will you join Ethan's superhero squad for his sixth birthday? Ask your grown-up to send your answer to headquarters.\u003c/p>\u003cp>\u003cstrong>Saturday, 17 July 2027\u003c/strong>\u003cbr>1:00 PM \u2013 4:00 PM\u003cbr>Hero Headquarters \u2022 Johannesburg\u003c/p>\u003c/div>\u003cdiv class=\"rsvp-card\">\u003cform id=\"rsvpForm\">\u003ch3>Hero Squad\u003cbr>Sign-Up\u003c/h3>\u003cdiv class=\"field\">\u003clabel for=\"heroName\">Hero's name\u003c/label>\u003cinput id=\"heroName\" name=\"heroName\" required maxlength=\"80\" placeholder=\"Your child's name\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"parentName\">Parent / guardian name\u003c/label>\u003cinput id=\"parentName\" name=\"parentName\" required maxlength=\"80\" placeholder=\"Your name\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"attend\">Can your hero join Ethan?\u003c/label>\u003cselect id=\"attend\" name=\"attend\" required>\u003coption value=\"\">Select your mission status\u003c/option>\u003coption value=\"yes\">Yes! Count us in!\u003c/option>\u003coption value=\"no\">Sorry, we can't make it\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"notes\">Message for Captain Ethan (optional)\u003c/label>\u003ctextarea id=\"notes\" name=\"notes\" maxlength=\"300\" placeholder=\"Happy birthday, Captain Ethan!\">\u003c/textarea>\u003c/div>\u003cbutton class=\"btn red\" type=\"submit\">Send to Headquarters \u2192\u003c/button>\u003cp style=\"font-size:12px;margin-bottom:0\">Prototype only: this form does not send or save RSVP information.\u003c/p>\u003c/form>\u003cdiv class=\"success\" id=\"success\" role=\"status\" aria-live=\"polite\">\u003cdiv style=\"font:65px Anton\">\u2605\u003c/div>\u003ch3 id=\"successTitle\">Mission Received!\u003c/h3>\u003cp id=\"successText\">\u003c/p>\u003cbutton class=\"btn\" id=\"again\" type=\"button\">Back to invitation\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003c/main>\u003cfooter class=\"footer\">\u003ch2>SEE YOU THERE,\u003cbr>HEROES!\u003c/h2>\u003cp>With super-sized love,\u003cbr>\u003cstrong>Captain Ethan & his family\u003c/strong> \u26a1\u003c/p>\u003cdiv class=\"fine\">ISSUE 006 \u2022 A ONE-OF-A-KIND BIRTHDAY ADVENTURE\u003c/div>\u003c/footer>\u003c/div>\n\u003cdiv class=\"modal\" id=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modalTitle\">\u003cdiv class=\"modal-panel\">\u003cbutton class=\"close\" id=\"close\" aria-label=\"Close mission file\">\u00d7\u003c/button>\u003cdiv class=\"stamp\" id=\"modalStamp\">\u003c/div>\u003ch3 id=\"modalTitle\">\u003c/h3>\u003cp id=\"modalText\">\u003c/p>\u003cbutton class=\"btn blue\" id=\"modalDone\">Mission Understood \u2713\u003c/button>\u003c/div>\u003c/div>\n\u003cscript src=\"assets/template-code/cd8c8840b8db3006b49a05c9.js\">\u003c/script>\u003c/body>\u003c/html>";const frame=document.getElementById("invitation");frame.srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/template-image-overrides.js?v=zero-waste1" defer></script><script src="assets/templates.js?v=zero-waste1"></script><script src="assets/design-finishing.js?v=20261115b"></script><script src="assets/template-polish.js?v=zero-waste1"></script></body></html>
