p{gap:35px}.section{padding:70px 0}}@media(max-width:500px){.container{padding:0 17px}.nav-links{gap:10px}.nav-links a{font-size:15px}.brand{font-size:21px}.intro h1{font-size:70px}.intro .moon{width:65px;height:65px}.cover h2{font-size:80px;-webkit-text-stroke:2px var(--ink);text-shadow:5px 6px 0 var(--red)}.cover .sub{font-size:25px}.hero-art{height:420px}.hero-art .caption{font-size:20px}.hero-art .badge{font-size:30px}.panel-art{min-height:350px}.panel-art .big6{font-size:250px}.mission-card{grid-template-columns:100px 1fr}.mission-card .copy{padding:15px}.mission-card h3{font-size:26px}.mission-card p{font-size:14px}.city{min-height:310px}.city-stop{min-height:155px;border-width:3px;padding:8px 3px}.city-stop .roof{font-size:42px}.city-stop span:last-child{font-size:16px}.schedule-row{grid-template-columns:100px 1fr;gap:10px}.schedule-row time{font-size:27px}.schedule-row strong{font-size:24px}.rsvp-card{padding:20px}.modal-panel{padding:25px 18px}.modal-panel h3{font-size:43px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv class=\"intro\" id=\"intro\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"introTitle\">\u003cdiv class=\"sky\">\u003c/div>\u003cdiv class=\"burst\">\u003c/div>\u003cdiv class=\"moon\">\u003c/div>\u003cdiv class=\"skyline\" aria-hidden=\"true\">\u003cdiv class=\"building\" style=\"height:64%\">\u003c/div>\u003cdiv class=\"building\" style=\"height:92%\">\u003c/div>\u003cdiv class=\"building\" style=\"height:72%\">\u003c/div>\u003cdiv class=\"building\" style=\"height:100%\">\u003c/div>\u003cdiv class=\"building\" style=\"height:61%\">\u003c/div>\u003cdiv class=\"building\" style=\"height:82%\">\u003c/div>\u003cdiv class=\"building\" style=\"height:70%\">\u003c/div>\u003cdiv class=\"building\" style=\"height:96%\">\u003c/div>\u003c/div>\u003cdiv class=\"intro-inner\">\u003cspan class=\"alert\">⚡ Incoming hero alert\u003c/span>\u003ch1 id=\"introTitle\">Hero City\u003cbr>Needs You!\u003c/h1>\u003cp>Captain Ethan is turning SIX, and he's assembling his ultimate birthday squad. One very important mission awaits.\u003c/p>\u003cbutton class=\"btn mission-start\" id=\"start\">Accept Mission →\u003c/button>\u003cp class=\"issue\">TOP SECRET • INVITATION FOR ETHAN'S HERO SQUAD\u003c/p>\u003c/div>\u003cdiv class=\"dispatch\">\u003c/div>\u003c/div>\n\u003cdiv class=\"site\" id=\"site\">\n\u003cheader>\u003cdiv class=\"container nav\">\u003cdiv class=\"brand\">CAPTAIN \u003cb>ETHAN\u003c/b> ★\u003c/div>\u003cnav class=\"nav-links\" aria-label=\"Main\">\u003ca href=\"#missions\">Missions\u003c/a>\u003ca href=\"#city\">Hero City\u003c/a>\u003ca href=\"#rsvp\">RSVP\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\n\u003cmain>\n\u003csection class=\"cover\">\u003cdiv class=\"dots halftone\">\u003c/div>\u003cdiv class=\"container cover-inner\">\u003cdiv class=\"cover-copy\">\u003cdiv class=\"issue-strip\">THE AMAZING ADVENTURES • ISSUE NO. 006\u003c/div>\u003ch2>CAPTAIN\u003cbr>ETHAN!\u003c/h2>\u003cdiv class=\"sub\">The birthday hero turns SIX!\u003c/div>\u003cp class=\"introline\">Suit up, sidekick! Ethan's biggest adventure yet is almost here — and no hero can save the day alone.\u003c/p>\u003ca href=\"#missions\" class=\"btn\">See Your Missions ↓\u003c/a>\u003c/div>\u003cdiv class=\"hero-art\" role=\"img\" aria-label=\"Original comic-style illustration of Captain Ethan in a blue suit and red cape\">\u003cdiv class=\"burst\">\u003c/div>\u003cdiv class=\"cape\">\u003c/div>\u003cdiv class=\"arm left\">\u003c/div>\u003cdiv class=\"arm right\">\u003c/div>\u003cdiv class=\"body\">\u003c/div>\u003cdiv class=\"neck\">\u003c/div>\u003cdiv class=\"belt\">\u003c/div>\u003cdiv class=\"badge\">E\u003c/div>\u003cdiv class=\"head\">\u003cdiv class=\"hair\">\u003c/div>\u003cdiv class=\"mask\">\u003c/div>\u003cdiv class=\"eyes\">\u003c/div>\u003c/div>\u003cdiv class=\"fist\">\u003c/div>\u003cdiv class=\"caption\">POW! ★\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003cdiv class=\"ticker\">\u003cdiv class=\"ticker-inner\">★ SIX YEARS OF AWESOME ★ ONE EPIC BIRTHDAY ★ HERO SQUAD ASSEMBLE ★\u003c/div>\u003c/div>\n\u003csection class=\"section story\">\u003cdiv class=\"container story-grid\">\u003cdiv class=\"reveal\">\u003cdiv class=\"kicker\">Origin Story • Chapter One\u003c/div>\u003ch2>Every hero has a beginning.\u003c/h2>\u003cp>Six years ago, a little legend named \u003cstrong>Ethan\u003c/strong> arrived on the scene. Since then, he's been filling every day with big laughs, brave adventures, and super-sized imagination.\u003c/p>\u003cp>Now it's time for his greatest mission yet: \u003cstrong>turning six!\u003c/strong> And the best part? You're invited to be on his team.\u003c/p>\u003c/div>\u003cdiv class=\"panel-art reveal\" aria-label=\"Comic panel celebrating Ethan's sixth birthday\">\u003cdiv class=\"circle\">\u003c/div>\u003cdiv class=\"big6\">6\u003c/div>\u003cdiv class=\"speech\">WOW!\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section missions\" id=\"missions\">\u003cdiv class=\"container\">\u003cdiv class=\"kicker\">Classified • Hero Squad Briefing\u003c/div>\u003ch2>Three secret\u003cbr>missions.\u003c/h2>\u003cp>Tap each mission file to unlock the details of Ethan's big day.\u003c/p>\u003cdiv class=\"mission-grid\">\u003cbutton class=\"mission-card reveal\" data-mission=\"hq\">\u003cdiv class=\"visual halftone\">\u003cdiv class=\"symbol\">HQ\u003c/div>\u003c/div>\u003cdiv class=\"copy\">\u003cdiv class=\"kicker\">Mission 001\u003c/div>\u003ch3>Find Headquarters\u003c/h3>\u003cp>Discover where Captain Ethan is gathering his team.\u003c/p>\u003cspan class=\"open\">Open mission file ↗\u003c/span>\u003c/div>\u003c/button>\u003cbutton class=\"mission-card reveal\" data-mission=\"time\">\u003cdiv class=\"visual halftone\">\u003cdiv class=\"symbol\">06\u003c/div>\u003c/div>\u003cdiv class=\"copy\">\u003cdiv class=\"kicker\">Mission 002\u003c/div>\u003ch3>Synchronise Watches\u003c/h3>\u003cp>Every superhero needs to know when the action starts.\u003c/p>\u003cspan class=\"open\">Open mission file ↗\u003c/span>\u003c/div>\u003c/button>\u003cbutton class=\"mission-card reveal\" data-mission=\"suit\">\u003cdiv class=\"visual halftone\">\u003cdiv class=\"symbol\">★\u003c/div>\u003c/div>\u003cdiv class=\"copy\">\u003cdiv class=\"kicker\">Mission 003\u003c/div>\u003ch3>Choose Your Disguise\u003c/h3>\u003cp>Find out what to wear for Ethan's epic celebration.\u003c/p>\u003cspan class=\"open\">Open mission file ↗\u003c/span>\u003c/div>\u003c/button>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section city-section\" id=\"city\">\u003cdiv class=\"container\">\u003cdiv class=\"kicker\">Explore • Ethan's Hero City\u003c/div>\u003ch2>The city is\u003cbr>your playground.\u003c/h2>\u003cp>Captain Ethan has planned a whole afternoon of super-powered fun. Tap a building to see what's happening inside.\u003c/p>\u003cdiv class=\"city halftone\">\u003cdiv class=\"sun\">\u003c/div>\u003cbutton class=\"city-stop\" data-mission=\"academy\">\u003cspan class=\"roof\">★\u003c/span>\u003cspan>Training Academy\u003c/span>\u003c/button>\u003cbutton class=\"city-stop\" data-mission=\"power\">\u003cspan class=\"roof\">⚡\u003c/span>\u003cspan>Power Station\u003c/span>\u003c/button>\u003cbutton class=\"city-stop\" data-mission=\"hq\">\u003cspan class=\"roof\">HQ\u003c/span>\u003cspan>Hero Headquarters\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"city-note\">★ Tap any building to explore Ethan's party plans.\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section schedule\">\u003cdiv class=\"container\">\u003cdiv class=\"kicker\">Official • Mission Timeline\u003c/div>\u003ch2>Operation:\u003cbr>Birthday!\u003c/h2>\u003cdiv class=\"schedule-list\">\u003cdiv class=\"schedule-row reveal\">\u003ctime>13:00\u003c/time>\u003cdiv>\u003cstrong>Heroes Assemble\u003c/strong>\u003cp>Check in at headquarters and meet the squad.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"schedule-row reveal\">\u003ctime>13:30\u003c/time>\u003cdiv>\u003cstrong>Superpower Training\u003c/strong>\u003cp>Games, challenges and top-secret hero activities.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"schedule-row reveal\">\u003ctime>15:00\u003c/time>\u003cdiv>\u003cstrong>Power-Up Break\u003c/strong>\u003cp>Snacks, birthday cake and a very important wish.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"schedule-row reveal\">\u003ctime>16:00\u003c/time>\u003cdiv>\u003cstrong>Mission Complete\u003c/strong>\u003cp>Every hero heads home with a story to tell.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"rsvp\" id=\"rsvp\">\u003cdiv class=\"container rsvp-wrap\">\u003cdiv>\u003cdiv class=\"kicker\">Final Mission • Hero Recruitment\u003c/div>\u003ch2>Captain Ethan\u003cbr>needs YOU!\u003c/h2>\u003cp>Will you join Ethan's superhero squad for his sixth birthday? Ask your grown-up to send your answer to headquarters.\u003c/p>\u003cp>\u003cstrong>Saturday, 17 July 2027\u003c/strong>\u003cbr>1:00 PM – 4:00 PM\u003cbr>Hero Headquarters • Johannesburg\u003c/p>\u003c/div>\u003cdiv class=\"rsvp-card\">\u003cform id=\"rsvpForm\">\u003ch3>Hero Squad\u003cbr>Sign-Up\u003c/h3>\u003cdiv class=\"field\">\u003clabel for=\"heroName\">Hero's name\u003c/label>\u003cinput id=\"heroName\" name=\"heroName\" required maxlength=\"80\" placeholder=\"Your child's name\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"parentName\">Parent / guardian name\u003c/label>\u003cinput id=\"parentName\" name=\"parentName\" required maxlength=\"80\" placeholder=\"Your name\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"attend\">Can your hero join Ethan?\u003c/label>\u003cselect id=\"attend\" name=\"attend\" required>\u003coption value=\"\">Select your mission status\u003c/option>\u003coption value=\"yes\">Yes! Count us in!\u003c/option>\u003coption value=\"no\">Sorry, we can't make it\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"notes\">Message for Captain Ethan (optional)\u003c/label>\u003ctextarea id=\"notes\" name=\"notes\" maxlength=\"300\" placeholder=\"Happy birthday, Captain Ethan!\">\u003c/textarea>\u003c/div>\u003cbutton class=\"btn red\" type=\"submit\">Send to Headquarters →\u003c/button>\u003cp style=\"font-size:12px;margin-bottom:0\">Prototype only: this form does not send or save RSVP information.\u003c/p>\u003c/form>\u003cdiv class=\"success\" id=\"success\" role=\"status\" aria-live=\"polite\">\u003cdiv style=\"font:65px Anton\">★\u003c/div>\u003ch3 id=\"successTitle\">Mission Received!\u003c/h3>\u003cp id=\"successText\">\u003c/p>\u003cbutton class=\"btn\" id=\"again\" type=\"button\">Back to invitation\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003c/main>\u003cfooter class=\"footer\">\u003ch2>SEE YOU THERE,\u003cbr>HEROES!\u003c/h2>\u003cp>With super-sized love,\u003cbr>\u003cstrong>Captain Ethan & his family\u003c/strong> ⚡\u003c/p>\u003cdiv class=\"fine\">ISSUE 006 • A ONE-OF-A-KIND BIRTHDAY ADVENTURE\u003c/div>\u003c/footer>\u003c/div>\n\u003cdiv class=\"modal\" id=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modalTitle\">\u003cdiv class=\"modal-panel\">\u003cbutton class=\"close\" id=\"close\" aria-label=\"Close mission file\">×\u003c/button>\u003cdiv class=\"stamp\" id=\"modalStamp\">\u003c/div>\u003ch3 id=\"modalTitle\">\u003c/h3>\u003cp id=\"modalText\">\u003c/p>\u003cbutton class=\"btn blue\" id=\"modalDone\">Mission Understood ✓\u003c/button>\u003c/div>\u003c/div>\n\u003cscript>\nconst intro=document.getElementById('intro'),site=document.getElementById('site');document.getElementById('start').addEventListener('click',()=>{intro.classList.add('launch');site.classList.add('ready');setTimeout(()=>{intro.classList.add('hidden');document.querySelector('.cover h2').setAttribute('tabindex','-1');document.querySelector('.cover h2').focus({preventScroll:true})},900)});\nconst missions={hq:{stamp:'CLASSIFIED FILE • 001',title:'Hero Headquarters',text:'Captain Ethan is calling all heroes to Hero Headquarters, Johannesburg! Exact venue address: 123 Adventure Avenue, Johannesburg (demo placeholder). Ask your grown-up to check the final invitation details before setting off.'},time:{stamp:'CLASSIFIED FILE • 002',title:'Mission Time!',text:'Saturday, 17 July 2027. Heroes assemble at 1:00 PM sharp. The adventure ends at 4:00 PM. Synchronise your watches and don’t be late!'},suit:{stamp:'CLASSIFIED FILE • 003',title:'Suit Up, Hero!',text:'Come dressed as your favourite superhero — or invent your own! Capes, masks, bright colours and heroic imaginations are encouraged. Comfortable shoes recommended for action-packed games.'},academy:{stamp:'HERO CITY • TRAINING ACADEMY',title:'Superpower Training',text:'Run, jump, laugh and conquer fun challenges with Ethan’s superhero squad. Every recruit gets a chance to show off their superpowers!'},power:{stamp:'HERO CITY • POWER STATION',title:'Recharge & Celebrate',text:'After all that hero work, it’s time for party snacks, birthday cake and Ethan’s big birthday wish. Even superheroes need a power-up!'}};\nconst modal=document.getElementById('modal'),close=document.getElementById('close');let previousFocus=null;function showMission(key){const m=missions[key];if(!m)return;previousFocus=document.activeElement;document.getElementById('modalStamp').textContent=m.stamp;document.getElementById('modalTitle').textContent=m.title;document.getElementById('modalText').textContent=m.text;modal.classList.add('show');document.body.style.overflow='hidden';close.focus()}function hideMission(){modal.classList.remove('show');document.body.style.overflow='';previousFocus?.focus()}document.querySelectorAll('[data-mission]').forEach(el=>el.addEventListener('click',()=>showMission(el.dataset.mission)));close.addEventListener('click',hideMission);document.getElementById('modalDone').addEventListener('click',hideMission);modal.addEventListener('click',e=>{if(e.target===modal)hideMission()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('show'))hideMission();if(e.key==='Tab'&&modal.classList.contains('show')){const focusable=[...modal.querySelectorAll('button')];const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});\nconst observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('in');observer.unobserve(entry.target)}}),{threshold:.09});document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));\ndocument.getElementById('rsvpForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('heroName').value.trim(),attendance=document.getElementById('attend').value;if(!name||!attendance)return;document.getElementById('successTitle').textContent=attendance==='yes'?'Hero Squad Confirmed!':'Message Received!';document.getElementById('successText').textContent=attendance==='yes'?`${name}, Captain Ethan is excited to have you on his team! (Demo confirmation — not submitted.)`:`Thanks for letting Ethan know, ${name}. You'll be missed! (Demo confirmation — not submitted.)`;document.getElementById('rsvpForm').style.display='none';document.getElementById('success').style.display='block'});document.getElementById('again').addEventListener('click',()=>{document.getElementById('rsvpForm').style.display='block';document.getElementById('success').style.display='none';document.getElementById('rsvpForm').reset()});\n\u003c/script>\u003c/body>\u003c/html>";document.getElementById('invitation').srcdoc=TEMPLATE;</script><script src="assets/site-nav.js" defer></script><script src="assets/template-image-overrides.js" defer></script></body></html>
