\" id=\"clearButton\" type=\"button\">Clear the glass \u2197\u003c/button>\u003cdiv class=\"hero-bottom\">\u003cspan>AFTER THE RAIN \u00b7 016\u003c/span>\u003cspan class=\"scroll-indicator\">SCROLL TO DISCOVER \u003ci>\u003c/i>\u003c/span>\u003c/div>\u003c/header>\n\u003csection class=\"chapter reveal\">\u003cdiv class=\"small kicker\">A note from us \u00b7 I\u003c/div>\u003ch2 class=\"serif\">Some things\u003cbr>are worth \u003cspan class=\"italic\">waiting\u003c/span> for.\u003c/h2>\u003cdiv class=\"ornament\">\u2733\u003c/div>\u003cp>Somewhere between the unexpected and the unforgettable, we found each other. Now, surrounded by the people who made us who we are, we'd love to celebrate what comes next.\u003c/p>\u003c/section>\n\u003csection class=\"split\">\u003cdiv class=\"split-photo observe\">\u003cimg src=\"assets/media/41e230d23088e0a6012e7214-960.webp\" alt=\"The couple sharing a quiet embrace\" loading=\"lazy\" srcset=\"assets/media/de356d0d5f70705439dd3044-320.webp 320w, assets/media/be8fdb1d12f4eb0bc6fe2282-640.webp 640w, assets/media/41e230d23088e0a6012e7214-960.webp 960w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\u003cdiv class=\"wipe\">\u003c/div>\u003cspan class=\"photo-label\">01 / THE STORY\u003c/span>\u003c/div>\u003cdiv class=\"split-copy\">\u003cdiv class=\"inner reveal\">\u003cdiv class=\"small\">The beginning \u00b7 II\u003c/div>\u003ch2 class=\"serif\">It was\u003cbr>always \u003cspan class=\"italic\">you.\u003c/span>\u003c/h2>\u003cp>Not every love story begins with fireworks. Ours began with the smallest moments \u2014 a conversation that lasted too long, a familiar laugh, the comfort of being completely ourselves.\u003c/p>\u003cp>And every day since, we've chosen each other.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"first-light\" id=\"first-light\" aria-label=\"The first light\">\u003cdiv class=\"light-image\">\u003c/div>\u003cdiv class=\"light-vignette\">\u003c/div>\u003cdiv class=\"light-ray\">\u003c/div>\u003cdiv class=\"light-words\">\u003cspan class=\"light-label\">A MOMENT BETWEEN CHAPTERS\u003c/span>\u003ch2>And then,\u003cbr>\u003cem>there was you.\u003c/em>\u003c/h2>\u003cp>Even the greyest skies found their way to gold.\u003c/p>\u003cspan class=\"light-scroll\">SCROLL TO LET THE LIGHT IN \u2193\u003c/span>\u003c/div>\u003c/section>\n\u003csection class=\"statement reveal\">\u003cdiv class=\"small\">The promise \u00b7 III\u003c/div>\u003ch2 class=\"serif\">Whatever the weather,\u003cbr>\u003cem class=\"italic\">we choose us.\u003c/em>\u003c/h2>\u003cp>Through every season, every new beginning, and every beautiful ordinary day.\u003c/p>\u003c/section>\n\u003csection class=\"photo-interlude observe\">\u003cimg src=\"assets/media/14e15e53a794e7d46b4096b1-960.webp\" alt=\"Hand-arranged flowers in soft natural light\" loading=\"lazy\" srcset=\"assets/media/01cf0295c058c807a8eed481-320.webp 320w, assets/media/5f4fdc873f6691b4475c1915-640.webp 640w, assets/media/14e15e53a794e7d46b4096b1-960.webp 960w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\u003cdiv class=\"caption serif\">The beautiful\u003cbr>\u003cspan class=\"italic\">in-between.\u003c/span>\u003c/div>\u003c/section>\n\u003csection class=\"memory-stage\" id=\"memories\">\u003cdiv class=\"memory-intro\">\u003cspan>THE BEAUTIFUL IN-BETWEEN \u00b7 IV\u003c/span>\u003ch2>Little moments.\u003cbr>\u003cem>Everything to us.\u003c/em>\u003c/h2>\u003cp>Not posed. Not perfect. Just ours.\u003c/p>\u003c/div>\u003cdiv class=\"memory-cards\">\u003cbutton type=\"button\" class=\"memory-card mc-one\" aria-label=\"View first memory\">\u003cimg src=\"assets/media/17a0ed554ab1aa639c343d7a-960.webp\" alt=\"An intimate wedding memory\" loading=\"lazy\" srcset=\"assets/media/0634577b416641654c998511-320.webp 320w, assets/media/f9fc0e897a007b879b6e6af4-640.webp 640w, assets/media/17a0ed554ab1aa639c343d7a-960.webp 960w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\u003cspan>01 \u2014 THE BEGINNING\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"memory-card mc-two\" aria-label=\"View second memory\">\u003cimg src=\"assets/media/6935b112e49a8bdef9ac4029-960.webp\" alt=\"A romantic moment\" loading=\"lazy\" srcset=\"assets/media/c773183ce7735105bbe91614-320.webp 320w, assets/media/2c2d7002bcb1c99c0995d54d-640.webp 639w, assets/media/6935b112e49a8bdef9ac4029-960.webp 960w\" sizes=\"(max-width: 767px) 100vw, 70vw\" decoding=\"async\">\u003cspan>02 \u2014 THE IN-BETWEEN\u003c/span>\u003c/button>\u003c/div>\u003cp class=\"memory-hint\">TAP A PHOTOGRAPH TO SEE IT CLOSELY\u003c/p>\u003c/section>\u003cdiv class=\"memory-viewer\" id=\"memory-viewer\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Photograph preview\" hidden>\u003cbutton type=\"button\" id=\"close-memory\" aria-label=\"Close photograph\">\u00d7\u003c/button>\u003cimg alt=\"Expanded photograph\">\u003c/div>\n\u003csection class=\"details\" id=\"details\">\u003cdiv class=\"small reveal\">The invitation \u00b7 IV\u003c/div>\u003ch2 class=\"serif reveal\">The day\u003cbr>\u003cspan class=\"italic\">is ours.\u003c/span>\u003c/h2>\u003cdiv class=\"details-grid reveal\">\u003cdiv>\u003cdiv class=\"small\">When\u003c/div>\u003ch3>18 September\u003c/h3>\u003cp>Saturday, 2027\u003cbr>Four o'clock in the afternoon\u003c/p>\u003c/div>\u003cdiv>\u003cdiv class=\"small\">Where\u003c/div>\u003ch3>The Glasshouse\u003c/h3>\u003cp>Garden Estate\u003cbr>Cape Winelands, South Africa\u003c/p>\u003c/div>\u003cdiv>\u003cdiv class=\"small\">Dress\u003c/div>\u003ch3>Garden formal\u003c/h3>\u003cp>Soft neutrals and earth tones\u003cbr>Jackets encouraged\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"note reveal\">Kindly arrive 20 minutes before the ceremony.\u003c/div>\u003c/section>\n\u003csection class=\"schedule\">\u003cdiv class=\"small\" style=\"text-align:center\">The order of things \u00b7 V\u003c/div>\u003ch2 class=\"serif reveal\">A day to \u003cspan class=\"italic\">remember.\u003c/span>\u003c/h2>\u003cdiv class=\"timeline reveal\">\u003cdiv class=\"event\">\u003cstrong>16:00\u003c/strong>\u003cdiv>The ceremony\u003c/div>\u003c/div>\u003cdiv class=\"event\">\u003cstrong>17:00\u003c/strong>\u003cdiv>Garden drinks &amp; photographs\u003c/div>\u003c/div>\u003cdiv class=\"event\">\u003cstrong>18:30\u003c/strong>\u003cdiv>Dinner beneath the lights\u003c/div>\u003c/div>\u003cdiv class=\"event\">\u003cstrong>20:00\u003c/strong>\u003cdiv>Music, dancing &amp; forever\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"rsvp\" id=\"rsvp\">\u003cdiv class=\"small reveal\">The reply \u00b7 VI\u003c/div>\u003ch2 class=\"serif reveal\">Be there.\u003c/h2>\u003cdiv class=\"introline reveal\">It wouldn't be the same without you.\u003c/div>\u003cp class=\"desc reveal\">Please let us know whether you'll be joining us by 18 August 2027. We can't wait to celebrate together.\u003c/p>\u003cform id=\"rsvpForm\" class=\"reveal\">\u003cdiv class=\"field\">\u003clabel for=\"guest\">Your name\u003c/label>\u003cinput id=\"guest\" name=\"guest\" placeholder=\"First and last name\" required autocomplete=\"name\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"attendance\">Will you attend?\u003c/label>\u003cselect id=\"attendance\" name=\"attendance\" required>\u003coption value=\"\">Select a response\u003c/option>\u003coption value=\"yes\">Joyfully accepts\u003c/option>\u003coption value=\"no\">Regretfully declines\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"note\">A note for the couple (optional)\u003c/label>\u003cinput id=\"note\" name=\"note\" placeholder=\"Leave a little love...\">\u003c/div>\u003cbutton class=\"submit\" type=\"submit\">Send my reply \u2197\u003c/button>\u003cdiv class=\"success\" id=\"success\" role=\"status\">Your response has been captured in this preview only. In the published invitation, RSVP submissions will connect to the VraxisRSVP dashboard.\u003c/div>\u003c/form>\u003c/section>\n\u003c
